 mit dem Zug zur Arbeit.","tip":"One full sentence per question is enough. Reuse the words from the question itself — that way you cannot get them wrong."},{"id":"w_kino","level":"A1","title":"Nachricht an die Nachbarin","en":"A short reply to a neighbour's message","words":[25,50],"task":"Ihre Nachbarin schreibt Ihnen: Wo ist das Kino? Um wie viel Uhr läuft der Film? Was kann man im Kino essen? Antworten Sie ihr.","taskEn":"Your neighbour asks: where is the cinema, what time is the film, what can you eat there? Write back.","points":[{"t":"Anrede","en":"greeting","k":["liebe","hallo","guten tag"]},{"t":"Wo ist das Kino?","en":"where the cinema is","k":["kino ist","bahnhof","neben","zentrum","strasse"]},{"t":"Um wie viel Uhr?","en":"what time","k":["uhr","läuft","laeuft","beginnt","fängt","faengt"]},{"t":"Was kann man essen?","en":"what to eat","k":["essen","popcorn","sandwich","kuchen","glace"]},{"t":"Gruss","en":"sign-off","k":["grüsse","gruesse","bis bald","liebe grüsse"]}],"phrases":[["Liebe Frau Meier,","Dear Mrs Meier,"],["danke für deine Nachricht","thanks for your message"],["Das Kino ist neben …","The cinema is next to …"],["Der Film läuft um … Uhr.","The film is on at …"],["Man kann dort … essen.","You can eat … there."],["Bis bald!","See you soon!"],["Viele Grüsse","Best wishes"]],"model":"Liebe Frau Meier,\n\nvielen Dank für Ihre Nachricht. Das Kino ist am Bahnhof, direkt neben der Post. Der Film läuft heute Abend um 20 Uhr. Im Kino kann man Popcorn und Sandwiches essen.\n\nBis bald!\n\nViele Grüsse\nAnna","tip":"Three questions, three sentences. Answer them in the order they were asked and you cannot forget one."},{"id":"w_arzt","level":"A2","title":"Termin beim Arzt absagen","en":"Cancelling a doctor's appointment","words":[35,60],"task":"Sie haben am Dienstag um 10 Uhr einen Termin bei Ihrer Ärztin. Sie können nicht kommen. Schreiben Sie eine E-Mail:\n– entschuldigen Sie sich\n– erklären Sie, warum Sie nicht kommen können\n– bitten Sie um einen neuen Termin","taskEn":"Cancel your doctor's appointment: apologise, explain why, ask for a new one. About 40 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte","sehr geehrter"]},{"t":"Termin absagen","en":"say you cannot come","k":["kann ich nicht","leider nicht","nicht kommen","absagen","nicht wahrnehmen","leider kann","leider","verhindert","nicht dabei","nicht schaffen"]},{"t":"Grund nennen","en":"give a reason","k":["weil","denn","mein","krank","arbeiten","muss"]},{"t":"Neuen Termin erbitten","en":"ask for a new appointment","k":["neuen termin","anderen termin","verschieben","könnten sie","koennten sie"]},{"t":"Höflicher Schluss","en":"polite closing","k":["vielen dank","danke","verständnis","verstaendnis"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen","freundlichen grüßen"]}],"phrases":[["Sehr geehrte Frau Doktor Berger,","Dear Dr Berger,"],["leider kann ich meinen Termin am … nicht wahrnehmen.","unfortunately I can't keep my appointment on …"],["Mein Sohn ist krank.","My son is ill."],["Könnten Sie mir bitte einen neuen Termin geben?","Could you give me a new appointment?"],["Vielen Dank für Ihr Verständnis.","Thank you for your understanding."],["Mit freundlichen Grüssen","Kind regards"]],"model":"Sehr geehrte Frau Doktor Berger,\n\nleider kann ich meinen Termin am Dienstag um 10 Uhr nicht wahrnehmen. Mein Sohn ist krank und ich muss zu Hause bleiben.\n\nKönnten Sie mir bitte einen neuen Termin in der nächsten Woche geben? Ein Vormittag wäre für mich am besten.\n\nVielen Dank für Ihr Verständnis.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"This is THE A2 template: greeting, cancel, reason, new date, thank you, sign-off. The doctor, the teacher and the boss versions are the same email with three words swapped."},{"id":"w_lehrer","level":"A2","title":"Elternabend absagen","en":"Telling the teacher you can't come to the parents' evening","words":[35,60],"task":"Am Mittwoch ist Elternabend in der Schule Ihres Kindes. Sie können nicht kommen. Schreiben Sie der Lehrerin:\n– entschuldigen Sie sich\n– erklären Sie den Grund\n– bitten Sie um die wichtigsten Informationen","taskEn":"Email your child's teacher: you can't attend the parents' evening, explain why, ask for the key information. About 40 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte","sehr geehrter"]},{"t":"Absage","en":"say you cannot come","k":["kann ich nicht","leider nicht","nicht kommen","nicht teilnehmen","leider kann","leider","nicht wahrnehmen","absagen","verhindert","nicht dabei","nicht schaffen"]},{"t":"Grund nennen","en":"give a reason","k":["weil","denn","arbeiten","muss","krank","termin"]},{"t":"Informationen erbitten","en":"ask for the information","k":["informationen","bescheid","schicken","mitteilen","zusammenfassung"]},{"t":"Höflicher Schluss","en":"polite closing","k":["vielen dank","danke","im voraus","verständnis","verstaendnis"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Sehr geehrte Frau Berger,","Dear Mrs Berger,"],["leider kann ich am … nicht zum Elternabend kommen.","unfortunately I can't come to the parents' evening on …"],["Ich muss an diesem Abend arbeiten.","I have to work that evening."],["Könnten Sie mir bitte die wichtigsten Informationen schicken?","Could you send me the key information?"],["Gerne komme ich zu einem anderen Termin.","I'd gladly come another time."],["Vielen Dank im Voraus.","Many thanks in advance."]],"model":"Sehr geehrte Frau Berger,\n\nleider kann ich am Mittwoch nicht zum Elternabend kommen. Ich muss an diesem Abend arbeiten und finde leider keine Betreuung für meine Kinder.\n\nKönnten Sie mir bitte die wichtigsten Informationen per E-Mail schicken? Gerne komme ich auch zu einem anderen Termin.\n\nVielen Dank im Voraus.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Note the small extra step: instead of a new appointment you ask for the information. Everything else is identical to the doctor email."},{"id":"w_chef","level":"A2","title":"Weihnachtsfeier absagen","en":"Declining your boss's invitation","words":[35,60],"task":"Ihr Chef lädt Sie zur Weihnachtsfeier am Freitag ein. Sie können nicht kommen. Schreiben Sie eine E-Mail:\n– bedanken Sie sich für die Einladung\n– sagen Sie ab und erklären Sie warum\n– wünschen Sie allen einen schönen Abend","taskEn":"Decline your boss's invitation to the Christmas party: thank them, say why you can't come, wish them a good evening. About 40 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrter","sehr geehrte","lieber herr","liebe frau"]},{"t":"Für die Einladung danken","en":"thank them for the invitation","k":["danke für die einladung","vielen dank für die einladung","einladung"]},{"t":"Absage","en":"decline","k":["kann ich nicht","leider nicht","nicht kommen","nicht teilnehmen","leider kann","leider","nicht wahrnehmen","absagen","verhindert","nicht dabei","nicht schaffen"]},{"t":"Grund nennen","en":"give a reason","k":["weil","denn","familie","besuch","krank","termin"]},{"t":"Guten Abend wünschen","en":"wish them a nice evening","k":["wünsche","wuensche","schönen abend","schoenen abend","viel spass"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Vielen Dank für die Einladung zur Weihnachtsfeier.","Thank you for the invitation to the Christmas party."],["Leider kann ich nicht kommen.","Unfortunately I can't come."],["Meine Familie ist zu Besuch.","My family is visiting."],["Das tut mir sehr leid.","I'm very sorry about that."],["Ich wünsche Ihnen und dem Team einen schönen Abend.","I wish you and the team a lovely evening."]],"model":"Sehr geehrter Herr Meier,\n\nvielen Dank für die Einladung zur Weihnachtsfeier am Freitag.\n\nLeider kann ich nicht kommen, weil meine Familie an diesem Wochenende zu Besuch ist. Das tut mir sehr leid.\n\nIch wünsche Ihnen und dem ganzen Team einen schönen Abend.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"When you're turning down an invitation, thank them first. That single sentence is what makes it sound polite rather than blunt."},{"id":"w_berater","level":"A2","title":"Termin verschieben","en":"Rescheduling an appointment with your adviser","words":[35,65],"task":"Sie haben einen Termin mit Ihrem Berater. Sie können nicht kommen, weil Ihre Tochter einen Unfall hatte. Schreiben Sie:\n– entschuldigen\n– erklären, warum Sie nicht kommen können\n– den Termin verschieben\n– korrekte Anrede und höfliche Formulierungen","taskEn":"You can't attend your appointment because your daughter had an accident. Apologise, explain, propose a new time. Formal tone. About 40 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrter","sehr geehrte"]},{"t":"Absage","en":"say you cannot come","k":["kann ich nicht","leider nicht","nicht kommen","leider kann","leider","nicht wahrnehmen","absagen","verhindert","nicht dabei","nicht schaffen"]},{"t":"Grund: Unfall","en":"the reason","k":["unfall","tochter","krankenhaus","spital","gestürzt","gestuerzt"]},{"t":"Termin verschieben","en":"propose a new time","k":["verschieben","neuen termin","anderen termin","würde mir passen","wuerde mir passen"]},{"t":"Höflicher Schluss","en":"polite closing","k":["vielen dank","danke","verständnis","verstaendnis"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Sehr geehrter Herr Keller,","Dear Mr Keller,"],["Meine Tochter hatte einen Unfall.","My daughter had an accident."],["Sie ist im Krankenhaus.","She is in hospital."],["Können wir den Termin bitte verschieben?","Could we please move the appointment?"],["Freitagmorgen würde mir gut passen.","Friday morning would suit me well."],["Vielen Dank für Ihr Verständnis.","Thank you for your understanding."]],"model":"Sehr geehrter Herr Keller,\n\nleider kann ich am Donnerstag nicht zu unserem Termin kommen. Meine Tochter hatte gestern einen Unfall und ist noch im Krankenhaus.\n\nKönnten wir den Termin bitte auf die nächste Woche verschieben? Freitagmorgen würde mir sehr gut passen.\n\nVielen Dank für Ihr Verständnis.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"The task explicitly asks for a correct salutation and polite forms — so use Sie throughout, and offer a concrete alternative day rather than just 'another time'."},{"id":"w_sms","level":"A2","title":"SMS an den Kollegen","en":"An informal message to a colleague","words":[30,55],"task":"Sie gehen für eine Woche in die Ferien. Schreiben Sie Ihrem Kollegen John eine SMS:\n– wohin Sie fahren\n– ab wann Sie weg sind\n– wann Sie zurück sind\n– Ihre Nummer für dringende Fälle","taskEn":"Text your colleague: where you're going, from when, when you're back, and your number for emergencies.","points":[{"t":"Lockere Anrede","en":"informal greeting","k":["hallo","hi","lieber","hey"]},{"t":"Wohin?","en":"where you're going","k":["nach","fahre","ferien","urlaub"]},{"t":"Ab wann?","en":"from when","k":["ab ","montag","dienstag","mittwoch","donnerstag","freitag","weg"]},{"t":"Wann zurück?","en":"when you're back","k":["zurück","zurueck","wieder da","komme am"]},{"t":"Notfallnummer","en":"emergency number","k":["07","+41","nummer","erreichen"]},{"t":"Lockerer Gruss","en":"informal sign-off","k":["grüsse","gruesse","bis bald","liebe grüsse","gruss"]}],"phrases":[["Hallo John,","Hi John,"],["ich bin nächste Woche in den Ferien","I'm on holiday next week"],["Ich bin ab Montag weg.","I'm away from Monday."],["Ich komme am Freitag zurück.","I'm back on Friday."],["In dringenden Fällen kannst du mich unter … erreichen.","In urgent cases you can reach me on …"],["Liebe Grüsse","Best wishes"]],"model":"Hallo John,\n\nich bin nächste Woche in den Ferien und fahre nach Italien. Ich bin ab Montag weg und komme am Freitag, den 20. März, zurück.\n\nIn dringenden Fällen kannst du mich unter 076 546 37 62 erreichen.\n\nLiebe Grüsse\nAnna","tip":"This is the one A2 task that is informal: du, not Sie. Watch for that — using Sie with a colleague you text is the mistake they're looking for."},{"id":"w_hotelA2","level":"A2","title":"Hotelzimmer buchen","en":"Booking a hotel room with three questions","words":[35,60],"task":"Sie möchten ein Hotelzimmer in den Bergen buchen. Schreiben Sie eine E-Mail und fragen Sie nach:\n– dem Preis\n– dem Check-in\n– einem Fitnessraum","taskEn":"Book a hotel room in the mountains and ask about the price, check-in, and whether they have a gym. About 40 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte","sehr geehrter"]},{"t":"Zimmer und Datum nennen","en":"say which room and when","k":["zimmer","doppelzimmer","einzelzimmer","vom","bis","august","juli"]},{"t":"Nach dem Preis fragen","en":"ask the price","k":["kostet","preis","kosten"]},{"t":"Nach dem Check-in fragen","en":"ask about check-in","k":["check-in","einchecken","ankommen","ab wann"]},{"t":"Nach dem Fitnessraum fragen","en":"ask about the gym","k":["fitness","sport","schwimmbad","gym"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Sehr geehrte Damen und Herren,","Dear Sir or Madam,"],["ich möchte ein Doppelzimmer buchen","I'd like to book a double room"],["vom 5. bis 8. August","from 5 to 8 August"],["Was kostet das Zimmer pro Nacht?","What does the room cost per night?"],["Ab wann kann man einchecken?","From what time can one check in?"],["Haben Sie auch einen Fitnessraum?","Do you also have a gym?"]],"model":"Sehr geehrte Damen und Herren,\n\nich möchte vom 5. bis 8. August ein Doppelzimmer für zwei Personen buchen.\n\nWas kostet das Zimmer pro Nacht? Ab wann kann man am Anreisetag einchecken? Und haben Sie auch einen Fitnessraum im Hotel?\n\nVielen Dank für Ihre Antwort.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Three questions, three short question sentences. At A2 nobody expects linking words — clear and correct beats clever."},{"id":"w_schule","level":"B1","title":"E-Mail an eine Sprachschule","en":"Asking a language school about a course","words":[75,110],"task":"Sie möchten einen Deutschkurs besuchen. Schreiben Sie an die Sprachschule:\n– warum Sie den Kurs machen möchten\n– wie lange der Kurs dauert und wie oft er stattfindet\n– was er kostet\n– ob es ein Zertifikat gibt","taskEn":"Write to a language school: why you want the course, how long and how often, the cost, and whether you get a certificate. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte","sehr geehrter"]},{"t":"Einleitung: Grund","en":"introduce why you're writing","k":["interessiere mich","möchte","moechte","habe gelesen","anzeige","internetseite"]},{"t":"Frage: Dauer","en":"ask about duration","k":["wie lange","dauert","wie oft","stattfindet","wochen","monate"]},{"t":"Frage: Preis","en":"ask about price","k":["kostet","preis","kosten","gebühr","gebuehr"]},{"t":"Frage: Zertifikat","en":"ask about a certificate","k":["zertifikat","bescheinigung","prüfung","pruefung","diplom"]},{"t":"Schlusssatz","en":"closing line","k":["baldige antwort","freuen","vielen dank","im voraus"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Ich habe Ihre Anzeige im Internet gelesen.","I read your advert online."],["Ich interessiere mich für einen Deutschkurs.","I'm interested in a German course."],["Ich möchte mein Deutsch verbessern, weil …","I want to improve my German because …"],["Dazu habe ich einige Fragen.","I have a few questions about it."],["Wie lange dauert der Kurs und wie oft findet er statt?","How long is the course and how often is it?"],["Bekommt man am Ende ein Zertifikat?","Do you get a certificate at the end?"],["Gibt es auch Abendkurse?","Are there evening courses too?"],["Über eine baldige Antwort würde ich mich sehr freuen.","I look forward to hearing from you soon."]],"model":"Sehr geehrte Damen und Herren,\n\nich habe Ihre Anzeige im Internet gelesen und interessiere mich für einen Deutschkurs auf dem Niveau B1. Ich wohne seit vier Jahren in der Schweiz und möchte mein Deutsch verbessern, weil ich wieder in meinem Beruf arbeiten möchte.\n\nDazu habe ich einige Fragen. Wie lange dauert der Kurs und wie oft findet er statt? Was kostet er insgesamt? Bekommt man am Ende ein Zertifikat? Und bieten Sie auch Abendkurse an, weil ich tagsüber arbeite?\n\nÜber eine baldige Antwort würde ich mich sehr freuen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"The B1 shape is: greeting, why you're writing, a paragraph of questions, closing line, sign-off. Every B1 email in this exam fits that shape. Learn it once."},{"id":"w_kita","level":"B1","title":"E-Mail an eine Kita","en":"Asking a nursery about a place","words":[75,110],"task":"Sie suchen einen Kita-Platz für Ihr Kind. Schreiben Sie an die Kita und fragen Sie:\n– ob es freie Plätze gibt\n– was ein Platz kostet\n– wie die Öffnungszeiten sind\n– ob Sie die Kita besichtigen können","taskEn":"Write to a nursery: are places free, what does it cost, opening times, can you visit. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte","sehr geehrter"]},{"t":"Einleitung: Ihre Situation","en":"introduce your situation","k":["suchen","suche","gezogen","kind","tochter","sohn","jahre alt"]},{"t":"Frage: freie Plätze","en":"ask about free places","k":["freie plätze","freie plaetze","platz frei","noch plätze","noch plaetze"]},{"t":"Frage: Preis","en":"ask about cost","k":["kostet","preis","kosten","pro monat"]},{"t":"Frage: Öffnungszeiten","en":"ask about opening times","k":["öffnungszeiten","oeffnungszeiten","wie lange offen","ab wann","ferien"]},{"t":"Frage: Besichtigung","en":"ask about a visit","k":["besichtigen","besuchen","anschauen","ansehen","termin"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Wir sind vor Kurzem nach … gezogen.","We recently moved to …"],["Wir suchen einen Platz für unsere Tochter.","We're looking for a place for our daughter."],["Haben Sie im August noch freie Plätze?","Do you still have free places in August?"],["Was kostet ein Platz pro Monat?","What does a place cost per month?"],["Wie sind Ihre Öffnungszeiten?","What are your opening hours?"],["Ist die Kita auch in den Ferien offen?","Is the nursery open during the holidays too?"],["Wäre es möglich, die Kita zu besichtigen?","Would it be possible to visit the nursery?"]],"model":"Sehr geehrte Damen und Herren,\n\nwir sind vor Kurzem nach Adliswil gezogen und suchen einen Kita-Platz für unsere Tochter. Sie ist drei Jahre alt und soll ab August drei Tage pro Woche zu Ihnen kommen.\n\nDeshalb habe ich einige Fragen an Sie. Haben Sie im August noch freie Plätze? Was kostet ein Platz pro Monat? Wie sind Ihre Öffnungszeiten, und ist die Kita auch in den Schulferien offen? Wäre es ausserdem möglich, die Kita vorher einmal zu besichtigen?\n\nVielen Dank im Voraus. Über eine baldige Antwort würde ich mich sehr freuen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Notice 'Deshalb habe ich einige Fragen an Sie' — one linking sentence before the questions. Small thing, but it's what lifts the text from A2 to B1."},{"id":"w_hotelB1","level":"B1","title":"Hotel in den Bergen","en":"Booking a mountain hotel and asking about sport","words":[75,110],"task":"Sie möchten im Sommer eine Woche in den Bergen verbringen. Schreiben Sie an das Hotel:\n– welches Zimmer und wann\n– was es kostet und ob Frühstück inbegriffen ist\n– ab wann man einchecken kann\n– welche Sportmöglichkeiten es gibt","taskEn":"Write to a mountain hotel: which room and when, price and breakfast, check-in time, what sports are available. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte"]},{"t":"Zimmer und Datum","en":"which room and when","k":["familienzimmer","doppelzimmer","zimmer","vom","bis","juli","august"]},{"t":"Frage: Preis und Frühstück","en":"ask about price and breakfast","k":["kostet","preis","frühstück","fruehstueck","inbegriffen","inklusive"]},{"t":"Frage: Check-in","en":"ask about check-in","k":["einchecken","check-in","ab wie viel uhr","ankunft"]},{"t":"Frage: Sport","en":"ask about sport","k":["sport","wandern","schwimmen","velo","fahrrad","möglichkeiten","moeglichkeiten"]},{"t":"Schlusssatz","en":"closing line","k":["baldige antwort","freuen","vielen dank"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Ich möchte mit meiner Familie eine Woche in den Bergen verbringen.","I'd like to spend a week in the mountains with my family."],["Ich hätte gerne ein Familienzimmer vom … bis …","I'd like a family room from … to …"],["Ist das Frühstück im Preis inbegriffen?","Is breakfast included in the price?"],["Ab wie viel Uhr kann man einchecken?","From what time can one check in?"],["Welche Sportmöglichkeiten gibt es bei Ihnen?","What sports facilities do you have?"],["Meine Kinder schwimmen sehr gern.","My children love swimming."]],"model":"Sehr geehrte Damen und Herren,\n\nich möchte im Juli mit meiner Familie eine Woche in den Bergen verbringen und interessiere mich sehr für Ihr Hotel.\n\nIch hätte gerne ein Familienzimmer vom 10. bis zum 17. Juli. Was kostet das Zimmer pro Nacht, und ist das Frühstück im Preis inbegriffen? Ab wie viel Uhr kann man am Anreisetag einchecken? Welche Sportmöglichkeiten gibt es ausserdem bei Ihnen? Mein Mann wandert sehr gern und unsere Kinder schwimmen jeden Tag.\n\nÜber eine baldige Antwort würde ich mich freuen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Adding one personal detail after a question ('mein Mann wandert gern') gets you to the word count naturally and sounds far more human than padding."},{"id":"w_shop","level":"B1","title":"E-Mail an einen Onlineshop","en":"Asking an online shop before ordering","words":[75,110],"task":"Sie möchten einen Fernseher kaufen. Schreiben Sie an den Onlineshop und fragen Sie:\n– ob sie liefern\n– was die Lieferung kostet\n– wann sie liefern können\n– ob sie eine Versicherung anbieten","taskEn":"Write to an online shop about buying a TV: do they deliver, what does it cost, when, and do they offer insurance. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte"]},{"t":"Einleitung: das Produkt","en":"say what you want to buy","k":["fernseher","gerät","geraet","internetseite","gefunden","bestellen"]},{"t":"Frage: Lieferung","en":"ask if they deliver","k":["liefern","lieferung","nach hause","zustellen"]},{"t":"Frage: Kosten","en":"ask the cost","k":["kostet","kosten","preis"]},{"t":"Frage: Liefertermin","en":"ask when","k":["wann","termin","wochenende","liefertag"]},{"t":"Frage: Versicherung","en":"ask about insurance","k":["versicherung","garantie","schutz"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Ich habe auf Ihrer Internetseite einen Fernseher gefunden.","I found a TV on your website."],["Bevor ich ihn bestelle, habe ich noch einige Fragen.","Before I order it I have a few questions."],["Liefern Sie das Gerät auch nach Hause?","Do you deliver the item to my home?"],["Was kostet die Lieferung?","What does delivery cost?"],["Ich bin nur am Wochenende zu Hause.","I'm only at home at the weekend."],["Bieten Sie auch eine Versicherung für das Gerät an?","Do you also offer insurance for the item?"]],"model":"Sehr geehrte Damen und Herren,\n\nich habe auf Ihrer Internetseite einen Fernseher gefunden, der mir sehr gut gefällt. Bevor ich ihn bestelle, habe ich noch einige Fragen.\n\nLiefern Sie das Gerät auch nach Hause, oder muss ich es im Geschäft abholen? Was kostet die Lieferung? Wann könnten Sie liefern, denn ich bin nur am Wochenende zu Hause. Und bieten Sie ausserdem eine Versicherung für das Gerät an?\n\nVielen Dank für Ihre Hilfe. Über eine baldige Antwort würde ich mich sehr freuen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"'denn ich bin nur am Wochenende zu Hause' — giving a reason for a question is easy marks. Every question can take a weil or denn clause."},{"id":"w_wohnung","level":"B1","title":"Bewerbung um eine Wohnung","en":"Applying for a flat a friend is leaving","words":[75,110],"task":"Eine Freundin zieht aus ihrer Wohnung aus. Sie möchten die Wohnung übernehmen. Schreiben Sie an die Vermieterin:\n– woher Sie von der Wohnung wissen\n– wer Sie sind\n– warum Sie die Wohnung möchten\n– bitten Sie um einen Besichtigungstermin","taskEn":"Write to a landlady about a flat your friend is leaving: how you heard, who you are, why you want it, ask to view it. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte","sehr geehrter"]},{"t":"Woher Sie es wissen","en":"how you heard about it","k":["freundin","freund","wohnt","zieht aus","gesagt","erfahren"]},{"t":"Wer Sie sind","en":"who you are","k":["familie","kinder","berufstätig","berufstaetig","arbeite","wir sind"]},{"t":"Warum Sie sie möchten","en":"why you want it","k":["weil","suchen","grössere","groessere","gegend","nähe","naehe"]},{"t":"Um Besichtigung bitten","en":"ask to view it","k":["besichtigen","besichtigung","anschauen","termin","möglich","moeglich"]},{"t":"Unterlagen anbieten","en":"offer documents","k":["unterlagen","dokumente","schicke","gerne"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Eine Freundin von mir wohnt zurzeit in Ihrer Wohnung.","A friend of mine currently lives in your flat."],["Sie zieht Ende Mai aus.","She is moving out at the end of May."],["Ich interessiere mich sehr für die Wohnung.","I'm very interested in the flat."],["Wir sind eine kleine Familie mit zwei Kindern.","We're a small family with two children."],["Wir suchen seit Längerem eine grössere Wohnung.","We've been looking for a bigger flat for a while."],["Wäre es möglich, die Wohnung zu besichtigen?","Would it be possible to view the flat?"],["Gerne schicke ich Ihnen alle nötigen Unterlagen.","I'll gladly send you all the necessary documents."]],"model":"Sehr geehrte Frau Weber,\n\neine Freundin von mir wohnt zurzeit in Ihrer Wohnung an der Seestrasse und zieht Ende Mai aus. Sie hat mir gesagt, dass die Wohnung frei wird, und ich interessiere mich sehr dafür.\n\nWir sind eine kleine Familie mit zwei Kindern und suchen seit Längerem eine grössere Wohnung in dieser Gegend. Mein Mann und ich sind beide berufstätig, und unsere Kinder gehen hier zur Schule.\n\nWäre es möglich, die Wohnung zu besichtigen? Gerne schicke ich Ihnen vorher alle nötigen Unterlagen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Here you're selling yourself, not just asking questions. Two sentences about who you are and why you're reliable is what a landlord actually wants to read."},{"id":"w_amt","level":"B1","title":"E-Mail an das Kreisbüro","en":"Registering after moving to Switzerland","words":[75,110],"task":"Sie sind neu in die Schweiz gezogen und müssen sich anmelden. Schreiben Sie an das Kreisbüro:\n– erklären Sie Ihre Situation\n– bitten Sie um einen Termin\n– fragen Sie, welche Unterlagen Sie brauchen\n– fragen Sie nach den Kosten","taskEn":"Write to the council office to register after moving: explain, request an appointment, ask which documents and what it costs. About 80 words.","points":[{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte"]},{"t":"Situation erklären","en":"explain your situation","k":["gezogen","umgezogen","neu","wohne","angekommen"]},{"t":"Um einen Termin bitten","en":"request an appointment","k":["termin","vereinbaren","könnten sie","koennten sie","bitte einen termin"]},{"t":"Frage: Unterlagen","en":"ask which documents","k":["unterlagen","dokumente","pass","mietvertrag","ausweis","mitbringen"]},{"t":"Frage: Kosten","en":"ask about the cost","k":["kostet","kosten","gebühr","gebuehr","preis"]},{"t":"Schlusssatz","en":"closing line","k":["vielen dank","baldige antwort","freuen","im voraus"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Ich bin vor zwei Wochen in die Schweiz gezogen.","I moved to Switzerland two weeks ago."],["Ich muss mich bei Ihnen anmelden.","I have to register with you."],["Ich möchte gerne einen Termin vereinbaren.","I'd like to make an appointment."],["Am liebsten wäre mir ein Vormittag.","A morning would suit me best."],["Welche Unterlagen muss ich mitbringen?","Which documents do I need to bring?"],["Brauche ich auch den Mietvertrag?","Do I also need the tenancy agreement?"],["Was kostet die Anmeldung?","What does registering cost?"]],"model":"Sehr geehrte Damen und Herren,\n\nich bin vor zwei Wochen aus Indien in die Schweiz gezogen und wohne jetzt in Zürich. Ich muss mich bei Ihnen anmelden und möchte dafür gerne einen Termin vereinbaren.\n\nKönnten Sie mir bitte einen Termin in den nächsten zwei Wochen geben? Am liebsten wäre mir ein Vormittag, weil ich am Nachmittag arbeite. Welche Unterlagen muss ich mitbringen, und brauche ich auch den Mietvertrag? Was kostet die Anmeldung?\n\nVielen Dank für Ihre Hilfe. Über eine baldige Antwort würde ich mich sehr freuen.\n\nMit freundlichen Grüssen\nAnna Keller","tip":"Useful beyond the exam — this is close to the email you'd really send. The Behörden vocabulary set in the Wörter tab covers the words used here."},{"id":"w_bewerbung","level":"B1","title":"Bewerbungsschreiben","en":"A job application letter","words":[85,120],"task":"Schreiben Sie eine Bewerbung. Wählen Sie die Stelle und die Firma selbst aus.\n– korrekte Anrede\n– Ihre Erfahrungen beschreiben\n– drei passende Fähigkeiten nennen\n– bedanken und um ein Vorstellungsgespräch bitten","taskEn":"Write a job application: choose the job and company yourself, describe your experience, name three relevant skills, thank them and ask for an interview. About 80–100 words.","points":[{"t":"Betreffzeile","en":"subject line","k":["betreff","bewerbung als","bewerbung um"]},{"t":"Korrekte Anrede","en":"correct formal greeting","k":["sehr geehrte damen und herren","sehr geehrte","sehr geehrter"]},{"t":"Auf die Stelle Bezug nehmen","en":"refer to the advertised job","k":["stellenanzeige","anzeige","stelle","internetseite","gelesen","bewerben"]},{"t":"Erfahrung beschreiben","en":"describe your experience","k":["erfahrung","jahre","gearbeitet","projekte","beruf"]},{"t":"Drei Fähigkeiten nennen","en":"name three skills","k":["sorgfältig","sorgfaeltig","teamfähig","teamfaehig","zuverlässig","zuverlaessig","lerne schnell","motiviert","kommunikativ","selbstständig"]},{"t":"Um ein Gespräch bitten","en":"ask for an interview","k":["vorstellungsgespräch","vorstellungsgespraech","gespräch","gespraech","kennenzulernen","einladung"]},{"t":"Lebenslauf erwähnen","en":"mention your CV","k":["lebenslauf","anhang","unterlagen","beigefügt","beigefuegt"]},{"t":"Grussformel","en":"sign-off","k":["freundlichen grüssen","freundlichen gruessen"]}],"phrases":[["Betreff: Bewerbung als …","Subject: Application for the post of …"],["ich habe Ihre Stellenanzeige gelesen und möchte mich um die Stelle bewerben","I read your job advert and would like to apply"],["Ich habe … Jahre Erfahrung in diesem Bereich.","I have … years of experience in this field."],["Ich habe in verschiedenen Projekten gearbeitet.","I've worked on various projects."],["Ich arbeite sorgfältig, lerne schnell und arbeite gern im Team.","I work carefully, learn quickly and enjoy teamwork."],["Über die Möglichkeit zu einem Vorstellungsgespräch würde ich mich sehr freuen.","I'd be delighted to have the chance of an interview."],["Meinen Lebenslauf finden Sie im Anhang.","You'll find my CV attached."]],"model":"Betreff: Bewerbung als [Ihr Beruf]\n\nSehr geehrte Damen und Herren,\n\nich habe Ihre Stellenanzeige auf Ihrer Internetseite gelesen und möchte mich um die Stelle als [Ihr Beruf] bewerben. Ihre Firma kenne ich seit Langem und ich würde sehr gerne bei Ihnen arbeiten.\n\nIch habe [X] Jahre Erfahrung in diesem Bereich und habe in verschiedenen Projekten mit unterschiedlichen Teams gearbeitet. Nach einer Familienpause möchte ich nun wieder in meinen Beruf zurückkehren.\n\nIch arbeite sehr sorgfältig, lerne schnell und arbeite gern im Team. Ausserdem verbessere ich meine Deutschkenntnisse laufend.\n\nÜber die Möglichkeit zu einem Vorstellungsgespräch würde ich mich sehr freuen. Meinen Lebenslauf finden Sie im Anhang.\n\nMit freundlichen Grüssen\n[Ihr Name]","tip":"The square brackets are for you to fill in — swap in your own job, years and name. This is the longest B1 task, so it's worth learning as a skeleton you can adapt to any advertised job."}];

/* ================= grammar ================= */
let gScores={};
try{ gScores=JSON.parse(store.get("hoerbar.gram")||"{}"); }catch(e){ gScores={}; }
let gT=null, gI=0, gRight=0, gPicked=null, gChecked=false;

const norm = s => (s||"").toLowerCase().trim()
  .replace(/[.!?,;:]/g,"").replace(/\s+/g," ")
  .replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue");

function showTab(t){
  if(t===true) t="g"; if(t===false) t="w";
  document.body.classList.toggle("g", t==="g");
  document.body.classList.toggle("s", t==="s");
  document.body.classList.toggle("k", t==="k");
  document.body.classList.toggle("n", t==="n");
  $("tabW").setAttribute("aria-selected", t==="w"?"true":"false");
  $("tabG").setAttribute("aria-selected", t==="g"?"true":"false");
  $("tabS").setAttribute("aria-selected", t==="s"?"true":"false");
  $("tabK").setAttribute("aria-selected", t==="k"?"true":"false");
  $("tabN").setAttribute("aria-selected", t==="n"?"true":"false");
  autoOn=false; var a=$("auto"); if(a) a.setAttribute("aria-pressed","false");
  try{ stopAll(); }catch(e){}
  try{ hardStop(); }catch(e){}
}
$("tabW").onclick=()=>showTab("w");
$("tabG").onclick=()=>{ showTab("g"); if(gT) startTopic(gT); else buildList(); };
$("tabS").onclick=()=>{ showTab("s"); if(wT) openWrite(wT); else buildWList(); };
$("tabK").onclick=()=>{ showTab("k"); if(kT) openSpeak(kT); else buildKList(); };
$("tabN").onclick=()=>{ showTab("n"); if(nB!==null) openBlock(nB); else buildNList(); };

function buildList(){
  hardStop();
  $("sheet").classList.remove("open");
  $("gex").hidden=true; $("glist").hidden=false;
  const el=$("glist"); el.innerHTML="";
  ["A1","A2","B1"].forEach(lv=>{
    const list=TOPICS.filter(t=>t.level===lv);
    if(!list.length) return;
    const hd=document.createElement("p"); hd.className="lvl"; hd.textContent=lv; el.appendChild(hd);
    list.forEach(t=>{
      const b=document.createElement("button"); b.className="topic";
      const s=gScores[t.id];
      b.innerHTML='<h3></h3><span class="score'+(s&&s>=t.items.length-1?" done":"")+'"></span>';
      b.querySelector("h3").innerHTML=esc(t.title)+(t.en?'<em>'+esc(t.en)+'</em>':'');
      b.querySelector(".score").textContent = s==null ? t.items.length+" Fragen" : s+"/"+t.items.length;
      b.onclick=()=>startTopic(t);
      el.appendChild(b);
    });
  });
}

function startTopic(t){
  hardStop();
  gT=t; gI=0; gRight=0;
  $("glist").hidden=true; $("gex").hidden=false;
  $("gtitle").innerHTML=esc(t.title)+(t.en?'<em>'+esc(t.en)+'</em>':'');
  renderQ();
}

function renderQ(){
  hardStop();
  gPicked=null; gChecked=false;
  $("gscore").textContent = gRight+"/"+gT.items.length;
  const it=gT.items[gI];
  const body=$("gbody"), foot=$("gfoot");
  body.scrollTop=0;

  let html='';
  if(gI===0) html+=(gT.en?'<p class="enrule">'+esc(gT.en)+'</p>':'')+'<div class="rulebox"><p>'+esc(gT.rule)+'</p></div>'+tablesHTML(gT.tables);
  html+='<p class="qnum">Frage '+(gI+1)+' von '+gT.items.length+'</p>';
  html+='<p class="qtext">'+esc(it.q)+'</p>';
  if(it.t==="gap"){
    html+='<input class="ans" id="ans" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Antwort eingeben">';
  }else{
    html+='<div class="opts2">'+it.o.map((o,n)=>'<button class="o" data-n="'+n+'" aria-pressed="false">'+esc(o)+'</button>').join('')+'</div>';
  }
  html+='<div id="fbslot"></div>';
  body.innerHTML=html;

  if(it.t==="gap"){
    const inp=$("ans");
    inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); var b=foot.querySelector(".gbtn:not(.hear):not(.sec)"); if(b) b.click(); }});
  }else{
    body.querySelectorAll(".o").forEach(b=>b.onclick=()=>{
      if(gChecked) return;
      body.querySelectorAll(".o").forEach(x=>x.setAttribute("aria-pressed","false"));
      b.setAttribute("aria-pressed","true"); gPicked=+b.dataset.n;
    });
  }
  foot.innerHTML='<button class="gbtn sec" id="gform">Formen</button><button class="gbtn" id="gcheck">Prüfen</button>';
  $("gcheck").onclick=check; $("gform").onclick=openSheet;
}

function gl(txt){
  const t=String(txt), g=GLOSS[t];
  return esc(t) + (g ? '<span class="gl">'+esc(g)+'</span>' : '');
}

function tablesHTML(tabs){
  return (tabs||[]).map(t=>{
    let s='<div class="tbl'+(t.head?'':' one')+'">';
    if(t.title) s+='<h4>'+esc(t.title)+(GLOSS[t.title]?'<em>'+esc(GLOSS[t.title])+'</em>':'')+'</h4>';
    s+='<div class="tblwrap"><table>';
    if(t.head) s+='<tr>'+t.head.map(c=>'<th>'+gl(c)+'</th>').join('')+'</tr>';
    t.rows.forEach(r=>{ s+='<tr>'+r.map((c,ci)=>'<td>'+(ci===0?gl(c):esc(c))+'</td>').join('')+'</tr>'; });
    return s+'</table></div></div>';
  }).join('');
}

function openSheet(){
  $("sheettitle").textContent = gT.title;
  $("sheetbd").innerHTML=(gT.en?'<p class="enrule">'+esc(gT.en)+'</p>':'')+'<div class="rulebox"><p>'+esc(gT.rule)+'</p></div>'+tablesHTML(gT.tables);
  $("sheet").classList.add("open");
}
$("sheetx").onclick=()=>$("sheet").classList.remove("open");
$("sheet").onclick=e=>{ if(e.target===$("sheet")) $("sheet").classList.remove("open"); };

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function solved(it){ return it.t==="gap" ? it.a[0] : it.o[it.a]; }
function fullSentence(it){
  if(it.t!=="gap") return solved(it);
  return it.q.replace(/_{2,}/, it.a[0]);
}

function check(){
  if(gChecked) return;
  const it=gT.items[gI];
  let ok;
  if(it.t==="gap"){
    const v=$("ans").value;
    if(!v.trim()){ $("ans").focus(); return; }
    ok = it.a.some(a=>norm(a)===norm(v));
    $("ans").disabled=true;
  }else{
    if(gPicked===null) return;
    ok = gPicked===it.a;
    $("gbody").querySelectorAll(".o").forEach((b,n)=>{
      if(n===it.a) b.style.borderColor="var(--moss)";
      else if(n===gPicked) b.style.borderColor="var(--amber)";
    });
  }
  gChecked=true;
  if(ok) gRight++;
  $("gscore").textContent = gRight+"/"+gT.items.length;
  $("fbslot").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Richtig":"Antwort: "+esc(solved(it)))+'</b>'+esc(it.why)+'</div>';

  const fb=$("fbslot").firstChild;
  if(fb && fb.scrollIntoView) fb.scrollIntoView({block:"nearest"});

  const last = gI===gT.items.length-1;
  $("gfoot").innerHTML='<button class="gbtn hear" id="ghear" aria-label="Hear the sentence">▶</button>'+
    '<button class="gbtn sec" id="gform">Formen</button>'+
    '<button class="gbtn" id="gnext">'+(last?"Ergebnis":"Weiter")+'</button>';
  $("gform").onclick=openSheet;
  $("ghear").onclick=()=>{ try{ speechSynthesis.cancel(); speechSynthesis.speak(utter(fullSentence(it),0.85)); }catch(e){} };
  $("gnext").onclick=()=>{ if(last) finish(); else { gI++; renderQ(); } };
}

function finish(){
  const total=gT.items.length;
  if(gScores[gT.id]==null || gRight>gScores[gT.id]){ gScores[gT.id]=gRight; store.set("hoerbar.gram", JSON.stringify(gScores)); }
  $("gbody").innerHTML='<div class="result"><p class="big">'+gRight+'/'+total+'</p><p>'+
    (gRight===total?"Alles richtig.":gRight>=total*0.7?"Gut gemacht.":"Schau dir die Regel noch einmal an.")+'</p></div>';
  $("gscore").textContent="";
  $("gfoot").innerHTML='<button class="gbtn sec" id="gagain">Nochmal</button><button class="gbtn" id="gdone">Themen</button>';
  $("gagain").onclick=()=>startTopic(gT);
  $("gdone").onclick=()=>{ gT=null; buildList(); };
}

$("gback").onclick=()=>{ gT=null; buildList(); };
buildList();

/* ================= writing ================= */
let wT=null, wSeg="a";
let wDrafts={};
try{ wDrafts=JSON.parse(store.get("hoerbar.drafts")||"{}"); }catch(e){ wDrafts={}; }

function buildWList(){
  hardStop();
  $("wex").hidden=true; $("wlist").hidden=false;
  const el=$("wlist"); el.innerHTML="";
  ["A1","A2","B1"].forEach(lv=>{
    const list=WTOPICS.filter(t=>t.level===lv);
    if(!list.length) return;
    const hd=document.createElement("p"); hd.className="lvl"; hd.textContent=lv; el.appendChild(hd);
    list.forEach(t=>{
      const b=document.createElement("button"); b.className="wtopic";
      let has=wDrafts[t.id]&&wDrafts[t.id].trim();
      if(has&&t.fields){ try{ const o=JSON.parse(wDrafts[t.id]); has=Object.keys(o).some(k=>(o[k]||"").trim()); }catch(e){} }
      b.innerHTML='<h3></h3><span class="score'+(has?" done":"")+'"></span>';
      b.querySelector("h3").innerHTML=esc(t.title)+'<em>'+esc(t.en)+'</em>';
      b.querySelector(".score").textContent = has ? "Entwurf" : (t.words[1]? "ca. "+t.words[1]+" W." : "");
      b.onclick=()=>openWrite(t);
      el.appendChild(b);
    });
  });
}

function openWrite(t){
  wT=t; wSeg="a";
  $("wlist").hidden=true; $("wex").hidden=false;
  $("wtitle").innerHTML=esc(t.title)+'<em>'+esc(t.en)+'</em>';
  renderSeg();
}

function setSeg(s){ wSeg=s; renderSeg(); }
$("segA").onclick=()=>setSeg("a");
$("segM").onclick=()=>setSeg("m");
$("segP").onclick=()=>setSeg("p");
$("wback").onclick=()=>{ wT=null; buildWList(); };

function renderSeg(){
  hardStop();
  $("segA").setAttribute("aria-selected", wSeg==="a"?"true":"false");
  $("segM").setAttribute("aria-selected", wSeg==="m"?"true":"false");
  $("segP").setAttribute("aria-selected", wSeg==="p"?"true":"false");
  const b=$("wbody"), f=$("wfoot"); b.scrollTop=0;

  if(wSeg==="a"){
    let s='<div class="taskbox"><p>'+esc(wT.task)+'</p><p class="ten">'+esc(wT.taskEn)+'</p></div>';

function wordCount(s){ return (s.trim().match(/[^\s]+/g)||[]).length; }
function countWords(){
  const n=wordCount($("wdraft").value), lo=wT.words[0], hi=wT.words[1];
  const el=$("wc");
  if(!hi){ el.textContent=n+" Wörter"; el.className="wcount"; return; }
  const ok=n>=lo&&n<=hi*1.4;
  el.textContent=n+" Wörter (Ziel: ca. "+hi+")";
  el.className="wcount"+(ok?" good":"");
}
function saveDraft(){ wDrafts[wT.id]=$("wdraft").value; store.set("hoerbar.drafts", JSON.stringify(wDrafts)); }

function saveForm(){
  const o={}; wT.fields.forEach(fd=>o[fd.k]=$("f_"+fd.k).value);
  wDrafts[wT.id]=JSON.stringify(o); store.set("hoerbar.drafts", JSON.stringify(wDrafts));
}

function checkForm(){
  let ok=0; let s='<p class="qnum" style="margin-top:18px">Ergebnis</p>';
  wT.fields.forEach(fd=>{
    const el=$("f_"+fd.k), v=(el.value||"").trim();
    let good=true, msg="";
    if(!v){ good=false; msg="Dieses Feld ist noch leer."; }
    else if(fd.re && !(new RegExp(fd.re,"i")).test(v)){ good=false; msg=fd.hint; }
    el.className = good ? "fi" : "fi bad";
    if(good) ok++;
    s+='<div class="chk '+(good?"yes":"no")+'"><span class="mk">'+(good?"✓":"–")+'</span><span class="cn">'+
       esc(fd.de)+'<span class="ce">'+esc(good?fd.en:msg)+'</span></span></div>';
  });
  s+='<p class="tipbox">'+ok+' von '+wT.fields.length+' Feldern korrekt ausgefüllt.'+
     (ok===wT.fields.length?' Alles vollständig.':' Die markierten Felder noch einmal ansehen.')+'</p>';
  $("wcheck").innerHTML=s;
}

function checkDraft(){
  const raw=$("wdraft").value;
  if(!raw.trim()){ $("wdraft").focus(); return; }
  const t=keyPair(raw);
  let hit=0;
  let s='<p class="qnum" style="margin-top:18px">Ergebnis</p>';
  wT.points.forEach(pt=>{
    const ok=pt.k.some(k=>{ const kp=keyPair(k); return t.ae.includes(kp.ae)||t.pl.includes(kp.pl); });
    if(ok) hit++;
    s+='<div class="chk '+(ok?"yes":"no")+'"><span class="mk">'+(ok?"✓":"–")+'</span><span class="cn">'+
       esc(pt.t)+'<span class="ce">'+esc(pt.en)+'</span></span></div>';
  });
  const n=wordCount(raw), hi=wT.words[1];
  s+='<p class="tipbox">'+hit+' von '+wT.points.length+' Punkten gefunden. '+
     (hi? n+' Wörter geschrieben, Ziel ca. '+hi+'. ':'')+
     'This check looks for keywords, so it can miss a good sentence that uses different words. Compare with the Muster to be sure.</p>';
  $("wcheck").innerHTML=s;
  $("wcheck").scrollIntoView&&$("wcheck").scrollIntoView({block:"nearest"});
}

function speakLong(text){
  hardStop();

    text.split(/\n\n+/).forEach(block=>{
      chunkText(block.replace(/\n/g," ").trim()).forEach(part=>speechSynthesis.speak(utter(part,0.95)));
    });
  }catch(e){}
}

let aDB=null, aHave=new Set(), aPlaying=null, aRec=null, aChunks=[], aStream=null;

function aOpen(){
  return new Promise((res,rej)=>{
    if(aDB) return res(aDB);
    try{
      const r=indexedDB.open("hoerbar-audio",1);
      r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains("rec")) r.result.createObjectStore("rec"); };
      r.onsuccess=()=>{ aDB=r.result; res(aDB); };
      r.onerror=()=>rej(r.error);
    }catch(e){ rej(e); }
  });
}
function aPut(id,blob){ return aOpen().then(d=>new Promise((res,rej)=>{
  const tx=d.transaction("rec","readwrite"); tx.objectStore("rec").put(blob,id);
  tx.oncomplete=()=>{ aHave.add(id); res(); }; tx.onerror=()=>rej(tx.error); })); }
function aGet(id){ return aOpen().then(d=>new Promise((res,rej)=>{
  const rq=d.transaction("rec","readonly").objectStore("rec").get(id);
  rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })); }
function aDel(id){ return aOpen().then(d=>new Promise((res,rej)=>{
  const tx=d.transaction("rec","readwrite"); tx.objectStore("rec").delete(id);
  tx.oncomplete=()=>{ aHave.delete(id); res(); }; tx.onerror=()=>rej(tx.error); })); }
function aLoadKeys(){ return aOpen().then(d=>new Promise(res=>{
  const rq=d.transaction("rec","readonly").objectStore("rec").getAllKeys();
  rq.onsuccess=()=>{ (rq.result||[]).forEach(k=>aHave.add(k)); res(); }; rq.onerror=()=>res(); })).catch(()=>{}); }

function aStopPlay(){ if(aPlaying){ try{ aPlaying.pause(); }catch(e){} aPlaying=null; } }

function aPlay(id,btn){
  if(aPlaying){ aStopPlay(); if(btn) btn.className=""; return; }
  aGet(id).then(blob=>{
    if(!blob) return;
    const url=URL.createObjectURL(blob);
    const au=new Audio(url);
    aPlaying=au;
    if(btn) btn.className="on";
    au.onended=()=>{ aPlaying=null; if(btn) btn.className=""; URL.revokeObjectURL(url); };
    au.onerror=()=>{ aPlaying=null; if(btn) btn.className=""; };
    au.play().catch(()=>{ aPlaying=null; if(btn) btn.className=""; });
  }).catch(()=>{});
}

function aCanRecord(){
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function aPickType(){
  const opts=["audio/mp4","audio/webm;codecs=opus","audio/webm",""];
  for(const t of opts){ try{ if(!t || MediaRecorder.isTypeSupported(t)) return t; }catch(e){} }
  return "";
}
function aStart(id,onFail){
  if(!aCanRecord()){ onFail&&onFail("Aufnahme hier nicht möglich. — Recording is not available in this browser. Open the page in Safari."); return; }
  navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
    aStream=st; aChunks=[];
    const mt=aPickType();
    aRec = mt ? new MediaRecorder(st,{mimeType:mt}) : new MediaRecorder(st);
    aRec.ondataavailable=e=>{ if(e.data&&e.data.size) aChunks.push(e.data); };
    aRec.onstop=()=>{
      try{ aStream.getTracks().forEach(t=>t.stop()); }catch(e){}
      aStream=null;
      if(!aChunks.length) return;
      const blob=new Blob(aChunks,{type:aChunks[0].type||"audio/mp4"});
      aPut(id,blob).then(()=>{
        if(kT&&kT.id===id&&kSeg==="s") renderKSeg();
        if(nB!==null&&id===("anki-"+nB)) renderNRec();
      }).catch(()=>{});
    };
    aRec.start();
  }).catch(err=>{
    const denied = err && /NotAllowed|Permission/i.test(String(err.name||err));
    onFail&&onFail(denied
      ? "Mikrofon nicht erlaubt. — Microphone permission was refused. Allow it, or open the page in Safari."
      : "Kein Mikrofon gefunden. — No microphone available here. This usually means the page is inside an app browser; open it in Safari.");
  });
}
function aStop(){ if(aRec){ try{ if(aRec.state!=="inactive") aRec.stop(); }catch(e){} aRec=null; } 
  if(aStream){ try{ aStream.getTracks().forEach(t=>t.stop()); }catch(e){} aStream=null; } }

              if(n===parts.length-1) u.onend=()=>{ btn.className="pb"; };
              speechSynthesis.speak(u);
            });
          }catch(e){ btn.className="pb"; }
        };
      });
    }
    f.innerHTML='<button class="gbtn sec" id="kagain">Zurücksetzen</button>'+
      '<button class="gbtn" id="kcheck">Prüfen</button>';
    $("kcheck").onclick=checkSpeech;
    $("kagain").onclick=()=>{ kSaid=""; renderKSeg(); };
  }
}

function fmt(s){ const m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }

function chunkText(text,max){
  const out=[]; let cur="";
  text.split(/(?<=[.!?])\s+/).map(x=>x.trim()).filter(x=>x.length>1).forEach(sent=>{
    if(!cur) cur=sent;
    else if((cur+" "+sent).length<=(max||190)) cur+=" "+sent;
    else { out.push(cur); cur=sent; }
  });
  if(cur) out.push(cur);
  return out;
}
function speakParas(rate){
  hardStop();
  try{ chunkText(modelText()).forEach(part=>speechSynthesis.speak(utter(part,rate))); }catch(e){}
}

function startTimer(){
  kLeft=kDur; $("ktime").textContent=fmt(kLeft);
  kTimer=setInterval(()=>{
    kLeft--; const el=$("ktime"); if(el) el.textContent=fmt(Math.max(0,kLeft));
    if(kLeft<=0){ stopTimer(); stopRec(); const m=$("kmt"); if(m) m.textContent="Zeit ist um."; }
  },1000);
}
function stopTimer(){ if(kTimer){ clearInterval(kTimer); kTimer=null; } }

function toggleRec(){
  if(kRunning){ stopRec(); stopTimer(); return; }
  hardStop(); aStopPlay();
  kRunning=true; $("kmic").className="mic rec"; $("kmic").textContent="■";
  $("kmt").textContent = "Aufnahme läuft — noch einmal tippen zum Beenden";
  startTimer();
  aStart(kT.id, msg=>{ const el=$("kmt"); if(el) el.textContent=msg+" Der Timer läuft trotzdem."; });
  if(!SR) return;
  try{
    kRec=new SR();
    kRec.lang="de-DE"; kRec.continuous=true; kRec.interimResults=true;
    kGot=false;
    kRec.onresult=e=>{
      let fin="";
      for(let i=e.resultIndex;i<e.results.length;i++){
        if(e.results[i].isFinal) fin+=e.results[i][0].transcript+" ";
      }
      if(fin){ kGot=true; kSaid+=fin; const el=$("ksay"); if(el) el.value=kSaid; }
    };
    kRec.onerror=()=>{ const el=$("kmt"); if(el) el.textContent="Automatische Erkennung nicht möglich — bitte unten diktieren."; };
    kRec.onend=()=>{ if(!kGot){ const el=$("kmt"); if(el) el.textContent="Nichts erkannt. Bitte unten mit der Mikrofon-Taste der Tastatur diktieren."; } };
    kRec.start();
  }catch(e){
    const el=$("kmt"); if(el) el.textContent="Die Spracherkennung liess sich nicht starten. Der Timer läuft trotzdem.";
  }
}
function stopRec(){
  aStop();
  kRunning=false;
  const m=$("kmic"); if(m){ m.className="mic"; m.textContent="●"; }
  if(kRec){ try{ kRec.stop(); }catch(e){} kRec=null; }
}

function checkSpeech(){
  stopRec(); stopTimer();
  const fld=$("ksay");
  const said=((fld?fld.value:kSaid)||"").trim();
  kSaid=said;
  let s='<p class="qnum" style="margin-top:20px">Ergebnis</p>';
  if(!said){
    s+=kT.points.map(pt=>'<div class="chk"><span class="mk">•</span><span class="cn">'+esc(pt.t)+
      '<span class="ce">'+esc(pt.en)+'</span></span></div>').join('');
    s+='<p class="tipbox">Kein Text da. Gehen Sie die Liste selbst durch: Haben Sie jeden Punkt gesagt? Oder diktieren Sie oben Ihre Antwort, dann prüfe ich sie.</p>';
    $("kres").innerHTML=s; return;
  }
  const t=keyPair(said);
  let hit=0;
  kT.points.forEach(pt=>{
    const ok=pt.k.some(k=>{ const q=keyPair(k); return t.ae.includes(q.ae)||t.pl.includes(q.pl); });
    if(ok) hit++;
    s+='<div class="chk '+(ok?"yes":"no")+'"><span class="mk">'+(ok?"✓":"–")+'</span><span class="cn">'+
       esc(pt.t)+'<span class="ce">'+esc(pt.en)+'</span></span></div>';
  });
  const words=(said.match(/[^\s]+/g)||[]).length;
  let cov="";
  if(kT.text&&kT.text.length){
    const mw=keyPair(modelText()).pl.split(/\s+/).filter(x=>x.length>3);
    const sw=new Set(keyPair(said).pl.split(/\s+/));
    const m=mw.filter(x=>sw.has(x)).length;
    cov=" Vom Mustertext haben Sie etwa "+Math.round(m/Math.max(1,mw.length)*100)+"% der Wörter benutzt.";
  }
  s+='<p class="tipbox">'+hit+' von '+kT.points.length+' Punkten erkannt. '+words+' Wörter gesprochen.'+cov+
     ' Geprüft wird nur der Inhalt, nicht die Aussprache.</p>';
  $("kres").innerHTML=s;
}

/* ================= Anki games ================= */
function donePool(){ let o=[]; [...nDone].forEach(i=>o=o.concat(nSlice(i))); return o; }
function shuf(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function withArt(x){ return (x.art?x.art+" ":"")+x.w; }
function reEsc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g, m => "\\"+m); }

function gapOf(x){
  if(!x.s.length) return null;
  const base=x.w.replace(/\s*\(.*$/,"").replace(/^sich\s+/,"").trim();
  if(base.length<3) return null;
  const stem=base.slice(0,Math.max(4,Math.floor(base.length*0.6)));
  const m=new RegExp(reEsc(stem)+"[a-zäöüß]*","i").exec(x.s[0][0]);
  if(!m) return null;
  return { q:x.s[0][0].slice(0,m.index)+"_____"+x.s[0][0].slice(m.index+m[0].length), en:x.s[0][1] };
}
function distract(x,pool,pick,n){
  const seen=new Set([pick(x)]);
  const out=[];
  shuf(pool).concat(shuf(ANKI)).forEach(y=>{
    if(out.length>=n) return;
    const v=pick(y); if(!v||seen.has(v)) return;
    seen.add(v); out.push(v);
  });
  return out;
}
function makeQ(x,mode,pool){
  if(mode==="artikel"){
    if(!x.art) return null;
    const opts=["der","die","das"];
    return {t:"mc",mode,word:x,q:x.w,hint:"Welcher Artikel?",o:opts,a:opts.indexOf(x.art),
            why:x.art+" "+x.w+(x.pl?" · Plural: "+x.pl:"")};
  }
  if(mode==="gap"){
    const g=gapOf(x); if(!g) return null;
    const o=shuf([withArt(x)].concat(distract(x,pool,withArt,3)));
    return {t:"mc",mode,word:x,q:g.q,hint:g.en,o,a:o.indexOf(withArt(x)),why:x.s[0][0]};
  }
  if(mode==="en2de"){
    const o=shuf([withArt(x)].concat(distract(x,pool,withArt,3)));
    return {t:"mc",mode,word:x,q:x.en,hint:"Welches deutsche Wort?",o,a:o.indexOf(withArt(x)),
            why:withArt(x)+(x.s.length?" — "+x.s[0][0]:"")};
  }
  if(mode==="audio"){
    const o=shuf([withArt(x)].concat(distract(x,pool,withArt,3)));
    return {t:"mc",mode,word:x,q:"",hint:"Was hören Sie?",o,a:o.indexOf(withArt(x)),audio:withArt(x),
            why:withArt(x)+" — "+x.en};
  }
  if(mode==="type"){
    return {t:"gap",mode,word:x,q:x.en,hint:"Schreiben Sie das deutsche Wort",
            a:[x.w,withArt(x)],why:withArt(x)+(x.s.length?" — "+x.s[0][0]:"")};
  }
  const o=shuf([x.en].concat(distract(x,pool,y=>y.en,3)));
  return {t:"mc",mode:"de2en",word:x,q:withArt(x),hint:"Was bedeutet das?",o,a:o.indexOf(x.en),
          why:withArt(x)+" — "+x.en};
}
const GAMES=[
 ["de2en","Wort → Bedeutung","Deutsches Wort, vier englische Bedeutungen"],
 ["en2de","Bedeutung → Wort","Englisch vorgegeben, deutsches Wort wählen"],

function openGame(block,mode){
  hardStop();
  if(mode==="memory"){ openMemory(block); return; }
  const pool = block===null ? donePool() : nSlice(block);
  const modes = mode==="mix" ? ["de2en","en2de","audio","artikel","gap","type"] : [mode];
  const want = block===null ? Math.min(20,pool.length) : Math.min(20,pool.length);
  const qs=[];
  shuf(pool).forEach(x=>{
    if(qs.length>=want) return;
    for(const m of shuf(modes)){ const q=makeQ(x,m,pool); if(q){ qs.push(q); return; } }
  });
  if(!qs.length) return;
  G={block,mode,qs,i:0,right:0,marks:[],checked:false,picked:null};
  $("ntitle").innerHTML=(block===null?'Test: alles Gelernte':'Üben · Block '+(block+1))+
    '<em>'+(GAMES.find(g=>g[0]===mode)||[,mode])[1]+' · '+qs.length+' Fragen</em>';
  renderGameQ();
}

function renderGameQ(){
  hardStop();
  G.checked=false; G.picked=null;
  const q=G.qs[G.i], b=$("nbody"), f=$("nfoot");
  b.scrollTop=0;
  let s='<div class="gprog">';
  for(let k=0;k<G.qs.length;k++) s+='<i class="'+(G.marks[k]==null?(k===G.i?"c":""):(G.marks[k]?"r":"w"))+'"></i>';
  s+='</div>';
  s+='<p class="qnum">Frage '+(G.i+1)+' von '+G.qs.length+'</p>';
  if(q.mode==="audio") s+='<button class="bigplay" id="gau">▶</button>';
  else s+='<p class="qword">'+esc(q.q)+'</p>';
  s+='<p class="qhint">'+esc(q.hint)+'</p>';
  if(q.t==="mc") s+='<div class="opts2">'+q.o.map((o,n)=>'<button class="o" data-n="'+n+'" aria-pressed="false">'+esc(o)+'</button>').join('')+'</div>';
  else s+='<input class="ans" id="gin" type="text" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="deutsches Wort">';
  s+='<div id="gfb"></div>';
  b.innerHTML=s;
  if(q.mode==="audio"){
    const play=()=>{ hardStop(); try{ speechSynthesis.speak(utter(q.audio,0.85)); }catch(e){} };
    $("gau").onclick=play; play();
  }
  if(q.t==="mc"){
    b.querySelectorAll(".o").forEach(btn=>btn.onclick=()=>{
      if(G.checked) return;
      b.querySelectorAll(".o").forEach(x=>x.setAttribute("aria-pressed","false"));
      btn.setAttribute("aria-pressed","true"); G.picked=+btn.dataset.n;
    });
  }
  f.innerHTML='<button class="gbtn sec" id="gquit">Schluss</button><button class="gbtn" id="gchk">Prüfen</button>';
  $("gchk").onclick=checkGame;
  $("gquit").onclick=()=>{ G=null; if(nB!==null) openBlock(nB); else buildNList(); };
}

function checkGame(){
  if(G.checked) return;
  const q=G.qs[G.i], b=$("nbody");
  let ok;
  if(q.t==="mc"){
    if(G.picked===null) return;
    ok=G.picked===q.a;
    b.querySelectorAll(".o").forEach((btn,n)=>{
      if(n===q.a) btn.style.borderColor="var(--moss)";
      else if(n===G.picked) btn.style.borderColor="var(--amber)";
    });
  }else{
    const v=$("gin").value; if(!v.trim()) return;
    const t=keyPair(v);
    ok=q.a.some(a=>{ const k=keyPair(a); return k.ae===t.ae||k.pl===t.pl; });
    $("gin").disabled=true;
  }
  G.checked=true; G.marks[G.i]=ok; if(ok) G.right++;
  $("gfb").innerHTML='<div class="fb '+(ok?"ok":"no")+'"><b>'+(ok?"Richtig":"Antwort: "+esc(q.t==="mc"?q.o[q.a]:q.a[0]))+'</b>'+esc(q.why)+'</div>';
  const last=G.i===G.qs.length-1;
  $("nfoot").innerHTML='<button class="gbtn hear" id="ghr" aria-label="Hören">▶</button>'+
    '<button class="gbtn" id="gnx">'+(last?"Ergebnis":"Weiter")+'</button>';
  $("ghr").onclick=()=>{ hardStop(); try{ speechSynthesis.speak(utter(withArt(q.word),0.85));
    if(q.word.s.length) speechSynthesis.speak(utter(q.word.s[0][0],0.95)); }catch(e){} };
  $("gnx").onclick=()=>{ if(last) gameResult(); else { G.i++; renderGameQ(); } };
}

function gameResult(){
  hardStop();
  const pct=Math.round(G.right/G.qs.length*100);
  if(G.block!==null && (nScores[G.block]==null || pct>nScores[G.block])){
    nScores[G.block]=pct; store.set("hoerbar.nscore", JSON.stringify(nScores));
  }
  const wrong=G.qs.filter((q,k)=>G.marks[k]===false);
  let s='<div class="result"><p class="big">'+G.right+'/'+G.qs.length+'</p><p>'+
    (pct===100?"Alles richtig.":pct>=70?"Gut gemacht.":"Diese Wörter noch einmal ansehen.")+'</p></div>';
  if(wrong.length){
    s+='<p class="qnum">Diese Wörter noch einmal</p>';
    wrong.forEach(q=>{ s+='<div class="chk no"><span class="mk">–</span><span class="cn">'+esc(withArt(q.word))+
      '<span class="ce">'+esc(q.word.en)+'</span></span></div>'; });
  }
  $("nbody").innerHTML=s;
  $("nfoot").innerHTML='<button class="gbtn sec" id="gagain2">Nochmal</button><button class="gbtn" id="gdone2">Fertig</button>';
  $("gagain2").onclick=()=>openGame(G.block,G.mode);
  $("gdone2").onclick=()=>{ const bk=G.block; G=null; if(bk===null) buildNList(); else openBlock(bk); };
}

/* ================= Memory: Deutsch ↔ Englisch ================= */
let M=null, mPairs=parseInt(store.get("hoerbar.mpairs")||"8",10)||8;
function shortEn(s){
  let t=String(s||"").split("/")[0].split(";")[0].split(",")[0].trim();
  t=t.replace(/^\s*to\s+/i,"to ");
  if(t.length>26) t=t.slice(0,25).trim()+"…";
  return t||String(s||"").slice(0,25);
}
function shortDe(x){
  let t=withArt(x).replace(/\s*\(.*$/,"").trim();
  if(t.length>22) t=t.slice(0,21).trim()+"…";
  return t;
}
function openMemory(block){
  hardStop();
  const pool = block===null ? donePool() : nSlice(block);
  const n=Math.min(mPairs,pool.length);
  const picked=shuf(pool).slice(0,n);
  const cards=[];
  picked.forEach((x,i)=>{
    cards.push({k:i,side:"de",t:shortDe(x),w:x});
    cards.push({k:i,side:"en",t:shortEn(x.en),w:x});
  });
  M={block,cards:shuf(cards),first:null,moves:0,found:0,total:n,busy:false};
  $("ntitle").innerHTML=(block===null?'Memory · alles Gelernte':'Memory · Block '+(block+1))+
    '<em>Deutsch und Englisch zu Paaren zuordnen</em>';
  renderMemory();
}
function renderMemory(){
  const b=$("nbody"), f=$("nfoot");
  let s='<div class="msize">'+[6,8,10].map(x=>
     '<button data-mp="'+x+'" aria-pressed="'+(mPairs===x?"true":"false")+'">'+x+' Paare</button>').join('')+'</div>';
  s+='<p class="mstat"><span id="mfound">'+M.found+' von '+M.total+' Paaren</span><span id="mmoves">'+M.moves+' Versuche</span></p>';
  s+='<div class="mgrid" id="mg">';
  M.cards.forEach((c,i)=>{
    const cls="mcard "+c.side+(c.done?" done":(c.open?" open":""));
    s+='<button class="'+cls+'" data-c="'+i+'"><span>'+esc(c.t)+'</span></button>';
  });
  s+='</div>';
  b.innerHTML=s;
  b.querySelectorAll(".msize button").forEach(x=>x.onclick=()=>{
    mPairs=+x.dataset.mp; store.set("hoerbar.mpairs",String(mPairs)); openMemory(M.block); });
  b.querySelectorAll(".mcard").forEach(x=>x.onclick=()=>flipCard(+x.dataset.c));
  f.innerHTML='<button class="gbtn sec" id="mquit">Schluss</button><button class="gbtn" id="mnew">Neue Karten</button>';
  $("mquit").onclick=()=>{ const bk=M.block; M=null; hardStop(); if(bk===null) buildNList(); else openBlock(bk); };
  $("mnew").onclick=()=>openMemory(M.block);
}
function mSet(i,cls){
  const el=$("mg"); if(!el) return;
  const btn=el.querySelectorAll(".mcard")[i]; if(btn) btn.className="mcard "+M.cards[i].side+(cls?" "+cls:"");
}
function flipCard(i){
  if(!M||M.busy) return;
  const c=M.cards[i];
  if(c.done||c.open) return;
  c.open=true; mSet(i,"open");
  if(c.side==="de"){ hardStop(); try{ speechSynthesis.speak(utter(withArt(c.w),0.85)); }catch(e){} }
  if(M.first===null){ M.first=i; return; }
  const a=M.cards[M.first], ai=M.first;
  M.first=null; M.moves++;
  const mv=$("mmoves"); if(mv) mv.textContent=M.moves+" Versuche";
  if(a.k===c.k && a.side!==c.side){
    a.done=c.done=true; a.open=c.open=false;
    mSet(ai,"done"); mSet(i,"done");
    M.found++;
    const fd=$("mfound"); if(fd) fd.textContent=M.found+" von "+M.total+" Paaren";
    if(M.found===M.total) setTimeout(memoryDone,500);
  }else{
    M.busy=true;
    mSet(ai,"open miss"); mSet(i,"open miss");
    setTimeout(()=>{ a.open=c.open=false; mSet(ai,""); mSet(i,""); M.busy=false; },850);
  }
}
function memoryDone(){
  hardStop();
  const best=M.total*1;
  let s='<div class="result"><p class="big">'+M.moves+'</p><p>Versuche für '+M.total+' Paare'+
        (M.moves<=best+2?" — sehr gut.":M.moves<=best*2?" — ordentlich.":" — noch einmal versuchen.")+'</p></div>';
  s+='<p class="qnum">Die Paare</p>';
  const seen=new Set();
  M.cards.forEach(c=>{ if(seen.has(c.k)) return; seen.add(c.k);
    s+='<div class="chk yes"><span class="mk">✓</span><span class="cn">'+esc(withArt(c.w))+
       '<span class="ce">'+esc(c.w.en)+'</span></span></div>'; });
  $("nbody").innerHTML=s;
  $("nfoot").innerHTML='<button class="gbtn sec" id="magain">Nochmal</button><button class="gbtn" id="mdone">Fertig</button>';
  $("magain").onclick=()=>openMemory(M.block);
  $("mdone").onclick=()=>{ const bk=M.block; M=null; if(bk===null) buildNList(); else openBlock(bk); };
}

/* ================= global audio stop ================= */
$("stopall").onclick=()=>{ autoOn=false; var a=$("auto"); if(a) a.setAttribute("aria-pressed","false"); hardStop(); };
setInterval(()=>{
  let on=false;
  try{ on = speechSynthesis.speaking || speechSynthesis.pending; }catch(e){}
  if(aPlaying) on=true;
  const b=$("stopall"); if(b) b.className = on ? "stopbar on" : "stopbar";
},400);
