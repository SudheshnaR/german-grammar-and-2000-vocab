<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hörbar</title>
<style>
:root{
  --paper:#E7EBEC;
  --card:#FFFFFF;
  --ink:#13202A;
  --soft:#66777F;
  --line:#CBD4D7;
  --amber:#C8830F;
  --amber-tint:#F6EBD6;
  --moss:#2C6A55;
  --moss-tint:#E0EBE6;
  --serif:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  display:flex;flex-direction:column;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;border:0;background:none;padding:13px 4px 11px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
#gram{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.g #gram{display:flex}
body.g header,body.g main,body.g footer{display:none}

/* topic list */
.glist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#gex{flex:1;display:flex;flex-direction:column;min-height:0}
#gex[hidden],.glist[hidden]{display:none!important}
.lvl{font-family:var(--sans);font-size:12px;color:var(--soft);margin:18px 0 8px;letter-spacing:.4px}
.glist .lvl:first-child{margin-top:2px}
.topic{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:4px 14px 14px 4px;
  padding:13px 14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:10px}
.topic h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1}
.score{font-family:var(--sans);font-size:12px;color:var(--soft);white-space:nowrap}
.score.done{color:var(--moss)}

/* exercise view */
.gtop{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:20px;color:var(--ink);cursor:pointer;padding:2px 6px 2px 0}
.gtop h2{font-family:var(--serif);font-size:17px;margin:0;flex:1;font-weight:600}
.gbody{flex:1;overflow-y:auto;padding:14px 18px 8px}
.rulebox{background:var(--amber-tint);border-radius:4px 14px 14px 4px;padding:13px 15px;margin-bottom:16px}
.rulebox p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.5}
.tbl{margin-bottom:16px}
.tbl h4{font-family:var(--sans);font-size:12px;color:var(--soft);margin:0 0 6px;font-weight:600}
.tbl h4 em{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--soft);opacity:.85;margin-top:1px}
.gl{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--soft);
  text-transform:none;letter-spacing:0;margin-top:2px;line-height:1.3;white-space:normal}
th .gl{opacity:.9}
.topic h3 em{display:block;font-style:normal;font-family:var(--sans);font-size:12px;
  color:var(--soft);font-weight:400;margin-top:3px;line-height:1.35}
.gtop h2 em{display:block;font-style:normal;font-family:var(--sans);font-size:11.5px;
  color:var(--soft);font-weight:400;margin-top:2px;line-height:1.3}
.enrule{font-family:var(--sans);font-size:12.5px;color:var(--soft);margin:-8px 0 14px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14.5px;background:var(--card);
  border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
th{background:var(--paper);font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--soft);
  text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-family:var(--sans);font-size:12.5px;color:var(--soft);white-space:nowrap}
.tbl.one td:first-child{width:34%}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stopbar{position:fixed;right:16px;bottom:calc(22px + env(safe-area-inset-bottom));z-index:60;
  border:0;border-radius:999px;background:var(--amber);color:#fff;font-family:var(--sans);font-size:14px;
  font-weight:600;padding:13px 20px;box-shadow:0 3px 14px rgba(19,32,42,.28);cursor:pointer;display:none}
.stopbar.on{display:block}
.sheet{position:fixed;inset:0;background:rgba(19,32,42,.35);display:none;z-index:50}
.sheet.open{display:block}
.sheetin{position:absolute;left:0;right:0;bottom:0;top:8%;background:var(--paper);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheethd{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheethd h3{font-family:var(--serif);font-size:17px;margin:0;flex:1;font-weight:600}
.sheethd button{border:0;background:none;font-size:22px;color:var(--soft);cursor:pointer;padding:0 4px}
.sheetbd{flex:1;overflow-y:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.qnum{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:0 0 8px}
.qtext{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0 0 16px}
input.ans{width:100%;font-family:var(--serif);font-size:19px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);-webkit-appearance:none}
input.ans:focus{outline:2px solid var(--amber);outline-offset:1px}
.opts2{display:flex;flex-direction:column;gap:8px}
.o{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--serif);font-size:17px;padding:12px 14px;border-radius:10px;cursor:pointer}
.o[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:11px 13px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-family:var(--serif);font-size:15.5px;line-height:1.5}
.fb.ok{background:var(--moss-tint);color:var(--moss)}
.fb.no{background:var(--amber-tint);color:var(--ink)}
.fb b{display:block;font-family:var(--sans);font-size:12px;margin-bottom:4px;font-weight:600}
.gfoot{flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.gbtn{flex:1;border:0;background:var(--ink);color:var(--paper);font-size:15px;padding:14px;border-radius:12px;cursor:pointer}
.gbtn.sec{background:transparent;color:var(--soft);border:1px solid var(--line)}
.gbtn.hear{flex:0 0 54px;font-size:17px}
.result{text-align:center;padding:40px 20px}
.result .big{font-family:var(--serif);font-size:46px;font-weight:600;margin:0}
.result p{font-family:var(--serif);font-size:17px;color:var(--soft);margin:8px 0 0}

#anki{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.n #anki{display:flex}
body.n header,body.n main,body.n footer{display:none}
#nlist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#nex{flex:1;display:flex;flex-direction:column;min-height:0}
#nex[hidden],#nlist[hidden]{display:none!important}
.tabs button{font-size:13px;padding:13px 2px 11px}
.nblock{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 14px 14px 4px;padding:12px 14px;margin-bottom:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.nblock h3{font-family:var(--serif);font-size:16px;font-weight:600;margin:0;flex:1}
.nblock h3 em{display:block;font-style:normal;font-family:var(--sans);font-size:11.5px;color:var(--soft);font-weight:400;margin-top:3px}
.wcard{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:10px;align-items:flex-start}
.wcard:first-child{border-top:0}
.wcard .pb{flex:0 0 32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:12px;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.wcard .pb.on{background:var(--amber);border-color:var(--amber);color:#fff}
.wcard .wt{flex:1;min-width:0}
.wcard .ww{font-family:var(--serif);font-size:18px;font-weight:600;line-height:1.3;margin:0}
.wcard .we{font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--soft);margin:2px 0 0;line-height:1.4}
.wcard .wf{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:4px 0 0}
.wcard .ws{margin:7px 0 0;padding-left:9px;border-left:2px solid var(--line)}
.wcard .ws p{margin:0 0 4px;font-family:var(--serif);font-size:14.5px;line-height:1.45}
.wcard .ws p.t{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-bottom:7px}
.hidetr .ws p.t,.hidetr .we{display:none}
.gmenu button{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 14px 14px 4px;padding:13px 14px;margin-bottom:8px;cursor:pointer}
.gmenu button b{display:block;font-family:var(--serif);font-size:16.5px;font-weight:600}
.gmenu button span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-top:3px;line-height:1.4}
.gmenu button:disabled{opacity:.45}
.bigtest{display:block;width:100%;text-align:left;border:0;background:var(--ink);color:var(--paper);
  border-radius:4px 16px 16px 4px;padding:15px 16px;margin:0 0 14px;cursor:pointer}
.bigtest b{display:block;font-family:var(--serif);font-size:17px;font-weight:600}
.bigtest span{display:block;font-family:var(--sans);font-size:11.5px;opacity:.75;margin-top:3px}
.bigtest:disabled{background:var(--card);color:var(--soft);box-shadow:0 0 0 1px var(--line)}
.qword{font-family:var(--serif);font-size:30px;line-height:1.2;font-weight:600;margin:0 0 6px;word-break:break-word}
.qhint{font-family:var(--sans);font-size:12px;color:var(--soft);margin:0 0 18px}
.bigplay{width:84px;height:84px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:26px;cursor:pointer;display:grid;place-items:center;margin:4px auto 18px}
.msize{display:flex;gap:7px;margin-bottom:14px}
.msize button{flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-family:var(--sans);font-size:12.5px;padding:9px 2px;border-radius:10px;cursor:pointer}
.msize button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.mstat{display:flex;justify-content:space-between;font-family:var(--sans);font-size:12px;color:var(--soft);margin:0 0 12px}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.mcard{aspect-ratio:1;border:0;border-radius:11px;background:var(--ink);cursor:pointer;
  display:grid;place-items:center;padding:5px;overflow:hidden}
.mcard span{font-size:0;color:transparent;line-height:1.2;text-align:center;word-break:break-word;hyphens:auto}
.mcard.open,.mcard.done{background:var(--card);box-shadow:0 0 0 1px var(--line)}
.mcard.open span,.mcard.done span{font-size:11.5px}
.mcard.de.open span,.mcard.de.done span{font-family:var(--serif);font-weight:600;font-size:12.5px;color:var(--ink)}
.mcard.en.open span,.mcard.en.done span{font-family:var(--sans);color:var(--soft)}
.mcard.de.open{background:var(--amber-tint)}
.mcard.done{background:var(--moss-tint);box-shadow:0 0 0 1px var(--moss)}
.mcard.done span{color:var(--moss)!important}
.mcard.miss{background:var(--amber);box-shadow:none}
.gprog{display:flex;gap:3px;margin-bottom:16px}
.gprog i{flex:1;height:4px;background:var(--line);border-radius:2px}
.gprog i.r{background:var(--moss)} .gprog i.w{background:var(--amber)} .gprog i.c{background:var(--ink)}
#speak{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.k #speak{display:flex}
body.k header,body.k main,body.k footer{display:none}
#klist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#kex{flex:1;display:flex;flex-direction:column;min-height:0}
#kex[hidden],#klist[hidden]{display:none!important}
.para{margin-bottom:15px}
.para .de{font-family:var(--serif);font-size:16.5px;line-height:1.6;margin:0}
.para .en{font-family:var(--sans);font-size:13px;color:var(--soft);line-height:1.5;margin:5px 0 0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:30px;cursor:pointer;display:grid;place-items:center;margin:6px auto 0}
.mic.rec{background:var(--amber)}
.mictxt{text-align:center;font-family:var(--sans);font-size:12.5px;color:var(--soft);margin:10px 0 0}
.timer{text-align:center;font-family:var(--serif);font-size:38px;font-weight:600;margin:14px 0 0}
.trans{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-family:var(--serif);font-size:15.5px;line-height:1.55;margin-top:16px;min-height:52px}
.trans em{font-style:normal;color:var(--soft)}
.fcard{border:1px solid var(--line);background:var(--card);border-radius:4px 14px 14px 4px;
  padding:12px 13px;margin-bottom:9px}
.frow{display:flex;gap:10px;align-items:flex-start}
.frow .pb{flex:0 0 30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);
  color:var(--ink);font-size:12px;cursor:pointer;display:grid;place-items:center;margin-top:1px}
.frow .pb.on{background:var(--amber);border-color:var(--amber);color:#fff}
.frow .ft{flex:1;min-width:0}
.fq{font-family:var(--serif);font-size:16px;font-weight:600;line-height:1.4;margin:0}
.fqe{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:3px 0 0;line-height:1.4}
.fa{font-family:var(--serif);font-size:15.5px;line-height:1.55;margin:0}
.fae{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:3px 0 0;line-height:1.4}
.fans{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.hideans .fans{display:none}
.seg.four button{font-size:12px;padding:11px 2px 9px}
.myrec{display:flex;gap:8px;margin-top:14px}
.myrec button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--sans);font-size:13px;padding:11px 4px;border-radius:10px;cursor:pointer}
.myrec button.on{background:var(--moss);border-color:var(--moss);color:#fff}
.myrec button.del{flex:0 0 54px;color:var(--soft)}
.recnote{font-family:var(--sans);font-size:11.5px;color:var(--soft);text-align:center;margin:9px 0 0;line-height:1.5}
.modes{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.modes button{min-width:0;line-height:1.25}
.modes button em,.myrec button em,.gbtn em,.dur button em{display:block;font-style:normal;
  font-size:9.5px;opacity:.62;margin-top:2px;font-weight:400}
.helpnote{background:var(--amber-tint);border-radius:4px 12px 12px 4px;padding:11px 13px;margin-bottom:14px}
.helpnote p{margin:0;font-family:var(--sans);font-size:11.5px;line-height:1.55;color:var(--ink)}
.helpnote p+p{margin-top:6px}
.helpnote b{font-weight:600}
.vrow{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.vrow:first-child{border-top:0}
.vrow .vn{flex:1;min-width:0}
.vrow .vn b{display:block;font-family:var(--serif);font-size:16px;font-weight:600}
.vrow .vn span{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-top:2px}
.vrow button{border:1px solid var(--line);background:var(--card);color:var(--ink);font-family:var(--sans);
  font-size:12.5px;padding:8px 12px;border-radius:999px;cursor:pointer}
.vrow button.sel{background:var(--moss);border-color:var(--moss);color:#fff}
.dur{display:flex;gap:7px;margin-top:14px}
.dur button{flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-family:var(--sans);font-size:12.5px;padding:9px 2px;border-radius:10px;cursor:pointer}
.dur button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.modes button{flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-family:var(--sans);font-size:13px;padding:10px 4px;border-radius:10px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sline{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.sline:first-of-type{border-top:0}
.sline .pb{flex:0 0 34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:13px;cursor:pointer;display:grid;place-items:center;margin-top:2px}
.sline .pb.on{background:var(--amber);border-color:var(--amber);color:var(--paper)}
.sline .st{flex:1;min-width:0}
.sline .st .d{font-family:var(--serif);font-size:16px;line-height:1.55;margin:0}
.sline .st .e{font-family:var(--sans);font-size:12.5px;color:var(--soft);line-height:1.45;margin:4px 0 0}
.hideen .sline .st .e{display:none}
.readnote{font-family:var(--sans);font-size:12.5px;color:var(--soft);line-height:1.55;margin:0 0 14px}
#ksay{width:100%;min-height:130px;font-family:var(--serif);font-size:16px;line-height:1.6;padding:13px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  -webkit-appearance:none;resize:vertical;margin-top:14px}
#ksay:focus{outline:2px solid var(--amber);outline-offset:1px}
.nosr{background:var(--amber-tint);border-radius:12px;padding:12px 14px;font-family:var(--sans);
  font-size:12.5px;color:var(--ink);line-height:1.55;margin-top:14px}
#write{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.s #write{display:flex}
body.s header,body.s main,body.s footer{display:none}
#wlist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#wex{flex:1;display:flex;flex-direction:column;min-height:0}
#wex[hidden],#wlist[hidden]{display:none!important}
.wtopic{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 14px 14px 4px;padding:13px 14px;margin-bottom:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.wtopic h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1}
.wtopic h3 em{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400;margin-top:3px;line-height:1.35}
.seg{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 18px}
.seg button{flex:1;border:0;background:none;padding:11px 4px 9px;font-family:var(--sans);font-size:13.5px;
  color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.wbody{flex:1;overflow-y:auto;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.taskbox{background:var(--amber-tint);border-radius:4px 14px 14px 4px;padding:13px 15px;margin-bottom:14px}
.taskbox p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.taskbox .ten{font-family:var(--sans);font-size:12.5px;color:var(--soft);margin-top:9px;line-height:1.45}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.chk .mk{flex:0 0 20px;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--line)}
.chk.yes .mk{color:var(--moss)} .chk.no .mk{color:var(--amber)}
.chk .cn{font-family:var(--serif);font-size:15px;line-height:1.4}
.chk .ce{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-top:2px}
.mail{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:15px 16px;

.fi.bad{border-color:var(--amber);border-width:2px;padding:9px 11px}

.wcount{font-family:var(--sans);font-size:12px;color:var(--soft);margin:8px 0 0;text-align:right}
.wcount.good{color:var(--moss)}
.tipbox{font-family:var(--sans);font-size:13px;color:var(--soft);line-height:1.55;margin-top:16px;
  padding-top:13px;border-top:1px solid var(--line)}
.wfoot{flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- header ---------- */
header{padding:14px 18px 10px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;flex:1}
.searchbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;
  padding:5px 13px;font-family:var(--sans);font-size:12.5px;cursor:pointer}
#wq{width:100%;font-family:var(--serif);font-size:18px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);-webkit-appearance:none}
#wq:focus{outline:2px solid var(--amber);outline-offset:1px}
.rescount{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:12px 0 8px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 12px 12px 4px;padding:11px 13px;margin-bottom:6px;cursor:pointer}
.res .rw{display:block;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
.res .rg{display:block;font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--soft);margin-top:2px}
.res .rs{display:block;font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:5px;opacity:.85}
.res mark{background:var(--amber-tint);color:inherit;border-radius:2px;padding:0 1px}
.brand span{font-size:12.5px;color:var(--soft)}
.sets{display:flex;gap:7px;overflow-x:auto;margin-top:11px;padding-bottom:3px;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.set{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-family:var(--sans);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;
}
.set[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ticks{display:flex;gap:2px;margin-top:12px;height:4px}
.tick{flex:1;background:var(--line);border-radius:1px;transition:background .2s}
.tick.seen{background:var(--soft)}
.tick.known{background:var(--moss)}
.tick.here{background:var(--amber)}

/* ---------- card ---------- */
main{flex:1 1 auto;display:flex;padding:6px 18px 0;min-height:0}
.card{
  flex:1;background:var(--card);border-radius:4px 20px 20px 4px;
  display:flex;overflow:hidden;box-shadow:0 1px 0 var(--line);
}
.meter{flex:0 0 34px;display:flex;align-items:center;justify-content:center;gap:3px;background:var(--paper)}
.meter i{display:block;width:3px;height:8px;background:var(--line);border-radius:2px;transition:height .12s ease,background .12s}
body.speaking .meter i{background:var(--amber)}
body.speaking .meter i:nth-child(1){animation:amp .7s -.0s infinite ease-in-out}
body.speaking .meter i:nth-child(2){animation:amp .7s -.15s infinite ease-in-out}
body.speaking .meter i:nth-child(3){animation:amp .7s -.3s infinite ease-in-out}
body.speaking .meter i:nth-child(4){animation:amp .7s -.45s infinite ease-in-out}
@keyframes amp{0%,100%{height:7px}50%{height:26px}}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 20px 22px;min-width:0}
.word{font-family:var(--serif);font-size:clamp(30px,9vw,44px);line-height:1.1;font-weight:600;margin:0;word-break:break-word}
.word.phrase{font-size:clamp(20px,5.4vw,27px);line-height:1.28;font-weight:600}
.reply{display:none;font-family:var(--sans);font-size:11px;color:var(--soft);margin:0 0 6px}
.card.phrase .reply{display:block}
.set.ph{border-style:dashed}
.gloss{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--soft);margin:8px 0 0;min-height:24px}
.gloss.hidden{color:transparent;background:var(--paper);border-radius:3px;display:inline-block;padding:0 6px}
.rule{height:1px;background:var(--line);margin:20px 0 16px}
.de{font-family:var(--serif);font-size:19px;line-height:1.42;margin:0}
.en{font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--soft);margin:7px 0 0}
.en.hidden{color:transparent;background:var(--paper);border-radius:3px}
.reveal{
  margin-top:16px;align-self:flex-start;border:0;background:none;padding:4px 0;
  font-family:var(--sans);font-size:13px;color:var(--amber);cursor:pointer;text-decoration:underline;
}

/* ---------- controls ---------- */
footer{flex:0 0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
button{font-family:var(--sans)}
.step{
  width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:19px;cursor:pointer;display:grid;place-items:center;
}
.play{
  width:88px;height:88px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:15px;letter-spacing:.3px;cursor:pointer;display:grid;place-items:center;
}
body.speaking .play{background:var(--amber)}
.play b{font-size:26px;line-height:1;display:block}
.opts{display:flex;gap:8px;margin-top:16px}
.opt{
  flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-size:13px;padding:10px 4px;border-radius:10px;cursor:pointer;
}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.marks{display:flex;gap:8px;margin-top:8px}
.mark{flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;padding:11px 4px;border-radius:10px;cursor:pointer}
.mark.known[aria-pressed="true"]{background:var(--moss-tint);border-color:var(--moss);color:var(--moss)}
.mark.again[aria-pressed="true"]{background:var(--amber-tint);border-color:var(--amber);color:var(--amber)}
.note{margin:12px 0 0;font-size:11.5px;color:var(--soft);text-align:center;line-height:1.5}

button:focus-visible,.set:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}

["Ich war für die Datenpipelines verantwortlich.","I was responsible for the data pipelines.","Mit welchen Werkzeugen?","With which tools?"],
["Ich kenne mich gut mit Informatica aus.","I know Informatica well.","Und wie steht es mit der Cloud?","And what about the cloud?"],
["Meine Azure-Zertifizierung muss ich erneuern.","I need to renew my Azure certification.","Wann planen Sie das?","When are you planning that?"],
["Ich habe eine Pause für die Familie gemacht.","I took a break for my family.","Das ist völlig in Ordnung.","That's completely fine."],
["In dieser Zeit habe ich Deutsch gelernt.","During that time I learned German.","Das merkt man.","One can tell."],
["Ich habe nebenbei eigene Projekte gebaut.","I built my own projects on the side.","Können Sie ein Beispiel nennen?","Can you give an example?"],
["Ich lerne schnell und arbeite gern im Team.","I learn quickly and enjoy working in a team.","Wie gehen Sie mit Konflikten um?","How do you handle conflict?"],
["Ich spreche das Problem direkt an.","I address the problem directly.","Das schätzen wir hier.","We value that here."],
["Meine Stärke ist die Analyse.","My strength is analysis.","Und Ihre Schwäche?","And your weakness?"],
["Ich bin manchmal zu gründlich.","Sometimes I'm too thorough.","Das kann auch ein Vorteil sein.","That can be an advantage too."],
["Könnten Sie mir mehr über das Team sagen?","Could you tell me more about the team?","Wir sind acht Leute.","We're eight people."],
["Wie sieht ein typischer Arbeitstag aus?","What does a typical working day look like?","Sehr unterschiedlich.","Very varied."],
["Gibt es Möglichkeiten zur Weiterbildung?","Are there opportunities for further training?","Ja, ein Budget pro Jahr.","Yes, a budget each year."],
["Ist Teilzeit grundsätzlich möglich?","Is part time possible in principle?","Darüber können wir sprechen.","We can talk about that."],
["Wie flexibel sind die Arbeitszeiten?","How flexible are the working hours?","Ziemlich flexibel.","Quite flexible."],
["Wie geht es nach diesem Gespräch weiter?","What are the next steps after this conversation?","Wir melden uns bis Freitag.","We'll get back to you by Friday."],

{name:"In der Schule", type:"phrase", words:[
["Ich bin die Mutter von Anja.","I'm Anja's mother.","Schön, Sie kennenzulernen.","Nice to meet you."],
["Wie kommt mein Kind in der Klasse zurecht?","How is my child getting on in class?","Sehr gut, es ist gut integriert.","Very well, they're well integrated."],
["Gibt es etwas, worauf wir zu Hause achten sollten?","Is there anything we should watch for at home?","Beim Lesen wäre etwas Übung gut.","A bit of practice with reading would help."],
["Wie viel Zeit sollten die Hausaufgaben dauern?","How long should the homework take?","Etwa zwanzig Minuten.","About twenty minutes."],
["Mein Kind braucht bei Deutsch etwas Hilfe.","My child needs some help with German.","Es gibt eine Förderstunde am Dienstag.","There's a support lesson on Tuesday."],
["Kann ich mich für die Förderstunde anmelden?","Can I sign up for the support lesson?","Ich schicke Ihnen das Formular.","I'll send you the form."],
["Wann ist der nächste Elternabend?","When is the next parents' evening?","Am Mittwoch um neunzehn Uhr.","On Wednesday at seven p.m."],
["Ich kann leider nicht kommen.","Unfortunately I can't come.","Dann machen wir einen eigenen Termin.","Then we'll arrange a separate appointment."],
["Mein Kind ist heute krank.","My child is ill today.","Danke für die Abmeldung.","Thanks for letting us know."],
["Wie lange soll es zu Hause bleiben?","How long should they stay at home?","Bis es fieberfrei ist.","Until the fever is gone."],
["Was hat es in dieser Woche verpasst?","What did they miss this week?","Ich gebe Ihnen die Blätter mit.","I'll give you the worksheets."],
["Wir fahren in den Ferien nach Indien.","We're going to India in the holidays.","Bitte reichen Sie ein Gesuch ein.","Please submit a request."],
["Brauche ich dafür eine Genehmigung?","Do I need permission for that?","Ja, von der Schulleitung.","Yes, from the head teacher."],
["Wer ist die Klassenlehrerin?","Who is the class teacher?","Frau Berger, sie kommt gleich.","Ms Berger, she's coming shortly."],
["Wie erreiche ich Sie am besten?","How can I best reach you?","Per Mail oder über die App.","By email or through the app."],
["Ich hätte gern ein kurzes Gespräch.","I'd like a short conversation.","Passt Ihnen Donnerstag um vier?","Does Thursday at four suit you?"],
["Mein Kind fühlt sich in der Pause allein.","My child feels alone during break.","Danke, dass Sie das ansprechen.","Thank you for raising that."],
["Gibt es Streit in der Klasse?","Is there conflict in the class?","Wir beobachten das genau.","We're watching that closely."],
["Was können wir zu Hause tun?","What can we do at home?","Viel vorlesen hilft sehr.","Reading aloud a lot helps a great deal."],
["Wann bekommen wir das Zeugnis?","When do we get the report?","Kurz vor den Sommerferien.","Shortly before the summer holidays."],
["Was kostet der Ausflug?","What does the excursion cost?","Fünfundzwanzig Franken.","Twenty-five francs."],
["Bis wann muss ich das Geld abgeben?","By when do I have to hand in the money?","Bis nächsten Freitag.","By next Friday."],
["Was soll mein Kind mitbringen?","What should my child bring?","Regenjacke und ein Mittagessen.","A rain jacket and a packed lunch."],
["Ich habe die Nachricht leider übersehen.","I'm afraid I missed the message.","Kein Problem, ich schicke sie nochmal.","No problem, I'll send it again."],
["Danke für Ihre Geduld mit meinem Deutsch.","Thank you for your patience with my German.","Sie machen das sehr gut.","You're doing very well."]
]},

{name:"Small Talk", type:"phrase", words:[
["Grüezi, wie geht es Ihnen?","Hello, how are you?","Danke, gut. Und Ihnen?","Thanks, good. And you?"],
["Schönes Wetter heute, oder?","Nice weather today, isn't it?","Endlich mal wieder Sonne.","Sunshine again at last."],
["Wohnen Sie schon lange hier?","Have you lived here long?","Seit über zwanzig Jahren.","For over twenty years."],
["Wir sind vor vier Jahren hergezogen.","We moved here four years ago.","Und wie gefällt es Ihnen?","And how do you like it?"],
["Am Anfang war es eine Umstellung.","At first it was an adjustment.","Das kann ich mir vorstellen.","I can imagine."],
["Woher kommen Sie ursprünglich?","Where are you originally from?","Aus Indien.","From India."],
["Haben Sie Kinder?","Do you have children?","Ja, zwei.","Yes, two."],
["Meine Tochter geht hier in die Schule.","My daughter goes to school here.","In welche Klasse?","Which class?"],
["Was machen Sie beruflich?","What do you do for a living?","Ich bin im technischen Bereich.","I work in a technical field."],
["Ich steige gerade wieder ein.","I'm just getting back into work.","Das schaffen Sie bestimmt.","You'll manage that for sure."],
["Haben Sie am Wochenende etwas vor?","Do you have plans for the weekend?","Wir wandern, wenn es trocken bleibt.","We're hiking if it stays dry."],
["Können Sie hier etwas empfehlen?","Can you recommend anything here?","Der Weg am See ist schön.","The path by the lake is lovely."],
["Wie lange braucht man bis dorthin?","How long does it take to get there?","Zu Fuss etwa zwanzig Minuten.","About twenty minutes on foot."],
["Das klingt gut, das probieren wir aus.","That sounds good, we'll try it.","Viel Spass dabei.","Have fun with it."],
["Entschuldigung, ich habe das nicht verstanden.","Sorry, I didn't understand that.","Ich sage es nochmal langsam.","I'll say it again slowly."],
["Sprechen Sie bitte Hochdeutsch mit mir?","Could you speak standard German with me?","Ja, gern.","Yes, of course."],
["Ich lerne noch, aber es wird besser.","I'm still learning, but it's getting better.","Man merkt schon einen Unterschied.","You can already tell the difference."],
["Wie sagt man das auf Deutsch?","How do you say that in German?","Man sagt einfach so.","You just say it like this."],
["Ist dieser Platz noch frei?","Is this seat free?","Ja, bitte sehr.","Yes, please do."],
["Darf ich mich kurz dazusetzen?","May I join you for a moment?","Natürlich, gern.","Of course, gladly."],
["Es war schön, mit Ihnen zu reden.","It was nice talking with you.","Ganz meinerseits.","Likewise."],
["Wir sehen uns bestimmt wieder.","I'm sure we'll see each other again.","Bestimmt, bis bald.","Certainly, see you soon."],
["Ich muss leider los.","I'm afraid I have to go.","Kein Problem, schönen Tag.","No problem, have a nice day."],
["Grüssen Sie Ihre Familie von mir.","Say hello to your family from me.","Mache ich gern.","I'll gladly do that."],
["Schönes Wochenende!","Have a nice weekend!","Ihnen auch!","You too!"]
]},

{name:"Am Telefon", type:"phrase", words:[
["Guten Tag, hier spricht Sudheshna.","Good day, this is Sudheshna speaking.","Was kann ich für Sie tun?","What can I do for you?"],
["Ich rufe wegen meines Termins an.","I'm calling about my appointment.","Einen Moment, ich schaue nach.","One moment, I'll check."],
["Ich hätte eine kurze Frage.","I have a quick question.","Gern, fragen Sie.","Go ahead, ask."],
["Könnten Sie mich bitte verbinden?","Could you put me through, please?","Ich verbinde Sie.","I'll connect you."],
["Ich warte gern.","I'm happy to wait.","Es dauert einen Moment.","It'll take a moment."],
["Die Verbindung ist leider schlecht.","The connection is poor, I'm afraid.","Ich rufe Sie zurück.","I'll call you back."],
["Könnten Sie das bitte buchstabieren?","Could you spell that, please?","Ja, ich buchstabiere es.","Yes, I'll spell it."],
["Ich notiere mir das kurz.","I'll just note that down.","Lassen Sie sich Zeit.","Take your time."],
["Habe ich das richtig verstanden?","Did I understand correctly?","Ja, ganz genau.","Yes, exactly."],
["Können Sie mir das per Mail schicken?","Could you send me that by email?","Ich schicke es gleich.","I'll send it right away."],
["Wie ist Ihre Mailadresse?","What is your email address?","Ich gebe sie Ihnen durch.","I'll give it to you."],
["Ich möchte den Termin verschieben.","I'd like to move the appointment.","Auf welchen Tag?","To which day?"],
["Ginge es auch am Nachmittag?","Would the afternoon work too?","Ja, um vierzehn Uhr.","Yes, at two p.m."],
["Ich muss den Termin leider absagen.","I'm afraid I have to cancel.","Kein Problem, ich streiche ihn.","No problem, I'll remove it."],
["Wann sind Sie wieder erreichbar?","When can I reach you again?","Ab Montagmorgen.","From Monday morning."],
["Kann ich eine Nachricht hinterlassen?","May I leave a message?","Ja, ich notiere sie.","Yes, I'll take it down."],
["Bitte rufen Sie mich zurück.","Please call me back.","Unter welcher Nummer?","On which number?"],
["Meine Nummer ist die folgende.","My number is as follows.","Ich lese sie zur Sicherheit vor.","I'll read it back to be sure."],
["Ich bin bis fünf Uhr erreichbar.","I'm available until five.","Gut, ich melde mich vorher.","Good, I'll get in touch before then."],
["Es geht um eine Rechnung.","It's about an invoice.","Haben Sie die Nummer zur Hand?","Do you have the number to hand?"],
["Ich glaube, da ist ein Fehler passiert.","I think a mistake has been made.","Das prüfen wir gleich.","We'll check that right away."],
["Vielen Dank für Ihre Geduld.","Thank you for your patience.","Sehr gern.","You're very welcome."],
["Können Sie das bitte schriftlich bestätigen?","Could you confirm that in writing?","Sie bekommen es heute noch.","You'll get it today."],
["Dann bleiben wir so verblieben.","Then we'll leave it at that.","Genau so machen wir es.","That's exactly what we'll do."],
["Auf Wiederhören.","Goodbye.","Auf Wiederhören, schönen Tag.","Goodbye, have a good day."]
]}
];

const TOPICS = [{"id":"pron","level":"A1","title":"Personalpronomen","rule":"ich, du, er/sie/es, wir, ihr, sie/Sie. Sie (capital) is the polite form for one person or many.","items":[{"t":"gap","q":"___ heisse Sudheshna.","a":["ich"],"why":"ich = I, always lower case unless it starts the sentence."},{"t":"gap","q":"Wie heisst ___?","a":["du"],"why":"du = informal you, one person."},{"t":"gap","q":"Das ist Tom. ___ kommt aus Bern.","a":["er"],"why":"Tom is masculine, so er."},{"t":"gap","q":"Das ist Maria. ___ wohnt in Zürich.","a":["sie"],"why":"Maria is feminine, so sie."},{"t":"gap","q":"Das Kind spielt. ___ ist drei Jahre alt.","a":["es"],"why":"das Kind is neuter, so es."},{"t":"gap","q":"Anna und ich sind müde. ___ gehen ins Bett.","a":["wir"],"why":"Someone else + I = wir."},{"t":"gap","q":"Kinder, ___ seid zu laut!","a":["ihr"],"why":"ihr = informal you, more than one person."},{"t":"gap","q":"Frau Meier, woher kommen ___?","a":["sie"],"why":"Sie = polite you, written with a capital S."},{"t":"mc","q":"Die Kinder spielen draussen. ___ sind glücklich.","o":["Er","Sie","Es"],"a":1,"why":"Plural always takes sie."},{"t":"gap","q":"___ wohnen seit vier Jahren hier. (wir)","a":["wir"],"why":"wir = we."},{"t":"gap","q":"Mein Bruder ruft an. ___ ist in Indien.","a":["er"],"why":"Bruder is masculine: er."},{"t":"gap","q":"Die Wohnung ist neu. ___ liegt im dritten Stock.","a":["sie"],"why":"die Wohnung is feminine, so sie — even for a thing."},{"t":"gap","q":"Das Auto ist alt. ___ fährt noch gut.","a":["es"],"why":"das Auto is neuter: es."},{"t":"gap","q":"Kannst ___ mir bitte helfen? (du)","a":["du"],"why":"Informal you, one person."},{"t":"gap","q":"Herr Meier, haben ___ einen Moment?","a":["sie"],"why":"Polite Sie, written with a capital S."},{"t":"gap","q":"Kinder, wo seid ___ ?","a":["ihr"],"why":"ihr for several people you know well."},{"t":"mc","q":"Der Tisch ist neu. ___ war nicht teuer.","o":["Es","Er","Sie"],"a":1,"why":"der Tisch is masculine, so er, not es."},{"t":"mc","q":"Which pronoun follows the gender of the noun, not the object itself?","o":["ich","es","sie/er"],"a":2,"why":"German pronouns follow grammatical gender: die Lampe → sie."},{"t":"gap","q":"Anna und Tom kommen. ___ sind schon unterwegs.","a":["sie"],"why":"Two people: plural sie."}],"tables":[{"title":"Personalpronomen","head":["","Nominativ","Akkusativ","Dativ"],"rows":[["1. Sg.","ich","mich","mir"],["2. Sg.","du","dich","dir"],["3. Sg. m","er","ihn","ihm"],["3. Sg. f","sie","sie","ihr"],["3. Sg. n","es","es","ihm"],["1. Pl.","wir","uns","uns"],["2. Pl.","ihr","euch","euch"],["3. Pl.","sie","sie","ihnen"],["höflich","Sie","Sie","Ihnen"]]}],"en":"Personal pronouns — I, you, he, she, we, they","seq":1},{"id":"praes","level":"A1","title":"Konjugation Präsens","rule":"Regular verbs: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, sie/Sie -en. Stems ending in -t or -d add an extra e: du arbeitest.","items":[{"t":"gap","q":"Ich ___ in Adliswil. (wohnen)","a":["wohne"],"why":"ich takes -e."},{"t":"gap","q":"Du ___ sehr viel. (arbeiten)","a":["arbeitest"],"why":"Stem ends in -t, so an extra e goes in: arbeit-e-st."},{"t":"gap","q":"Er ___ Fussball. (spielen)","a":["spielt"],"why":"er/sie/es takes -t."},{"t":"gap","q":"Wir ___ jeden Tag Deutsch. (lernen)","a":["lernen"],"why":"wir takes -en, same as the infinitive."},{"t":"gap","q":"Ihr ___ immer zu spät. (kommen)","a":["kommt"],"why":"ihr takes -t."},{"t":"gap","q":"Du ___ Anna. (heissen)","a":["heisst"],"why":"The stem already ends in s, so du just adds -t."},{"t":"gap","q":"Es ___ seit gestern. (regnen)","a":["regnet"],"why":"Stem ends in -n after g, so an extra e goes in."},{"t":"gap","q":"Die Kinder ___ im Garten. (spielen)","a":["spielen"],"why":"Plural subject takes -en."},{"t":"mc","q":"Warum ___ du so schnell?","o":["redet","redest","reden"],"a":1,"why":"du + stem ending in -d takes -est."},{"t":"gap","q":"Du ___ sehr schnell. (reden)","a":["redest"],"why":"Stem ends in -d, so du takes -est."},{"t":"gap","q":"Er ___ jeden Morgen Zeitung. (lesen)","a":["liest"],"why":"lesen changes e→ie and adds -t."},{"t":"gap","q":"Wir ___ am Wochenende. (arbeiten)","a":["arbeiten"],"why":"wir takes -en."},{"t":"gap","q":"Ihr ___ zu viel. (reden)","a":["redet"],"why":"ihr + stem in -d takes -et."},{"t":"gap","q":"Sie ___ in Zürich. (wohnen, Singular)","a":["wohnt"],"why":"sie singular takes -t."},{"t":"gap","q":"Ich ___ das nicht. (verstehen)","a":["verstehe"],"why":"ich takes -e."},{"t":"gap","q":"Du ___ gut. (tanzen)","a":["tanzt"],"why":"Stem ends in -z, so du just adds -t."},{"t":"gap","q":"Das Kind ___ im Garten. (warten)","a":["wartet"],"why":"Stem in -t takes -et."},{"t":"mc","q":"Which form is wrong?","o":["du findest","du arbeitest","du heisstest"],"a":2,"why":"heissen already ends in s, so du heisst."},{"t":"gap","q":"Die Kinder ___ Fussball. (spielen)","a":["spielen"],"why":"Plural takes -en."}],"tables":[{"title":"Regelmässige Verben","head":["","lernen","arbeiten","heissen"],"rows":[["ich","lerne","arbeite","heisse"],["du","lernst","arbeitest","heisst"],["er/sie/es","lernt","arbeitet","heisst"],["wir","lernen","arbeiten","heissen"],["ihr","lernt","arbeitet","heisst"],["sie/Sie","lernen","arbeiten","heissen"]]},{"title":"Merke","rows":[["Stamm auf -t / -d","extra e: du arbeitest, er findet"],["Stamm auf -s / -ss / -z","du nur -t: du heisst, du tanzt"]]}],"en":"Present tense — the verb ending changes with the person","seq":2},{"id":"seinhaben","level":"A1","title":"sein und haben","rule":"sein: bin, bist, ist, sind, seid, sind. haben: habe, hast, hat, haben, habt, haben. Both are irregular and worth learning by heart.","items":[{"t":"gap","q":"Ich ___ heute sehr müde. (sein)","a":["bin"],"why":"ich bin."},{"t":"gap","q":"Du ___ recht. (haben)","a":["hast"],"why":"du hast."},{"t":"gap","q":"Er ___ Lehrer von Beruf. (sein)","a":["ist"],"why":"er ist."},{"t":"gap","q":"Wir ___ grossen Hunger. (haben)","a":["haben"],"why":"wir haben."},{"t":"gap","q":"Ihr ___ zu spät gekommen. (sein)","a":["seid"],"why":"ihr seid."},{"t":"gap","q":"Sie ___ zwei Kinder. (haben, Plural)","a":["haben"],"why":"sie (plural) haben."},{"t":"gap","q":"___ du am Samstag Zeit? (haben)","a":["hast"],"why":"Question with du: Hast du."},{"t":"gap","q":"Das ___ leider nicht wahr. (sein)","a":["ist"],"why":"das ist."},{"t":"mc","q":"___ ihr schon fertig?","o":["Seid","Sind","Seit"],"a":0,"why":"ihr seid. Note: seit with t is the preposition 'since'."},{"t":"gap","q":"___ ihr schon da? (sein)","a":["seid"],"why":"ihr seid."},{"t":"gap","q":"Ich ___ leider keine Zeit. (haben)","a":["habe"],"why":"ich habe."},{"t":"gap","q":"Er ___ noch sehr jung. (sein)","a":["ist"],"why":"er ist."},{"t":"gap","q":"Du ___ heute sehr still. (sein)","a":["bist"],"why":"du bist."},{"t":"gap","q":"Wir ___ endlich fertig. (sein)","a":["sind"],"why":"wir sind."},{"t":"gap","q":"Ihr ___ ein schönes Haus. (haben)","a":["habt"],"why":"ihr habt."},{"t":"gap","q":"Sie ___ zwei Kinder und einen Hund. (haben, Sie)","a":["haben"],"why":"Polite Sie haben."},{"t":"gap","q":"Es ___ heute sehr warm. (sein)","a":["ist"],"why":"es ist."},{"t":"mc","q":"Which is correct?","o":["Ich habe müde.","Ich bin müde.","Ich bin Hunger."],"a":1,"why":"müde is an adjective, so sein. But Hunger is a noun: Ich habe Hunger."},{"t":"gap","q":"Ich ___ Durst. (haben)","a":["habe"],"why":"German uses haben with Durst, Hunger, Angst and Zeit."}],"tables":[{"title":"Die drei Hilfsverben","head":["","sein","haben","werden"],"rows":[["ich","bin","habe","werde"],["du","bist","hast","wirst"],["er/sie/es","ist","hat","wird"],["wir","sind","haben","werden"],["ihr","seid","habt","werdet"],["sie/Sie","sind","haben","werden"]]}],"en":"'to be' and 'to have' — the two verbs you need most","seq":3},{"id":"vokal","level":"A1","title":"Verben mit Vokalwechsel","rule":"Some verbs change their stem vowel in du and er/sie/es only: a→ä, e→i, e→ie. wir, ihr and sie keep the original vowel.","items":[{"t":"gap","q":"Er ___ am Samstag nach Bern. (fahren)","a":["fährt"],"why":"a becomes ä in er/sie/es."},{"t":"gap","q":"Du ___ schon sehr gut Deutsch. (sprechen)","a":["sprichst"],"why":"e becomes i in du."},{"t":"gap","q":"Sie ___ jeden Abend ein Buch. (lesen)","a":["liest"],"why":"e becomes ie: sie liest."},{"t":"gap","q":"Er ___ jeden Morgen einen Apfel. (essen)","a":["isst"],"why":"e becomes i: er isst."},{"t":"gap","q":"Du ___ den nächsten Bus. (nehmen)","a":["nimmst"],"why":"nehmen becomes du nimmst."},{"t":"gap","q":"Das Kind ___ noch. (schlafen)","a":["schläft"],"why":"a becomes ä."},{"t":"gap","q":"Sie ___ mir das Buch. (geben)","a":["gibt"],"why":"e becomes i: sie gibt."},{"t":"gap","q":"Du ___ heute müde aus. (aussehen)","a":["siehst"],"why":"e becomes ie, and aus goes to the end."},{"t":"mc","q":"Wir ___ am Wochenende in die Berge.","o":["fährt","fahren","fährst"],"a":1,"why":"wir never changes the vowel: wir fahren."},{"t":"gap","q":"Er ___ mir immer bei den Hausaufgaben. (helfen)","a":["hilft"],"why":"e→i: er hilft."},{"t":"gap","q":"Du ___ zu schnell. (laufen)","a":["läufst","laeufst"],"why":"au→äu: du läufst."},{"t":"gap","q":"Sie ___ ihre Tasche zu Hause. (vergessen)","a":["vergisst"],"why":"e→i: sie vergisst."},{"t":"gap","q":"Er ___ einen schweren Koffer. (tragen)","a":["trägt","traegt"],"why":"a→ä: er trägt."},{"t":"gap","q":"Wir ___ uns um sieben. (treffen)","a":["treffen"],"why":"wir keeps the original vowel."},{"t":"gap","q":"Das Kleid ___ mir gut. (gefallen)","a":["gefällt","gefaellt"],"why":"a→ä: es gefällt."},{"t":"gap","q":"Du ___ das Buch. (nehmen)","a":["nimmst"],"why":"nehmen becomes du nimmst."},{"t":"gap","q":"Ihr ___ zu wenig. (essen)","a":["esst"],"why":"ihr keeps the e: ihr esst."},{"t":"mc","q":"Which form has NO vowel change?","o":["du sprichst","wir sprechen","er spricht"],"a":1,"why":"Only du and er/sie/es change."},{"t":"gap","q":"Er ___ um zehn ins Bett. (gehen)","a":["geht"],"why":"gehen has no vowel change: er geht."}],"tables":[{"title":"Vokalwechsel nur bei du und er/sie/es","head":["","fahren a→ä","sprechen e→i","lesen e→ie","nehmen"],"rows":[["ich","fahre","spreche","lese","nehme"],["du","fährst","sprichst","liest","nimmst"],["er/sie/es","fährt","spricht","liest","nimmt"],["wir","fahren","sprechen","lesen","nehmen"],["ihr","fahrt","sprecht","lest","nehmt"],["sie/Sie","fahren","sprechen","lesen","nehmen"]]},{"title":"Weitere Verben","rows":[["a→ä","schlafen, tragen, laufen, halten, gefallen"],["e→i","essen, geben, helfen, treffen, vergessen"],["e→ie","sehen, empfehlen, stehlen"]]}],"en":"Stem-changing verbs — the vowel shifts for du and er/sie/es","seq":4},{"id":"modal","level":"A1","title":"Modalverben","rule":"können, müssen, wollen, dürfen, sollen, mögen. The modal is in position 2 and the main verb goes to the very end as an infinitive.","items":[{"t":"gap","q":"Ich ___ gut kochen. (können)","a":["kann"],"why":"ich kann — no ending in ich and er/sie/es."},{"t":"gap","q":"Du ___ jetzt wirklich gehen. (müssen)","a":["musst"],"why":"du musst."},{"t":"gap","q":"Er ___ heute nicht arbeiten. (wollen)","a":["will"],"why":"er will."},{"t":"gap","q":"Wir ___ hier nicht parken. (dürfen)","a":["dürfen"],"why":"wir dürfen."},{"t":"gap","q":"___ ich Ihnen helfen? (können)","a":["kann"],"why":"Kann ich — the modal starts the question."},{"t":"gap","q":"Du ___ mehr Wasser trinken. (sollen)","a":["sollst"],"why":"du sollst."},{"t":"gap","q":"Ich ___ keinen Kaffee. (mögen)","a":["mag"],"why":"ich mag."},{"t":"gap","q":"Wir können am Samstag ___ . (kommen)","a":["kommen"],"why":"After a modal the second verb stays in the infinitive, at the end."},{"t":"mc","q":"Which sentence is correct?","o":["Ich muss heute gehen früher.","Ich muss heute früher gehen.","Ich gehen muss heute früher."],"a":1,"why":"The infinitive goes right at the end of the sentence."},{"t":"gap","q":"Ihr ___ hier nicht rauchen. (dürfen)","a":["dürft","duerft"],"why":"ihr dürft."},{"t":"gap","q":"Wir ___ heute länger bleiben. (können)","a":["können","koennen"],"why":"wir können."},{"t":"gap","q":"Sie ___ das Formular ausfüllen. (müssen, Sie)","a":["müssen","muessen"],"why":"Polite Sie müssen."},{"t":"gap","q":"Ich ___ gern einen Tee. (möchten)","a":["möchte","moechte"],"why":"ich möchte — polite way to order."},{"t":"gap","q":"Du ___ das nicht machen. (sollen)","a":["sollst"],"why":"du sollst."},{"t":"gap","q":"Er ___ keine Zwiebeln. (mögen)","a":["mag"],"why":"er mag — no ending."},{"t":"gap","q":"Wir ___ morgen früh aufstehen. (müssen)","a":["müssen","muessen"],"why":"wir müssen, with aufstehen at the end."},{"t":"mc","q":"Which is correct?","o":["Ich kann Deutsch sprechen.","Ich kann sprechen Deutsch.","Ich kann Deutsch spreche."],"a":0,"why":"The infinitive goes right at the end."},{"t":"mc","q":"Ich ___ nicht schwimmen — ich habe es nie gelernt.","o":["darf","kann","muss"],"a":1,"why":"können = ability. dürfen = permission, müssen = obligation."},{"t":"mc","q":"Hier ___ man nicht parken — es ist verboten.","o":["kann","darf","mag"],"a":1,"why":"dürfen is about permission, so a ban uses nicht dürfen."}],"tables":[{"title":"Modalverben 1","head":["","können","müssen","wollen"],"rows":[["ich","kann","muss","will"],["du","kannst","musst","willst"],["er/sie/es","kann","muss","will"],["wir","können","müssen","wollen"],["ihr","könnt","müsst","wollt"],["sie/Sie","können","müssen","wollen"]]},{"title":"Modalverben 2","head":["","dürfen","sollen","mögen","möchten"],"rows":[["ich","darf","soll","mag","möchte"],["du","darfst","sollst","magst","möchtest"],["er/sie/es","darf","soll","mag","möchte"],["wir","dürfen","sollen","mögen","möchten"],["ihr","dürft","sollt","mögt","möchtet"],["sie/Sie","dürfen","sollen","mögen","möchten"]]},{"title":"Merke","rows":[["ich und er/sie/es","keine Endung, gleiche Form"],["Satzbau","Modalverb Position 2, Infinitiv am Ende"]]}],"en":"Modal verbs — can, must, want, may, should, like","seq":5},{"id":"modalgeb","level":"A1","seq":6,"title":"Modalverben: Gebrauch","en":"What each modal actually means — permission, ability, obligation","rule":"können = ability. dürfen = permission. müssen = necessity. sollen = someone else's instruction. wollen = your own intention. möchten = a polite wish. Watch the negatives: nicht müssen means 'you don't have to', but nicht dürfen means 'you must not'.","tables":[{"title":"Bedeutung","head":["Verb","Bedeutung","Beispiel"],"rows":[["können","ability, possibility","Ich kann schwimmen."],["dürfen","permission","Darf ich hier rauchen?"],["müssen","necessity","Ich muss arbeiten."],["sollen","someone else says so","Der Arzt sagt, ich soll mehr schlafen."],["wollen","your own intention","Ich will Ärztin werden."],["möchten","polite wish","Ich möchte einen Kaffee."],["mögen","liking, no infinitive","Ich mag Tee."]]},{"title":"Verneinung","rows":[["nicht müssen","not necessary — Du musst nicht kommen."],["nicht dürfen","forbidden — Du darfst nicht rauchen."],["nicht können","not able — Ich kann nicht kommen."]]}],"items":[{"t":"mc","q":"Ich ___ schwimmen. Ich habe es als Kind gelernt.","o":["kann","darf","muss"],"a":0,"why":"Ability learned = können."},{"t":"mc","q":"___ ich Ihr Telefon benutzen?","o":["Muss","Darf","Will"],"a":1,"why":"Asking permission = dürfen."},{"t":"mc","q":"Du ___ hier nicht rauchen, das ist verboten.","o":["musst","darfst","kannst"],"a":1,"why":"A ban is nicht dürfen."},{"t":"mc","q":"Du ___ nicht kommen, wenn du müde bist.","o":["darfst","musst","sollst"],"a":1,"why":"nicht müssen = you don't have to."},{"t":"mc","q":"What does 'Du musst nicht kommen' mean?","o":["You are not allowed to come.","You don't have to come."],"a":1,"why":"nicht müssen removes the obligation, it does not forbid."},{"t":"mc","q":"What does 'Du darfst nicht kommen' mean?","o":["You don't have to come.","You are not allowed to come."],"a":1,"why":"nicht dürfen is a prohibition."},{"t":"gap","q":"Der Arzt sagt, ich ___ mehr Wasser trinken. (sollen)","a":["soll"],"why":"An instruction from someone else = sollen."},{"t":"gap","q":"Ich ___ bitte einen Kaffee. (höflicher Wunsch)","a":["möchte","moechte"],"why":"möchte is the polite wish form."},{"t":"gap","q":"Ich ___ Schokolade sehr gern. (mögen)","a":["mag"],"why":"mögen stands alone with a noun, no infinitive."},{"t":"gap","q":"Wir ___ morgen früh aufstehen, der Zug fährt um sechs. (müssen)","a":["müssen","muessen"],"why":"Real necessity = müssen."},{"t":"gap","q":"___ du mir kurz helfen? (Bitte)","a":["kannst"],"why":"Kannst du ...? is the everyday way to ask for help."},{"t":"gap","q":"Hier ___ man nicht parken. (Verbot)","a":["darf"],"why":"A ban uses darf nicht."},{"t":"gap","q":"Ich ___ Ingenieurin werden. (eigener Plan)","a":["will","möchte","moechte"],"why":"Your own firm intention = wollen."},{"t":"gap","q":"___ ich Ihnen helfen? (Angebot)","a":["kann","darf"],"why":"Kann ich Ihnen helfen? is the standard offer."}]},{"id":"trenn","level":"A1","title":"Trennbare Verben","rule":"aufstehen, anrufen, einkaufen and similar verbs split in a main clause: the prefix jumps to the end. After a modal they stay whole.","items":[{"t":"gap","q":"Ich stehe jeden Tag um sechs ___ . (aufstehen)","a":["auf"],"why":"The prefix auf goes to the end."},{"t":"gap","q":"Wann fährt der Zug ___ ? (abfahren)","a":["ab"],"why":"ab goes to the end, even in a question."},{"t":"gap","q":"Ruf mich bitte heute Abend ___ ! (anrufen)","a":["an"],"why":"an goes to the end in the imperative too."},{"t":"gap","q":"Ich kaufe am Samstag ___ . (einkaufen)","a":["ein"],"why":"ein goes to the end."},{"t":"gap","q":"Machst du bitte das Fenster ___ ? (zumachen)","a":["zu"],"why":"zu goes to the end."},{"t":"gap","q":"Wir fahren morgen um acht ___ . (losfahren)","a":["los"],"why":"los goes to the end."},{"t":"gap","q":"Ich hole die Kinder um vier ___ . (abholen)","a":["ab"],"why":"ab goes to the end."},{"t":"mc","q":"Ich muss die Kinder ___ .","o":["abhole","abholen","hole ab"],"a":1,"why":"After a modal the verb stays whole in the infinitive: abholen."},{"t":"mc","q":"Which is correct?","o":["Ich einkaufe am Samstag.","Ich kaufe am Samstag ein.","Ich kaufe ein am Samstag."],"a":1,"why":"The prefix goes right to the end of the clause."},{"t":"gap","q":"Der Film fängt um acht ___ . (anfangen)","a":["an"],"why":"an goes to the end."},{"t":"gap","q":"Wir steigen an der Hauptstrasse ___ . (aussteigen)","a":["aus"],"why":"aus goes to the end."},{"t":"gap","q":"Ich ziehe mich schnell ___ . (umziehen)","a":["um"],"why":"um goes to the end."},{"t":"gap","q":"Bring bitte Brot ___ ! (mitbringen)","a":["mit"],"why":"mit goes to the end in the imperative."},{"t":"gap","q":"Wann kommst du ___ ? (zurückkommen)","a":["zurück","zurueck"],"why":"zurück goes to the end."},{"t":"gap","q":"Ich habe die Kinder ___ . (abholen, Perfekt)","a":["abgeholt"],"why":"Perfect of a separable verb: ab + ge + holt."},{"t":"gap","q":"Ich rufe dich an, wenn ich ___ . (ankommen, Nebensatz)","a":["ankomme"],"why":"In a subordinate clause the verb stays whole at the end."},{"t":"mc","q":"Which verb is NOT separable?","o":["anrufen","besuchen","einkaufen"],"a":1,"why":"be- is an inseparable prefix."},{"t":"mc","q":"Weil ich früh ___ , gehe ich jetzt ins Bett.","o":["stehe auf","aufstehe","aufstehen"],"a":1,"why":"In a subordinate clause the verb stays together at the end."},{"t":"gap","q":"Wir fangen morgen mit dem Kurs ___ . (anfangen)","a":["an"],"why":"an at the end, after everything else."}],"tables":[{"title":"anrufen in jedem Satztyp","rows":[["Aussage","Ich rufe dich an."],["Frage","Rufst du mich an?"],["Imperativ","Ruf mich an!"],["mit Modalverb","Ich will dich anrufen."],["Nebensatz","..., weil ich dich anrufe."],["Perfekt","Ich habe dich angerufen."],["mit zu","Ich habe vergessen, dich anzurufen."]]},{"title":"Häufige trennbare Vorsilben","rows":[["","ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, weg-, los-, hin-, her-"]]},{"title":"Nicht trennbar","rows":[["","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"]]}],"en":"Separable verbs — the prefix breaks off and goes to the end","seq":7},{"id":"imp","level":"A1","title":"Imperativ","rule":"du: verb stem, no ending (Geh!). ihr: like the present tense (Geht!). Sie: verb + Sie (Gehen Sie!). Vowel-change verbs keep e→i in du: Nimm!","items":[{"t":"gap","q":"___ bitte nach Hause! (gehen, du)","a":["geh","gehe"],"why":"du form: just the stem, geh."},{"t":"gap","q":"___ bitte herein! (kommen, ihr)","a":["kommt"],"why":"ihr form is the same as the present tense."},{"t":"gap","q":"___ Sie bitte einen Moment! (warten, Sie)","a":["warten"],"why":"Sie form: infinitive + Sie."},{"t":"gap","q":"___ bitte leise! (sein, du)","a":["sei"],"why":"sein is irregular: Sei!"},{"t":"gap","q":"___ den nächsten Bus! (nehmen, du)","a":["nimm"],"why":"e→i change stays in the imperative: Nimm!"},{"t":"gap","q":"___ bitte das Fenster zu! (zumachen, du)","a":["mach"],"why":"Mach ... zu — the prefix still goes to the end."},{"t":"gap","q":"___ Sie mir bitte! (helfen, Sie)","a":["helfen"],"why":"Sie form: Helfen Sie."},{"t":"gap","q":"___ bitte etwas langsamer! (fahren, du)","a":["fahr","fahre"],"why":"a→ä does NOT happen in the du imperative: Fahr!"},{"t":"mc","q":"Polite request to one stranger:","o":["Warte bitte!","Wartet bitte!","Warten Sie bitte!"],"a":2,"why":"With a stranger use the Sie form."},{"t":"gap","q":"___ mir bitte! (helfen, du)","a":["hilf"],"why":"e→i stays: Hilf!"},{"t":"gap","q":"___ bitte langsamer! (sprechen, Sie)","a":["sprechen"],"why":"Sie form: Sprechen Sie."},{"t":"gap","q":"___ nicht so laut! (sein, ihr)","a":["seid"],"why":"ihr form of sein: Seid!"},{"t":"gap","q":"___ bitte Geduld! (haben, du)","a":["hab","habe"],"why":"du form of haben: Hab!"},{"t":"gap","q":"___ das Fenster bitte auf! (aufmachen, Sie)","a":["machen"],"why":"Machen Sie ... auf."},{"t":"gap","q":"___ mir das Buch! (geben, du)","a":["gib"],"why":"e→i: Gib!"},{"t":"gap","q":"___ euch bitte hin! (setzen, ihr)","a":["setzt"],"why":"ihr form: Setzt euch."},{"t":"mc","q":"Talking to your child:","o":["Essen Sie bitte!","Iss bitte!","Esst bitte!"],"a":1,"why":"One child, informal: the du imperative Iss!"},{"t":"mc","q":"Which du imperative is correct?","o":["Fähr langsamer!","Fahr langsamer!","Fahrst langsamer!"],"a":1,"why":"a→ä does not happen in the imperative."},{"t":"gap","q":"___ Sie bitte hier! (warten, Sie)","a":["warten"],"why":"Warten Sie."}],"tables":[{"title":"Imperativformen","head":["","gehen","nehmen","fahren","sein","haben"],"rows":[["du","Geh!","Nimm!","Fahr!","Sei!","Hab!"],["ihr","Geht!","Nehmt!","Fahrt!","Seid!","Habt!"],["Sie","Gehen Sie!","Nehmen Sie!","Fahren Sie!","Seien Sie!","Haben Sie!"]]},{"title":"Merke","rows":[["e→i bleibt","nehmen → Nimm!, geben → Gib!"],["a→ä fällt weg","fahren → Fahr! (nicht Fähr!)"],["bitte","macht jeden Imperativ höflicher"]]}],"en":"Imperative — telling or asking someone to do something","seq":8},{"id":"fragen","level":"A1","title":"Fragen","rule":"W-questions start with the question word: Wie heisst du? Yes/no questions start with the verb: Hast du Zeit?","items":[{"t":"gap","q":"___ heisst du?","a":["wie"],"why":"wie = how, used for names too."},{"t":"gap","q":"___ kommst du? – Aus Indien.","a":["woher"],"why":"woher asks where from."},{"t":"gap","q":"___ wohnst du? – In Adliswil.","a":["wo"],"why":"wo asks where."},{"t":"gap","q":"___ kostet das Buch? – Zwanzig Franken.","a":["was","wie viel"],"why":"Was kostet ...? is the normal way to ask a price."},{"t":"gap","q":"___ hast du Geburtstag? – Im Mai.","a":["wann"],"why":"wann asks when."},{"t":"gap","q":"___ ist das? – Das ist mein Bruder.","a":["wer"],"why":"wer asks which person."},{"t":"gap","q":"___ kommst du nicht mit?","a":["warum","wieso","weshalb"],"why":"warum asks for a reason."},{"t":"gap","q":"___ du morgen Zeit? (haben)","a":["hast"],"why":"Yes/no question: the verb comes first."},{"t":"mc","q":"Which is a correct yes/no question?","o":["Du hast Zeit?","Hast du Zeit?","Zeit hast du?"],"a":1,"why":"Yes/no questions put the verb in first position."},{"t":"gap","q":"___ siehst du? – Meinen Bruder.","a":["wen"],"why":"Person as object: wen."},{"t":"gap","q":"___ hilfst du? – Meiner Schwester.","a":["wem"],"why":"helfen takes the dative, so wem."},{"t":"gap","q":"___ gehst du? – Ins Kino.","a":["wohin"],"why":"Direction: wohin."},{"t":"gap","q":"___ lange dauert der Kurs?","a":["wie"],"why":"wie lange asks about duration."},{"t":"gap","q":"___ Bus fährt zum Bahnhof?","a":["welcher"],"why":"welcher asks you to choose."},{"t":"gap","q":"___ oft gehst du schwimmen?","a":["wie"],"why":"wie oft asks about frequency."},{"t":"gap","q":"___ du morgen frei? (sein)","a":["bist"],"why":"Yes/no question: verb first."},{"t":"gap","q":"___ ihr schon gegessen? (haben)","a":["habt"],"why":"Yes/no question in the perfect: Habt ihr ...?"},{"t":"mc","q":"___ wartest du? – Auf den Bus.","o":["Worauf","Wofür","Womit"],"a":0,"why":"warten auf → Worauf for a thing."},{"t":"mc","q":"Which asks about origin?","o":["Wo","Wohin","Woher"],"a":2,"why":"woher = where from."}],"tables":[{"title":"Fragewörter","head":["Wort","Frage nach","Beispiel"],"rows":[["wer","Person (Nom.)","Wer kommt?"],["wen","Person (Akk.)","Wen siehst du?"],["wem","Person (Dat.)","Wem hilfst du?"],["was","Sache","Was kostet das?"],["wo","Ort","Wo wohnst du?"],["wohin","Richtung","Wohin gehst du?"],["woher","Herkunft","Woher kommst du?"],["wann","Zeit","Wann kommst du?"],["wie","Art","Wie geht es dir?"],["warum","Grund","Warum nicht?"],["welcher","Auswahl","Welcher Bus?"],["wie viel","Menge","Wie viel kostet das?"],["wie lange","Dauer","Wie lange dauert es?"],["wie oft","Häufigkeit","Wie oft gehst du?"]]}],"en":"Questions — question words and yes/no questions","seq":9},{"id":"wortst","level":"A1","title":"Wörter im Satz","rule":"In a statement the conjugated verb is always in position 2. Whatever you put first, the verb still comes second and the subject moves after it.","items":[{"t":"gap","q":"Heute ___ ich nach Bern. (fahren)","a":["fahre"],"why":"Heute is position 1, so the verb comes second and ich follows."},{"t":"gap","q":"Morgen ___ wir früher an. (anfangen)","a":["fangen"],"why":"fangen in position 2, an at the end."},{"t":"gap","q":"Ich ___ heute leider keine Zeit. (haben)","a":["habe"],"why":"Subject first, verb second."},{"t":"gap","q":"Um acht ___ der Kurs. (beginnen)","a":["beginnt"],"why":"Time first, verb second, subject third."},{"t":"gap","q":"Leider ___ ich nicht kommen. (können)","a":["kann"],"why":"The modal takes position 2."},{"t":"gap","q":"Am Wochenende ___ wir immer aus. (schlafen)","a":["schlafen"],"why":"Verb second, prefix aus at the end."},{"t":"mc","q":"Which is correct?","o":["Am Montag ich gehe zur Arbeit.","Am Montag gehe ich zur Arbeit.","Ich am Montag gehe zur Arbeit."],"a":1,"why":"The verb must stay in position 2."},{"t":"mc","q":"Which is correct?","o":["Ich fahre morgen mit dem Zug nach Bern.","Ich morgen fahre mit dem Zug nach Bern.","Morgen ich fahre mit dem Zug nach Bern."],"a":0,"why":"Verb second; time, then manner, then place."},{"t":"mc","q":"Normal order of the middle field:","o":["place, manner, time","time, manner, place","manner, time, place"],"a":1,"why":"Time – manner – place: heute mit dem Bus nach Zürich."},{"t":"gap","q":"Gestern ___ ich sehr müde. (sein)","a":["war"],"why":"Time first, verb second."},{"t":"gap","q":"Nach der Arbeit ___ ich immer einkaufen. (gehen)","a":["gehe"],"why":"Long phrase in position 1, verb still second."},{"t":"gap","q":"Deshalb ___ wir zu Hause geblieben. (sein)","a":["sind"],"why":"deshalb takes position 1."},{"t":"gap","q":"Am Samstag ___ meine Eltern. (kommen)","a":["kommen"],"why":"Verb second, subject after it."},{"t":"gap","q":"Morgen ___ ich nicht arbeiten. (müssen)","a":["muss"],"why":"The modal takes position 2."},{"t":"mc","q":"Which is correct?","o":["Ich gehe heute mit dem Bus zur Arbeit.","Ich gehe mit dem Bus heute zur Arbeit."],"a":0,"why":"Time before manner before place."},{"t":"mc","q":"Which is correct?","o":["Ich habe gestern ein Buch gekauft.", en and ein becomes einen. Everything else stays the same.","items":[{"t":"gap","q":"___ Mann dort ist mein Nachbar.","a":["der"],"why":"Mann is masculine: der Mann."},{"t":"gap","q":"___ Frau arbeitet bei einer Bank.","a":["die"],"why":"Frau is feminine: die Frau."},{"t":"gap","q":"___ Kind spielt im Garten.","a":["das"],"why":"Kind is neuter: das Kind."},{"t":"gap","q":"Wir haben ___ Auto gekauft.","a":["ein"],"why":"Auto is neuter, so ein in both nominative and accusative."},{"t":"gap","q":"Das ist ___ interessantes Buch.","a":["ein"],"why":"Buch is neuter: ein Buch."},{"t":"gap","q":"Ich brauche ___ neue Tasche.","a":["eine"],"why":"Tasche is feminine: eine, unchanged in the accusative."},{"t":"gap","q":"Ich möchte ___ Kaffee, bitte.","a":["einen"],"why":"Kaffee is masculine and it is the object, so einen."},{"t":"mc","q":"Ich sehe ___ Hund.","o":["der","den","dem"],"a":1,"why":"Masculine object takes den."},{"t":"mc","q":"Nouns ending in -ung, -heit, -keit are usually:","o":["masculine","feminine","neuter"],"a":1,"why":"These endings are reliably feminine: die Wohnung, die Freiheit."},{"t":"gap","q":"___ Zeitung liegt auf dem Tisch.","a":["die"],"why":"Zeitung ends in -ung, so feminine."},{"t":"gap","q":"___ Mädchen spielt draussen.","a":["das"],"why":"-chen is always neuter, even for a girl."},{"t":"gap","q":"___ Sommer war dieses Jahr kurz.","a":["der"],"why":"Seasons, months and days are masculine."},{"t":"gap","q":"Ich brauche ___ Stift.","a":["einen"],"why":"Stift is masculine and is the object."},{"t":"gap","q":"Wir suchen ___ Wohnung.","a":["eine"],"why":"Wohnung is feminine: eine, unchanged in the accusative."},{"t":"gap","q":"___ Freiheit ist ihm wichtig.","a":["die"],"why":"-heit is feminine."},{"t":"gap","q":"Ich habe ___ Problem.","a":["ein"],"why":"Problem is neuter."},{"t":"mc","q":"Which noun is feminine?","o":["der Beruf","die Bildung","das Zeugnis"],"a":1,"why":"-ung is reliably feminine."},{"t":"mc","q":"Ich gebe ___ Kind das Buch.","o":["das","dem","den"],"a":1,"why":"Indirect object: neuter dative dem."},{"t":"gap","q":"___ Essen ist fertig.","a":["das"],"why":"Infinitives used as nouns are neuter: das Essen."}],"tables":[{"title":"Bestimmter Artikel","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","den"],["Genitiv","des","der","des","der"]]},{"title":"Unbestimmter Artikel","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","ein","eine","ein","—"],["Akkusativ","einen","eine","ein","—"],["Dativ","einem","einer","einem","—"],["Genitiv","eines","einer","eines","—"]]},{"title":"Genus erkennen","rows":[["maskulin","-er, -en, -ling, -ismus; Tage, Monate, Wetter"],["feminin","-ung, -heit, -keit, -schaft, -ion, -tät, -ei"],["neutral","-chen, -lein, -ment, -um; Infinitive (das Essen)"]]}],"en":"Articles — 'the' and 'a', and the gender of nouns","seq":14},{"id":"neg","level":"A1","title":"Negation: kein und nicht","rule":"kein negates a noun with ein or no article. nicht negates everything else: verbs, adjectives, and nouns with der/die/das or a possessive.","items":[{"t":"gap","q":"Ich habe heute ___ Zeit.","a":["keine"],"why":"Zeit is feminine and has no article, so keine."},{"t":"gap","q":"Das ist ___ Problem.","a":["kein"],"why":"Problem is neuter: kein Problem."},{"t":"gap","q":"Wir haben ___ Auto.","a":["kein"],"why":"Auto is neuter: kein Auto."},{"t":"gap","q":"Er kommt heute ___ .","a":["nicht"],"why":"nicht negates the verb."},{"t":"gap","q":"Das Buch ist ___ interessant.","a":["nicht"],"why":"nicht goes before the adjective."},{"t":"gap","q":"Ich kenne ihn ___ .","a":["nicht"],"why":"nicht negates the verb and goes at the end here."},{"t":"gap","q":"Sie haben ___ Kinder.","a":["keine"],"why":"Plural with no article takes keine."},{"t":"gap","q":"Ich trinke ___ Kaffee.","a":["keinen"],"why":"Masculine object: keinen."},{"t":"mc","q":"Das ist ___ mein Buch.","o":["kein","nicht","keine"],"a":1,"why":"With a possessive you use nicht, not kein."},{"t":"gap","q":"Ich habe ___ Hunger.","a":["keinen"],"why":"Hunger is masculine and is the object: keinen."},{"t":"gap","q":"Wir brauchen ___ Hilfe.","a":["keine"],"why":"Hilfe is feminine: keine."},{"t":"gap","q":"Das gefällt mir ___ .","a":["nicht"],"why":"nicht negates the verb."},{"t":"gap","q":"Er hat ___ Geschwister.","a":["keine"],"why":"Plural with no article: keine."},{"t":"gap","q":"Ich komme heute ___ mit.","a":["nicht"],"why":"nicht goes before the separable prefix."},{"t":"gap","q":"Das ist ___ meine Tasche.","a":["nicht"],"why":"With a possessive you use nicht."},{"t":"gap","q":"Ich habe mit ___ Kollegen gesprochen.","a":["keinem"],"why":"mit + masculine dative: keinem."},{"t":"mc","q":"Ich trinke ___ Alkohol.","o":["nicht","keinen","kein"],"a":1,"why":"Alkohol is masculine and has no article, so keinen."},{"t":"mc","q":"Where does nicht usually go?","o":["before the conjugated verb","before the element being negated","always first"],"a":1,"why":"nicht stands directly before what it negates, or at the end for the whole verb."},{"t":"gap","q":"Der Laden ist heute ___ geöffnet.","a":["nicht"],"why":"nicht before an adjective or participle."}],"tables":[{"title":"kein","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","kein","keine","kein","keine"],["Akkusativ","keinen","keine","kein","keine"],["Dativ","keinem","keiner","keinem","keinen"]]},{"title":"kein oder nicht?","rows":[["kein","vor Nomen mit ein oder ohne Artikel"],["nicht","vor der/die/das, mein, dein, Namen"],["nicht","vor Adjektiven und Adverbien"],["nicht","am Satzende, wenn das Verb verneint wird"]]}],"en":"Negation — how to say 'not' and 'no'","seq":15},{"id":"akk","level":"A1","title":"Akkusativ","rule":"The accusative marks the direct object. Only masculine changes: der→den, ein→einen, mein→meinen. Feminine, neuter and plural look the same as the nominative.","items":[{"t":"gap","q":"Ich sehe ___ Mann an der Tür.","a":["den"],"why":"Masculine object: der becomes den."},{"t":"gap","q":"Ich kaufe ___ Tasche.","a":["die"],"why":"Feminine stays die."},{"t":"gap","q":"Er liest ___ Buch.","a":["das"],"why":"Neuter stays das."},{"t":"gap","q":"Ich habe ___ Bruder und zwei Schwestern.","a":["einen"],"why":"Masculine object: ein becomes einen."},{"t":"gap","q":"Wir brauchen ___ neuen Stuhl.","a":["einen"],"why":"Stuhl is masculine and is the object."},{"t":"gap","q":"Wir besuchen ___ Eltern am Sonntag.","a":["die"],"why":"Plural stays die."},{"t":"gap","q":"Ich rufe ___ Arzt an.","a":["den"],"why":"Masculine object takes den."},{"t":"gap","q":"Ich möchte ___ Wasser, bitte.","a":["ein"],"why":"Wasser is neuter, so ein is unchanged."},{"t":"mc","q":"Which verb does NOT take the accusative?","o":["sehen","kaufen","helfen"],"a":2,"why":"helfen takes the dative: Ich helfe dem Mann."},{"t":"gap","q":"Wir suchen ___ Wohnung. (eine)","a":["eine"],"why":"Feminine accusative stays eine."},{"t":"gap","q":"Ich kenne ___ Kollegen gut.","a":["den"],"why":"Masculine accusative: den."},{"t":"gap","q":"Sie liest ___ Zeitung.","a":["die"],"why":"Feminine stays die."},{"t":"gap","q":"Er trägt ___ schweren Koffer.","a":["einen"],"why":"Koffer is masculine, object: einen."},{"t":"gap","q":"Ich brauche ___ Termin.","a":["einen"],"why":"Termin is masculine."},{"t":"gap","q":"Wir haben ___ Auto verkauft.","a":["das"],"why":"Neuter stays das."},{"t":"gap","q":"Ich rufe ___ Kollegen an.","a":["meinen"],"why":"Possessive, masculine accusative: meinen."},{"t":"mc","q":"Which sentence uses the accusative correctly?","o":["Ich sehe der Mann.","Ich sehe den Mann.","Ich sehe dem Mann."],"a":1,"why":"Direct object, masculine: den."},{"t":"mc","q":"Ich helfe ___ Bruder.","o":["meinen","meinem","mein"],"a":1,"why":"helfen takes the dative, so meinem — a trap after all this accusative practice."},{"t":"gap","q":"Möchtest du ___ Apfel?","a":["einen"],"why":"Apfel is masculine, object: einen."}],"tables":[{"title":"Akkusativ — nur maskulin ändert sich","head":["","der-Wörter","ein-Wörter","mein-Wörter"],"rows":[["maskulin","den","einen","meinen"],["feminin","die","eine","meine"],["neutral","das","ein","mein"],["Plural","die","—","meine"]]},{"title":"Typische Akkusativ-Verben","rows":[["","sehen, kaufen, haben, brauchen, lesen, essen, trinken, nehmen, besuchen, suchen, finden"]]}],"en":"Accusative — the direct object, the thing being acted on","seq":16},{"id":"dat","level":"A1","title":"Dativ","rule":"der/das→dem, die→der, plural→den (+n on the noun). Used after helfen, danken, gehören and after mit, nach, bei, seit, von, zu, aus.","items":[{"t":"gap","q":"Ich helfe ___ Mann mit dem Koffer.","a":["dem"],"why":"helfen takes the dative: dem Mann."},{"t":"gap","q":"Ich gebe ___ Frau das Buch.","a":["der"],"why":"Feminine dative: die becomes der."},{"t":"gap","q":"Ich danke ___ Kind für die Hilfe.","a":["dem"],"why":"Neuter dative: das becomes dem."},{"t":"gap","q":"Wir fahren mit ___ Bus.","a":["dem"],"why":"mit always takes the dative."},{"t":"gap","q":"Sie wohnt noch bei ___ Eltern.","a":["den"],"why":"Plural dative: den Eltern."},{"t":"gap","q":"Ich spreche mit ___ Lehrerin.","a":["der"],"why":"mit + feminine dative = der Lehrerin."},{"t":"gap","q":"Nach ___ Arbeit gehe ich einkaufen.","a":["der"],"why":"nach + feminine dative = der Arbeit."},{"t":"gap","q":"Das Buch gehört ___ Kollegen.","a":["dem"],"why":"gehören takes the dative."},{"t":"mc","q":"Which preposition always takes the dative?","o":["für","seit","ohne"],"a":1,"why":"seit is dative; für and ohne take the accusative."},{"t":"gap","q":"Das Essen schmeckt ___ Kindern gut.","a":["den"],"why":"schmecken takes the dative; plural is den + n."},{"t":"gap","q":"Ich fahre zu ___ Arzt.","a":["dem"],"why":"zu dem — usually contracted to zum."},{"t":"gap","q":"Nach ___ Essen gehen wir spazieren.","a":["dem"],"why":"nach + neuter dative: dem Essen."},{"t":"gap","q":"Die Wohnung gefällt ___ Frau.","a":["der"],"why":"gefallen takes the dative, feminine: der."},{"t":"gap","q":"Ich komme aus ___ Schweiz.","a":["der"],"why":"die Schweiz is feminine: aus der Schweiz."},{"t":"gap","q":"Er wohnt bei ___ Freund.","a":["einem"],"why":"bei + masculine dative: einem."},{"t":"gap","q":"Ich danke ___ Kollegen für die Hilfe.","a":["den","dem"],"why":"danken takes the dative."},{"t":"mc","q":"Which sentence needs the dative?","o":["Ich sehe den Mann.","Ich danke dem Mann.","Ich rufe den Mann an."],"a":1,"why":"danken is a dative verb."},{"t":"mc","q":"Ich gehe zu ___ Post.","o":["dem","der","den"],"a":1,"why":"die Post is feminine: zu der, contracted to zur."},{"t":"gap","q":"Sie spricht mit ___ Kindern.","a":["den"],"why":"Dative plural: den Kindern."}],"tables":[{"title":"Dativ","head":["","der-Wörter","ein-Wörter","Nomen"],"rows":[["maskulin","dem","einem","—"],["feminin","der","einer","—"],["neutral","dem","einem","—"],["Plural","den","—","+n: den Kindern"]]},{"title":"Dativ-Verben","rows":[["","helfen, danken, gehören, gefallen, passen, schmecken, antworten, glauben, folgen, gratulieren"]]},{"title":"Dativ-Präpositionen","rows":[["","aus, bei, mit, nach, seit, von, zu, gegenüber"]]}],"en":"Dative — the indirect object, usually the person receiving","seq":17},{"id":"poss","level":"A1","title":"Possessivartikel","rule":"mein, dein, sein, ihr, unser, euer, ihr/Ihr. They take the same endings as ein: meinen (m. acc), meiner (f. dat).","items":[{"t":"gap","q":"Das ist ___ Buch. (ich)","a":["mein"],"why":"Buch is neuter, nominative: mein."},{"t":"gap","q":"Wo ist ___ Tasche? (du)","a":["deine"],"why":"Tasche is feminine: deine."},{"t":"gap","q":"___ Auto ist ganz neu. (er)","a":["sein"],"why":"His = sein; Auto is neuter."},{"t":"gap","q":"___ Mutter kommt morgen. (sie)","a":["ihre"],"why":"Her = ihr, plus -e for feminine."},{"t":"gap","q":"Das sind ___ Kinder. (wir)","a":["unsere"],"why":"Plural takes -e: unsere Kinder."},{"t":"gap","q":"Ich kenne ___ Bruder gut. (du)","a":["deinen"],"why":"Masculine accusative: deinen."},{"t":"gap","q":"Ich helfe ___ Schwester. (ich)","a":["meiner"],"why":"helfen + feminine dative: meiner Schwester."},{"t":"gap","q":"Wie heisst ___ Hund? (ihr)","a":["euer"],"why":"Your (plural) = euer; Hund is masculine nominative."},{"t":"mc","q":"Frau Berger, ist das ___ Mantel?","o":["ihr","Ihr","euer"],"a":1,"why":"Polite form takes a capital I: Ihr."},{"t":"gap","q":"Ist das ___ Schlüssel? (du)","a":["dein"],"why":"Schlüssel is masculine nominative: dein."},{"t":"gap","q":"Wir haben ___ Auto verkauft. (wir)","a":["unser"],"why":"Auto is neuter: unser, no ending."},{"t":"gap","q":"Ich rufe ___ Mutter an. (ich)","a":["meine"],"why":"Mutter is feminine accusative: meine."},{"t":"gap","q":"Wo sind ___ Schuhe? (du)","a":["deine"],"why":"Plural takes -e."},{"t":"gap","q":"Er fährt mit ___ Fahrrad. (er)","a":["seinem"],"why":"mit + neuter dative: seinem."},{"t":"gap","q":"Sie wohnt bei ___ Eltern. (sie)","a":["ihren"],"why":"bei + dative plural: ihren."},{"t":"gap","q":"Frau Berger, wo ist ___ Mantel?","a":["ihr"],"why":"Polite Ihr with a capital I, masculine nominative."},{"t":"mc","q":"Kinder, habt ihr ___ Hausaufgaben gemacht?","o":["eure","euer","euren"],"a":0,"why":"Plural accusative: eure — euer loses its e."},{"t":"mc","q":"Ich helfe ___ Schwester.","o":["meine","meiner","meinen"],"a":1,"why":"helfen + feminine dative: meiner."},{"t":"gap","q":"Das ist ___ Problem, nicht meins. (du)","a":["dein"],"why":"Problem is neuter nominative: dein."}],"tables":[{"title":"Possessivartikel","head":["Person","Grundform","mask. Akk","feminin","Plural"],"rows":[["ich","mein","meinen","meine","meine"],["du","dein","deinen","deine","deine"],["er/es","sein","seinen","seine","seine"],["sie","ihr","ihren","ihre","ihre"],["wir","unser","unseren","unsere","unsere"],["ihr","euer","euren","eure","eure"],["sie","ihr","ihren","ihre","ihre"],["Sie","Ihr","Ihren","Ihre","Ihre"]]},{"title":"Merke","rows":[["Endungen","genau wie bei ein / kein"],["euer","ver
