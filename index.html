liert das e: eure, euren"]]}],"en":"Possessives — my, your, his, her, our, their","seq":18},{"id":"artdem","level":"A1","seq":19,"title":"Artikel: interrogativ und demonstrativ","en":"'Which one?' and 'this one' — welcher and dieser","rule":"welcher asks which one; dieser points to this one. Both take exactly the same endings as der/die/das, so if you know der, den, dem you already know these.","tables":[{"title":"welcher und dieser","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","welcher / dieser","welche / diese","welches / dieses","welche / diese"],["Akkusativ","welchen / diesen","welche / diese","welches / dieses","welche / diese"],["Dativ","welchem / diesem","welcher / dieser","welchem / diesem","welchen / diesen"]]},{"title":"Merke","rows":[["Endungen","genau wie der, die, das"],["jeder, mancher, solcher","folgen demselben Muster"]]}],"items":[{"t":"gap","q":"___ Bus fährt zum Bahnhof?","a":["welcher"],"why":"Bus is masculine nominative: Welcher."},{"t":"gap","q":"___ Wohnung gefällt dir besser?","a":["welche"],"why":"Wohnung is feminine: Welche."},{"t":"gap","q":"___ Buch liest du gerade?","a":["welches"],"why":"Buch is neuter: Welches."},{"t":"gap","q":"___ Mann meinst du? (Akkusativ)","a":["welchen"],"why":"Masculine accusative: Welchen."},{"t":"gap","q":"Mit ___ Bus fährst du?","a":["welchem"],"why":"mit + masculine dative: welchem."},{"t":"gap","q":"In ___ Stock wohnen Sie?","a":["welchem"],"why":"in + masculine dative: welchem."},{"t":"gap","q":"___ Kinder sind das?","a":["welche"],"why":"Plural: Welche."},{"t":"gap","q":"___ Stuhl ist sehr bequem. (dieser)","a":["dieser"],"why":"Masculine nominative: Dieser."},{"t":"gap","q":"Ich nehme ___ Tasche. (dieser)","a":["diese"],"why":"Feminine accusative: diese."},{"t":"gap","q":"___ Jahr fahren wir nach Indien. (dieser)","a":["dieses"],"why":"Jahr is neuter: Dieses."},{"t":"gap","q":"Ich kenne ___ Mann nicht. (dieser)","a":["diesen"],"why":"Masculine accusative: diesen."},{"t":"gap","q":"Mit ___ Zug fahren wir. (dieser)","a":["diesem"],"why":"mit + masculine dative: diesem."},{"t":"mc","q":"___ Farbe möchten Sie?","o":["Welcher","Welche","Welches"],"a":1,"why":"Farbe is feminine."},{"t":"mc","q":"The endings of welcher and dieser follow:","o":["ein / kein","der / die / das","mein / dein"],"a":1,"why":"They copy the definite article endings exactly."}]},{"id":"pronakkdat","level":"A2","title":"Pronomen: Akkusativ und Dativ","rule":"Accusative: mich, dich, ihn, sie, es, uns, euch, sie. Dative: mir, dir, ihm, ihr, ihm, uns, euch, ihnen. When both appear, accusative comes first: Ich gebe es dir.","items":[{"t":"gap","q":"Kennst du ___ ? (er)","a":["ihn"],"why":"Accusative of er is ihn."},{"t":"gap","q":"Ich helfe ___ gern. (du)","a":["dir"],"why":"helfen takes the dative: dir."},{"t":"gap","q":"Gib ___ bitte das Buch. (ich)","a":["mir"],"why":"Indirect object is dative: mir."},{"t":"gap","q":"Ich sehe ___ morgen. (ihr, plural)","a":["euch"],"why":"Accusative of ihr is euch."},{"t":"gap","q":"Das Buch gehört ___ . (sie, Singular)","a":["ihr"],"why":"gehören takes the dative: ihr."},{"t":"gap","q":"Ich rufe ___ später an. (Sie)","a":["sie"],"why":"Polite Sie in the accusative stays Sie."},{"t":"gap","q":"Ich gebe ___ dir morgen. (das Buch)","a":["es"],"why":"das Buch becomes es, and it comes before dir."},{"t":"gap","q":"Sag ___ bitte Bescheid. (wir)","a":["uns"],"why":"Dative of wir is uns."},{"t":"mc","q":"Which order is correct?","o":["Ich gebe dir es.","Ich gebe es dir."],"a":1,"why":"When both are pronouns, accusative comes before dative."},{"t":"gap","q":"Ich habe ___ gestern gesehen. (sie, Singular)","a":["sie"],"why":"Feminine accusative stays sie."},{"t":"gap","q":"Das Buch gehört ___ . (er)","a":["ihm"],"why":"gehören takes the dative: ihm."},{"t":"gap","q":"Kannst du ___ helfen? (wir)","a":["uns"],"why":"helfen + dative: uns."},{"t":"gap","q":"Ich schicke ___ die Datei. (du)","a":["dir"],"why":"Indirect object: dir."},{"t":"gap","q":"Ich habe ___ angerufen. (sie, Plural)","a":["sie"],"why":"Plural accusative: sie."},{"t":"gap","q":"Das Kleid steht ___ gut. (du)","a":["dir"],"why":"stehen + dative for suiting someone."},{"t":"gap","q":"Herr Meier, ich schicke ___ die Unterlagen.","a":["ihnen"],"why":"Polite dative: Ihnen with a capital I."},{"t":"gap","q":"Ich gebe ___ ihm morgen. (das Formular)","a":["es"],"why":"das Formular becomes es and goes before ihm."},{"t":"mc","q":"Which order is correct?","o":["Ich gebe ihm es.","Ich gebe es ihm."],"a":1,"why":"Two pronouns: accusative first."},{"t":"mc","q":"Ich gebe ___ das Buch.","o":["ihn","ihm","er"],"a":1,"why":"The person receiving is the dative: ihm."}],"tables":[{"title":"Pronomen","head":["","Nominativ","Akkusativ","Dativ"],"rows":[["","ich","mich","mir"],["","du","dich","dir"],["","er","ihn","ihm"],["","sie","sie","ihr"],["","es","es","ihm"],["","wir","uns","uns"],["","ihr","euch","euch"],["","sie","sie","ihnen"],["","Sie","Sie","Ihnen"]]},{"title":"Reihenfolge im Satz","rows":[["zwei Nomen","Dativ vor Akkusativ: Ich gebe dem Kind das Buch."],["Pronomen + Nomen","Pronomen zuerst: Ich gebe es dem Kind."],["zwei Pronomen","Akkusativ vor Dativ: Ich gebe es ihm."]]}],"en":"Object pronouns — him, her, them, to me, to you","seq":20},{"id":"verbdatakk","level":"A2","seq":21,"title":"Verben mit Dativ und Akkusativ","en":"Verbs with two objects — give someone something","rule":"geben, schenken, zeigen, schicken, bringen, erklären, empfehlen and leihen take a person in the dative and a thing in the accusative. Order: two nouns → dative first. A pronoun always comes before a noun. Two pronouns → accusative first.","tables":[{"title":"Verben mit zwei Objekten","rows":[["Person im Dativ, Sache im Akkusativ","geben, schenken, zeigen, schicken, bringen, erklären, empfehlen, leihen, kaufen, sagen"]]},{"title":"Nur Dativ","rows":[["kein Akkusativobjekt","helfen, danken, gefallen, gehören, antworten, passen, schmecken"]]},{"title":"Reihenfolge","head":["Fall","Beispiel"],"rows":[["zwei Nomen","Ich gebe dem Kind das Buch."],["Pronomen + Nomen","Ich gebe es dem Kind."],["Nomen + Pronomen","Ich gebe ihm das Buch."],["zwei Pronomen","Ich gebe es ihm."]]}],"items":[{"t":"gap","q":"Ich gebe ___ Kind das Buch.","a":["dem"],"why":"The person is dative: dem Kind."},{"t":"gap","q":"Ich schenke ___ Mutter Blumen. (ich)","a":["meiner"],"why":"Feminine dative: meiner Mutter."},{"t":"gap","q":"Er zeigt ___ Gästen die Wohnung.","a":["den"],"why":"Dative plural: den Gästen."},{"t":"gap","q":"Ich schicke ___ die Datei. (du)","a":["dir"],"why":"The recipient is dative: dir."},{"t":"gap","q":"Sie erklärt ___ Schülern die Regel.","a":["den"],"why":"Dative plural: den Schülern."},{"t":"gap","q":"Ich empfehle ___ dieses Restaurant. (Sie)","a":["ihnen"],"why":"Polite dative: Ihnen."},{"t":"gap","q":"Kannst du ___ bitte das Salz geben? (ich)","a":["mir"],"why":"Recipient in the dative: mir."},{"t":"gap","q":"Er leiht ___ sein Auto. (wir)","a":["uns"],"why":"Dative of wir: uns."},{"t":"gap","q":"Ich bringe ___ Kollegen einen Kaffee.","a":["dem"],"why":"Masculine dative: dem Kollegen."},{"t":"gap","q":"Sie hat ___ die Wahrheit gesagt. (er)","a":["ihm"],"why":"Dative of er: ihm."},{"t":"mc","q":"Two nouns — which order?","o":["Ich gebe das Buch dem Kind.","Ich gebe dem Kind das Buch."],"a":1,"why":"With two nouns the dative comes first."},{"t":"mc","q":"Which is correct?","o":["Ich gebe dem Kind es.","Ich gebe es dem Kind."],"a":1,"why":"A pronoun always goes before a noun."},{"t":"mc","q":"Which is correct?","o":["Ich gebe es ihm.","Ich gebe ihm es."],"a":0,"why":"Two pronouns: accusative before dative."},{"t":"mc","q":"Which verb takes ONLY a dative object?","o":["geben","helfen","zeigen"],"a":1,"why":"helfen never takes an accusative object."}]},{"id":"praet1","level":"A1","title":"war und hatte","rule":"For sein and haben, German prefers the simple past even in speech: war, warst, war, waren, wart, waren / hatte, hattest, hatte, hatten, hattet, hatten.","items":[{"t":"gap","q":"Ich ___ gestern leider krank.","a":["war"],"why":"ich war."},{"t":"gap","q":"Wir ___ letzte Woche keine Zeit.","a":["hatten"],"why":"wir hatten."},{"t":"gap","q":"Er ___ den ganzen Tag zu Hause.","a":["war"],"why":"er war."},{"t":"gap","q":"___ du gestern auch da?","a":["warst"],"why":"du warst."},{"t":"gap","q":"Sie ___ grossen Hunger.","a":["hatte"],"why":"sie hatte (singular)."},{"t":"gap","q":"Ihr ___ leider zu spät.","a":["wart"],"why":"ihr wart."},{"t":"gap","q":"Es ___ im Januar sehr kalt.","a":["war"],"why":"es war."},{"t":"gap","q":"Ich ___ als Kind einen Hund.","a":["hatte"],"why":"ich hatte."},{"t":"mc","q":"In spoken German, which is more natural?","o":["Ich bin gestern krank gewesen.","Ich war gestern krank."],"a":1,"why":"With sein and haben the simple past is the normal spoken choice."},{"t":"gap","q":"Als Kind ___ ich oft krank.","a":["war"],"why":"ich war."},{"t":"gap","q":"Wir ___ letztes Jahr in Indien.","a":["waren"],"why":"wir waren."},{"t":"gap","q":"___ ihr gestern im Kino?","a":["wart"],"why":"ihr wart."},{"t":"gap","q":"Sie ___ damals kein Auto.","a":["hatten","hatte"],"why":"hatte for singular, hatten for plural."},{"t":"gap","q":"Ich ___ gestern viel zu tun.","a":["hatte"],"why":"ich hatte."},{"t":"gap","q":"Der Film ___ sehr gut.","a":["war"],"why":"er war."},{"t":"gap","q":"Du ___ recht.","a":["hattest"],"why":"du hattest."},{"t":"mc","q":"Which modal verb is also common in the Präteritum?","o":["konnte","gekonnt","können"],"a":0,"why":"Modals prefer the simple past: konnte, musste, wollte."},{"t":"mc","q":"Ich ___ gestern keine Zeit.","o":["hatte","habte","hattete"],"a":0,"why":"haben is irregular: hatte."},{"t":"gap","q":"Es ___ ein langer Tag.","a":["war"],"why":"es war."}],"tables":[{"title":"Präteritum von sein und haben","head":["","sein","haben"],"rows":[["ich","war","hatte"],["du","warst","hattest"],["er/sie/es","war","hatte"],["wir","waren","hatten"],["ihr","wart","hattet"],["sie/Sie","waren","hatten"]]},{"title":"Auch im Präteritum üblich","rows":[["Modalverben","konnte, musste, wollte, durfte, sollte, mochte"],["Gebrauch","im Gespräch natürlicher als das Perfekt"]]}],"en":"Simple past of 'to be' and 'to have' — war and hatte","seq":23},{"id":"perfhaben","level":"A1","title":"Perfekt mit haben","rule":"haben + participle at the end. Regular: ge- + stem + -t (gelernt). Irregular: ge- + stem + -en (gelesen). Separable verbs put ge- in the middle: zugemacht.","items":[{"t":"gap","q":"Ich habe das Buch schon ___ . (lesen)","a":["gelesen"],"why":"Irregular participle: gelesen."},{"t":"gap","q":"Wir haben gestern Pizza ___ . (essen)","a":["gegessen"],"why":"Irregular: gegessen."},{"t":"gap","q":"Sie hat den ganzen Tag ___ . (arbeiten)","a":["gearbeitet"],"why":"Regular, stem in -t so -et: gearbeitet."},{"t":"gap","q":"Hast du ihn gestern ___ ? (sehen)","a":["gesehen"],"why":"Irregular: gesehen."},{"t":"gap","q":"Ich habe die Tür ___ . (zumachen)","a":["zugemacht"],"why":"Separable: prefix + ge + macht."},{"t":"gap","q":"Er hat mich gestern Abend ___ . (anrufen)","a":["angerufen"],"why":"Separable and irregular: angerufen."},{"t":"gap","q":"Wir haben zwei Jahre Deutsch ___ . (lernen)","a":["gelernt"],"why":"Regular: gelernt."},{"t":"gap","q":"Ich habe den Termin leider ___ . (vergessen)","a":["vergessen"],"why":"Verbs starting with ver- take no ge-."},{"t":"mc","q":"Which participle has NO ge-?","o":["gekauft","besucht","gemacht"],"a":1,"why":"Verbs with be-, ver-, er-, ent- form the participle without ge-."},{"t":"gap","q":"Wir haben lange ___ . (warten)","a":["gewartet"],"why":"Regular, stem in -t: gewartet."},{"t":"gap","q":"Ich habe ihn gestern ___ . (treffen)","a":["getroffen"],"why":"Irregular: getroffen."},{"t":"gap","q":"Sie hat mir alles ___ . (erklären)","a":["erklärt","erklaert"],"why":"er- takes no ge-."},{"t":"gap","q":"Wir haben zwei Stunden ___ . (telefonieren)","a":["telefoniert"],"why":"Verbs in -ieren take no ge-."},{"t":"gap","q":"Er hat den Bericht ___ . (schreiben)","a":["geschrieben"],"why":"Irregular: geschrieben."},{"t":"gap","q":"Hast du das Formular ___ ? (ausfüllen)","a":["ausgefüllt","ausgefuellt"],"why":"Separable: aus + ge + füllt."},{"t":"gap","q":"Ich habe den Schlüssel ___ . (finden)","a":["gefunden"],"why":"Irregular: gefunden."},{"t":"gap","q":"Wir haben die Wohnung ___ . (besichtigen)","a":["besichtigt"],"why":"be- takes no ge-."},{"t":"mc","q":"Which participle is correct?","o":["gestudiert","studiert","gestudieren"],"a":1,"why":"-ieren verbs never take ge-."},{"t":"gap","q":"Sie hat viel ___ . (arbeiten)","a":["gearbeitet"],"why":"Stem in -t: gearbeitet."}],"tables":[{"title":"Partizip II bilden","head":["Typ","Infinitiv","Partizip II"],"rows":[["regelmässig","machen","gemacht"],["Stamm auf -t","arbeiten","gearbeitet"],["unregelmässig","lesen","gelesen"],["unregelmässig","essen","gegessen"],["unregelmässig","sehen","gesehen"],["trennbar","einkaufen","eingekauft"],["trennbar","anrufen","angerufen"],["untrennbar","besuchen","besucht"],["untrennbar","vergessen","vergessen"],["auf -ieren","studieren","studiert"]]},{"title":"Kein ge-","rows":[["Vorsilben","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"],["Endung","-ieren: telefoniert, reserviert, funktioniert"]]}],"en":"Present perfect with 'haben' — the everyday spoken past","seq":24},{"id":"perfsein","level":"A1","title":"Perfekt mit sein","rule":"Use sein with verbs of movement (gehen, fahren, kommen) and change of state (aufstehen, einschlafen, werden), plus sein, bleiben and passieren.","items":[{"t":"gap","q":"Ich ___ gestern nach Bern gefahren.","a":["bin"],"why":"fahren is movement, so sein."},{"t":"gap","q":"Wir ___ den ganzen Tag zu Hause geblieben.","a":["sind"],"why":"bleiben always takes sein."},{"t":"gap","q":"Er ist heute um sechs ___ . (aufstehen)","a":["aufgestanden"],"why":"Change of state, separable: aufgestanden."},{"t":"gap","q":"Sie ist schon nach Hause ___ . (gehen)","a":["gegangen"],"why":"Movement: ist gegangen."},{"t":"gap","q":"Ich bin gestern sehr früh ___ . (einschlafen)","a":["eingeschlafen"],"why":"Change of state: eingeschlafen."},{"t":"gap","q":"Wann ___ ihr angekommen?","a":["seid"],"why":"ankommen is movement: ihr seid."},{"t":"gap","q":"Was ___ hier passiert?","a":["ist"],"why":"passieren always takes sein."},{"t":"gap","q":"Ich ___ noch nie in Berlin gewesen.","a":["bin"],"why":"sein itself takes sein: ich bin gewesen."},{"t":"mc","q":"Ich ___ zehn Kilometer gelaufen.","o":["habe","bin","werde"],"a":1,"why":"laufen is movement from A to B, so sein."},{"t":"gap","q":"Wir ___ mit dem Zug gefahren.","a":["sind"],"why":"fahren is movement: sein."},{"t":"gap","q":"Ich ___ gestern spät nach Hause gekommen.","a":["bin"],"why":"kommen is movement."},{"t":"gap","q":"Er ist um sechs ___ . (losfahren)","a":["losgefahren"],"why":"Separable and movement: ist losgefahren."},{"t":"gap","q":"Das Kind ist schnell ___ . (wachsen)","a":["gewachsen"],"why":"Change of state: ist gewachsen."},{"t":"gap","q":"Wir ___ nach Bern geflogen.","a":["sind"],"why":"fliegen is movement."},{"t":"gap","q":"Sie ___ Ärztin geworden.","a":["ist"],"why":"werden always takes sein."},{"t":"gap","q":"Ich ___ eine Stunde im Stau gestanden.","a":["habe"],"why":"stehen has no movement from A to B, so haben."},{"t":"mc","q":"Wir ___ zu Hause geblieben.","o":["haben","sind","werden"],"a":1,"why":"bleiben always takes sein."},{"t":"mc","q":"Which verb takes haben in the perfect?","o":["gehen","schlafen","aufstehen"],"a":1,"why":"schlafen is no movement and no change of state."},{"t":"gap","q":"Was ___ dann passiert?","a":["ist"],"why":"passieren takes sein."}],"tables":[{"title":"Perfekt mit sein","head":["Gruppe","Verb","Perfekt"],"rows":[["Bewegung","gehen","ist gegangen"],["Bewegung","fahren","ist gefahren"],["Bewegung","kommen","ist gekommen"],["Bewegung","laufen","ist gelaufen"],["Bewegung","fliegen","ist geflogen"],["Zustandswechsel","aufstehen","ist aufgestanden"],["Zustandswechsel","einschlafen","ist eingeschlafen"],["Zustandswechsel","werden","ist geworden"],["Sonderfall","sein","ist gewesen"],["Sonderfall","bleiben","ist geblieben"],["Sonderfall","passieren","ist passiert"]]}],"en":"Present perfect with 'sein' — for movement and change","seq":25},{"id":"partperf","level":"A2","seq":26,"title":"Partizip Perfekt","en":"Building past participles — gemacht, gegangen, besucht","rule":"Regular: ge- + stem + -t. Irregular: ge- + stem + -en, usually with a vowel change. No ge- at all after be-, ge-, er-, ver-, zer-, ent-, emp-, miss- or with verbs ending in -ieren. Separable verbs put ge- between the prefix and the stem.","tables":[{"title":"Die vier Muster","head":["Muster","Infinitiv","Partizip II"],"rows":[["ge- + -t","machen","gemacht"],["ge- + -et","arbeiten","gearbeitet"],["ge- + -en","gehen","gegangen"],["ge- + -en, Vokalwechsel","trinken","getrunken"],["trennbar","einkaufen","eingekauft"],["trennbar unregelmässig","anrufen","angerufen"],["kein ge- (be-, ver-, er-)","besuchen","besucht"],["kein ge- (-ieren)","telefonieren","telefoniert"]]},{"title":"Merke","rows":[["Vorsilben ohne ge-","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"],["Endung ohne ge-","-ieren"]]}],"items":[{"t":"gap","q":"machen → ge___","a":["macht"],"why":"Regular: gemacht."},{"t":"gap","q":"spielen → ___","a":["gespielt"],"why":"Regular: gespielt."},{"t":"gap","q":"arbeiten → ___","a":["gearbeitet"],"why":"Stem in -t takes -et: gearbeitet."},{"t":"gap","q":"gehen → ___","a":["gegangen"],"why":"Irregular: gegangen."},{"t":"gap","q":"trinken → ___","a":["getrunken"],"why":"Vowel change: getrunken."},{"t":"gap","q":"sprechen → ___","a":["gesprochen"],"why":"Vowel change: gesprochen."},{"t":"gap","q":"besuchen → ___","a":["besucht"],"why":"be- means no ge-."},{"t":"gap","q":"verstehen → ___","a":["verstanden"],"why":"ver- means no ge-, and the stem changes."},{"t":"gap","q":"bezahlen → ___","a":["bezahlt"],"why":"be- means no ge-."},{"t":"gap","q":"telefonieren → ___","a":["telefoniert"],"why":"-ieren verbs take no ge-."},{"t":"gap","q":"einkaufen → ___","a":["eingekauft"],"why":"Separable: ein + ge + kauft."},{"t":"gap","q":"aufstehen → ___","a":["aufgestanden"],"why":"Separable and irregular: aufgestanden."},{"t":"gap","q":"mitbringen → ___","a":["mitgebracht"],"why":"Separable and irregular: mitgebracht."},{"t":"mc","q":"Which participle correctly has NO ge-?","o":["gestudiert","studiert","gestudieren"],"a":1,"why":"-ieren verbs never take ge-."}]},{"id":"praetmodal","level":"A2","seq":27,"title":"Präteritum: Modalverben","en":"Simple past of the modals — konnte, musste, wollte","rule":"Modals drop the umlaut and add -te: können→konnte, müssen→musste, dürfen→durfte, mögen→mochte. sollen→sollte and wollen→wollte have no umlaut to lose. In speech this is used far more than the perfect.","tables":[{"title":"Alle sechs","head":["Infinitiv","Präteritum (ich/er)"],"rows":[["können","konnte"],["müssen","musste"],["dürfen","durfte"],["sollen","sollte"],["wollen","wollte"],["mögen","mochte"]]},{"title":"Endungen","head":["","können"],"rows":[["ich","konnte"],["du","konntest"],["er/sie/es","konnte"],["wir","konnten"],["ihr","konntet"],["sie/Sie","konnten"]]}],"items":[{"t":"gap","q":"Ich ___ gestern nicht kommen. (können)","a":["konnte"],"why":"können → konnte, no umlaut."},{"t":"gap","q":"Wir ___ lange warten. (müssen)","a":["mussten"],"why":"wir mussten."},{"t":"gap","q":"Als Kind ___ ich keinen Kaffee. (mögen)","a":["mochte"],"why":"mögen → mochte."},{"t":"gap","q":"Er ___ nicht mitkommen. (wollen)","a":["wollte"],"why":"wollen → wollte."},{"t":"gap","q":"___ du gestern früher gehen? (dürfen)","a":["durftest"],"why":"du durftest."},{"t":"gap","q":"Ich ___ eigentlich anrufen. (sollen)","a":["sollte"],"why":"sollen → sollte."},{"t":"gap","q":"Wir ___ das Formular ausfüllen. (müssen)","a":["mussten"],"why":"wir mussten."},{"t":"gap","q":"Ihr ___ hier nicht parken. (dürfen)","a":["durftet"],"why":"ihr durftet."},{"t":"gap","q":"Sie ___ sehr gut Deutsch. (können)","a":["konnte","konnten"],"why":"konnte for one person, konnten for several."},{"t":"gap","q":"Ich ___ das nicht wissen. (können)","a":["konnte"],"why":"ich konnte."},{"t":"mc","q":"What happens to the umlaut in the Präteritum?","o":["it stays","it disappears","it moves"],"a":1,"why":"müssen → musste, können → konnte."},{"t":"mc","q":"Which sounds more natural in conversation?","o":["Ich habe nicht kommen können.","Ich konnte nicht kommen."],"a":1,"why":"Modals prefer the simple past even in speech."},{"t":"gap","q":"Damals ___ wir noch kein Auto. (dürfen)","a":["durften"],"why":"wir durften."},{"t":"mc","q":"Präteritum of mögen:","o":["mögte","mochte","magte"],"a":1,"why":"mögen → mochte."}]},{"id":"zeiten","level":"A2","seq":28,"title":"Zeitengebrauch","en":"Which past tense to use, and when","rule":"Speaking: use the Perfekt for most verbs, but the Präteritum for sein, haben and the modals. Writing, news and stories: Präteritum throughout. For an event that happened before another past event: Plusquamperfekt.","tables":[{"title":"Im Gespräch","head":["Verb","natürliche Form"],"rows":[["die meisten Verben","Perfekt: Ich habe gearbeitet."],["sein","Präteritum: Ich war müde."],["haben","Präteritum: Ich hatte Zeit."],["Modalverben","Präteritum: Ich musste gehen."]]},{"title":"Im Text","head":["Textsorte","Zeit"],"rows":[["Erzählung, Roman","Präteritum"],["Zeitung, Bericht","Präteritum"],["Mail an Freunde","Perfekt"],["frühere Vergangenheit","Plusquamperfekt"]]}],"items":[{"t":"mc","q":"Talking to a friend about yesterday, which is most natural?","o":["Ich arbeitete gestern lange.","Ich habe gestern lange gearbeitet."],"a":1,"why":"In speech, most verbs take the Perfekt."},{"t":"mc","q":"And with sein?","o":["Ich bin gestern müde gewesen.","Ich war gestern müde."],"a":1,"why":"sein prefers the Präteritum even in speech."},{"t":"mc","q":"And with a modal?","o":["Ich habe früher gehen müssen.","Ich musste früher gehen."],"a":1,"why":"Modals prefer the Präteritum."},{"t":"mc","q":"A newspaper report uses mainly:","o":["Perfekt","Präteritum","Futur"],"a":1,"why":"Written narrative uses the Präteritum."},{"t":"mc","q":"Which tense marks the EARLIER of two past events?","o":["Perfekt","Präteritum","Plusquamperfekt"],"a":2,"why":"That is exactly what the Plusquamperfekt is for."},{"t":"gap","q":"Ich ___ gestern krank. (sein, Gespräch)","a":["war"],"why":"sein takes the Präteritum."},{"t":"gap","q":"Wir ___ gestern Pizza gegessen. (Gespräch)","a":["haben"],"why":"Normal verb in speech: Perfekt with haben."},{"t":"gap","q":"Ich ___ leider keine Zeit. (haben, Gespräch)","a":["hatte"],"why":"haben takes the Präteritum."},{"t":"gap","q":"Nachdem wir gegessen ___ , gingen wir los.","a":["hatten"],"why":"Earlier event: Plusquamperfekt."},{"t":"gap","q":"Ich ___ gestern nicht kommen. (können, Gespräch)","a":["konnte"],"why":"Modal in the Präteritum."},{"t":"gap","q":"Er ___ mich gestern angerufen. (Gespräch)","a":["hat"],"why":"Normal verb: Perfekt."},{"t":"mc","q":"Morgen fahre ich nach Bern. Which tense is this?","o":["Präsens used for the future","Futur I","Perfekt"],"a":0,"why":"German commonly uses the present with a time word for the future."},{"t":"mc","q":"Which pair is correct for a story in the past?","o":["Er ging hinaus und schloss die Tür.","Er ist hinausgegangen und hat die Tür geschlossen."],"a":0,"why":"Both are grammatical, but written narrative uses the Präteritum."},{"t":"gap","q":"Als ich klein ___ , wohnten wir in Chennai. (sein)","a":["war"],"why":"sein in the Präteritum."}]},{"id":"refl","level":"A2","title":"Reflexive Verben","rule":"mich, dich, sich, uns, euch, sich. sich freuen, sich interessieren, sich beeilen, sich fühlen. In the dative (with a body part or object) du becomes dir: Ich wasche mir die Hände.","items":[{"t":"gap","q":"Ich freue ___ auf das Wochenende.","a":["mich"],"why":"ich → mich."},{"t":"gap","q":"Beeil ___ bitte!","a":["dich"],"why":"du → dich."},{"t":"gap","q":"Er interessiert ___ für Technik.","a":["sich"],"why":"er → sich."},{"t":"gap","q":"Wir treffen ___ um sieben.","a":["uns"],"why":"wir → uns."},{"t":"gap","q":"Wie fühlst du ___ heute?","a":["dich"],"why":"sich fühlen with du → dich."},{"t":"gap","q":"Setzt ___ bitte hin!","a":["euch"],"why":"ihr → euch."},{"t":"gap","q":"Ich wasche ___ die Hände.","a":["mir"],"why":"With a direct object (die Hände) the pronoun is dative: mir."},{"t":"gap","q":"Sie zieht ___ schnell um.","a":["sich"],"why":"sie → sich."},{"t":"mc","q":"Ich putze ___ die Zähne.","o":["mich","mir","meine"],"a":1,"why":"die Zähne is the object, so the reflexive is dative: mir."},{"t":"gap","q":"Wir freuen ___ über die Nachricht.","a":["uns"],"why":"wir → uns."},{"t":"gap","q":"Ich erinnere ___ gut an den Tag.","a":["mich"],"why":"sich erinnern takes the accusative."},{"t":"gap","q":"Zieh ___ warm an!","a":["dich"],"why":"sich anziehen with du → dich."},{"t":"gap","q":"Er ärgert ___ über den Fehler.","a":["sich"],"why":"er → sich."},{"t":"gap","q":"Ich sehe ___ das Zimmer an.","a":["mir"],"why":"With a direct object the pronoun is dative: mir."},{"t":"gap","q":"Habt ihr ___ schon vorgestellt?","a":["euch"],"why":"ihr → euch."},{"t":"gap","q":"Sie kümmert ___ um die Kinder.","a":["sich"],"why":"sich kümmern um + accusative."},{"t":"gap","q":"Ich kann ___ das gut vorstellen.","a":["mir"],"why":"sich etwas vorstellen takes the dative."},{"t":"mc","q":"Ich wasche ___ die Haare.","o":["mich","mir","meine"],"a":1,"why":"die Haare is the object, so the reflexive is dative."},{"t":"mc","q":"Where does the reflexive pronoun usually stand?","o":["at the end","right after the verb","before the subject"],"a":1,"why":"Ich freue mich auf ... — it follows the conjugated verb."}],"tables":[{"title":"Reflexivpronomen","head":["","Akkusativ","Dativ"],"rows":[["ich","mich","mir"],["du","dich","dir"],["er/sie/es","sich","sich"],["wir","uns","uns"],["ihr","euch","euch"],["sie/Sie","sich","sich"]]},{"title":"Häufige reflexive Verben","rows":[["Akkusativ","sich freuen, sich beeilen, sich fühlen, sich interessieren, sich setzen, sich umziehen, sich erinnern, sich ärgern"],["Dativ","sich die Hände waschen, sich die Zähne putzen, sich etwas vorstellen, sich etwas ansehen"]]}],"en":"Reflexive verbs — myself, yourself, each other","seq":29},{"id":"temp","level":"A1","title":"Temporale Präpositionen","rule":"am + day or date, im + month or season, um + clock time, seit + starting point, in + future span. All take the dative.","items":[{"t":"gap","q":"___ Montag habe ich frei.","a":["am"],"why":"am + day of the week."},{"t":"gap","q":"___ Januar ist es hier sehr kalt.","a":["im"],"why":"im + month."},{"t":"gap","q":"___ acht Uhr beginnt der Kurs.","a":["um"],"why":"um + clock time."},{"t":"gap","q":"___ Wochenende fahren wir weg.","a":["am"],"why":"am Wochenende is fixed."},{"t":"gap","q":"___ Sommer sind wir meistens hier.","a":["im"],"why":"im + season."},{"t":"gap","q":"Ich arbeite ___ 2018 in der Schweiz.","a":["seit"],"why":"seit + a point when something began, still true now."},{"t":"gap","q":"___ zwei Wochen fahren wir nach Indien.","a":["in"],"why":"in + a future span."},{"t":"gap","q":"___ Abend lese ich gern.","a":["am"],"why":"am Abend, am Morgen, am Nachmittag — but in der Nacht."},{"t":"mc","q":"___ der Nacht schlafe ich schlecht.","o":["Am","In","Um"],"a":1,"why":"Night is the exception: in der Nacht."},{"t":"gap","q":"Ich arbeite ___ Montag bis Freitag.","a":["von"],"why":"von ... bis for a span."},{"t":"gap","q":"Der Kurs beginnt ___ Montag.","a":["am"],"why":"am + day."},{"t":"gap","q":"___ drei Jahren sind wir hergezogen.","a":["vor"],"why":"vor for a point in the past."},{"t":"gap","q":"Der Laden ist ___ Montag geschlossen.","a":["ab"],"why":"ab for a start point in the future."},{"t":"gap","q":"___ Herbst wird es früh dunkel.","a":["im"],"why":"im + season."},{"t":"gap","q":"Wir treffen uns ___ halb acht.","a":["um"],"why":"um + clock time."},{"t":"gap","q":"___ der Pause telefoniere ich.","a":["während","in"],"why":"während for something happening at the same time."},{"t":"gap","q":"___ 3. Mai habe ich Geburtstag.","a":["am"],"why":"am + date."},{"t":"mc","q":"___ 2018 wohne ich hier.","o":["In","Seit","Am"],"a":1,"why":"seit for something that started then and is still true."},{"t":"mc","q":"Which needs NO preposition?","o":["___ Montag","___ 2018","___ Januar"],"a":1,"why":"Years stand alone: 2018 bin ich gekommen."}],"tables":[{"title":"Zeitangaben","head":["Präposition","Gebrauch","Beispiel"],"rows":[["am","Tag, Datum, Tageszeit","am Montag, am Abend"],["im","Monat, Jahreszeit","im Januar, im Sommer"],["um","Uhrzeit","um acht Uhr"],["in","Zukunft, Nacht","in zwei Wochen, in der Nacht"],["seit","Beginn bis jetzt","seit 2018"],["von … bis","Zeitraum","von Mai bis Juli"],["ab","Beginn in der Zukunft","ab Montag"],["vor","früher","vor drei Jahren"],["nach","später","nach der Arbeit"],["während","gleichzeitig","während der Pause"],["ohne Präposition","Jahreszahl","2018 bin ich gekommen"]]}],"en":"Time prepositions — at, in, on, since, until","seq":30},{"id":"prepdat","level":"A1","title":"Präpositionen mit Dativ","rule":"aus, bei, mit, nach, seit, von, zu always take the dative. Short forms: zu dem = zum, zu der = zur, bei dem = beim, von dem = vom.","items":[{"t":"gap","q":"Ich komme ___ Indien.","a":["aus"],"why":"aus = out of, from a country or place of origin."},{"t":"gap","q":"Sie wohnt noch ___ ihren Eltern.","a":["bei"],"why":"bei = at someone's place."},{"t":"gap","q":"Wir fahren ___ dem Zug nach Bern.","a":["mit"],"why":"mit for means of transport."},{"t":"gap","q":"___ der Arbeit gehe ich einkaufen.","a":["nach"],"why":"nach = after."},{"t":"gap","q":"Ich bin ___ Montag krank.","a":["seit"],"why":"seit = since."},{"t":"gap","q":"Das Geschenk ist ___ meiner Schwester.","a":["von"],"why":"von = from a person."},{"t":"gap","q":"Ich gehe morgen ___ Arzt.","a":["zum"],"why":"zu dem contracts to zum."},{"t":"gap","q":"Ich muss noch ___ Post.","a":["zur"],"why":"zu der contracts to zur: die Post."},{"t":"mc","q":"Ich fahre ___ Hause.","o":["zu","nach","bei"],"a":1,"why":"nach Hause for going home; zu Hause for being at home."},{"t":"gap","q":"Ich fahre ___ dem Fahrrad zur Arbeit.","a":["mit"],"why":"mit for means of transport."},{"t":"gap","q":"Das Buch ist ___ meiner Kollegin.","a":["von"],"why":"von for the giver or source."},{"t":"gap","q":"Wir wohnen ___ dem Bahnhof gegenüber.","a":["dem"],"why":"gegenüber takes the dative and often follows the noun."},{"t":"gap","q":"Ich gehe ___ Bäcker.","a":["zum"],"why":"zu dem → zum."},{"t":"gap","q":"Sie kommt gerade ___ der Arbeit.","a":["von"],"why":"von for coming from a place or activity."},{"t":"gap","q":"___ dem Essen räumen wir auf.","a":["nach"],"why":"nach = after."},{"t":"gap","q":"Ich wohne ___ meinem Bruder.","a":["bei"],"why":"bei = at someone's place."},{"t":"mc","q":"Ich bin ___ Hause.","o":["nach","zu","bei"],"a":1,"why":"zu Hause = at home; nach Hause = going home."},{"t":"mc","q":"Which is NOT a dative preposition?","o":["seit","aus","durch"],"a":2,"why":"durch takes the accusative."},{"t":"gap","q":"Der Zug fährt ___ Zürich nach Bern.","a":["von"],"why":"von ... nach for a route."}],"tables":[{"title":"Immer Dativ","head":["Präposition","Bedeutung","Beispiel"],"rows":[["aus","Herkunft, heraus","aus Indien"],["bei","bei jemandem, in der Nähe","bei meinen Eltern"],["mit","Begleitung, Mittel","mit dem Zug"],["nach","danach, Richtung Ort","nach der Arbeit"],["seit","seit wann","seit Montag"],["von","von wem, von wo","von meiner Schwester"],["zu","Richtung Person/Ort","zum Arzt"],["gegenüber","auf der anderen Seite","gegenüber der Post"]]},{"title":"Kurzformen","rows":[["zu dem → zum","zu der → zur"],["bei dem → beim","von dem → vom"]]}],"en":"Prepositions that always take the dative","seq":31},{"id":"prepakk","level":"A2","title":"Präpositionen mit Akkusativ","rule":"für, um, durch, ohne, gegen, bis always take the accusative. Only masculine shows it: für den Mann, ohne einen Schirm.","items":[{"t":"gap","q":"Das Geschenk ist ___ meinen Bruder.","a":["für"],"why":"für + accusative."},{"t":"gap","q":"Wir gehen ___ den Park.","a":["durch"],"why":"durch = through, accusative."},{"t":"gap","q":"Ich trinke Kaffee ___ Zucker.","a":["ohne"],"why":"ohne + accusative, and no article here."},{"t":"gap","q":"Wir spielen ___ die andere Mannschaft.","a":["gegen"],"why":"gegen = against, accusative."},{"t":"gap","q":"Der Bus fährt ___ den See.","a":["um"],"why":"um = around, accusative."},{"t":"gap","q":"Ich habe das für ___ Vater gekauft.","a":["meinen"],"why":"Masculine accusative: meinen Vater."},{"t":"gap","q":"Ohne ___ Ausweis geht es nicht.","a":["einen"],"why":"Ausweis is masculine, accusative: einen."},{"t":"gap","q":"Wir bleiben ___ nächsten Freitag.","a":["bis"],"why":"bis = until, accusative."},{"t":"mc","q":"Which one takes the DATIVE?","o":["für","gegen","mit"],"a":2,"why":"mit is dative; für and gegen are accusative."},{"t":"gap","q":"Ich habe ein Geschenk ___ dich.","a":["für"],"why":"für + accusative."},{"t":"gap","q":"Wir fahren ___ die Stadt.","a":["durch"],"why":"durch = through."},{"t":"gap","q":"___ dich schaffe ich das nicht.","a":["ohne"],"why":"ohne + accusative."},{"t":"gap","q":"Der Kurs geht ___ Ende Juni.","a":["bis"],"why":"bis for an end point."},{"t":"gap","q":"Wir sitzen ___ den Tisch.","a":["um"],"why":"um = around."},{"t":"gap","q":"Ich bin ___ diesen Vorschlag.","a":["gegen"],"why":"gegen = against."},{"t":"gap","q":"Das ist ein Geschenk für ___ Kollegin.","a":["meine"],"why":"Feminine accusative: meine."},{"t":"gap","q":"Ich komme ___ acht Uhr.","a":["gegen"],"why":"gegen also means approximately with times."},{"t":"mc","q":"Ohne ___ Auto geht es nicht.","o":["ein","einem","einen"],"a":0,"why":"Auto is neuter, so ein is unchanged in the accusative."},{"t":"mc","q":"Which pair is BOTH accusative?","o":["für, mit","durch, gegen","nach, ohne"],"a":1,"why":"durch and gegen are accusative; mit and nach are dative."}],"tables":[{"title":"Immer Akkusativ","head":["Präposition","Bedeutung","Beispiel"],"rows":[["für","für wen","für meinen Bruder"],["um","herum, Uhrzeit","um den See"],["durch","hindurch","durch den Park"],["ohne","ohne was","ohne Zucker"],["gegen","dagegen, ungefähr","gegen die Mannschaft"],["bis","bis wann","bis nächsten Freitag"],["entlang","daran entlang","die Strasse entlang"]]},{"title":"Kurzformen","rows":[["für das → fürs","durch das → durchs, um das → ums"]]}],"en":"Prepositions that always take the accusative","seq":32},{"id":"wechsel","level":"A2","title":"Wechselpräpositionen","rule":"in, an, auf, über, unter, vor, hinter, neben, zwischen. Movement to a place → accusative (Wohin?). Position at a place → dative (Wo?).","items":[{"t":"gap","q":"Das Buch liegt auf ___ Tisch. (Wo?)","a":["dem"],"why":"Position, so dative: dem Tisch."},{"t":"gap","q":"Ich lege das Buch auf ___ Tisch. (Wohin?)","a":["den"],"why":"Movement, so accusative: den Tisch."},{"t":"gap","q":"Wir gehen ___ Kino. (Wohin?)","a":["ins"],"why":"in das contracts to ins, accusative for movement."},{"t":"gap","q":"Wir sind ___ Kino. (Wo?)","a":["im"],"why":"in dem contracts to im, dative for position."},{"t":"gap","q":"Der Schlüssel hängt an ___ Wand.","a":["der"],"why":"Position, feminine dative: der Wand."},{"t":"gap","q":"Häng das Bild an ___ Wand.","a":["die"],"why":"Movement, feminine accusative: die Wand."},{"t":"gap","q":"Die Tasche steht unter ___ Stuhl.","a":["dem"],"why":"Position: dative."},{"t":"gap","q":"Stell die Tasche unter ___ Stuhl.","a":["den"],"why":"Movement: accusative."},{"t":"mc","q":"Which question word signals the ACCUSATIVE?","o":["Wo?","Wohin?","Woher?"],"a":1,"why":"Wohin means movement, which takes the accusative."},{"t":"gap","q":"Die Kinder spielen in ___ Garten. (Wo?)","a":["dem"],"why":"Position: dative."},{"t":"gap","q":"Die Kinder gehen in ___ Garten. (Wohin?)","a":["den"],"why":"Movement: accusative."},{"t":"gap","q":"Der Schlüssel liegt neben ___ Tasche.","a":["der"],"why":"Position, feminine dative."},{"t":"gap","q":"Ich stelle die Flasche neben ___ Teller.","a":["den"],"why":"Movement, masculine accusative."},{"t":"gap","q":"Wir warten vor ___ Haus.","a":["dem"],"why":"Position: dative."},{"t":"gap","q":"Setz dich zwischen ___ Kinder.","a":["die"],"why":"Movement, plural accusative."},{"t":"gap","q":"Das Bild hängt über ___ Sofa.","a":["dem"],"why":"Position: dative."},{"t":"gap","q":"Wir gehen ___ den Berg. (auf)","a":["auf"],"why":"auf + accusative for going up."},{"t":"mc","q":"Ich gehe ___ Schule.","o":["in der","in die","im"],"a":1,"why":"Movement to school: in die Schule."},{"t":"mc","q":"Which contraction is right for in + das?","o":["im","ins","ims"],"a":1,"why":"in das → ins."}],"tables":[{"title":"Wechselpräpositionen","head":["Präposition","Wo? + Dativ","Wohin? + Akkusativ"],"rows":[["in","im Kino","ins Kino"],["an","an der Wand","an die Wand"],["auf","auf dem Tisch","auf den Tisch"],["über","über dem Bett","über das Bett"],["unter","unter dem Stuhl","unter den Stuhl"],["vor","vor dem Haus","vor das Haus"],["hinter","hinter dem Haus","hinter das Haus"],["neben","neben der Tür","neben die Tür"],["zwischen","zwischen den Häusern","zwischen die Häuser"]]},{"title":"Kurzformen","rows":[["in dem → im","in das → ins"],["an dem → am","an das → ans"],["auf das → aufs",""]]}],"en":"Two-way prepositions — dative for position, accusative for movement","seq":33},{"id":"lokalprep","level":"A2","seq":35,"title":"Lokale Präpositionen","en":"Saying where you are and where you're going","rule":"zu + a person or business you go to: zum Arzt. bei + where you are or work: beim Arzt. in + an enclosed place: ins Kino, im Kino. auf + an open space or a public office: auf den Sportplatz, auf der Post. nach + a town or country with no article: nach Bern. an + an edge or water: ans Meer, am See.","tables":[{"title":"Wohin? und Wo?","head":["Wohin?","Wo?","Typ"],"rows":[["zum Arzt","beim Arzt","Person, Beruf"],["zum Bäcker","beim Bäcker","Geschäft"],["ins Kino","im Kino","geschlossener Raum"],["auf die Post","auf der Post","Amt, offener Platz"],["auf den Sportplatz","auf dem Sportplatz","Freifläche"],["nach Bern","in Bern","Stadt, Land ohne Artikel"],["in die Schweiz","in der Schweiz","Land mit Artikel"],["ans Meer","am Meer","Wasser, Rand"],["nach Hause","zu Hause","Sonderfall"]]}],"items":[{"t":"gap","q":"Ich gehe morgen ___ Arzt.","a":["zum"],"why":"Going to a person: zu dem → zum."},{"t":"gap","q":"Ich war gestern ___ Arzt.","a":["beim"],"why":"Being at a person: bei dem → beim."},{"t":"gap","q":"Wir gehen ___ Kino.","a":["ins"],"why":"Movement into an enclosed place: in das → ins."},{"t":"gap","q":"Wir sind gerade ___ Kino.","a":["im"],"why":"Being inside: in dem → im."},{"t":"gap","q":"Ich muss noch ___ Post.","a":["auf die","zur"],"why":"auf die Post or zur Post — both are used."},{"t":"gap","q":"Im Sommer fahren wir ___ Meer.","a":["ans"],"why":"Movement to the water: an das → ans."},{"t":"gap","q":"Wir fahren am Wochenende ___ Bern.","a":["nach"],"why":"Towns take nach with no article."},{"t":"gap","q":"Sie ist letztes Jahr ___ die Schweiz gezogen.","a":["in"],"why":"Countries with an article take in + accusative."},{"t":"gap","q":"Die Kinder gehen ___ Sportplatz.","a":["auf den"],"why":"Open space: auf + accusative."},{"t":"gap","q":"Ich fahre jetzt ___ Hause.","a":["nach"],"why":"nach Hause for going home."},{"t":"gap","q":"Ich bin den ganzen Tag ___ Hause.","a":["zu"],"why":"zu Hause for being at home."},{"t":"gap","q":"Sie arbeitet ___ einer Bank.","a":["bei"],"why":"bei for a workplace."},{"t":"mc","q":"Ich gehe ___ Friseur.","o":["im","zum","auf dem"],"a":1,"why":"Going to a business: zum."},{"t":"mc","q":"Which needs no article at all?","o":["___ die Schweiz","___ Bern","___ das Kino"],"a":1,"why":"Plain town names take nach with no article."}]},{"id":"adjend","level":"A2","title":"Adjektivendungen","rule":"After der/die/das: -e in the nominative, -en for masculine accusative, -en everywhere in the plural. After ein/eine: -er (m), -e (f), -es (n).","items":[{"t":"gap","q":"Der ___ Mann wartet draussen. (nett)","a":["nette"],"why":"der + nominative masculine: -e."},{"t":"gap","q":"Ich kenne den ___ Mann. (nett)","a":["netten"],"why":"den + accusative masculine: -en."},{"t":"gap","q":"Das ist ein ___ Mann. (nett)","a":["netter"],"why":"ein has no ending, so the adjective shows it: -er."},{"t":"gap","q":"Wir haben eine ___ Wohnung. (schön)","a":["schöne","schoene"],"why":"eine + feminine: -e."},{"t":"gap","q":"Das ist ein ___ Buch. (interessant)","a":["interessantes"],"why":"ein + neuter: -es."},{"t":"gap","q":"Die ___ Kinder spielen draussen. (klein)","a":["kleinen"],"why":"Plural after die always takes -en."},{"t":"gap","q":"Ich trinke gern ___ Kaffee. (stark)","a":["starken"],"why":"No article, masculine accusative: -en."},{"t":"gap","q":"Ich suche einen ___ Stuhl. (bequem)","a":["bequemen"],"why":"einen + masculine accusative: -en."},{"t":"mc","q":"Ich helfe der ___ Frau.","o":["nette","netten","netter"],"a":1,"why":"Dative always takes -en."},{"t":"gap","q":"Ich suche eine ___ Wohnung. (gross)","a":["grosse"],"why":"eine + feminine accusative: -e."},{"t":"gap","q":"Das ist ein ___ Problem. (schwierig)","a":["schwieriges"],"why":"ein + neuter: -es."},{"t":"gap","q":"Ich habe mit dem ___ Kollegen gesprochen. (neu)","a":["neuen"],"why":"Dative always takes -en."},{"t":"gap","q":"Die ___ Kinder sind schon müde. (klein)","a":["kleinen"],"why":"Plural after die: -en."},{"t":"gap","q":"Er hat einen ___ Wagen. (alt)","a":["alten"],"why":"einen + masculine accusative: -en."},{"t":"gap","q":"___ Wetter macht gute Laune. (schön)","a":["schönes","schoenes"],"why":"No article, neuter nominative: -es."},{"t":"gap","q":"Ich trinke gern ___ Milch. (warm)","a":["warme"],"why":"No article, feminine accusative: -e."},{"t":"gap","q":"Der ___ Mantel gefällt mir. (blau)","a":["blaue"],"why":"der + masculine nominative: -e."},{"t":"mc","q":"Ich helfe den ___ Kindern.","o":["klein","kleine","kleinen"],"a":2,"why":"Dative plural takes -en."},{"t":"mc","q":"Which ending appears most often overall?","o":["-e","-en","-es"],"a":1,"why":"-en covers all dative forms, plural, and masculine accusative."}],"tables":[{"title":"Nach der / die / das","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","der nette","die nette","das nette","die netten"],["Akkusativ","den netten","die nette","das nette","die netten"],["Dativ","dem netten","der netten","dem netten","den netten"]]},{"title":"Nach ein / kein / mein","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","ein netter","eine nette","ein nettes","keine netten"],["Akkusativ","einen netten","eine nette","ein nettes","keine netten"],["Dativ","einem netten","einer netten","einem netten","keinen netten"]]},{"title":"Ohne Artikel","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","guter Kaffee","gute Milch","gutes Brot","gute Äpfel"],["Akkusativ","guten Kaffee","gute Milch","gutes Brot","gute Äpfel"],["Dativ","gutem Kaffee","guter Milch","gutem Brot","guten Äpfeln"]]},{"title":"Faustregel","rows":[["","Zeigt der Artikel den Fall schon an, endet das Adjektiv auf -e oder -en. Zeigt er ihn nicht an, übernimmt das Adjektiv die Endung."]]}],"en":"Adjective endings — how adjectives change before a noun","seq":36},{"id":"komp","level":"A2","title":"Komparativ und Superlativ","rule":"Comparative: adjective + -er (schneller ... als). Superlative: am ...-sten or der/die/das ...-ste. Irregular: gut–besser–am besten, viel–mehr–am meisten, gern–lieber–am liebsten.","items":[{"t":"gap","q":"Der Zug ist ___ als der Bus. (schnell)","a":["schneller"],"why":"Comparative adds -er."},{"t":"gap","q":"Zürich ist ___ als Bern. (gross)","a":["grösser","groesser","grosser"],"why":"Short adjectives often take an umlaut too."},{"t":"gap","q":"Dieses Buch ist ___ als das andere. (gut)","a":["besser"],"why":"gut is irregular: besser."},{"t":"gap","q":"Ich trinke ___ Tee als Kaffee. (gern)","a":["lieber"],"why":"gern becomes lieber."},{"t":"gap","q":"Er läuft am ___ von allen. (schnell)","a":["schnellsten"],"why":"Superlative: am schnellsten."},{"t":"gap","q":"Das ist der ___ Weg. (kurz)","a":["kürzeste","kuerzeste","kurzeste"],"why":"Superlative before a noun: der kürzeste Weg."},{"t":"gap","q":"Sie spricht am ___ Deutsch. (gut)","a":["besten"],"why":"am besten."},{"t":"gap","q":"Mein Bruder ist so gross ___ ich.","a":["wie"],"why":"Equality uses so ... wie; comparison uses ... als."},{"t":"mc","q":"Der Kaffee ist teurer ___ der Tee.","o":["wie","als","so"],"a":1,"why":"After a comparative you always use als."},{"t":"gap","q":"Heute ist es ___ als gestern. (warm)","a":["wärmer","waermer"],"why":"Umlaut plus -er."},{"t":"gap","q":"Mein Deutsch wird ___ . (gut)","a":["besser"],"why":"gut is irregular: besser."},{"t":"gap","q":"Sie arbeitet am ___ von allen. (schnell)","a":["schnellsten"],"why":"am schnellsten."},{"t":"gap","q":"Der Winter dauert hier ___ als in Indien. (lang)","a":["länger","laenger"],"why":"Umlaut plus -er."},{"t":"gap","q":"Ich esse ___ Reis als Brot. (gern)","a":["lieber"],"why":"gern becomes lieber."},{"t":"gap","q":"Das ist die ___ Lösung. (einfach)","a":["einfachste"],"why":"Superlative before a noun: die einfachste."},{"t":"gap","q":"Er ist ___ als sein Bruder. (jung)","a":["jünger","juenger"],"why":"Umlaut plus -er."},{"t":"gap","q":"Zürich ist nicht so gross ___ Mumbai.","a":["wie"],"why":"so ... wie for equality."},{"t":"mc","q":"Which comparative is irregular?","o":["kleiner","mehr","schöner"],"a":1,"why":"viel becomes mehr."},{"t":"mc","q":"Das ist der ___ Weg.","o":["kürzer","kürzeste","am kürzesten"],"a":1,"why":"Before a noun you need the -ste form with an article."}],"tables":[{"title":"Steigerung","head":["Grundform","Komparativ","Superlativ"],"rows":[["schnell","schneller","am schnellsten"],["gross","grösser","am grössten"],["alt","älter","am ältesten"],["jung","jünger","am jüngsten"],["kurz","kürzer","am kürzesten"],["gut","besser","am besten"],["viel","mehr","am meisten"],["gern","lieber","am liebsten"],["hoch","höher","am höchsten"],["nah","näher","am nächsten"],["teuer","teurer","am teuersten"],["dunkel","dunkler","am dunkelsten"]]},{"title":"Vergleichen","rows":[["gleich","so … wie: so gross wie ich"],["ungleich","…-er als: grösser als ich"],["vor dem Nomen","der schnellste Zug, das beste Buch"]]}],"en":"Comparative and superlative — fast, faster, fastest","seq":38},{"id":"konnekt","level":"A2","title":"Hauptsätze verbinden","rule":"und, aber, oder, denn, sondern sit outside the sentence and change nothing. deshalb, danach, trotzdem, dann take position 1, so the verb comes second.","items":[{"t":"gap","q":"Ich bin müde, ___ ich gehe trotzdem mit.","a":["aber"],"why":"aber joins without changing word order."},{"t":"gap","q":"Ich bleibe zu Hause, ___ es regnet.","a":["denn"],"why":"denn = because, and the word order stays normal."},{"t":"gap","q":"Möchtest du Tee ___ Kaffee?","a":["oder"],"why":"oder offers an alternative."},{"t":"gap","q":"Nicht heute, ___ morgen.","a":["sondern"],"why":"sondern corrects a negative statement."},{"t":"gap","q":"Es hat geregnet. Deshalb ___ wir zu Hause. (bleiben)","a":["blieben","bleiben"],"why":"deshalb takes position 1, so the verb comes second."},{"t":"gap","q":"Zuerst essen wir. Danach ___ wir spazieren. (gehen)","a":["gehen"],"why":"danach in position 1, verb second."},{"t":"gap","q":"Es war kalt. Trotzdem ___ wir raus. (gehen)","a":["gingen","gehen"],"why":"trotzdem in position 1, verb second."},{"t":"mc","q":"Which is correct?","o":["Ich habe Zeit, deshalb ich komme mit.","Ich habe Zeit, deshalb komme ich mit."],"a":1,"why":"deshalb counts as position 1, so the verb must come second."},{"t":"mc","q":"Which word does NOT change the word order?","o":["deshalb","aber","trotzdem"],"a":1,"why":"und, aber, oder, denn, sondern sit in position 0 and change nothing."},{"t":"gap","q":"Ich habe Hunger, ___ ich esse jetzt etwas.","a":["also","und"],"why":"also or und both work here."},{"t":"gap","q":"Sie kommt nicht, ___ sie ist krank.","a":["denn"],"why":"denn gives the reason without changing word order."},{"t":"gap","q":"Beeil dich, ___ wir kommen zu spät.","a":["sonst"],"why":"sonst = otherwise."},{"t":"gap","q":"Zuerst räume ich auf. Dann ___ ich einkaufen. (gehen)","a":["gehe"],"why":"dann is position 1, verb second."},{"t":"gap","q":"Es war teuer. Trotzdem ___ wir es gekauft. (haben)","a":["haben"],"why":"trotzdem in position 1."},{"t":"gap","q":"Ich mag keinen Kaffee, ___ Tee.","a":["sondern"],"why":"sondern corrects a negative."},{"t":"gap","q":"Es ist spät. Ausserdem ___ ich müde. (sein)","a":["bin"],"why":"ausserdem takes position 1."},{"t":"mc","q":"Which is correct?","o":["Ich bin müde, trotzdem ich komme.","Ich bin müde, trotzdem komme ich."],"a":1,"why":"trotzdem counts as position 1."},{"t":"mc","q":"Which is correct?","o":["Ich bleibe, denn es regnet.","Ich bleibe, denn regnet es."],"a":0,"why":"denn changes nothing about the word order."},{"t":"gap","q":"Wir können laufen ___ den Bus nehmen.","a":["oder"],"why":"oder offers an alternative."}],"tables":[{"title":"Position 0 — nichts ändert sich","head":["Wort","Bedeutung","Beispiel"],"rows":[["und","Addition","Ich koche und du deckst."],["aber","Gegensatz","Ich bin müde, aber ich komme."],["oder","Alternative","Tee oder Kaffee?"],["denn","Grund","Ich bleibe, denn es regnet."],["sondern","Korrektur","Nicht heute, sondern morgen."]]},{"title":"Position 1 — Verb kommt direkt danach","head":["Wort","Bedeutung","Beispiel"],"rows":[["deshalb","Folge","Es regnet, deshalb bleibe ich."],["trotzdem","Gegensatz","Es regnet, trotzdem gehe ich."],["dann","danach","Zuerst esse ich, dann gehe ich."],["danach","danach","Danach gehen wir spazieren."],["sonst","andernfalls","Beeil dich, sonst kommst du zu spät."],["ausserdem","zusätzlich","Ausserdem ist es zu teuer."]]}],"en":"Joining main clauses — and, but, so, therefore","seq":40},{"id":"neben","level":"A2","title":"Nebensätze: weil, dass, wenn","rule":"In a subordinate clause the conjugated verb goes right to the end. With a modal, the modal is last of all: ..., weil ich arbeiten muss.","items":[{"t":"gap","q":"Ich bleibe zu Hause, weil es ___ . (regnen)","a":["regnet"],"why":"The verb goes to the end of the weil clause."},{"t":"gap","q":"Ich glaube, dass er morgen ___ . (kommen)","a":["kommt"],"why":"dass sends the verb to the end."},{"t":"gap","q":"Wenn ich Zeit ___ , rufe ich dich an. (haben)","a":["habe"],"why":"Verb at the end of the wenn clause."},{"t":"gap","q":"Ich komme später, weil ich noch arbeiten ___ . (müssen)","a":["muss"],"why":"With a modal, the modal comes last."},{"t":"gap","q":"Sie sagt, dass sie krank ___ . (sein)","a":["ist"],"why":"ist goes to the end."},{"t":"gap","q":"Wenn es morgen schön ___ , gehen wir wandern. (sein)","a":["ist"],"why":"Verb at the end."},{"t":"gap","q":"Ich weiss nicht, ___ er kommt.","a":["ob"],"why":"ob is used for an indirect yes/no question."},{"t":"mc","q":"Which is correct?","o":["Ich komme nicht, weil ich habe keine Zeit.","Ich komme nicht, weil ich keine Zeit habe."],"a":1,"why":"After weil the verb must go right to the end."},{"t":"mc","q":"Wenn ich Zeit habe, ___ ich dich an.","o":["rufe","ich rufe","anrufe"],"a":0,"why":"The subordinate clause counts as position 1, so the main verb comes straight after."},{"t":"gap","q":"Ich weiss nicht, ___ der Laden noch offen ist.","a":["ob"],"why":"ob for an indirect yes/no question."},{"t":"gap","q":"___ ich klein war, wohnten wir in Chennai.","a":["als"],"why":"als for one event in the past."},{"t":"gap","q":"___ es kalt war, sind wir spazieren gegangen.","a":["obwohl"],"why":"obwohl expresses a contrast."},{"t":"gap","q":"Ich lerne Deutsch, ___ ich hier arbeiten möchte.","a":["weil"],"why":"weil gives the reason."},{"t":"gap","q":"Ruf mich an, ___ du angekommen bist.","a":["wenn","sobald","nachdem"],"why":"wenn or sobald both work here."},{"t":"gap","q":"Ich koche, ___ die Kinder Hausaufgaben machen.","a":["während"],"why":"während for two things at once."},{"t":"gap","q":"Ich komme nicht, weil ich arbeiten ___ . (müssen)","a":["muss"],"why":"With a modal, the modal comes last."},{"t":"gap","q":"Er sagt, dass er morgen ___ . (kommen)","a":["kommt"],"why":"Verb at the end."},{"t":"mc","q":"Which is correct?","o":["Ich glaube, dass er ist krank.","Ich glaube, dass er krank ist."],"a":1,"why":"The verb must go to the very end after dass."},{"t":"mc","q":"als or wenn? '___ ich in Zürich ankam, regnete es.'","o":["Wenn","Als"],"a":1,"why":"als for a single completed event in the past."}],"tables":[{"title":"Nebensätze — Verb am Ende","head":["Konjunktion","Bedeutung","Beispiel"],"rows":[["weil","Grund","Ich bleibe, weil es regnet."],["dass","Aussage","Ich glaube, dass er kommt."],["wenn","Bedingung, Wiederholung","Wenn ich Zeit habe, komme ich."],["als","einmal, Vergangenheit","Als ich klein war, …"],["ob","indirekte Ja/Nein-Frage","Ich weiss nicht, ob er kommt."],["obwohl","Gegensatz","Obwohl es kalt war, …"],["damit","Ziel","Ich rufe an, damit du es weisst."],["bevor","vorher","Ruf an, bevor du gehst."],["nachdem","danach","Nachdem ich gegessen hatte, …"],["während","gleichzeitig","Während ich koche, lernt sie."]]},{"title":"Merke","rows":[["Verbstellung","Das konjugierte Verb steht ganz am Ende."],["mit Modalverb","Das Modalverb steht als Letztes: …, weil ich arbeiten muss."],["Nebensatz zuerst","Dann folgt sofort das Verb: Wenn ich Zeit habe, komme ich."]]}],"en":"Subordinate clauses — because, that, if, although","seq":42},{"id":"adverbien","level":"A2","seq":43,"title":"Positions- und Direktionaladverbien","en":"here and there, plus the direction words hin and her","rule":"Position words answer Wo?: hier, da, dort, oben, unten, vorn, hinten, drinnen, draussen. Direction words answer Wohin?: hierher, dorthin, nach oben, nach unten. hin points away from the speaker, her points towards the speaker: Komm her! Geh hin!","tables":[{"title":"Wo? und Wohin?","head":["Wo?","Wohin?"],"rows":[["hier","hierher"],["dort","dorthin"],["da","dahin"],["oben","nach oben"],["unten","nach unten"],["vorn","nach vorn"],["hinten","nach hinten"],["drinnen","hinein / rein"],["draussen","hinaus / raus"]]},{"title":"hin und her","rows":[["hin","vom Sprecher weg — Geh hin! Ich fahre hin."],["her","zum Sprecher — Komm her! Gib es her."],["Kombination","hinauf, herunter, hinein, herein, hinüber"],["Frage","Wohin gehst du? Woher kommst du?"]]}],"items":[{"t":"gap","q":"___ ist es viel ruhiger als draussen.","a":["hier","drinnen"],"why":"Position word for where you are."},{"t":"gap","q":"Komm bitte ___ ! (zum Sprecher)","a":["her"],"why":"her points towards the speaker."},{"t":"gap","q":"Ich fahre morgen ___ . (weg vom Sprecher)","a":["hin"],"why":"hin points away from the speaker."},{"t":"gap","q":"Die Bücher stehen ___ im Regal, nicht unten.","a":["oben"],"why":"Position: oben."},{"t":"gap","q":"Die Kinder spielen ___ im Garten.","a":["draussen"],"why":"Position: outside."},{"t":"gap","q":"Kommen Sie bitte ___ ! (ins Zimmer, zum Sprecher)","a":["herein","rein"],"why":"herein = in towards the speaker."},{"t":"gap","q":"Wir sitzen ganz ___ , wir sehen alles.","a":["vorn","vorne"],"why":"Position at the front."},{"t":"gap","q":"Stell die Kiste bitte ___ unten.","a":["nach"],"why":"Direction: nach unten."},{"t":"gap","q":"___ gehst du? – Ins Kino.","a":["wohin"],"why":"Direction question."},{"t":"gap","q":"___ kommst du? – Aus Indien.","a":["woher"],"why":"Origin question."},{"t":"gap","q":"___ bist du? – In der Küche.","a":["wo"],"why":"Position question."},{"t":"mc","q":"Someone at the door says:","o":["Komm hin!","Komm her!"],"a":1,"why":"They want you to come towards them: her."},{"t":"mc","q":"Which one answers Wohin?","o":["dort","dorthin"],"a":1,"why":"dorthin includes direction."},{"t":"mc","q":"'Geh raus!' means:","o":["come in","go out"],"a":1,"why":"raus is the short form of hinaus."}]},{"id":"partikeln","level":"A2","seq":44,"title":"Partikeln","en":"The little flavour words — denn, mal, doch, ja, eigentlich","rule":"Particles add tone, not information. denn softens a question. mal makes a request casual. doch urges, or contradicts a negative. ja signals shared knowledge or surprise. eigentlich means actually. They are never stressed and never start the sentence.","tables":[{"title":"Was sie tun","head":["Partikel","Wirkung","Beispiel"],"rows":[["denn","freundlichere Frage","Wie heisst du denn?"],["mal","lockere Bitte","Komm mal her."],["doch","Aufforderung, Widerspruch","Komm doch mit! Das stimmt doch nicht."],["ja","gemeinsames Wissen, Überraschung","Du weisst ja, wie es ist."],["eigentlich","eigentlich, nebenbei gefragt","Wie spät ist es eigentlich?"],["halt / eben","Resignation","Das ist halt so."],["wohl","Vermutung","Er ist wohl krank."],["ruhig","beruhigende Erlaubnis","Frag ruhig nach."]]},{"title":"Merke","rows":[["Position","meist nach dem Verb und dem Subjekt"],["Betonung","nie betont"],["Antwort doch","Widerspruch zu einer negativen Frage: Kommst du nicht? – Doch!"]]}],"items":[{"t":"gap","q":"Wie heisst du ___ ? (freundlicher)","a":["denn"],"why":"denn softens a question."},{"t":"gap","q":"Komm ___ her, ich zeige es dir. (locker)","a":["mal"],"why":"mal makes a request casual."},{"t":"gap","q":"Komm ___ mit, es wird lustig! (auffordernd)","a":["doch"],"why":"doch urges someone."},{"t":"gap","q":"Du weisst ___ , wie das hier läuft. (gemeinsames Wissen)","a":["ja"],"why":"ja signals what you both already know."},{"t":"gap","q":"Wie spät ist es ___ ? (nebenbei)","a":["eigentlich"],"why":"eigentlich = actually, by the way."},{"t":"gap","q":"Er ist ___ im Stau. (Vermutung)","a":["wohl"],"why":"wohl marks a guess."},{"t":"gap","q":"Frag ___ nach, das ist kein Problem. (beruhigend)","a":["ruhig"],"why":"ruhig gives reassuring permission."},{"t":"gap","q":"Das ist ___ so, da kann man nichts machen.","a":["halt","eben"],"why":"halt or eben express resignation."},{"t":"mc","q":"Kommst du nicht mit? – ___ , ich komme!","o":["Ja","Doch","Nein"],"a":1,"why":"Doch contradicts a negative question."},{"t":"mc","q":"'Wo warst du denn?' compared with 'Wo warst du?' sounds:","o":["angrier","friendlier and more curious"],"a":1,"why":"denn softens the question."},{"t":"mc","q":"Where do particles usually stand?","o":["at the start","after the verb and subject","at the very end"],"a":1,"why":"Komm mal her. Wie heisst du denn?"},{"t":"mc","q":"'Das ist ja toll!' expresses:","o":["doubt","pleasant surprise"],"a":1,"why":"ja here marks surprise."},{"t":"mc","q":"Which particle can answer a question all on its own?","o":["mal","doch","eigentlich"],"a":1,"why":"Doch! contradicts a negative question."},{"t":"gap","q":"Setz dich ___ ! (freundliche Aufforderung)","a":["doch"],"why":"doch makes an invitation warmer."}]},{"id":"komposita","level":"A2","seq":45,"title":"Komposita","en":"Compound nouns — the last part decides the gender","rule":"German simply joins nouns together. The LAST part gives the gender and the plural: die Tür + das Haus → die Haustür. Sometimes a linking -s or -n appears: der Arbeitsplatz, die Sonnenbrille. Read compounds from the back: a Haustür is a kind of Tür.","tables":[{"title":"Wie sie gebaut sind","head":["Teile","Kompositum","Artikel"],"rows":[["das Haus + die Tür","die Haustür","die (von Tür)"],["die Hand + das Tuch","das Handtuch","das (von Tuch)"],["der Zug + die Fahrt","die Zugfahrt","die (von Fahrt)"],["die Arbeit + der Platz","der Arbeitsplatz","Fugen-s"],["die Sonne + die Brille","die Sonnenbrille","Fugen-n"],["das Jahr + die Zeit","die Jahreszeit","Fugen-es"]]},{"title":"Merke","rows":[["Artikel","immer vom letzten Wort"],["Plural","immer vom letzten Wort"],["Bedeutung","von hinten lesen: Haustür = eine Tür"],["Betonung","auf dem ersten Teil: HAUStür"]]}],"items":[{"t":"gap","q":"das Haus + die Tür = ___ Haustür","a":["die"],"why":"Tür is last and feminine."},{"t":"gap","q":"die Hand + das Tuch = ___ Handtuch","a":["das"],"why":"Tuch is last and neuter."},{"t":"gap","q":"der Zug + die Fahrt = ___ Zugfahrt","a":["die"],"why":"Fahrt is last and feminine."},{"t":"gap","q":"die Küche + der Tisch = ___ Küchentisch","a":["der"],"why":"Tisch is last and masculine."},{"t":"gap","q":"das Kind + der Garten = ___ Kindergarten","a":["der"],"why":"Garten is last and masculine."},{"t":"gap","q":"die Arbeit + das Amt = ___ Arbeitsamt","a":["das"],"why":"Amt is last and neuter."},{"t":"gap","q":"die Sonne + die Brille = ___ Sonnenbrille","a":["die"],"why":"Brille is last and feminine."},{"t":"gap","q":"der Winter + der Mantel = ___ Wintermantel","a":["der"],"why":"Mantel is last and masculine."},{"t":"mc","q":"Eine Haustür ist vor allem:","o":["ein Haus","eine Tür"],"a":1,"why":"Read compounds from the back."},{"t":"mc","q":"What gives a compound its gender?","o":["the first part","the last part","the longest part"],"a":1,"why":"Always the final noun."},{"t":"mc","q":"Which has a linking -s?","o":["Handtuch","Arbeitsplatz","Küchentisch"],"a":1,"why":"Arbeit + s + Platz."},{"t":"mc","q":"Plural of das Handtuch:","o":["die Handtücher","die Handtuchs","die Handtuche"],"a":0,"why":"The plural follows Tuch → Tücher."},{"t":"gap","q":"der Geburtstag: die Geburt + ___ Tag","a":["der"],"why":"Tag is masculine, and it gives the compound its gender."},{"t":"gap","q":"die Fahrkarte: die Fahrt + ___ Karte","a":["die"],"why":"Karte is last and feminine."}]},{"id":"wortbildung","level":"A2","seq":46,"title":"Wortbildung","en":"Building new words with endings — -ung, -er, -in, -chen","rule":"-ung turns a verb into a feminine noun: wohnen → die Wohnung. -er names the person doing it: lehren → der Lehrer. -in makes it feminine: die Lehrerin. -chen and -lein make something small and neuter: das Brötchen. un- reverses the meaning: unfreundlich. -los means without, -bar means able to be.","tables":[{"title":"Endungen","head":["Endung","Bedeutung","Beispiel"],"rows":[["-ung","Verb → Nomen (feminin)","wohnen → die Wohnung"],["-er","die Person","lehren → der Lehrer"],["-in","weibliche Form","der Lehrer → die Lehrerin"],["-chen / -lein","klein, immer neutral","das Brot → das Brötchen"],["-heit / -keit","Eigenschaft (feminin)","frei → die Freiheit"],["-los","ohne","die Arbeit → arbeitslos"],["-bar","kann man tun","essen → essbar"],["-ig","Eigenschaft","die Sonne → sonnig"]]},{"title":"Vorsilben","rows":[["un-","Gegenteil: unfreundlich, unmöglich"],["miss-","falsch: missverstehen"],["ver-","oft Fehler: sich verlaufen, sich versprechen"]]}],"items":[{"t":"gap","q":"wohnen → die ___","a":["Wohnung","wohnung"],"why":"-ung makes a feminine noun from the verb."},{"t":"gap","q":"rechnen → die ___","a":["Rechnung","rechnung"],"why":"-ung: die Rechnung."},{"t":"gap","q":"lehren → der ___","a":["Lehrer","lehrer"],"why":"-er names the person."},{"t":"gap","q":"der Lehrer → die ___","a":["Lehrerin","lehrerin"],"why":"-in makes the feminine form."},{"t":"gap","q":"das Brot → das ___ (klein)","a":["Brötchen","brötchen","broetchen"],"why":"-chen makes it small and neuter."},{"t":"gap","q":"frei → die ___","a":["Freiheit","freiheit"],"why":"-heit makes an abstract feminine noun."},{"t":"gap","q":"möglich → die ___","a":["Möglichkeit","möglichkeit","moeglichkeit"],"why":"-keit after -lich."},{"t":"gap","q":"die Arbeit → ___ (ohne Arbeit)","a":["Arbeitslos","arbeitslos"],"why":"-los means without."},{"t":"gap","q":"essen → ___ (kann man essen)","a":["Essbar","essbar"],"why":"-bar means able to be done."},{"t":"gap","q":"freundlich → ___ (Gegenteil)","a":["Unfreundlich","unfreundlich"],"why":"un- reverses the meaning."},{"t":"gap","q":"die Sonne → ___ (Wetter)","a":["Sonnig","sonnig"],"why":"-ig makes an adjective."},{"t":"mc","q":"Nouns ending in -ung are always:","o":["masculine","feminine","neuter"],"a":1,"why":"-ung is reliably feminine."},{"t":"mc","q":"Nouns ending in -chen are always:","o":["masculine","feminine","neuter"],"a":2,"why":"das Mädchen, das Brötchen — always neuter."},{"t":"mc","q":"What does 'verstehen' become with miss-?","o":["missverstehen — to misunderstand","missverstehen — to understand well"],"a":0,"why":"miss- means wrongly."}]},{"id":"genus","level":"A2","seq":48,"title":"Genusregeln","en":"How to guess whether a noun is der, die or das","rule":"Gender is not random. Endings are the best clue: -ung, -heit, -keit, -schaft, -ion, -tät are feminine; -chen, -lein, -ment, -um are neuter; -er, -ling, -ismus are usually masculine. Meaning helps too: days, months, seasons and weather are masculine.","tables":[{"title":"Endungen","head":["Genus","Endung","Beispiel"],"rows":[["die","-ung","die Wohnung"],["die","-heit, -keit","die Freiheit, die Möglichkeit"],["die","-schaft","die Gesellschaft"],["die","-ion, -tät","die Information, die Qualität"],["die","-e (meist)","die Lampe, die Blume"],["das","-chen, -lein","das Mädchen"],["das","-ment, -um","das Dokument, das Museum"],["das","Infinitiv als Nomen","das Essen, das Lernen"],["der","-er (Person)","der Lehrer"],["der","-ling, -ismus","der Lehrling"]]},{"title":"Bedeutung","rows":[["der","Tage, Monate, Jahreszeiten, Wetter: der Montag, der Mai, der Sommer, der Regen"],["der","männliche Personen: der Vater, der Arzt"],["die","weibliche Personen: die Mutter, die Ärztin"],["die","Zahlen als Nomen: die Eins"],["das","Farben, Sprachen: das Blau, das Deutsch"],["Achtung","das Mädchen ist neutral, weil -chen stärker ist als die Bedeutung"]]}],"items":[{"t":"gap","q":"___ Wohnung","a":["die"],"why":"-ung is feminine."},{"t":"gap","q":"___ Mädchen","a":["das"],"why":"-chen is always neuter, even for a girl."},{"t":"gap","q":"___ Freiheit","a":["die"],"why":"-heit is feminine."},{"t":"gap","q":"___ Museum","a":["das"],"why":"-um is neuter."},{"t":"gap","q":"___ Information","a":["die"],"why":"-ion is feminine."},{"t":"gap","q":"___ Montag","a":["der"],"why":"Days of the week are masculine."},{"t":"gap","q":"___ Sommer","a":["der"],"why":"Seasons are masculine."},{"t":"gap","q":"___ Regen","a":["der"],"why":"Weather words are masculine."},{"t":"gap","q":"___ Möglichkeit","a":["die"],"why":"-keit is feminine."},{"t":"gap","q":"___ Dokument","a":["das"],"why":"-ment is neuter."},{"t":"gap","q":"___ Essen (vom Verb essen)","a":["das"],"why":"Infinitives used as nouns are neuter."},{"t":"gap","q":"___ Gesellschaft","a":["die"],"why":"-schaft is feminine."},{"t":"mc","q":"Which ending is NOT feminine?","o":["-ung","-keit","-ling"],"a":2,"why":"-ling is masculine: der Lehrling."},{"t":"mc","q":"Why is 'das Mädchen' neuter?","o":["because girls are neuter","because -chen always wins"],"a":1,"why":"The ending overrides the meaning."}]},{"id":"praet2","level":"B1","title":"Präteritum","rule":"Written and formal past. Regular: stem + -te (machte, machtest, machte, machten). Irregular: vowel change, no ending in ich/er (ging, kam, sah, gab, fuhr).","items":[{"t":"gap","q":"Er ___ gestern sehr früh nach Hause. (gehen)","a":["ging"],"why":"gehen becomes ging, no ending in er."},{"t":"gap","q":"Sie ___ mir einen langen Brief. (schreiben)","a":["schrieb"],"why":"schreiben becomes schrieb."},{"t":"gap","q":"Wir ___ jeden Sommer ans Meer. (fahren)","a":["fuhren"],"why":"fahren becomes fuhr, plural adds -en."},{"t":"gap","q":"Ich ___ ihn zum ersten Mal in Bern. (sehen)","a":["sah"],"why":"sehen becomes sah."},{"t":"gap","q":"Sie ___ das Fenster und ging hinaus. (öffnen)","a":["öffnete","oeffnete"],"why":"Regular verb: stem + -ete."},{"t":"gap","q":"Er ___ mir das Buch. (geben)","a":["gab"],"why":"geben becomes gab."},{"t":"gap","q":"Wir ___ lange auf den Zug. (warten)","a":["warteten"],"why":"Regular: wartete + -n for wir."},{"t":"gap","q":"Das Kind ___ die ganze Nacht. (schlafen)","a":["schlief"],"why":"schlafen becomes schlief."},{"t":"mc","q":"When is the Präteritum most used?","o":["Everyday spoken German","Written narrative and news","Only questions"],"a":1,"why":"In speech the Perfekt dominates; the Präteritum belongs to written German."},{"t":"gap","q":"Er ___ mir alles. (erzählen)","a":["erzählte","erzaehlte"],"why":"Regular: stem + -te."},{"t":"gap","q":"Sie ___ den Brief und ging. (nehmen)","a":["nahm"],"why":"nehmen becomes nahm."},{"t":"gap","q":"Wir ___ nichts davon. (wissen)","a":["wussten"],"why":"wissen becomes wusste, plural wussten."},{"t":"gap","q":"Ich ___ lange darüber nach. (nachdenken)","a":["dachte"],"why":"denken becomes dachte; nach goes to the end."},{"t":"gap","q":"Er ___ mir das Buch. (bringen)","a":["brachte"],"why":"bringen becomes brachte."},{"t":"gap","q":"Sie ___ die ganze Nacht. (arbeiten)","a":["arbeitete"],"why":"Regular, stem in -t: arbeitete."},{"t":"gap","q":"Wir ___ zu Hause. (bleiben)","a":["blieben"],"why":"bleiben becomes blieb, plural blieben."},{"t":"gap","q":"Du ___ zu spät. (kommen)","a":["kamst"],"why":"kam + -st for du."},{"t":"mc","q":"Which is the Präteritum of essen?","o":["ass","gegessen","esste"],"a":0,"why":"essen — ass — gegessen."},{"t":"mc","q":"Which ending does er take in the Präteritum?","o":["-t","-te or none","-st"],"a":1,"why":"Regular: machte. Irregular: ging, with no ending."}],"tables":[{"title":"Endungen","head":["","regelmässig: machen","unregelmässig: gehen"],"rows":[["ich","machte","ging"],["du","machtest","gingst"],["er/sie/es","machte","ging"],["wir","machten","gingen"],["ihr","machtet","gingt"],["sie/Sie","machten","gingen"]]},{"title":"Wichtige unregelmässige Verben","head":["Infinitiv","Präteritum","Partizip II"],"rows":[["gehen","ging","ist gegangen"],["kommen","kam","ist gekommen"],["sehen","sah","hat gesehen"],["geben","gab","hat gegeben"],["fahren","fuhr","ist gefahren"],["nehmen","nahm","hat genommen"],["sprechen","sprach","hat gesprochen"],["schreiben","schrieb","hat geschrieben"],["bleiben","blieb","ist geblieben"],["finden","fand","hat gefunden"],["essen","ass","hat gegessen"],["trinken","trank","hat getrunken"],["denken","dachte","hat gedacht"],["bringen","brachte","hat gebracht"],["wissen","wusste","hat gewusst"]]}],"en":"Simple past — the past tense used in writing and stories","seq":49},{"id":"plus","level":"B1","title":"Plusquamperfekt","rule":"For an event before another past event: hatte / war + participle. Often paired with nachdem: Nachdem ich gegessen hatte, ging ich los.","items":[{"t":"gap","q":"Ich ___ zu lange geschlafen und kam zu spät.","a":["hatte"],"why":"schlafen takes haben, so hatte + participle."},{"t":"gap","q":"Nachdem wir gegessen ___ , gingen wir spazieren.","a":["hatten"],"why":"wir hatten gegessen."},{"t":"gap","q":"Er ___ schon nach Hause gegangen, als ich ankam.","a":["war"],"why":"gehen takes sein, so war gegangen."},{"t":"gap","q":"Sie ___ den Zug verpasst und wartete auf den nächsten.","a":["hatte"],"why":"verpassen takes haben."},{"t":"gap","q":"Nachdem der Film zu Ende ___ , gingen alle heim. (sein)","a":["war"],"why":"sein takes war."},{"t":"gap","q":"Wir ___ den Termin vergessen.","a":["hatten"],"why":"vergessen takes haben."},{"t":"gap","q":"Ich ___ noch nie in Berlin gewesen, bevor wir hinfuhren.","a":["war"],"why":"sein gewesen takes war."},{"t":"mc","q":"Which tense follows nachdem when the main clause is Präteritum?","o":["Perfekt","Plusquamperfekt","Präsens"],"a":1,"why":"nachdem needs the earlier action, so Plusquamperfekt."},{"t":"mc","q":"Which is correct?","o":["Nachdem ich gegessen habe, ging ich los.","Nachdem ich gegessen hatte, ging ich los."],"a":1,"why":"Both clauses stay in the past: hatte + gegangen sequence."},{"t":"gap","q":"Nachdem sie angekommen ___ , rief sie an.","a":["war"],"why":"ankommen takes sein: war angekommen."},{"t":"gap","q":"Ich ___ den Schlüssel vergessen und musste zurück.","a":["hatte"],"why":"vergessen takes haben."},{"t":"gap","q":"Wir ___ schon gegessen, als er kam.","a":["hatten"],"why":"wir hatten gegessen."},{"t":"gap","q":"Nachdem der Film ___ war, gingen wir. (enden)","a":["geendet","zu ende"],"why":"enden takes sein: war geendet."},{"t":"gap","q":"Er ___ noch nie geflogen, bevor er nach Zürich kam.","a":["war"],"why":"fliegen takes sein."},{"t":"gap","q":"Sie ___ den Bericht schon geschrieben.","a":["hatte"],"why":"schreiben takes haben."},{"t":"gap","q":"Nachdem ich mich ___ hatte, ging ich los. (umziehen)","a":["umgezogen"],"why":"Separable participle: umgezogen."},{"t":"mc","q":"Which describes the Plusquamperfekt?","o":["the most recent past event","an event before another past event","a future event"],"a":1,"why":"It marks the earlier of two past events."},{"t":"mc","q":"Nachdem wir gegessen ___, gingen wir spazieren.","o":["haben","hatten","hätten"],"a":1,"why":"Past sequence needs hatten."},{"t":"gap","q":"Ich ___ den Zug verpasst, deshalb kam ich zu spät.","a":["hatte"],"why":"The missing came first: Plusquamperfekt."}],"tables":[{"title":"Plusquamperfekt","head":["","mit haben","mit sein"],"rows":[["ich","hatte gegessen","war gegangen"],["du","hattest gegessen","warst gegangen"],["er/sie/es","hatte gegessen","war gegangen"],["wir","hatten gegessen","waren gegangen"],["ihr","hattet gegessen","wart gegangen"],["sie/Sie","hatten gegessen","waren gegangen"]]},{"title":"Zeitenfolge","rows":[["früher","Plusquamperfekt: Nachdem ich gegessen hatte,"],["danach","Präteritum oder Perfekt: … ging ich los."]]}],"en":"Past perfect — an event that happened before another past event","seq":50},{"id":"refldat","level":"B1","seq":51,"title":"Reflexivpronomen im Dativ","en":"Doing something to yourself, and to each other","rule":"When a reflexive verb already has a direct object, the reflexive pronoun switches to the dative: Ich wasche mich, but Ich wasche mir die Hände. Only ich and du change: mich→mir, dich→dir. Reciprocal verbs use uns, euch, sich to mean 'each other'.","tables":[{"title":"Akkusativ und Dativ","head":["","Akkusativ","Dativ"],"rows":[["ich","mich","mir"],["du","dich","dir"],["er/sie/es","sich","sich"],["wir","uns","uns"],["ihr","euch","euch"],["sie/Sie","sich","sich"]]},{"title":"Wann Dativ?","rows":[["ohne Objekt → Akkusativ","Ich wasche mich."],["mit Objekt → Dativ","Ich wasche mir die Hände."],["typisch","sich die Zähne putzen, sich etwas vorstellen, sich etwas ansehen, sich etwas merken, sich etwas wünschen"]]},{"title":"Reziprok: einander","rows":[["uns / euch / sich","Wir helfen uns. = We help each other."],["einander","Sie kennen einander seit Jahren."]]}],"items":[{"t":"gap","q":"Ich wasche ___ die Hände.","a":["mir"],"why":"There is an object (die Hände), so the reflexive is dative."},{"t":"gap","q":"Ich wasche ___ schnell.","a":["mich"],"why":"No object, so accusative."},{"t":"gap","q":"Putz dir bitte ___ Zähne.","a":["die"],"why":"The body part takes the definite article, not a possessive."},{"t":"gap","q":"Kannst du ___ das vorstellen? (du)","a":["dir"],"why":"sich etwas vorstellen takes the dative."},{"t":"gap","q":"Ich sehe ___ die Wohnung morgen an.","a":["mir"],"why":"With an object: dative mir."},{"t":"gap","q":"Merk ___ bitte die Nummer. (du)","a":["dir"],"why":"sich etwas merken takes the dative."},{"t":"gap","q":"Was wünschst du ___ zum Geburtstag?","a":["dir"],"why":"sich etwas wünschen takes the dative."},{"t":"gap","q":"Wir helfen ___ gegenseitig.","a":["uns"],"why":"Reciprocal: each other."},{"t":"gap","q":"Die beiden kennen ___ seit Jahren.","a":["sich","einander"],"why":"Reciprocal sich or einander."},{"t":"gap","q":"Ich habe ___ den Arm verletzt.","a":["mir"],"why":"den Arm is the object, so dative mir."},{"t":"gap","q":"Zieh ___ bitte warm an. (du, ohne Objekt)","a":["dich"],"why":"No object, so accusative dich."},{"t":"mc","q":"Which pronouns actually change between accusative and dative?","o":["all of them","only ich and du","only the plural"],"a":1,"why":"mich/mir and dich/dir — the rest are identical."},{"t":"mc","q":"Ich putze ___ die Zähne.","o":["mich","mir","meine"],"a":1,"why":"die Zähne is the object, so the reflexive goes dative."},{"t":"mc","q":"'Sie schreiben sich jede Woche' most likely means:","o":["They write to themselves.","They write to each other."],"a":1,"why":"With a plural subject, sich is usually reciprocal."}]},{"id":"trennuntrenn","level":"B1","seq":52,"title":"Trennbare und untrennbare Verben","en":"Which prefixes split off, and which never do","rule":"Always separable: ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, weg-, los-, her-, hin-. Never separable: be-, ge-, er-, ver-, zer-, ent-, emp-, miss-. A few go both ways with different meanings: über-, um-, unter-, durch-, wieder-. Separable prefixes are stressed; inseparable ones are not.","tables":[{"title":"Die drei Gruppen","head":["Gruppe","Vorsilben","Partizip II"],"rows":[["immer trennbar","ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, weg-, los-","angerufen, eingekauft"],["nie trennbar","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-","besucht, verstanden"],["beides möglich","über-, um-, unter-, durch-, wieder-","umgezogen / umarmt"]]},{"title":"Gleiche Vorsilbe, zwei Bedeutungen","head":["trennbar","untrennbar"],"rows":[["umziehen — to move house","umarmen — to hug"],["übersetzen (ans andere Ufer)","übersetzen — to translate"],["durchfallen — to fail","durchschauen — to see through"],["wiederkommen — to come back","wiederholen — to repeat"]]},{"title":"Test","rows":[["Betonung","trennbar: ANrufen. Untrennbar: besuCHEN."],["ge- im Partizip","nur trennbar: angerufen — nie: besucht"]]}],"items":[{"t":"gap","q":"Ich rufe dich später ___ . (anrufen)","a":["an"],"why":"an- is always separable."},{"t":"gap","q":"Wir ___ morgen unsere Eltern. (besuchen)","a":["besuchen"],"why":"be- never separates."},{"t":"gap","q":"Ich habe den Text ___ . (übersetzen, ins Deutsche)","a":["übersetzt","uebersetzt"],"why":"Translating is inseparable: übersetzt, no ge-."},{"t":"gap","q":"Wir ziehen im Sommer ___ . (umziehen)","a":["um"],"why":"Moving house is separable."},{"t":"gap","q":"Sie hat ihre Mutter ___ . (umarmen)","a":["umarmt"],"why":"umarmen is inseparable: umarmt, no ge-."},{"t":"gap","q":"Ich habe das nicht ___ . (verstehen)","a":["verstanden"],"why":"ver- never separates and takes no ge-."},{"t":"gap","q":"Können Sie das bitte ___ ? (wiederholen)","a":["wiederholen"],"why":"To repeat is inseparable."},{"t":"gap","q":"Wann kommst du ___ ? (wiederkommen)","a":["wieder"],"why":"To come back is separable."},{"t":"gap","q":"Er hat das Geschenk ___ . (mitbringen)","a":["mitgebracht"],"why":"Separable, so ge- goes in the middle."},{"t":"gap","q":"Der Termin wurde ___ . (verschieben)","a":["verschoben"],"why":"ver- is inseparable: verschoben."},{"t":"mc","q":"Which participle shows the verb is separable?","o":["besucht","angerufen","verstanden"],"a":1,"why":"Only separable verbs keep ge- inside: an-ge-rufen."},{"t":"mc","q":"Which prefix is NEVER separable?","o":["auf-","ent-","zurück-"],"a":1,"why":"ent- belongs to the inseparable group."},{"t":"mc","q":"How can you hear the difference?","o":["separable prefixes are stressed","inseparable prefixes are stressed"],"a":0,"why":"ANrufen versus besuCHEN."},{"t":"mc","q":"Which prefix can go both ways?","o":["ver-","um-","aus-"],"a":1,"why":"umziehen separates, umarmen does not."}]},{"id":"verbprep","level":"A2","title":"Verben mit Präpositionen","rule":"Many verbs take a fixed preposition and case: warten auf + acc, sich freuen auf + acc, denken an + acc, sprechen über + acc, helfen bei + dat, Angst haben vor + dat.","items":[{"t":"gap","q":"Ich warte ___ den Bus.","a":["auf"],"why":"warten auf + accusative."},{"t":"gap","q":"Ich freue mich ___ die Ferien.","a":["auf"],"why":"sich freuen auf + accusative, for something ahead."},{"t":"gap","q":"Ich denke oft ___ meine Familie.","a":["an"],"why":"denken an + accusative."},{"t":"gap","q":"Wir sprechen ___ das Projekt.","a":["über"],"why":"sprechen über + accusative."},{"t":"gap","q":"Kannst du mir ___ der Arbeit helfen?","a":["bei"],"why":"helfen bei + dative."},{"t":"gap","q":"Sie hat Angst ___ Hunden.","a":["vor"],"why":"Angst haben vor + dative."},{"t":"gap","q":"Ich interessiere mich ___ Technik.","a":["für"],"why"
