<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Hörbar</title>
<style>
:root{
  --paper:#E7EBEC;
  --card:#FFFFFF;
  --ink:#13202A;
  --soft:#66777F;
  --line:#CBD4D7;
  --amber:#C8830F;
  --amber-tint:#F6EBD6;
  --moss:#2C6A55;
  --moss-tint:#E0EBE6;
  --serif:"Iowan Old Style","Charter","Palatino Linotype",Palatino,Georgia,serif;
  --sans:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);
  display:flex;flex-direction:column;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;border:0;background:none;padding:13px 4px 11px;font-size:14px;color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
#gram{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.g #gram{display:flex}
body.g header,body.g main,body.g footer{display:none}

/* topic list */
.glist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#gex{flex:1;display:flex;flex-direction:column;min-height:0}
#gex[hidden],.glist[hidden]{display:none!important}
.lvl{font-family:var(--sans);font-size:12px;color:var(--soft);margin:18px 0 8px;letter-spacing:.4px}
.glist .lvl:first-child{margin-top:2px}
.topic{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:4px 14px 14px 4px;
  padding:13px 14px;margin-bottom:7px;cursor:pointer;display:flex;align-items:center;gap:10px}
.topic h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1}
.score{font-family:var(--sans);font-size:12px;color:var(--soft);white-space:nowrap}
.score.done{color:var(--moss)}

/* exercise view */
.gtop{display:flex;align-items:center;gap:10px;padding:12px 18px 8px;border-bottom:1px solid var(--line)}
.back{border:0;background:none;font-size:20px;color:var(--ink);cursor:pointer;padding:2px 6px 2px 0}
.gtop h2{font-family:var(--serif);font-size:17px;margin:0;flex:1;font-weight:600}
.gbody{flex:1;overflow-y:auto;padding:14px 18px 8px}
.rulebox{background:var(--amber-tint);border-radius:4px 14px 14px 4px;padding:13px 15px;margin-bottom:16px}
.rulebox p{margin:0;font-family:var(--serif);font-size:15px;line-height:1.5}
.tbl{margin-bottom:16px}
.tbl h4{font-family:var(--sans);font-size:12px;color:var(--soft);margin:0 0 6px;font-weight:600}
.tbl h4 em{display:block;font-style:normal;font-weight:400;font-size:11.5px;color:var(--soft);opacity:.85;margin-top:1px}
.gl{display:block;font-family:var(--sans);font-size:10.5px;font-weight:400;color:var(--soft);
  text-transform:none;letter-spacing:0;margin-top:2px;line-height:1.3;white-space:normal}
th .gl{opacity:.9}
.topic h3 em{display:block;font-style:normal;font-family:var(--sans);font-size:12px;
  color:var(--soft);font-weight:400;margin-top:3px;line-height:1.35}
.gtop h2 em{display:block;font-style:normal;font-family:var(--sans);font-size:11.5px;
  color:var(--soft);font-weight:400;margin-top:2px;line-height:1.3}
.enrule{font-family:var(--sans);font-size:12.5px;color:var(--soft);margin:-8px 0 14px;line-height:1.45}
table{width:100%;border-collapse:collapse;font-family:var(--serif);font-size:14.5px;background:var(--card);
  border-radius:10px;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
th{background:var(--paper);font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--soft);
  text-align:left;padding:7px 9px;white-space:nowrap}
td{padding:7px 9px;border-top:1px solid var(--line);vertical-align:top}
td:first-child{font-family:var(--sans);font-size:12.5px;color:var(--soft);white-space:nowrap}
.tbl.one td:first-child{width:34%}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.sheet{position:fixed;inset:0;background:rgba(19,32,42,.35);display:none;z-index:50}
.sheet.open{display:block}
.sheetin{position:absolute;left:0;right:0;bottom:0;top:8%;background:var(--paper);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheethd{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.sheethd h3{font-family:var(--serif);font-size:17px;margin:0;flex:1;font-weight:600}
.sheethd button{border:0;background:none;font-size:22px;color:var(--soft);cursor:pointer;padding:0 4px}
.sheetbd{flex:1;overflow-y:auto;padding:16px 18px calc(20px + env(safe-area-inset-bottom))}
.qnum{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:0 0 8px}
.qtext{font-family:var(--serif);font-size:20px;line-height:1.45;margin:0 0 16px}
input.ans{width:100%;font-family:var(--serif);font-size:19px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);-webkit-appearance:none}
input.ans:focus{outline:2px solid var(--amber);outline-offset:1px}
.opts2{display:flex;flex-direction:column;gap:8px}
.o{text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-family:var(--serif);font-size:17px;padding:12px 14px;border-radius:10px;cursor:pointer}
.o[aria-pressed="true"]{border-color:var(--ink);border-width:2px;padding:11px 13px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-family:var(--serif);font-size:15.5px;line-height:1.5}
.fb.ok{background:var(--moss-tint);color:var(--moss)}
.fb.no{background:var(--amber-tint);color:var(--ink)}
.fb b{display:block;font-family:var(--sans);font-size:12px;margin-bottom:4px;font-weight:600}
.gfoot{flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.gbtn{flex:1;border:0;background:var(--ink);color:var(--paper);font-size:15px;padding:14px;border-radius:12px;cursor:pointer}
.gbtn.sec{background:transparent;color:var(--soft);border:1px solid var(--line)}
.gbtn.hear{flex:0 0 54px;font-size:17px}
.result{text-align:center;padding:40px 20px}
.result .big{font-family:var(--serif);font-size:46px;font-weight:600;margin:0}
.result p{font-family:var(--serif);font-size:17px;color:var(--soft);margin:8px 0 0}

#speak{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.k #speak{display:flex}
body.k header,body.k main,body.k footer{display:none}
#klist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#kex{flex:1;display:flex;flex-direction:column;min-height:0}
#kex[hidden],#klist[hidden]{display:none!important}
.para{margin-bottom:15px}
.para .de{font-family:var(--serif);font-size:16.5px;line-height:1.6;margin:0}
.para .en{font-family:var(--sans);font-size:13px;color:var(--soft);line-height:1.5;margin:5px 0 0}
.mic{width:96px;height:96px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:30px;cursor:pointer;display:grid;place-items:center;margin:6px auto 0}
.mic.rec{background:var(--amber)}
.mictxt{text-align:center;font-family:var(--sans);font-size:12.5px;color:var(--soft);margin:10px 0 0}
.timer{text-align:center;font-family:var(--serif);font-size:38px;font-weight:600;margin:14px 0 0}
.trans{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font-family:var(--serif);font-size:15.5px;line-height:1.55;margin-top:16px;min-height:52px}
.trans em{font-style:normal;color:var(--soft)}
#ksay{width:100%;min-height:130px;font-family:var(--serif);font-size:16px;line-height:1.6;padding:13px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  -webkit-appearance:none;resize:vertical;margin-top:14px}
#ksay:focus{outline:2px solid var(--amber);outline-offset:1px}
.nosr{background:var(--amber-tint);border-radius:12px;padding:12px 14px;font-family:var(--sans);
  font-size:12.5px;color:var(--ink);line-height:1.55;margin-top:14px}
#write{flex:1 1 auto;display:none;flex-direction:column;min-height:0}
body.s #write{display:flex}
body.s header,body.s main,body.s footer{display:none}
#wlist{flex:1;overflow-y:auto;padding:14px 18px calc(20px + env(safe-area-inset-bottom))}
#wex{flex:1;display:flex;flex-direction:column;min-height:0}
#wex[hidden],#wlist[hidden]{display:none!important}
.wtopic{width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 14px 14px 4px;padding:13px 14px;margin-bottom:7px;cursor:pointer;display:flex;gap:10px;align-items:center}
.wtopic h3{font-family:var(--serif);font-size:17px;font-weight:600;margin:0;flex:1}
.wtopic h3 em{display:block;font-style:normal;font-family:var(--sans);font-size:12px;color:var(--soft);font-weight:400;margin-top:3px;line-height:1.35}
.seg{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 18px}
.seg button{flex:1;border:0;background:none;padding:11px 4px 9px;font-family:var(--sans);font-size:13.5px;
  color:var(--soft);cursor:pointer;border-bottom:2px solid transparent}
.seg button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:600}
.wbody{flex:1;overflow-y:auto;padding:14px 18px calc(16px + env(safe-area-inset-bottom))}
.taskbox{background:var(--amber-tint);border-radius:4px 14px 14px 4px;padding:13px 15px;margin-bottom:14px}
.taskbox p{margin:0;font-family:var(--serif);font-size:15.5px;line-height:1.55;white-space:pre-wrap}
.taskbox .ten{font-family:var(--sans);font-size:12.5px;color:var(--soft);margin-top:9px;line-height:1.45}
.chk{display:flex;gap:9px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line)}
.chk .mk{flex:0 0 20px;font-family:var(--sans);font-size:14px;line-height:1.4;color:var(--line)}
.chk.yes .mk{color:var(--moss)} .chk.no .mk{color:var(--amber)}
.chk .cn{font-family:var(--serif);font-size:15px;line-height:1.4}
.chk .ce{display:block;font-family:var(--sans);font-size:11.5px;color:var(--soft);margin-top:2px}
.mail{background:var(--card);border:1px solid var(--line);border-radius:4px 14px 14px 4px;padding:15px 16px;
  font-family:var(--serif);font-size:16px;line-height:1.65;white-space:pre-wrap}
.ph{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border-radius:10px;
  overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.ph td{padding:8px 10px;border-top:1px solid var(--line);font-family:var(--serif);vertical-align:top}
.ph tr:first-child td{border-top:0}
.ph td.e{color:var(--soft);font-size:13px;width:44%}
.fld{display:block;margin-bottom:10px}
.fl{display:block;font-family:var(--sans);font-size:12px;color:var(--soft);margin-bottom:4px;font-weight:600}
.fl em{font-style:normal;font-weight:400;opacity:.8}
.fi{width:100%;font-family:var(--serif);font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);-webkit-appearance:none}
.fi:focus{outline:2px solid var(--amber);outline-offset:1px}
.fi.bad{border-color:var(--amber);border-width:2px;padding:9px 11px}
#wdraft{width:100%;min-height:230px;font-family:var(--serif);font-size:16px;line-height:1.6;padding:13px;
  border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);
  -webkit-appearance:none;resize:vertical}
#wdraft:focus{outline:2px solid var(--amber);outline-offset:1px}
.wcount{font-family:var(--sans);font-size:12px;color:var(--soft);margin:8px 0 0;text-align:right}
.wcount.good{color:var(--moss)}
.tipbox{font-family:var(--sans);font-size:13px;color:var(--soft);line-height:1.55;margin-top:16px;
  padding-top:13px;border-top:1px solid var(--line)}
.wfoot{flex:0 0 auto;padding:12px 18px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}

/* ---------- header ---------- */
header{padding:14px 18px 10px;flex:0 0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.brand h1{font-family:var(--serif);font-size:22px;font-weight:600;margin:0;letter-spacing:.2px;flex:1}
.searchbtn{border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;
  padding:5px 13px;font-family:var(--sans);font-size:12.5px;cursor:pointer}
#wq{width:100%;font-family:var(--serif);font-size:18px;padding:11px 13px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);color:var(--ink);-webkit-appearance:none}
#wq:focus{outline:2px solid var(--amber);outline-offset:1px}
.rescount{font-family:var(--sans);font-size:11.5px;color:var(--soft);margin:12px 0 8px}
.res{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);
  border-radius:4px 12px 12px 4px;padding:11px 13px;margin-bottom:6px;cursor:pointer}
.res .rw{display:block;font-family:var(--serif);font-size:17px;font-weight:600;line-height:1.3}
.res .rg{display:block;font-family:var(--serif);font-size:14.5px;font-style:italic;color:var(--soft);margin-top:2px}
.res .rs{display:block;font-family:var(--sans);font-size:11px;color:var(--soft);margin-top:5px;opacity:.85}
.res mark{background:var(--amber-tint);color:inherit;border-radius:2px;padding:0 1px}
.brand span{font-size:12.5px;color:var(--soft)}
.sets{display:flex;gap:7px;overflow-x:auto;margin-top:11px;padding-bottom:3px;scrollbar-width:none}
.sets::-webkit-scrollbar{display:none}
.set{
  flex:0 0 auto;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-family:var(--sans);font-size:13px;padding:6px 12px;border-radius:999px;cursor:pointer;
}
.set[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ticks{display:flex;gap:2px;margin-top:12px;height:4px}
.tick{flex:1;background:var(--line);border-radius:1px;transition:background .2s}
.tick.seen{background:var(--soft)}
.tick.known{background:var(--moss)}
.tick.here{background:var(--amber)}

/* ---------- card ---------- */
main{flex:1 1 auto;display:flex;padding:6px 18px 0;min-height:0}
.card{
  flex:1;background:var(--card);border-radius:4px 20px 20px 4px;
  display:flex;overflow:hidden;box-shadow:0 1px 0 var(--line);
}
.meter{flex:0 0 34px;display:flex;align-items:center;justify-content:center;gap:3px;background:var(--paper)}
.meter i{display:block;width:3px;height:8px;background:var(--line);border-radius:2px;transition:height .12s ease,background .12s}
body.speaking .meter i{background:var(--amber)}
body.speaking .meter i:nth-child(1){animation:amp .7s -.0s infinite ease-in-out}
body.speaking .meter i:nth-child(2){animation:amp .7s -.15s infinite ease-in-out}
body.speaking .meter i:nth-child(3){animation:amp .7s -.3s infinite ease-in-out}
body.speaking .meter i:nth-child(4){animation:amp .7s -.45s infinite ease-in-out}
@keyframes amp{0%,100%{height:7px}50%{height:26px}}

.body{flex:1;display:flex;flex-direction:column;justify-content:center;padding:20px 20px 22px;min-width:0}
.word{font-family:var(--serif);font-size:clamp(30px,9vw,44px);line-height:1.1;font-weight:600;margin:0;word-break:break-word}
.word.phrase{font-size:clamp(20px,5.4vw,27px);line-height:1.28;font-weight:600}
.reply{display:none;font-family:var(--sans);font-size:11px;color:var(--soft);margin:0 0 6px}
.card.phrase .reply{display:block}
.set.ph{border-style:dashed}
.gloss{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--soft);margin:8px 0 0;min-height:24px}
.gloss.hidden{color:transparent;background:var(--paper);border-radius:3px;display:inline-block;padding:0 6px}
.rule{height:1px;background:var(--line);margin:20px 0 16px}
.de{font-family:var(--serif);font-size:19px;line-height:1.42;margin:0}
.en{font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--soft);margin:7px 0 0}
.en.hidden{color:transparent;background:var(--paper);border-radius:3px}
.reveal{
  margin-top:16px;align-self:flex-start;border:0;background:none;padding:4px 0;
  font-family:var(--sans);font-size:13px;color:var(--amber);cursor:pointer;text-decoration:underline;
}

/* ---------- controls ---------- */
footer{flex:0 0 auto;padding:14px 18px calc(14px + env(safe-area-inset-bottom))}
.row{display:flex;align-items:center;justify-content:center;gap:14px}
button{font-family:var(--sans)}
.step{
  width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font-size:19px;cursor:pointer;display:grid;place-items:center;
}
.play{
  width:88px;height:88px;border-radius:50%;border:0;background:var(--ink);color:var(--paper);
  font-size:15px;letter-spacing:.3px;cursor:pointer;display:grid;place-items:center;
}
body.speaking .play{background:var(--amber)}
.play b{font-size:26px;line-height:1;display:block}
.opts{display:flex;gap:8px;margin-top:16px}
.opt{
  flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);
  font-size:13px;padding:10px 4px;border-radius:10px;cursor:pointer;
}
.opt[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.marks{display:flex;gap:8px;margin-top:8px}
.mark{flex:1;border:1px solid var(--line);background:transparent;color:var(--soft);font-size:13px;padding:11px 4px;border-radius:10px;cursor:pointer}
.mark.known[aria-pressed="true"]{background:var(--moss-tint);border-color:var(--moss);color:var(--moss)}
.mark.again[aria-pressed="true"]{background:var(--amber-tint);border-color:var(--amber);color:var(--amber)}
.note{margin:12px 0 0;font-size:11.5px;color:var(--soft);text-align:center;line-height:1.5}

button:focus-visible,.set:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:640px){
  body{max-width:560px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
}
</style>
</head>
<body>

<div class="sheet" id="wsheet"><div class="sheetin">
  <div class="sheethd"><h3>Wort suchen</h3><button id="wx" aria-label="Close">×</button></div>
  <div class="sheetbd">
    <input id="wq" type="search" autocapitalize="none" autocorrect="off" spellcheck="false"
           placeholder="Deutsch oder Englisch eingeben">
    <div id="wres"></div>
  </div>
</div></div>

<div class="sheet" id="sheet"><div class="sheetin">
  <div class="sheethd"><h3 id="sheettitle">Formen</h3><button id="sheetx" aria-label="Close">×</button></div>
  <div class="sheetbd" id="sheetbd"></div>
</div></div>

<div class="tabs">
  <button class="tab" id="tabW" aria-selected="true">Wörter</button>
  <button class="tab" id="tabG" aria-selected="false">Grammatik</button>
  <button class="tab" id="tabS" aria-selected="false">Schreiben</button>
  <button class="tab" id="tabK" aria-selected="false">Sprechen</button>
</div>

<section id="speak">
  <div id="klist"></div>
  <div id="kex" hidden>
    <div class="gtop"><button class="back" id="kback" aria-label="Back">‹</button><h2 id="ktitle"></h2></div>
    <div class="seg">
      <button id="ksegA" aria-selected="true">Frage</button>
      <button id="ksegT" aria-selected="false">Text</button>
      <button id="ksegS" aria-selected="false">Sprechen</button>
    </div>
    <div class="wbody" id="kbody"></div>
    <div class="wfoot" id="kfoot"></div>
  </div>
</section>

<section id="write">
  <div id="wlist"></div>
  <div id="wex" hidden>
    <div class="gtop"><button class="back" id="wback" aria-label="Back">‹</button><h2 id="wtitle"></h2></div>
    <div class="seg">
      <button id="segA" aria-selected="true">Aufgabe</button>
      <button id="segM" aria-selected="false">Muster</button>
      <button id="segP" aria-selected="false">Üben</button>

rn. (fahren)","a":["fährt"],"why":"a becomes ä in er/sie/es."},{"t":"gap","q":"Du ___ schon sehr gut Deutsch. (sprechen)","a":["sprichst"],"why":"e becomes i in du."},{"t":"gap","q":"Sie ___ jeden Abend ein Buch. (lesen)","a":["liest"],"why":"e becomes ie: sie liest."},{"t":"gap","q":"Er ___ jeden Morgen einen Apfel. (essen)","a":["isst"],"why":"e becomes i: er isst."},{"t":"gap","q":"Du ___ den nächsten Bus. (nehmen)","a":["nimmst"],"why":"nehmen becomes du nimmst."},{"t":"gap","q":"Das Kind ___ noch. (schlafen)","a":["schläft"],"why":"a becomes ä."},{"t":"gap","q":"Sie ___ mir das Buch. (geben)","a":["gibt"],"why":"e becomes i: sie gibt."},{"t":"gap","q":"Du ___ heute müde aus. (aussehen)","a":["siehst"],"why":"e becomes ie, and aus goes to the end."},{"t":"mc","q":"Wir ___ am Wochenende in die Berge.","o":["fährt","fahren","fährst"],"a":1,"why":"wir never changes the vowel: wir fahren."},{"t":"gap","q":"Er ___ mir immer bei den Hausaufgaben. (helfen)","a":["hilft"],"why":"e→i: er hilft."},{"t":"gap","q":"Du ___ zu schnell. (laufen)","a":["läufst","laeufst"],"why":"au→äu: du läufst."},{"t":"gap","q":"Sie ___ ihre Tasche zu Hause. (vergessen)","a":["vergisst"],"why":"e→i: sie vergisst."},{"t":"gap","q":"Er ___ einen schweren Koffer. (tragen)","a":["trägt","traegt"],"why":"a→ä: er trägt."},{"t":"gap","q":"Wir ___ uns um sieben. (treffen)","a":["treffen"],"why":"wir keeps the original vowel."},{"t":"gap","q":"Das Kleid ___ mir gut. (gefallen)","a":["gefällt","gefaellt"],"why":"a→ä: es gefällt."},{"t":"gap","q":"Du ___ das Buch. (nehmen)","a":["nimmst"],"why":"nehmen becomes du nimmst."},{"t":"gap","q":"Ihr ___ zu wenig. (essen)","a":["esst"],"why":"ihr keeps the e: ihr esst."},{"t":"mc","q":"Which form has NO vowel change?","o":["du sprichst","wir sprechen","er spricht"],"a":1,"why":"Only du and er/sie/es change."},{"t":"gap","q":"Er ___ um zehn ins Bett. (gehen)","a":["geht"],"why":"gehen has no vowel change: er geht."}],"tables":[{"title":"Vokalwechsel nur bei du und er/sie/es","head":["","fahren a→ä","sprechen e→i","lesen e→ie","nehmen"],"rows":[["ich","fahre","spreche","lese","nehme"],["du","fährst","sprichst","liest","nimmst"],["er/sie/es","fährt","spricht","liest","nimmt"],["wir","fahren","sprechen","lesen","nehmen"],["ihr","fahrt","sprecht","lest","nehmt"],["sie/Sie","fahren","sprechen","lesen","nehmen"]]},{"title":"Weitere Verben","rows":[["a→ä","schlafen, tragen, laufen, halten, gefallen"],["e→i","essen, geben, helfen, treffen, vergessen"],["e→ie","sehen, empfehlen, stehlen"]]}],"en":"Stem-changing verbs — the vowel shifts for du and er/sie/es","seq":4},{"id":"modal","level":"A1","title":"Modalverben","rule":"können, müssen, wollen, dürfen, sollen, mögen. The modal is in position 2 and the main verb goes to the very end as an infinitive.","items":[{"t":"gap","q":"Ich ___ gut kochen. (können)","a":["kann"],"why":"ich kann — no ending in ich and er/sie/es."},{"t":"gap","q":"Du ___ jetzt wirklich gehen. (müssen)","a":["musst"],"why":"du musst."},{"t":"gap","q":"Er ___ heute nicht arbeiten. (wollen)","a":["will"],"why":"er will."},{"t":"gap","q":"Wir ___ hier nicht parken. (dürfen)","a":["dürfen"],"why":"wir dürfen."},{"t":"gap","q":"___ ich Ihnen helfen? (können)","a":["kann"],"why":"Kann ich — the modal starts the question."},{"t":"gap","q":"Du ___ mehr Wasser trinken. (sollen)","a":["sollst"],"why":"du sollst."},{"t":"gap","q":"Ich ___ keinen Kaffee. (mögen)","a":["mag"],"why":"ich mag."},{"t":"gap","q":"Wir können am Samstag ___ . (kommen)","a":["kommen"],"why":"After a modal the second verb stays in the infinitive, at the end."},{"t":"mc","q":"Which sentence is correct?","o":["Ich muss heute gehen früher.","Ich muss heute früher gehen.","Ich gehen muss heute früher."],"a":1,"why":"The infinitive goes right at the end of the sentence."},{"t":"gap","q":"Ihr ___ hier nicht rauchen. (dürfen)","a":["dürft","duerft"],"why":"ihr dürft."},{"t":"gap","q":"Wir ___ heute länger bleiben. (können)","a":["können","koennen"],"why":"wir können."},{"t":"gap","q":"Sie ___ das Formular ausfüllen. (müssen, Sie)","a":["müssen","muessen"],"why":"Polite Sie müssen."},{"t":"gap","q":"Ich ___ gern einen Tee. (möchten)","a":["möchte","moechte"],"why":"ich möchte — polite way to order."},{"t":"gap","q":"Du ___ das nicht machen. (sollen)","a":["sollst"],"why":"du sollst."},{"t":"gap","q":"Er ___ keine Zwiebeln. (mögen)","a":["mag"],"why":"er mag — no ending."},{"t":"gap","q":"Wir ___ morgen früh aufstehen. (müssen)","a":["müssen","muessen"],"why":"wir müssen, with aufstehen at the end."},{"t":"mc","q":"Which is correct?","o":["Ich kann Deutsch sprechen.","Ich kann sprechen Deutsch.","Ich kann Deutsch spreche."],"a":0,"why":"The infinitive goes right at the end."},{"t":"mc","q":"Ich ___ nicht schwimmen — ich habe es nie gelernt.","o":["darf","kann","muss"],"a":1,"why":"können = ability. dürfen = permission, müssen = obligation."},{"t":"mc","q":"Hier ___ man nicht parken — es ist verboten.","o":["kann","darf","mag"],"a":1,"why":"dürfen is about permission, so a ban uses nicht dürfen."}],"tables":[{"title":"Modalverben 1","head":["","können","müssen","wollen"],"rows":[["ich","kann","muss","will"],["du","kannst","musst","willst"],["er/sie/es","kann","muss","will"],["wir","können","müssen","wollen"],["ihr","könnt","müsst","wollt"],["sie/Sie","können","müssen","wollen"]]},{"title":"Modalverben 2","head":["","dürfen","sollen","mögen","möchten"],"rows":[["ich","darf","soll","mag","möchte"],["du","darfst","sollst","magst","möchtest"],["er/sie/es","darf","soll","mag","möchte"],["wir","dürfen","sollen","mögen","möchten"],["ihr","dürft","sollt","mögt","möchtet"],["sie/Sie","dürfen","sollen","mögen","möchten"]]},{"title":"Merke","rows":[["ich und er/sie/es","keine Endung, gleiche Form"],["Satzbau","Modalverb Position 2, Infinitiv am Ende"]]}],"en":"Modal verbs — can, must, want, may, should, like","seq":5},{"id":"modalgeb","level":"A1","seq":6,"title":"Modalverben: Gebrauch","en":"What each modal actually means — permission, ability, obligation","rule":"können = ability. dürfen = permission. müssen = necessity. sollen = someone else's instruction. wollen = your own intention. möchten = a polite wish. Watch the negatives: nicht müssen means 'you don't have to', but nicht dürfen means 'you must not'.","tables":[{"title":"Bedeutung","head":["Verb","Bedeutung","Beispiel"],"rows":[["können","ability, possibility","Ich kann schwimmen."],["dürfen","permission","Darf ich hier rauchen?"],["müssen","necessity","Ich muss arbeiten."],["sollen","someone else says so","Der Arzt sagt, ich soll mehr schlafen."],["wollen","your own intention","Ich will Ärztin werden."],["möchten","polite wish","Ich möchte einen Kaffee."],["mögen","liking, no infinitive","Ich mag Tee."]]},{"title":"Verneinung","rows":[["nicht müssen","not necessary — Du musst nicht kommen."],["nicht dürfen","forbidden — Du darfst nicht rauchen."],["nicht können","not able — Ich kann nicht kommen."]]}],"items":[{"t":"mc","q":"Ich ___ schwimmen. Ich habe es als Kind gelernt.","o":["kann","darf","muss"],"a":0,"why":"Ability learned = können."},{"t":"mc","q":"___ ich Ihr Telefon benutzen?","o":["Muss","Darf","Will"],"a":1,"why":"Asking permission = dürfen."},{"t":"mc","q":"Du ___ hier nicht rauchen, das ist verboten.","o":["musst","darfst","kannst"],"a":1,"why":"A ban is nicht dürfen."},{"t":"mc","q":"Du ___ nicht kommen, wenn du müde bist.","o":["darfst","musst","sollst"],"a":1,"why":"nicht müssen = you don't have to."},{"t":"mc","q":"What does 'Du musst nicht kommen' mean?","o":["You are not allowed to come.","You don't have to come."],"a":1,"why":"nicht müssen removes the obligation, it does not forbid."},{"t":"mc","q":"What does 'Du darfst nicht kommen' mean?","o":["You don't have to come.","You are not allowed to come."],"a":1,"why":"nicht dürfen is a prohibition."},{"t":"gap","q":"Der Arzt sagt, ich ___ mehr Wasser trinken. (sollen)","a":["soll"],"why":"An instruction from someone else = sollen."},{"t":"gap","q":"Ich ___ bitte einen Kaffee. (höflicher Wunsch)","a":["möchte","moechte"],"why":"möchte is the polite wish form."},{"t":"gap","q":"Ich ___ Schokolade sehr gern. (mögen)","a":["mag"],"why":"mögen stands alone with a noun, no infinitive."},{"t":"gap","q":"Wir ___ morgen früh aufstehen, der Zug fährt um sechs. (müssen)","a":["müssen","muessen"],"why":"Real necessity = müssen."},{"t":"gap","q":"___ du mir kurz helfen? (Bitte)","a":["kannst"],"why":"Kannst du ...? is the everyday way to ask for help."},{"t":"gap","q":"Hier ___ man nicht parken. (Verbot)","a":["darf"],"why":"A ban uses darf nicht."},{"t":"gap","q":"Ich ___ Ingenieurin werden. (eigener Plan)","a":["will","möchte","moechte"],"why":"Your own firm intention = wollen."},{"t":"gap","q":"___ ich Ihnen helfen? (Angebot)","a":["kann","darf"],"why":"Kann ich Ihnen helfen? is the standard offer."}]},{"id":"trenn","level":"A1","title":"Trennbare Verben","rule":"aufstehen, anrufen, einkaufen and similar verbs split in a main clause: the prefix jumps to the end. After a modal they stay whole.","items":[{"t":"gap","q":"Ich stehe jeden Tag um sechs ___ . (aufstehen)","a":["auf"],"why":"The prefix auf goes to the end."},{"t":"gap","q":"Wann fährt der Zug ___ ? (abfahren)","a":["ab"],"why":"ab goes to the end, even in a question."},{"t":"gap","q":"Ruf mich bitte heute Abend ___ ! (anrufen)","a":["an"],"why":"an goes to the end in the imperative too."},{"t":"gap","q":"Ich kaufe am Samstag ___ . (einkaufen)","a":["ein"],"why":"ein goes to the end."},{"t":"gap","q":"Machst du bitte das Fenster ___ ? (zumachen)","a":["zu"],"why":"zu goes to the end."},{"t":"gap","q":"Wir fahren morgen um acht ___ . (losfahren)","a":["los"],"why":"los goes to the end."},{"t":"gap","q":"Ich hole die Kinder um vier ___ . (abholen)","a":["ab"],"why":"ab goes to the end."},{"t":"mc","q":"Ich muss die Kinder ___ .","o":["abhole","abholen","hole ab"],"a":1,"why":"After a modal the verb stays whole in the infinitive: abholen."},{"t":"mc","q":"Which is correct?","o":["Ich einkaufe am Samstag.","Ich kaufe am Samstag ein.","Ich kaufe ein am Samstag."],"a":1,"why":"The prefix goes right to the end of the clause."},{"t":"gap","q":"Der Film fängt um acht ___ . (anfangen)","a":["an"],"why":"an goes to the end."},{"t":"gap","q":"Wir steigen an der Hauptstrasse ___ . (aussteigen)","a":["aus"],"why":"aus goes to the end."},{"t":"gap","q":"Ich ziehe mich schnell ___ . (umziehen)","a":["um"],"why":"um goes to the end."},{"t":"gap","q":"Bring bitte Brot ___ ! (mitbringen)","a":["mit"],"why":"mit goes to the end in the imperative."},{"t":"gap","q":"Wann kommst du ___ ? (zurückkommen)","a":["zurück","zurueck"],"why":"zurück goes to the end."},{"t":"gap","q":"Ich habe die Kinder ___ . (abholen, Perfekt)","a":["abgeholt"],"why":"Perfect of a separable verb: ab + ge + holt."},{"t":"gap","q":"Ich rufe dich an, wenn ich ___ . (ankommen, Nebensatz)","a":["ankomme"],"why":"In a subordinate clause the verb stays whole at the end."},{"t":"mc","q":"Which verb is NOT separable?","o":["anrufen","besuchen","einkaufen"],"a":1,"why":"be- is an inseparable prefix."},{"t":"mc","q":"Weil ich früh ___ , gehe ich jetzt ins Bett.","o":["stehe auf","aufstehe","aufstehen"],"a":1,"why":"In a subordinate clause the verb stays together at the end."},{"t":"gap","q":"Wir fangen morgen mit dem Kurs ___ . (anfangen)","a":["an"],"why":"an at the end, after everything else."}],"tables":[{"title":"anrufen in jedem Satztyp","rows":[["Aussage","Ich rufe dich an."],["Frage","Rufst du mich an?"],["Imperativ","Ruf mich an!"],["mit Modalverb","Ich will dich anrufen."],["Nebensatz","..., weil ich dich anrufe."],["Perfekt","Ich habe dich angerufen."],["mit zu","Ich habe vergessen, dich anzurufen."]]},{"title":"Häufige trennbare Vorsilben","rows":[["","ab-, an-, auf-, aus-, ein-, mit-, nach-, vor-, zu-, zurück-, weg-, los-, hin-, her-"]]},{"title":"Nicht trennbar","rows":[["","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"]]}],"en":"Separable verbs — the prefix breaks off and goes to the end","seq":7},{"id":"imp","level":"A1","title":"Imperativ","rule":"du: verb stem, no ending (Geh!). ihr: like the present tense (Geht!). Sie: verb + Sie (Gehen Sie!). Vowel-change verbs keep e→i in du: Nimm!","items":[{"t":"gap","q":"___ bitte nach Hause! (gehen, du)","a":["geh","gehe"],"why":"du form: just the stem, geh."},{"t":"gap","q":"___ bitte herein! (kommen, ihr)","a":["kommt"],"why":"ihr form is the same as the present tense."},{"t":"gap","q":"___ Sie bitte einen Moment! (warten, Sie)","a":["warten"],"why":"Sie form: infinitive + Sie."},{"t":"gap","q":"___ bitte leise! (sein, du)","a":["sei"],"why":"sein is irregular: Sei!"},{"t":"gap","q":"___ den nächsten Bus! (nehmen, du)","a":["nimm"],"why":"e→i change stays in the imperative: Nimm!"},{"t":"gap","q":"___ bitte das Fenster zu! (zumachen, du)","a":["mach"],"why":"Mach ... zu — the prefix still goes to the end."},{"t":"gap","q":"___ Sie mir bitte! (helfen, Sie)","a":["helfen"],"why":"Sie form: Helfen Sie."},{"t":"gap","q":"___ bitte etwas langsamer! (fahren, du)","a":["fahr","fahre"],"why":"a→ä does NOT happen in the du imperative: Fahr!"},{"t":"mc","q":"Polite request to one stranger:","o":["Warte bitte!","Wartet bitte!","Warten Sie bitte!"],"a":2,"why":"With a stranger use the Sie form."},{"t":"gap","q":"___ mir bitte! (helfen, du)","a":["hilf"],"why":"e→i stays: Hilf!"},{"t":"gap","q":"___ bitte langsamer! (sprechen, Sie)","a":["sprechen"],"why":"Sie form: Sprechen Sie."},{"t":"gap","q":"___ nicht so laut! (sein, ihr)","a":["seid"],"why":"ihr form of sein: Seid!"},{"t":"gap","q":"___ bitte Geduld! (haben, du)","a":["hab","habe"],"why":"du form of haben: Hab!"},{"t":"gap","q":"___ das Fenster bitte auf! (aufmachen, Sie)","a":["machen"],"why":"Machen Sie ... auf."},{"t":"gap","q":"___ mir das Buch! (geben, du)","a":["gib"],"why":"e→i: Gib!"},{"t":"gap","q":"___ euch bitte hin! (setzen, ihr)","a":["setzt"],"why":"ihr form: Setzt euch."},{"t":"mc","q":"Talking to your child:","o":["Essen Sie bitte!","Iss bitte!","Esst bitte!"],"a":1,"why":"One child, informal: the du imperative Iss!"},{"t":"mc","q":"Which du imperative is correct?","o":["Fähr langsamer!","Fahr langsamer!","Fahrst langsamer!"],"a":1,"why":"a→ä does not happen in the imperative."},{"t":"gap","q":"___ Sie bitte hier! (warten, Sie)","a":["warten"],"why":"Warten Sie."}],"tables":[{"title":"Imperativformen","head":["","gehen","nehmen","fahren","sein","haben"],"rows":[["du","Geh!","Nimm!","Fahr!","Sei!","Hab!"],["ihr","Geht!","Nehmt!","Fahrt!","Seid!","Habt!"],["Sie","Gehen Sie!","Nehmen Sie!","Fahren Sie!","Seien Sie!","Haben Sie!"]]},{"title":"Merke","rows":[["e→i bleibt","nehmen → Nimm!, geben → Gib!"],["a→ä fällt weg","fahren → Fahr! (nicht Fähr!)"],["bitte","macht jeden Imperativ höflicher"]]}],"en":"Imperative — telling or asking someone to do something","seq":8},{"id":"fragen","level":"A1","title":"Fragen","rule":"W-questions start with the question word: Wie heisst du? Yes/no questions start with the verb: Hast du Zeit?","items":[{"t":"gap","q":"___ heisst du?","a":["wie"],"why":"wie = how, used for names too."},{"t":"gap","q":"___ kommst du? – Aus Indien.","a":["woher"],"why":"woher asks where from."},{"t":"gap","q":"___ wohnst du? – In Adliswil.","a":["wo"],"why":"wo asks where."},{"t":"gap","q":"___ kostet das Buch? – Zwanzig Franken.","a":["was","wie viel"],"why":"Was kostet ...? is the normal way to ask a price."},{"t":"gap","q":"___ hast du Geburtstag? – Im Mai.","a":["wann"],"why":"wann asks when."},{"t":"gap","q":"___ ist das? – Das ist mein Bruder.","a":["wer"],"why":"wer asks which person."},{"t":"gap","q":"___ kommst du nicht mit?","a":["warum","wieso","weshalb"],"why":"warum asks for a reason."},{"t":"gap","q":"___ du morgen Zeit? (haben)","a":["hast"],"why":"Yes/no question: the verb comes first."},{"t":"mc","q":"Which is a correct yes/no question?","o":["Du hast Zeit?","Hast du Zeit?","Zeit hast du?"],"a":1,"why":"Yes/no questions put the verb in first position."},{"t":"gap","q":"___ siehst du? – Meinen Bruder.","a":["wen"],"why":"Person as object: wen."},{"t":"gap","q":"___ hilfst du? – Meiner Schwester.","a":["wem"],"why":"helfen takes the dative, so wem."},{"t":"gap","q":"___ gehst du? – Ins Kino.","a":["wohin"],"why":"Direction: wohin."},{"t":"gap","q":"___ lange dauert der Kurs?","a":["wie"],"why":"wie lange asks about duration."},{"t":"gap","q":"___ Bus fährt zum Bahnhof?","a":["welcher"],"why":"welcher asks you to choose."},{"t":"gap","q":"___ oft gehst du schwimmen?","a":["wie"],"why":"wie oft asks about frequency."},{"t":"gap","q":"___ du morgen frei? (sein)","a":["bist"],"why":"Yes/no question: verb first."},{"t":"gap","q":"___ ihr schon gegessen? (haben)","a":["habt"],"why":"Yes/no question in the perfect: Habt ihr ...?"},{"t":"mc","q":"___ wartest du? – Auf den Bus.","o":["Worauf","Wofür","Womit"],"a":0,"why":"warten auf → Worauf for a thing."},{"t":"mc","q":"Which asks about origin?","o":["Wo","Wohin","Woher"],"a":2,"why":"woher = where from."}],"tables":[{"title":"Fragewörter","head":["Wort","Frage nach","Beispiel"],"rows":[["wer","Person (Nom.)","Wer kommt?"],["wen","Person (Akk.)","Wen siehst du?"],["wem","Person (Dat.)","Wem hilfst du?"],["was","Sache","Was kostet das?"],["wo","Ort","Wo wohnst du?"],["wohin","Richtung","Wohin gehst du?"],["woher","Herkunft","Woher kommst du?"],["wann","Zeit","Wann kommst du?"],["wie","Art","Wie geht es dir?"],["warum","Grund","Warum nicht?"],["welcher","Auswahl","Welcher Bus?"],["wie viel","Menge","Wie viel kostet das?"],["wie lange","Dauer","Wie lange dauert es?"],["wie oft","Häufigkeit","Wie oft gehst du?"]]}],"en":"Questions — question words and yes/no questions","seq":9},{"id":"wortst","level":"A1","title":"Wörter im Satz","rule":"In a statement the conjugated verb is always in position 2. Whatever you put first, the verb still comes second and the subject moves after it.","items":[{"t":"gap","q":"Heute ___ ich nach Bern. (fahren)","a":["fahre"],"why":"Heute is position 1, so the verb comes second and ich follows."},{"t":"gap","q":"Morgen ___ wir früher an. (anfangen)","a":["fangen"],"why":"fangen in position 2, an at the end."},{"t":"gap","q":"Ich ___ heute leider keine Zeit. (haben)","a":["habe"],"why":"Subject first, verb second."},{"t":"gap","q":"Um acht ___ der Kurs. (beginnen)","a":["beginnt"],"why":"Time first, verb second, subject third."},{"t":"gap","q":"Leider ___ ich nicht kommen. (können)","a":["kann"],"why":"The modal takes position 2."},{"t":"gap","q":"Am Wochenende ___ wir immer aus. (schlafen)","a":["schlafen"],"why":"Verb second, prefix aus at the end."},{"t":"mc","q":"Which is correct?","o":["Am Montag ich gehe zur Arbeit.","Am Montag gehe ich zur Arbeit.","Ich am Montag gehe zur Arbeit."],"a":1,"why":"The verb must stay in position 2."},{"t":"mc","q":"Which is correct?","o":["Ich fahre morgen mit dem Zug nach Bern.","Ich morgen fahre mit dem Zug nach Bern.","Morgen ich fahre mit dem Zug nach Bern."],"a":0,"why":"Verb second; time, then manner, then place."},{"t":"mc","q":"Normal order of the middle field:","o":["place, manner, time","time, manner, place","manner, time, place"],"a":1,"why":"Time – manner – place: heute mit dem Bus nach Zürich."},{"t":"gap","q":"Gestern ___ ich sehr müde. (sein)","a":["war"],"why":"Time first, verb second."},{"t":"gap","q":"Nach der Arbeit ___ ich immer einkaufen. (gehen)","a":["gehe"],"why":"Long phrase in position 1, verb still second."},{"t":"gap","q":"Deshalb ___ wir zu Hause geblieben. (sein)","a":["sind"],"why":"deshalb takes position 1."},{"t":"gap","q":"Am Samstag ___ meine Eltern. (kommen)","a":["kommen"],"why":"Verb second, subject after it."},{"t":"gap","q":"Morgen ___ ich nicht arbeiten. (müssen)","a":["muss"],"why":"The modal takes position 2."},{"t":"mc","q":"Which is correct?","o":["Ich gehe heute mit dem Bus zur Arbeit.","Ich gehe mit dem Bus heute zur Arbeit."],"a":0,"why":"Time before manner before place."},{"t":"mc","q":"Which is correct?","o":["Ich habe gestern ein Buch gekauft.","Ich habe gekauft gestern ein Buch."],"a":0,"why":"The participle goes right at the end."},{"t":"mc","q":"Which is correct?","o":["Weil es regnet, ich bleibe zu Hause.","Weil es regnet, bleibe ich zu Hause."],"a":1,"why":"The whole subordinate clause is position 1, so the verb follows immediately."},{"t":"gap","q":"Dann ___ wir nach Hause. (fahren)","a":["fahren"],"why":"dann is position 1, verb second."},{"t":"gap","q":"Leider ___ ich das nicht gewusst. (haben)","a":["habe"],"why":"Leider in position 1, habe second, gewusst at the end."}],"tables":[{"title":"Verb immer auf Position 2","head":["Position 1","Position 2","Mittelfeld","Ende"],"rows":[["Ich","fahre","morgen nach Bern",""],["Morgen","fahre","ich nach Bern",""],["Ich","muss","morgen nach Bern","fahren"],["Ich","kaufe","am Samstag","ein"],["Gestern","bin","ich zu Hause","geblieben"]]},{"title":"Mittelfeld: Te-Ka-Mo-Lo","rows":[["Temporal","wann? — heute"],["Kausal","warum? — wegen des Regens"],["Modal","wie? — mit dem Bus"],["Lokal","wo/wohin? — nach Zürich"]]}],"en":"Word order — where the verb goes in a sentence","seq":11},{"id":"plural","level":"A1","title":"Nomen: Plural","rule":"Five common endings: -e, -er, -(e)n, -s, and no ending. Many take an umlaut too. In the plural the article is always die.","items":[{"t":"gap","q":"das Kind – die ___","a":["kinder"],"why":"-er plural."},{"t":"gap","q":"der Tisch – die ___","a":["tische"],"why":"-e plural."},{"t":"gap","q":"die Frau – die ___","a":["frauen"],"why":"-en plural, very common for feminine nouns."},{"t":"gap","q":"das Auto – die ___","a":["autos"],"why":"-s plural, common for loanwords."},{"t":"gap","q":"der Apfel – die ___","a":["äpfel","aepfel"],"why":"Umlaut only, no ending."},{"t":"gap","q":"das Buch – die ___","a":["bücher","buecher"],"why":"Umlaut plus -er."},{"t":"gap","q":"die Wohnung – die ___","a":["wohnungen"],"why":"Nouns in -ung always take -en."},{"t":"gap","q":"der Mann – die ___","a":["männer","maenner"],"why":"Umlaut plus -er."},{"t":"mc","q":"Which article do all plural nouns take?","o":["der","die","das"],"a":1,"why":"Plural is always die in the nominative."},{"t":"gap","q":"die Stadt – die ___","a":["städte","staedte"],"why":"Umlaut plus -e."},{"t":"gap","q":"der Stuhl – die ___","a":["stühle","stuehle"],"why":"Umlaut plus -e."},{"t":"gap","q":"das Haus – die ___","a":["häuser","haeuser"],"why":"Umlaut plus -er."},{"t":"gap","q":"der Lehrer – die ___","a":["lehrer"],"why":"Nouns in -er usually add nothing."},{"t":"gap","q":"die Zeitung – die ___","a":["zeitungen"],"why":"-ung always takes -en."},{"t":"gap","q":"das Handy – die ___","a":["handys"],"why":"Loanwords take -s."},{"t":"gap","q":"die Möglichkeit – die ___","a":["möglichkeiten","moeglichkeiten"],"why":"-keit always takes -en."},{"t":"gap","q":"der Tag – die ___","a":["tage"],"why":"-e plural, no umlaut."},{"t":"mc","q":"Nouns ending in -chen form the plural with:","o":["-er","-s","no ending"],"a":2,"why":"das Mädchen – die Mädchen."},{"t":"gap","q":"das Kind – ich helfe den ___","a":["kindern"],"why":"Dative plural adds an extra -n."}],"tables":[{"title":"Pluralendungen","head":["Typ","Singular","Plural"],"rows":[["-e","der Tisch","die Tische"],["-e + Umlaut","der Stuhl","die Stühle"],["-er + Umlaut","das Buch","die Bücher"],["-(e)n","die Frau","die Frauen"],["-s","das Auto","die Autos"],["keine Endung","der Lehrer","die Lehrer"],["nur Umlaut","der Apfel","die Äpfel"]]},{"title":"Faustregeln","rows":[["-ung, -heit, -keit, -schaft, -ion","immer -en"],["-er, -el, -en (maskulin/neutral)","meist keine Endung"],["Fremdwörter","meist -s"],["Plural-Artikel","immer die"]]}],"en":"Plural nouns — how to make one thing into many","seq":13},{"id":"artikel","level":"A1","title":"Artikel","rule":"Definite: der, die, das. Indefinite: ein (m/n), eine (f). In the accusative der becomes den and ein becomes einen. Everything else stays the same.","items":[{"t":"gap","q":"___ Mann dort ist mein Nachbar.","a":["der"],"why":"Mann is masculine: der Mann."},{"t":"gap","q":"___ Frau arbeitet bei einer Bank.","a":["die"],"why":"Frau is feminine: die Frau."},{"t":"gap","q":"___ Kind spielt im Garten.","a":["das"],"why":"Kind is neuter: das Kind."},{"t":"gap","q":"Wir haben ___ Auto gekauft.","a":["ein"],"why":"Auto is neuter, so ein in both nominative and accusative."},{"t":"gap","q":"Das ist ___ interessantes Buch.","a":["ein"],"why":"Buch is neuter: ein Buch."},{"t":"gap","q":"Ich brauche ___ neue Tasche.","a":["eine"],"why":"Tasche is feminine: eine, unchanged in the accusative."},{"t":"gap","q":"Ich möchte ___ Kaffee, bitte.","a":["einen"],"why":"Kaffee is masculine and it is the object, so einen."},{"t":"mc","q":"Ich sehe ___ Hund.","o":["der","den","dem"],"a":1,"why":"Masculine object takes den."},{"t":"mc","q":"Nouns ending in -ung, -heit, -keit are usually:","o":["masculine","feminine","neuter"],"a":1,"why":"These endings are reliably feminine: die Wohnung, die Freiheit."},{"t":"gap","q":"___ Zeitung liegt auf dem Tisch.","a":["die"],"why":"Zeitung ends in -ung, so feminine."},{"t":"gap","q":"___ Mädchen spielt draussen.","a":["das"],"why":"-chen is always neuter, even for a girl."},{"t":"gap","q":"___ Sommer war dieses Jahr kurz.","a":["der"],"why":"Seasons, months and days are masculine."},{"t":"gap","q":"Ich brauche ___ Stift.","a":["einen"],"why":"Stift is masculine and is the object."},{"t":"gap","q":"Wir suchen ___ Wohnung.","a":["eine"],"why":"Wohnung is feminine: eine, unchanged in the accusative."},{"t":"gap","q":"___ Freiheit ist ihm wichtig.","a":["die"],"why":"-heit is feminine."},{"t":"gap","q":"Ich habe ___ Problem.","a":["ein"],"why":"Problem is neuter."},{"t":"mc","q":"Which noun is feminine?","o":["der Beruf","die Bildung","das Zeugnis"],"a":1,"why":"-ung is reliably feminine."},{"t":"mc","q":"Ich gebe ___ Kind das Buch.","o":["das","dem","den"],"a":1,"why":"Indirect object: neuter dative dem."},{"t":"gap","q":"___ Essen ist fertig.","a":["das"],"why":"Infinitives used as nouns are neuter: das Essen."}],"tables":[{"title":"Bestimmter Artikel","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","der","die","das","die"],["Akkusativ","den","die","das","die"],["Dativ","dem","der","dem","den"],["Genitiv","des","der","des","der"]]},{"title":"Unbestimmter Artikel","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","ein","eine","ein","—"],["Akkusativ","einen","eine","ein","—"],["Dativ","einem","einer","einem","—"],["Genitiv","eines","einer","eines","—"]]},{"title":"Genus erkennen","rows":[["maskulin","-er, -en, -ling, -ismus; Tage, Monate, Wetter"],["feminin","-ung, -heit, -keit, -schaft, -ion, -tät, -ei"],["neutral","-chen, -lein, -ment, -um; Infinitive (das Essen)"]]}],"en":"Articles — 'the' and 'a', and the gender of nouns","seq":14},{"id":"neg","level":"A1","title":"Negation: kein und nicht","rule":"kein negates a noun with ein or no article. nicht negates everything else: verbs, adjectives, and nouns with der/die/das or a possessive.","items":[{"t":"gap","q":"Ich habe heute ___ Zeit.","a":["keine"],"why":"Zeit is feminine and has no article, so keine."},{"t":"gap","q":"Das ist ___ Problem.","a":["kein"],"why":"Problem is neuter: kein Problem."},{"t":"gap","q":"Wir haben ___ Auto.","a":["kein"],"why":"Auto is neuter: kein Auto."},{"t":"gap","q":"Er kommt heute ___ .","a":["nicht"],"why":"nicht negates the verb."},{"t":"gap","q":"Das Buch ist ___ interessant.","a":["nicht"],"why":"nicht goes before the adjective."},{"t":"gap","q":"Ich kenne ihn ___ .","a":["nicht"],"why":"nicht negates the verb and goes at the end here."},{"t":"gap","q":"Sie haben ___ Kinder.","a":["keine"],"why":"Plural with no article takes keine."},{"t":"gap","q":"Ich trinke ___ Kaffee.","a":["keinen"],"why":"Masculine object: keinen."},{"t":"mc","q":"Das ist ___ mein Buch.","o":["kein","nicht","keine"],"a":1,"why":"With a possessive you use nicht, not kein."},{"t":"gap","q":"Ich habe ___ Hunger.","a":["keinen"],"why":"Hunger is masculine and is the object: keinen."},{"t":"gap","q":"Wir brauchen ___ Hilfe.","a":["keine"],"why":"Hilfe is feminine: keine."},{"t":"gap","q":"Das gefällt mir ___ .","a":["nicht"],"why":"nicht negates the verb."},{"t":"gap","q":"Er hat ___ Geschwister.","a":["keine"],"why":"Plural with no article: keine."},{"t":"gap","q":"Ich komme heute ___ mit.","a":["nicht"],"why":"nicht goes before the separable prefix."},{"t":"gap","q":"Das ist ___ meine Tasche.","a":["nicht"],"why":"With a possessive you use nicht."},{"t":"gap","q":"Ich habe mit ___ Kollegen gesprochen.","a":["keinem"],"why":"mit + masculine dative: keinem."},{"t":"mc","q":"Ich trinke ___ Alkohol.","o":["nicht","keinen","kein"],"a":1,"why":"Alkohol is masculine and has no article, so keinen."},{"t":"mc","q":"Where does nicht usually go?","o":["before the conjugated verb","before the element being negated","always first"],"a":1,"why":"nicht stands directly before what it negates, or at the end for the whole verb."},{"t":"gap","q":"Der Laden ist heute ___ geöffnet.","a":["nicht"],"why":"nicht before an adjective or participle."}],"tables":[{"title":"kein","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","kein","keine","kein","keine"],["Akkusativ","keinen","keine","kein","keine"],["Dativ","keinem","keiner","keinem","keinen"]]},{"title":"kein oder nicht?","rows":[["kein","vor Nomen mit ein oder ohne Artikel"],["nicht","vor der/die/das, mein, dein, Namen"],["nicht","vor Adjektiven und Adverbien"],["nicht","am Satzende, wenn das Verb verneint wird"]]}],"en":"Negation — how to say 'not' and 'no'","seq":15},{"id":"akk","level":"A1","title":"Akkusativ","rule":"The accusative marks the direct object. Only masculine changes: der→den, ein→einen, mein→meinen. Feminine, neuter and plural look the same as the nominative.","items":[{"t":"gap","q":"Ich sehe ___ Mann an der Tür.","a":["den"],"why":"Masculine object: der becomes den."},{"t":"gap","q":"Ich kaufe ___ Tasche.","a":["die"],"why":"Feminine stays die."},{"t":"gap","q":"Er liest ___ Buch.","a":["das"],"why":"Neuter stays das."},{"t":"gap","q":"Ich habe ___ Bruder und zwei Schwestern.","a":["einen"],"why":"Masculine object: ein becomes einen."},{"t":"gap","q":"Wir brauchen ___ neuen Stuhl.","a":["einen"],"why":"Stuhl is masculine and is the object."},{"t":"gap","q":"Wir besuchen ___ Eltern am Sonntag.","a":["die"],"why":"Plural stays die."},{"t":"gap","q":"Ich rufe ___ Arzt an.","a":["den"],"why":"Masculine object takes den."},{"t":"gap","q":"Ich möchte ___ Wasser, bitte.","a":["ein"],"why":"Wasser is neuter, so ein is unchanged."},{"t":"mc","q":"Which verb does NOT take the accusative?","o":["sehen","kaufen","helfen"],"a":2,"why":"helfen takes the dative: Ich helfe dem Mann."},{"t":"gap","q":"Wir suchen ___ Wohnung. (eine)","a":["eine"],"why":"Feminine accusative stays eine."},{"t":"gap","q":"Ich kenne ___ Kollegen gut.","a":["den"],"why":"Masculine accusative: den."},{"t":"gap","q":"Sie liest ___ Zeitung.","a":["die"],"why":"Feminine stays die."},{"t":"gap","q":"Er trägt ___ schweren Koffer.","a":["einen"],"why":"Koffer is masculine, object: einen."},{"t":"gap","q":"Ich brauche ___ Termin.","a":["einen"],"why":"Termin is masculine."},{"t":"gap","q":"Wir haben ___ Auto verkauft.","a":["das"],"why":"Neuter stays das."},{"t":"gap","q":"Ich rufe ___ Kollegen an.","a":["meinen"],"why":"Possessive, masculine accusative: meinen."},{"t":"mc","q":"Which sentence uses the accusative correctly?","o":["Ich sehe der Mann.","Ich sehe den Mann.","Ich sehe dem Mann."],"a":1,"why":"Direct object, masculine: den."},{"t":"mc","q":"Ich helfe ___ Bruder.","o":["meinen","meinem","mein"],"a":1,"why":"helfen takes the dative, so meinem — a trap after all this accusative practice."},{"t":"gap","q":"Möchtest du ___ Apfel?","a":["einen"],"why":"Apfel is masculine, object: einen."}],"tables":[{"title":"Akkusativ — nur maskulin ändert sich","head":["","der-Wörter","ein-Wörter","mein-Wörter"],"rows":[["maskulin","den","einen","meinen"],["feminin","die","eine","meine"],["neutral","das","ein","mein"],["Plural","die","—","meine"]]},{"title":"Typische Akkusativ-Verben","rows":[["","sehen, kaufen, haben, brauchen, lesen, essen, trinken, nehmen, besuchen, suchen, finden"]]}],"en":"Accusative — the direct object, the thing being acted on","seq":16},{"id":"dat","level":"A1","title":"Dativ","rule":"der/das→dem, die→der, plural→den (+n on the noun). Used after helfen, danken, gehören and after mit, nach, bei, seit, von, zu, aus.","items":[{"t":"gap","q":"Ich helfe ___ Mann mit dem Koffer.","a":["dem"],"why":"helfen takes the dative: dem Mann."},{"t":"gap","q":"Ich gebe ___ Frau das Buch.","a":["der"],"why":"Feminine dative: die becomes der."},{"t":"gap","q":"Ich danke ___ Kind für die Hilfe.","a":["dem"],"why":"Neuter dative: das becomes dem."},{"t":"gap","q":"Wir fahren mit ___ Bus.","a":["dem"],"why":"mit always takes the dative."},{"t":"gap","q":"Sie wohnt noch bei ___ Eltern.","a":["den"],"why":"Plural dative: den Eltern."},{"t":"gap","q":"Ich spreche mit ___ Lehrerin.","a":["der"],"why":"mit + feminine dative = der Lehrerin."},{"t":"gap","q":"Nach ___ Arbeit gehe ich einkaufen.","a":["der"],"why":"nach + feminine dative = der Arbeit."},{"t":"gap","q":"Das Buch gehört ___ Kollegen.","a":["dem"],"why":"gehören takes the dative."},{"t":"mc","q":"Which preposition always takes the dative?","o":["für","seit","ohne"],"a":1,"why":"seit is dative; für and ohne take the accusative."},{"t":"gap","q":"Das Essen schmeckt ___ Kindern gut.","a":["den"],"why":"schmecken takes the dative; plural is den + n."},{"t":"gap","q":"Ich fahre zu ___ Arzt.","a":["dem"],"why":"zu dem — usually contracted to zum."},{"t":"gap","q":"Nach ___ Essen gehen wir spazieren.","a":["dem"],"why":"nach + neuter dative: dem Essen."},{"t":"gap","q":"Die Wohnung gefällt ___ Frau.","a":["der"],"why":"gefallen takes the dative, feminine: der."},{"t":"gap","q":"Ich komme aus ___ Schweiz.","a":["der"],"why":"die Schweiz is feminine: aus der Schweiz."},{"t":"gap","q":"Er wohnt bei ___ Freund.","a":["einem"],"why":"bei + masculine dative: einem."},{"t":"gap","q":"Ich danke ___ Kollegen für die Hilfe.","a":["den","dem"],"why":"danken takes the dative."},{"t":"mc","q":"Which sentence needs the dative?","o":["Ich sehe den Mann.","Ich danke dem Mann.","Ich rufe den Mann an."],"a":1,"why":"danken is a dative verb."},{"t":"mc","q":"Ich gehe zu ___ Post.","o":["dem","der","den"],"a":1,"why":"die Post is feminine: zu der, contracted to zur."},{"t":"gap","q":"Sie spricht mit ___ Kindern.","a":["den"],"why":"Dative plural: den Kindern."}],"tables":[{"title":"Dativ","head":["","der-Wörter","ein-Wörter","Nomen"],"rows":[["maskulin","dem","einem","—"],["feminin","der","einer","—"],["neutral","dem","einem","—"],["Plural","den","—","+n: den Kindern"]]},{"title":"Dativ-Verben","rows":[["","helfen, danken, gehören, gefallen, passen, schmecken, antworten, glauben, folgen, gratulieren"]]},{"title":"Dativ-Präpositionen","rows":[["","aus, bei, mit, nach, seit, von, zu, gegenüber"]]}],"en":"Dative — the indirect object, usually the person receiving","seq":17},{"id":"poss","level":"A1","title":"Possessivartikel","rule":"mein, dein, sein, ihr, unser, euer, ihr/Ihr. They take the same endings as ein: meinen (m. acc), meiner (f. dat).","items":[{"t":"gap","q":"Das ist ___ Buch. (ich)","a":["mein"],"why":"Buch is neuter, nominative: mein."},{"t":"gap","q":"Wo ist ___ Tasche? (du)","a":["deine"],"why":"Tasche is feminine: deine."},{"t":"gap","q":"___ Auto ist ganz neu. (er)","a":["sein"],"why":"His = sein; Auto is neuter."},{"t":"gap","q":"___ Mutter kommt morgen. (sie)","a":["ihre"],"why":"Her = ihr, plus -e for feminine."},{"t":"gap","q":"Das sind ___ Kinder. (wir)","a":["unsere"],"why":"Plural takes -e: unsere Kinder."},{"t":"gap","q":"Ich kenne ___ Bruder gut. (du)","a":["deinen"],"why":"Masculine accusative: deinen."},{"t":"gap","q":"Ich helfe ___ Schwester. (ich)","a":["meiner"],"why":"helfen + feminine dative: meiner Schwester."},{"t":"gap","q":"Wie heisst ___ Hund? (ihr)","a":["euer"],"why":"Your (plural) = euer; Hund is masculine nominative."},{"t":"mc","q":"Frau Berger, ist das ___ Mantel?","o":["ihr","Ihr","euer"],"a":1,"why":"Polite form takes a capital I: Ihr."},{"t":"gap","q":"Ist das ___ Schlüssel? (du)","a":["dein"],"why":"Schlüssel is masculine nominative: dein."},{"t":"gap","q":"Wir haben ___ Auto verkauft. (wir)","a":["unser"],"why":"Auto is neuter: unser, no ending."},{"t":"gap","q":"Ich rufe ___ Mutter an. (ich)","a":["meine"],"why":"Mutter is feminine accusative: meine."},{"t":"gap","q":"Wo sind ___ Schuhe? (du)","a":["deine"],"why":"Plural takes -e."},{"t":"gap","q":"Er fährt mit ___ Fahrrad. (er)","a":["seinem"],"why":"mit + neuter dative: seinem."},{"t":"gap","q":"Sie wohnt bei ___ Eltern. (sie)","a":["ihren"],"why":"bei + dative plural: ihren."},{"t":"gap","q":"Frau Berger, wo ist ___ Mantel?","a":["ihr"],"why":"Polite Ihr with a capital I, masculine nominative."},{"t":"mc","q":"Kinder, habt ihr ___ Hausaufgaben gemacht?","o":["eure","euer","euren"],"a":0,"why":"Plural accusative: eure — euer loses its e."},{"t":"mc","q":"Ich helfe ___ Schwester.","o":["meine","meiner","meinen"],"a":1,"why":"helfen + feminine dative: meiner."},{"t":"gap","q":"Das ist ___ Problem, nicht meins. (du)","a":["dein"],"why":"Problem is neuter nominative: dein."}],"tables":[{"title":"Possessivartikel","head":["Person","Grundform","mask. Akk","feminin","Plural"],"rows":[["ich","mein","meinen","meine","meine"],["du","dein","deinen","deine","deine"],["er/es","sein","seinen","seine","seine"],["sie","ihr","ihren","ihre","ihre"],["wir","unser","unseren","unsere","unsere"],["ihr","euer","euren","eure","eure"],["sie","ihr","ihren","ihre","ihre"],["Sie","Ihr","Ihren","Ihre","Ihre"]]},{"title":"Merke","rows":[["Endungen","genau wie bei ein / kein"],["euer","verliert das e: eure, euren"]]}],"en":"Possessives — my, your, his, her, our, their","seq":18},{"id":"artdem","level":"A1","seq":19,"title":"Artikel: interrogativ und demonstrativ","en":"'Which one?' and 'this one' — welcher and dieser","rule":"welcher asks which one; dieser points to this one. Both take exactly the same endings as der/die/das, so if you know der, den, dem you already know these.","tables":[{"title":"welcher und dieser","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","welcher / dieser","welche / diese","welches / dieses","welche / diese"],["Akkusativ","welchen / diesen","welche / diese","welches / dieses","welche / diese"],["Dativ","welchem / diesem","welcher / dieser","welchem / diesem","welchen / diesen"]]},{"title":"Merke","rows":[["Endungen","genau wie der, die, das"],["jeder, mancher, solcher","folgen demselben Muster"]]}],"items":[{"t":"gap","q":"___ Bus fährt zum Bahnhof?","a":["welcher"],"why":"Bus is masculine nominative: Welcher."},{"t":"gap","q":"___ Wohnung gefällt dir besser?","a":["welche"],"why":"Wohnung is feminine: Welche."},{"t":"gap","q":"___ Buch liest du gerade?","a":["welches"],"why":"Buch is neuter: Welches."},{"t":"gap","q":"___ Mann meinst du? (Akkusativ)","a":["welchen"],"why":"Masculine accusative: Welchen."},{"t":"gap","q":"Mit ___ Bus fährst du?","a":["welchem"],"why":"mit + masculine dative: welchem."},{"t":"gap","q":"In ___ Stock wohnen Sie?","a":["welchem"],"why":"in + masculine dative: welchem."},{"t":"gap","q":"___ Kinder sind das?","a":["welche"],"why":"Plural: Welche."},{"t":"gap","q":"___ Stuhl ist sehr bequem. (dieser)","a":["dieser"],"why":"Masculine nominative: Dieser."},{"t":"gap","q":"Ich nehme ___ Tasche. (dieser)","a":["diese"],"why":"Feminine accusative: diese."},{"t":"gap","q":"___ Jahr fahren wir nach Indien. (dieser)","a":["dieses"],"why":"Jahr is neuter: Dieses."},{"t":"gap","q":"Ich kenne ___ Mann nicht. (dieser)","a":["diesen"],"why":"Masculine accusative: diesen."},{"t":"gap","q":"Mit ___ Zug fahren wir. (dieser)","a":["diesem"],"why":"mit + masculine dative: diesem."},{"t":"mc","q":"___ Farbe möchten Sie?","o":["Welcher","Welche","Welches"],"a":1,"why":"Farbe is feminine."},{"t":"mc","q":"The endings of welcher and dieser follow:","o":["ein / kein","der / die / das","mein / dein"],"a":1,"why":"They copy the definite article endings exactly."}]},{"id":"pronakkdat","level":"A2","title":"Pronomen: Akkusativ und Dativ","rule":"Accusative: mich, dich, ihn, sie, es, uns, euch, sie. Dative: mir, dir, ihm, ihr, ihm, uns, euch, ihnen. When both appear, accusative comes first: Ich gebe es dir.","items":[{"t":"gap","q":"Kennst du ___ ? (er)","a":["ihn"],"why":"Accusative of er is ihn."},{"t":"gap","q":"Ich helfe ___ gern. (du)","a":["dir"],"why":"helfen takes the dative: dir."},{"t":"gap","q":"Gib ___ bitte das Buch. (ich)","a":["mir"],"why":"Indirect object is dative: mir."},{"t":"gap","q":"Ich sehe ___ morgen. (ihr, plural)","a":["euch"],"why":"Accusative of ihr is euch."},{"t":"gap","q":"Das Buch gehört ___ . (sie, Singular)","a":["ihr"],"why":"gehören takes the dative: ihr."},{"t":"gap","q":"Ich rufe ___ später an. (Sie)","a":["sie"],"why":"Polite Sie in the accusative stays Sie."},{"t":"gap","q":"Ich gebe ___ dir morgen. (das Buch)","a":["es"],"why":"das Buch becomes es, and it comes before dir."},{"t":"gap","q":"Sag ___ bitte Bescheid. (wir)","a":["uns"],"why":"Dative of wir is uns."},{"t":"mc","q":"Which order is correct?","o":["Ich gebe dir es.","Ich gebe es dir."],"a":1,"why":"When both are pronouns, accusative comes before dative."},{"t":"gap","q":"Ich habe ___ gestern gesehen. (sie, Singular)","a":["sie"],"why":"Feminine accusative stays sie."},{"t":"gap","q":"Das Buch gehört ___ . (er)","a":["ihm"],"why":"gehören takes the dative: ihm."},{"t":"gap","q":"Kannst du ___ helfen? (wir)","a":["uns"],"why":"helfen + dative: uns."},{"t":"gap","q":"Ich schicke ___ die Datei. (du)","a":["dir"],"why":"Indirect object: dir."},{"t":"gap","q":"Ich habe ___ angerufen. (sie, Plural)","a":["sie"],"why":"Plural accusative: sie."},{"t":"gap","q":"Das Kleid steht ___ gut. (du)","a":["dir"],"why":"stehen + dative for suiting someone."},{"t":"gap","q":"Herr Meier, ich schicke ___ die Unterlagen.","a":["ihnen"],"why":"Polite dative: Ihnen with a capital I."},{"t":"gap","q":"Ich gebe ___ ihm morgen. (das Formular)","a":["es"],"why":"das Formular becomes es and goes before ihm."},{"t":"mc","q":"Which order is correct?","o":["Ich gebe ihm es.","Ich gebe es ihm."],"a":1,"why":"Two pronouns: accusative first."},{"t":"mc","q":"Ich gebe ___ das Buch.","o":["ihn","ihm","er"],"a":1,"why":"The person receiving is the dative: ihm."}],"tables":[{"title":"Pronomen","head":["","Nominativ","Akkusativ","Dativ"],"rows":[["","ich","mich","mir"],["","du","dich","dir"],["","er","ihn","ihm"],["","sie","sie","ihr"],["","es","es","ihm"],["","wir","uns","uns"],["","ihr","euch","euch"],["","sie","sie","ihnen"],["","Sie","Sie","Ihnen"]]},{"title":"Reihenfolge im Satz","rows":[["zwei Nomen","Dativ vor Akkusativ: Ich gebe dem Kind das Buch."],["Pronomen + Nomen","Pronomen zuerst: Ich gebe es dem Kind."],["zwei Pronomen","Akkusativ vor Dativ: Ich gebe es ihm."]]}],"en":"Object pronouns — him, her, them, to me, to you","seq":20},{"id":"verbdatakk","level":"A2","seq":21,"title":"Verben mit Dativ und Akkusativ","en":"Verbs with two objects — give someone something","rule":"geben, schenken, zeigen, schicken, bringen, erklären, empfehlen and leihen take a person in the dative and a thing in the accusative. Order: two nouns → dative first. A pronoun always comes before a noun. Two pronouns → accusative first.","tables":[{"title":"Verben mit zwei Objekten","rows":[["Person im Dativ, Sache im Akkusativ","geben, schenken, zeigen, schicken, bringen, erklären, empfehlen, leihen, kaufen, sagen"]]},{"title":"Nur Dativ","rows":[["kein Akkusativobjekt","helfen, danken, gefallen, gehören, antworten, passen, schmecken"]]},{"title":"Reihenfolge","head":["Fall","Beispiel"],"rows":[["zwei Nomen","Ich gebe dem Kind das Buch."],["Pronomen + Nomen","Ich gebe es dem Kind."],["Nomen + Pronomen","Ich gebe ihm das Buch."],["zwei Pronomen","Ich gebe es ihm."]]}],"items":[{"t":"gap","q":"Ich gebe ___ Kind das Buch.","a":["dem"],"why":"The person is dative: dem Kind."},{"t":"gap","q":"Ich schenke ___ Mutter Blumen. (ich)","a":["meiner"],"why":"Feminine dative: meiner Mutter."},{"t":"gap","q":"Er zeigt ___ Gästen die Wohnung.","a":["den"],"why":"Dative plural: den Gästen."},{"t":"gap","q":"Ich schicke ___ die Datei. (du)","a":["dir"],"why":"The recipient is dative: dir."},{"t":"gap","q":"Sie erklärt ___ Schülern die Regel.","a":["den"],"why":"Dative plural: den Schülern."},{"t":"gap","q":"Ich empfehle ___ dieses Restaurant. (Sie)","a":["ihnen"],"why":"Polite dative: Ihnen."},{"t":"gap","q":"Kannst du ___ bitte das Salz geben? (ich)","a":["mir"],"why":"Recipient in the dative: mir."},{"t":"gap","q":"Er leiht ___ sein Auto. (wir)","a":["uns"],"why":"Dative of wir: uns."},{"t":"gap","q":"Ich bringe ___ Kollegen einen Kaffee.","a":["dem"],"why":"Masculine dative: dem Kollegen."},{"t":"gap","q":"Sie hat ___ die Wahrheit gesagt. (er)","a":["ihm"],"why":"Dative of er: ihm."},{"t":"mc","q":"Two nouns — which order?","o":["Ich gebe das Buch dem Kind.","Ich gebe dem Kind das Buch."],"a":1,"why":"With two nouns the dative comes first."},{"t":"mc","q":"Which is correct?","o":["Ich gebe dem Kind es.","Ich gebe es dem Kind."],"a":1,"why":"A pronoun always goes before a noun."},{"t":"mc","q":"Which is correct?","o":["Ich gebe es ihm.","Ich gebe ihm es."],"a":0,"why":"Two pronouns: accusative before dative."},{"t":"mc","q":"Which verb takes ONLY a dative object?","o":["geben","helfen","zeigen"],"a":1,"why":"helfen never takes an accusative object."}]},{"id":"praet1","level":"A1","title":"war und hatte","rule":"For sein and haben, German prefers the simple past even in speech: war, warst, war, waren, wart, waren / hatte, hattest, hatte, hatten, hattet, hatten.","items":[{"t":"gap","q":"Ich ___ gestern leider krank.","a":["war"],"why":"ich war."},{"t":"gap","q":"Wir ___ letzte Woche keine Zeit.","a":["hatten"],"why":"wir hatten."},{"t":"gap","q":"Er ___ den ganzen Tag zu Hause.","a":["war"],"why":"er war."},{"t":"gap","q":"___ du gestern auch da?","a":["warst"],"why":"du warst."},{"t":"gap","q":"Sie ___ grossen Hunger.","a":["hatte"],"why":"sie hatte (singular)."},{"t":"gap","q":"Ihr ___ leider zu spät.","a":["wart"],"why":"ihr wart."},{"t":"gap","q":"Es ___ im Januar sehr kalt.","a":["war"],"why":"es war."},{"t":"gap","q":"Ich ___ als Kind einen Hund.","a":["hatte"],"why":"ich hatte."},{"t":"mc","q":"In spoken German, which is more natural?","o":["Ich bin gestern krank gewesen.","Ich war gestern krank."],"a":1,"why":"With sein and haben the simple past is the normal spoken choice."},{"t":"gap","q":"Als Kind ___ ich oft krank.","a":["war"],"why":"ich war."},{"t":"gap","q":"Wir ___ letztes Jahr in Indien.","a":["waren"],"why":"wir waren."},{"t":"gap","q":"___ ihr gestern im Kino?","a":["wart"],"why":"ihr wart."},{"t":"gap","q":"Sie ___ damals kein Auto.","a":["hatten","hatte"],"why":"hatte for singular, hatten for plural."},{"t":"gap","q":"Ich ___ gestern viel zu tun.","a":["hatte"],"why":"ich hatte."},{"t":"gap","q":"Der Film ___ sehr gut.","a":["war"],"why":"er war."},{"t":"gap","q":"Du ___ recht.","a":["hattest"],"why":"du hattest."},{"t":"mc","q":"Which modal verb is also common in the Präteritum?","o":["konnte","gekonnt","können"],"a":0,"why":"Modals prefer the simple past: konnte, musste, wollte."},{"t":"mc","q":"Ich ___ gestern keine Zeit.","o":["hatte","habte","hattete"],"a":0,"why":"haben is irregular: hatte."},{"t":"gap","q":"Es ___ ein langer Tag.","a":["war"],"why":"es war."}],"tables":[{"title":"Präteritum von sein und haben","head":["","sein","haben"],"rows":[["ich","war","hatte"],["du","warst","hattest"],["er/sie/es","war","hatte"],["wir","waren","hatten"],["ihr","wart","hattet"],["sie/Sie","waren","hatten"]]},{"title":"Auch im Präteritum üblich","rows":[["Modalverben","konnte, musste, wollte, durfte, sollte, mochte"],["Gebrauch","im Gespräch natürlicher als das Perfekt"]]}],"en":"Simple past of 'to be' and 'to have' — war and hatte","seq":23},{"id":"perfhaben","level":"A1","title":"Perfekt mit haben","rule":"haben + participle at the end. Regular: ge- + stem + -t (gelernt). Irregular: ge- + stem + -en (gelesen). Separable verbs put ge- in the middle: zugemacht.","items":[{"t":"gap","q":"Ich habe das Buch schon ___ . (lesen)","a":["gelesen"],"why":"Irregular participle: gelesen."},{"t":"gap","q":"Wir haben gestern Pizza ___ . (essen)","a":["gegessen"],"why":"Irregular: gegessen."},{"t":"gap","q":"Sie hat den ganzen Tag ___ . (arbeiten)","a":["gearbeitet"],"why":"Regular, stem in -t so -et: gearbeitet."},{"t":"gap","q":"Hast du ihn gestern ___ ? (sehen)","a":["gesehen"],"why":"Irregular: gesehen."},{"t":"gap","q":"Ich habe die Tür ___ . (zumachen)","a":["zugemacht"],"why":"Separable: prefix + ge + macht."},{"t":"gap","q":"Er hat mich gestern Abend ___ . (anrufen)","a":["angerufen"],"why":"Separable and irregular: angerufen."},{"t":"gap","q":"Wir haben zwei Jahre Deutsch ___ . (lernen)","a":["gelernt"],"why":"Regular: gelernt."},{"t":"gap","q":"Ich habe den Termin leider ___ . (vergessen)","a":["vergessen"],"why":"Verbs starting with ver- take no ge-."},{"t":"mc","q":"Which participle has NO ge-?","o":["gekauft","besucht","gemacht"],"a":1,"why":"Verbs with be-, ver-, er-, ent- form the participle without ge-."},{"t":"gap","q":"Wir haben lange ___ . (warten)","a":["gewartet"],"why":"Regular, stem in -t: gewartet."},{"t":"gap","q":"Ich habe ihn gestern ___ . (treffen)","a":["getroffen"],"why":"Irregular: getroffen."},{"t":"gap","q":"Sie hat mir alles ___ . (erklären)","a":["erklärt","erklaert"],"why":"er- takes no ge-."},{"t":"gap","q":"Wir haben zwei Stunden ___ . (telefonieren)","a":["telefoniert"],"why":"Verbs in -ieren take no ge-."},{"t":"gap","q":"Er hat den Bericht ___ . (schreiben)","a":["geschrieben"],"why":"Irregular: geschrieben."},{"t":"gap","q":"Hast du das Formular ___ ? (ausfüllen)","a":["ausgefüllt","ausgefuellt"],"why":"Separable: aus + ge + füllt."},{"t":"gap","q":"Ich habe den Schlüssel ___ . (finden)","a":["gefunden"],"why":"Irregular: gefunden."},{"t":"gap","q":"Wir haben die Wohnung ___ . (besichtigen)","a":["besichtigt"],"why":"be- takes no ge-."},{"t":"mc","q":"Which participle is correct?","o":["gestudiert","studiert","gestudieren"],"a":1,"why":"-ieren verbs never take ge-."},{"t":"gap","q":"Sie hat viel ___ . (arbeiten)","a":["gearbeitet"],"why":"Stem in -t: gearbeitet."}],"tables":[{"title":"Partizip II bilden","head":["Typ","Infinitiv","Partizip II"],"rows":[["regelmässig","machen","gemacht"],["Stamm auf -t","arbeiten","gearbeitet"],["unregelmässig","lesen","gelesen"],["unregelmässig","essen","gegessen"],["unregelmässig","sehen","gesehen"],["trennbar","einkaufen","eingekauft"],["trennbar","anrufen","angerufen"],["untrennbar","besuchen","besucht"],["untrennbar","vergessen","vergessen"],["auf -ieren","studieren","studiert"]]},{"title":"Kein ge-","rows":[["Vorsilben","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"],["Endung","-ieren: telefoniert, reserviert, funktioniert"]]}],"en":"Present perfect with 'haben' — the everyday spoken past","seq":24},{"id":"perfsein","level":"A1","title":"Perfekt mit sein","rule":"Use sein with verbs of movement (gehen, fahren, kommen) and change of state (aufstehen, einschlafen, werden), plus sein, bleiben and passieren.","items":[{"t":"gap","q":"Ich ___ gestern nach Bern gefahren.","a":["bin"],"why":"fahren is movement, so sein."},{"t":"gap","q":"Wir ___ den ganzen Tag zu Hause geblieben.","a":["sind"],"why":"bleiben always takes sein."},{"t":"gap","q":"Er ist heute um sechs ___ . (aufstehen)","a":["aufgestanden"],"why":"Change of state, separable: aufgestanden."},{"t":"gap","q":"Sie ist schon nach Hause ___ . (gehen)","a":["gegangen"],"why":"Movement: ist gegangen."},{"t":"gap","q":"Ich bin gestern sehr früh ___ . (einschlafen)","a":["eingeschlafen"],"why":"Change of state: eingeschlafen."},{"t":"gap","q":"Wann ___ ihr angekommen?","a":["seid"],"why":"ankommen is movement: ihr seid."},{"t":"gap","q":"Was ___ hier passiert?","a":["ist"],"why":"passieren always takes sein."},{"t":"gap","q":"Ich ___ noch nie in Berlin gewesen.","a":["bin"],"why":"sein itself takes sein: ich bin gewesen."},{"t":"mc","q":"Ich ___ zehn Kilometer gelaufen.","o":["habe","bin","werde"],"a":1,"why":"laufen is movement from A to B, so sein."},{"t":"gap","q":"Wir ___ mit dem Zug gefahren.","a":["sind"],"why":"fahren is movement: sein."},{"t":"gap","q":"Ich ___ gestern spät nach Hause gekommen.","a":["bin"],"why":"kommen is movement."},{"t":"gap","q":"Er ist um sechs ___ . (losfahren)","a":["losgefahren"],"why":"Separable and movement: ist losgefahren."},{"t":"gap","q":"Das Kind ist schnell ___ . (wachsen)","a":["gewachsen"],"why":"Change of state: ist gewachsen."},{"t":"gap","q":"Wir ___ nach Bern geflogen.","a":["sind"],"why":"fliegen is movement."},{"t":"gap","q":"Sie ___ Ärztin geworden.","a":["ist"],"why":"werden always takes sein."},{"t":"gap","q":"Ich ___ eine Stunde im Stau gestanden.","a":["habe"],"why":"stehen has no movement from A to B, so haben."},{"t":"mc","q":"Wir ___ zu Hause geblieben.","o":["haben","sind","werden"],"a":1,"why":"bleiben always takes sein."},{"t":"mc","q":"Which verb takes haben in the perfect?","o":["gehen","schlafen","aufstehen"],"a":1,"why":"schlafen is no movement and no change of state."},{"t":"gap","q":"Was ___ dann passiert?","a":["ist"],"why":"passieren takes sein."}],"tables":[{"title":"Perfekt mit sein","head":["Gruppe","Verb","Perfekt"],"rows":[["Bewegung","gehen","ist gegangen"],["Bewegung","fahren","ist gefahren"],["Bewegung","kommen","ist gekommen"],["Bewegung","laufen","ist gelaufen"],["Bewegung","fliegen","ist geflogen"],["Zustandswechsel","aufstehen","ist aufgestanden"],["Zustandswechsel","einschlafen","ist eingeschlafen"],["Zustandswechsel","werden","ist geworden"],["Sonderfall","sein","ist gewesen"],["Sonderfall","bleiben","ist geblieben"],["Sonderfall","passieren","ist passiert"]]}],"en":"Present perfect with 'sein' — for movement and change","seq":25},{"id":"partperf","level":"A2","seq":26,"title":"Partizip Perfekt","en":"Building past participles — gemacht, gegangen, besucht","rule":"Regular: ge- + stem + -t. Irregular: ge- + stem + -en, usually with a vowel change. No ge- at all after be-, ge-, er-, ver-, zer-, ent-, emp-, miss- or with verbs ending in -ieren. Separable verbs put ge- between the prefix and the stem.","tables":[{"title":"Die vier Muster","head":["Muster","Infinitiv","Partizip II"],"rows":[["ge- + -t","machen","gemacht"],["ge- + -et","arbeiten","gearbeitet"],["ge- + -en","gehen","gegangen"],["ge- + -en, Vokalwechsel","trinken","getrunken"],["trennbar","einkaufen","eingekauft"],["trennbar unregelmässig","anrufen","angerufen"],["kein ge- (be-, ver-, er-)","besuchen","besucht"],["kein ge- (-ieren)","telefonieren","telefoniert"]]},{"title":"Merke","rows":[["Vorsilben ohne ge-","be-, ge-, er-, ver-, zer-, ent-, emp-, miss-"],["Endung ohne ge-","-ieren"]]}],"items":[{"t":"gap","q":"machen → ge___","a":["macht"],"why":"Regular: gemacht."},{"t":"gap","q":"spielen → ___","a":["gespielt"],"why":"Regular: gespielt."},{"t":"gap","q":"arbeiten → ___","a":["gearbeitet"],"why":"Stem in -t takes -et: gearbeitet."},{"t":"gap","q":"gehen → ___","a":["gegangen"],"why":"Irregular: gegangen."},{"t":"gap","q":"trinken → ___","a":["getrunken"],"why":"Vowel change: getrunken."},{"t":"gap","q":"sprechen → ___","a":["gesprochen"],"why":"Vowel change: gesprochen."},{"t":"gap","q":"besuchen → ___","a":["besucht"],"why":"be- means no ge-."},{"t":"gap","q":"verstehen → ___","a":["verstanden"],"why":"ver- means no ge-, and the stem changes."},{"t":"gap","q":"bezahlen → ___","a":["bezahlt"],"why":"be- means no ge-."},{"t":"gap","q":"telefonieren → ___","a":["telefoniert"],"why":"-ieren verbs take no ge-."},{"t":"gap","q":"einkaufen → ___","a":["eingekauft"],"why":"Separable: ein + ge + kauft."},{"t":"gap","q":"aufstehen → ___","a":["aufgestanden"],"why":"Separable and irregular: aufgestanden."},{"t":"gap","q":"mitbringen → ___","a":["mitgebracht"],"why":"Separable and irregular: mitgebracht."},{"t":"mc","q":"Which participle correctly has NO ge-?","o":["gestudiert","studiert","gestudieren"],"a":1,"why":"-ieren verbs never take ge-."}]},{"id":"praetmodal","level":"A2","seq":27,"title":"Präteritum: Modalverben","en":"Simple past of the modals — konnte, musste, wollte","rule":"Modals drop the umlaut and add -te: können→konnte, müssen→musste, dürfen→durfte, mögen→mochte. sollen→sollte and wollen→wollte have no umlaut to lose. In speech this is used far more than the perfect.","tables":[{"title":"Alle sechs","head":["Infinitiv","Präteritum (ich/er)"],"rows":[["können","konnte"],["müssen","musste"],["dürfen","durfte"],["sollen","sollte"],["wollen","wollte"],["mögen","mochte"]]},{"title":"Endungen","head":["","können"],"rows":[["ich","konnte"],["du","konntest"],["er/sie/es","konnte"],["wir","konnten"],["ihr","konntet"],["sie/Sie","konnten"]]}],"items":[{"t":"gap","q":"Ich ___ gestern nicht kommen. (können)","a":["konnte"],"why":"können → konnte, no umlaut."},{"t":"gap","q":"Wir ___ lange warten. (müssen)","a":["mussten"],"why":"wir mussten."},{"t":"gap","q":"Als Kind ___ ich keinen Kaffee. (mögen)","a":["mochte"],"why":"mögen → mochte."},{"t":"gap","q":"Er ___ nicht mitkommen. (wollen)","a":["wollte"],"why":"wollen → wollte."},{"t":"gap","q":"___ du gestern früher gehen? (dürfen)","a":["durftest"],"why":"du durftest."},{"t":"gap","q":"Ich ___ eigentlich anrufen. (sollen)","a":["sollte"],"why":"sollen → sollte."},{"t":"gap","q":"Wir ___ das Formular ausfüllen. (müssen)","a":["mussten"],"why":"wir mussten."},{"t":"gap","q":"Ihr ___ hier nicht parken. (dürfen)","a":["durftet"],"why":"ihr durftet."},{"t":"gap","q":"Sie ___ sehr gut Deutsch. (können)","a":["konnte","konnten"],"why":"konnte for one person, konnten for several."},{"t":"gap","q":"Ich ___ das nicht wissen. (können)","a":["konnte"],"why":"ich konnte."},{"t":"mc","q":"What happens to the umlaut in the Präteritum?","o":["it stays","it disappears","it moves"],"a":1,"why":"müssen → musste, können → konnte."},{"t":"mc","q":"Which sounds more natural in conversation?","o":["Ich habe nicht kommen können.","Ich konnte nicht kommen."],"a":1,"why":"Modals prefer the simple past even in speech."},{"t":"gap","q":"Damals ___ wir noch kein Auto. (dürfen)","a":["durften"],"why":"wir durften."},{"t":"mc","q":"Präteritum of mögen:","o":["mögte","mochte","magte"],"a":1,"why":"mögen → mochte."}]},{"id":"zeiten","level":"A2","seq":28,"title":"Zeitengebrauch","en":"Which past tense to use, and when","rule":"Speaking: use the Perfekt for most verbs, but the Präteritum for sein, haben and the modals. Writing, news and stories: Präteritum throughout. For an event that happened before another past event: Plusquamperfekt.","tables":[{"title":"Im Gespräch","head":["Verb","natürliche Form"],"rows":[["die meisten Verben","Perfekt: Ich habe gearbeitet."],["sein","Präteritum: Ich war müde."],["haben","Präteritum: Ich hatte Zeit."],["Modalverben","Präteritum: Ich musste gehen."]]},{"title":"Im Text","head":["Textsorte","Zeit"],"rows":[["Erzählung, Roman","Präteritum"],["Zeitung, Bericht","Präteritum"],["Mail an Freunde","Perfekt"],["frühere Vergangenheit","Plusquamperfekt"]]}],"items":[{"t":"mc","q":"Talking to a friend about yesterday, which is most natural?","o":["Ich arbeitete gestern lange.","Ich habe gestern lange gearbeitet."],"a":1,"why":"In speech, most verbs take the Perfekt."},{"t":"mc","q":"And with sein?","o":["Ich bin gestern müde gewesen.","Ich war gestern müde."],"a":1,"why":"sein prefers the Präteritum even in speech."},{"t":"mc","q":"And with a modal?","o":["Ich habe früher gehen müssen.","Ich musste früher gehen."],"a":1,"why":"Modals prefer the Präteritum."},{"t":"mc","q":"A newspaper report uses mainly:","o":["Perfekt","Präteritum","Futur"],"a":1,"why":"Written narrative uses the Präteritum."},{"t":"mc","q":"Which tense marks t
