:"sich interessieren für + accusative."},{"t":"gap","q":"Wir haben lange ___ das Problem diskutiert.","a":["über"],"why":"diskutieren über + accusative."},{"t":"mc","q":"Ich bedanke mich ___ die Hilfe.","o":["für","von","mit"],"a":0,"why":"sich bedanken für + accusative."},{"t":"gap","q":"Ich erinnere mich ___ meine Kindheit.","a":["an"],"why":"sich erinnern an + accusative."},{"t":"gap","q":"Wir fangen ___ der Arbeit an.","a":["mit"],"why":"anfangen mit + dative."},{"t":"gap","q":"Sie nimmt ___ dem Kurs teil.","a":["an"],"why":"teilnehmen an + dative."},{"t":"gap","q":"Ich ärgere mich ___ den Lärm.","a":["über"],"why":"sich ärgern über + accusative."},{"t":"gap","q":"Er lädt uns ___ Essen ein.","a":["zum"],"why":"einladen zu + dative: zu dem → zum."},{"t":"gap","q":"Das gehört ___ meiner Arbeit.","a":["zu"],"why":"gehören zu + dative."},{"t":"gap","q":"Ich freue mich ___ das Wiedersehen.","a":["auf"],"why":"Something ahead: sich freuen auf."},{"t":"gap","q":"Wir haben lange ___ dich gewartet.","a":["auf"],"why":"warten auf + accusative."},{"t":"mc","q":"___ wartest du? – Auf meinen Mann.","o":["Worauf","Auf wen","Wofür"],"a":1,"why":"For a person you use the preposition + wen."},{"t":"mc","q":"Ich denke oft ___ dich.","o":["auf","an","über"],"a":1,"why":"denken an + accusative."}],"tables":[{"title":"Verb + feste Präposition","head":["Verb","Präposition","Kasus"],"rows":[["warten","auf","Akkusativ"],["sich freuen","auf (Zukunft)","Akkusativ"],["sich freuen","über (jetzt)","Akkusativ"],["denken","an","Akkusativ"],["sich erinnern","an","Akkusativ"],["sprechen / reden","über","Akkusativ"],["sich interessieren","für","Akkusativ"],["sich bedanken","für","Akkusativ"],["sich ärgern","über","Akkusativ"],["helfen","bei","Dativ"],["Angst haben","vor","Dativ"],["anfangen","mit","Dativ"],["teilnehmen","an","Dativ"],["gehören","zu","Dativ"],["einladen","zu","Dativ"]]},{"title":"Fragen und Antworten","rows":[["Sache","Worauf wartest du? — Darauf."],["Person","Auf wen wartest du? — Auf ihn."]]}],"en":"Verbs with a fixed preposition — wait FOR, think OF","seq":53},{"id":"prepadv","level":"B1","seq":54,"title":"Präpositionaladverbien","en":"darauf, damit, worauf — referring back to a thing","rule":"For things, replace preposition + noun with da(r)-: auf das → darauf, mit dem → damit, für das → dafür. Add an r when the preposition starts with a vowel: darauf, daran, darüber. Ask with wo(r)-: worauf, womit, wofür. For people, keep the preposition: auf ihn, mit ihm, auf wen.","tables":[{"title":"Sache oder Person?","head":["","Sache","Person"],"rows":[["Verweis","darauf, damit, dafür","auf ihn, mit ihm, für sie"],["Frage","Worauf? Womit? Wofür?","Auf wen? Mit wem? Für wen?"]]},{"title":"Formen","head":["Präposition","da-Form","wo-Form"],"rows":[["auf","darauf","worauf"],["an","daran","woran"],["über","darüber","worüber"],["in","darin","worin"],["mit","damit","womit"],["für","dafür","wofür"],["von","davon","wovon"],["zu","dazu","wozu"],["nach","danach","wonach"]]},{"title":"Merke","rows":[["r einfügen","vor Vokal: da-r-auf, wo-r-über"],["Personen","nie da- oder wo-: Auf wen wartest du?"]]}],"items":[{"t":"gap","q":"Ich warte auf den Bus. Ich warte ___ .","a":["darauf"],"why":"auf + thing → darauf."},{"t":"gap","q":"Ich denke an die Prüfung. Ich denke ___ .","a":["daran"],"why":"an + thing → daran."},{"t":"gap","q":"Wir sprechen über das Projekt. Wir sprechen ___ .","a":["darüber","darueber"],"why":"über + thing → darüber."},{"t":"gap","q":"Ich schreibe mit dem Stift. Ich schreibe ___ .","a":["damit"],"why":"mit + thing → damit."},{"t":"gap","q":"Danke für die Hilfe. Danke ___ .","a":["dafür","dafuer"],"why":"für + thing → dafür."},{"t":"gap","q":"___ wartest du? – Auf den Bus.","a":["worauf"],"why":"Question about a thing: worauf."},{"t":"gap","q":"___ wartest du? – Auf meinen Mann.","a":["auf wen"],"why":"For a person keep the preposition: Auf wen?"},{"t":"gap","q":"___ denkst du? – An die Ferien.","a":["woran"],"why":"an + thing → woran."},{"t":"gap","q":"___ hast du das gemacht? – Mit dem Messer.","a":["womit"],"why":"mit + thing → womit."},{"t":"gap","q":"Ich freue mich auf das Wochenende. Ich freue mich ___ .","a":["darauf"],"why":"auf + thing → darauf."},{"t":"gap","q":"Ich habe mit meiner Kollegin gesprochen. Ich habe ___ gesprochen. (Person)","a":["mit ihr"],"why":"For a person, keep mit + pronoun."},{"t":"mc","q":"Why is it 'darauf' and not 'daauf'?","o":["it just is","an r goes in before a vowel"],"a":1,"why":"da + r + auf, to make it pronounceable."},{"t":"mc","q":"Wofür interessierst du dich? asks about:","o":["a thing","a person"],"a":0,"why":"wo- forms only refer to things."},{"t":"mc","q":"Ich habe Angst ___ . (vor Spinnen)","o":["davor","vor ihnen"],"a":0,"why":"Spiders here are a thing/idea, so davor."}]},{"id":"konj2","level":"B1","title":"Konjunktiv II","rule":"For wishes, polite requests and unreal conditions. würde + infinitive works for most verbs. Common short forms: wäre, hätte, könnte, müsste, würde.","items":[{"t":"gap","q":"Ich ___ gern einen Kaffee. (haben)","a":["hätte","haette"],"why":"hätte is the polite way to order or ask."},{"t":"gap","q":"Das ___ sehr nett von Ihnen. (sein)","a":["wäre","waere"],"why":"wäre is the Konjunktiv II of sein."},{"t":"gap","q":"___ Sie mir bitte helfen? (können)","a":["könnten","koennten"],"why":"könnten is more polite than können."},{"t":"gap","q":"Wenn ich Zeit hätte, ___ ich mitkommen.","a":["würde","wuerde"],"why":"würde + infinitive in the main clause."},{"t":"gap","q":"Wenn ich mehr Geld ___ , würde ich reisen. (haben)","a":["hätte","haette"],"why":"The wenn clause takes hätte."},{"t":"gap","q":"An deiner Stelle ___ ich das nicht machen.","a":["würde","wuerde"],"why":"würde for advice: if I were you."},{"t":"gap","q":"Du ___ mehr schlafen. (sollen)","a":["solltest"],"why":"solltest for gentle advice."},{"t":"gap","q":"Ich ___ jetzt eigentlich arbeiten. (müssen)","a":["müsste","muesste"],"why":"müsste = I really ought to."},{"t":"mc","q":"Which is the more polite request?","o":["Können Sie mir helfen?","Könnten Sie mir helfen?"],"a":1,"why":"Konjunktiv II softens the request."},{"t":"gap","q":"___ Sie mir bitte die Tür öffnen? (können)","a":["könnten","koennten"],"why":"Könnten Sie is the polite form."},{"t":"gap","q":"Ich ___ gern einen Termin vereinbaren. (mögen)","a":["möchte","moechte"],"why":"möchte is the standard polite form."},{"t":"gap","q":"Wenn ich du ___ , würde ich fragen. (sein)","a":["wäre","waere"],"why":"wäre in the wenn clause."},{"t":"gap","q":"Das ___ wirklich hilfreich. (sein)","a":["wäre","waere"],"why":"wäre for a hypothetical."},{"t":"gap","q":"Wir ___ uns sehr freuen. (werden)","a":["würden","wuerden"],"why":"würden + infinitive."},{"t":"gap","q":"Du ___ dich mal ausruhen. (sollen)","a":["solltest"],"why":"solltest for advice."},{"t":"gap","q":"Ich ___ gern wissen, wann es losgeht. (mögen)","a":["möchte","moechte","wüsste"],"why":"Ich möchte gern wissen is the natural polite phrasing."},{"t":"gap","q":"Wenn wir mehr Zeit ___ , würden wir bleiben. (haben)","a":["hätten","haetten"],"why":"hätten in the wenn clause."},{"t":"mc","q":"Which is a real Konjunktiv II form, not würde + infinitive?","o":["würde gehen","hätte","würde haben"],"a":1,"why":"haben, sein and the modals have their own short forms."},{"t":"mc","q":"Which sounds most polite in a shop?","o":["Ich will einen Kaffee.","Ich hätte gern einen Kaffee.","Geben Sie mir Kaffee."],"a":1,"why":"Ich hätte gern is the standard polite request."}],"tables":[{"title":"Wichtige Formen","head":["Verb","Konjunktiv II","Beispiel"],"rows":[["sein","wäre","Das wäre schön."],["haben","hätte","Ich hätte gern einen Kaffee."],["können","könnte","Könnten Sie mir helfen?"],["müssen","müsste","Ich müsste eigentlich gehen."],["dürfen","dürfte","Dürfte ich kurz stören?"],["sollen","sollte","Du solltest mehr schlafen."],["werden","würde","Ich würde gern mitkommen."],["wissen","wüsste","Ich wüsste gern mehr."],["gehen","ginge","Das ginge auch."]]},{"title":"Endungen","head":["","wäre","hätte","könnte"],"rows":[["ich","wäre","hätte","könnte"],["du","wärst","hättest","könntest"],["er/sie/es","wäre","hätte","könnte"],["wir","wären","hätten","könnten"],["ihr","wärt","hättet","könntet"],["sie/Sie","wären","hätten","könnten"]]},{"title":"Gebrauch","rows":[["höflich","Könnten Sie …? Ich hätte gern …"],["Wunsch","Wenn ich mehr Zeit hätte …"],["Rat","An deiner Stelle würde ich …"],["andere Verben","würde + Infinitiv"]]}],"en":"Subjunctive — polite requests, wishes, and hypotheticals","seq":55},{"id":"passiv","level":"B1","title":"Passiv","rule":"werden + participle. Present: Das Auto wird repariert. Past: Das Auto wurde repariert. Perfect: ist repariert worden. The doer, if named, comes with von.","items":[{"t":"gap","q":"Das Auto ___ gerade repariert.","a":["wird"],"why":"Present passive singular: wird + participle."},{"t":"gap","q":"Die Häuser ___ letztes Jahr gebaut.","a":["wurden"],"why":"Past passive plural: wurden."},{"t":"gap","q":"Der Brief ___ gestern geschrieben.","a":["wurde"],"why":"Past passive singular: wurde."},{"t":"gap","q":"Das Formular muss heute ___ werden. (ausfüllen)","a":["ausgefüllt","ausgefuellt"],"why":"Modal + participle + werden."},{"t":"gap","q":"Die Rechnung ist schon bezahlt ___ .","a":["worden"],"why":"In the perfect passive, geworden shortens to worden."},{"t":"gap","q":"Das Haus wurde ___ meinem Vater gebaut.","a":["von"],"why":"The agent takes von + dative."},{"t":"gap","q":"Hier ___ nicht geraucht.","a":["wird"],"why":"Impersonal passive for rules."},{"t":"gap","q":"Wann ___ der Bericht fertig geschrieben?","a":["wird"],"why":"Present passive question."},{"t":"mc","q":"Active: Der Techniker repariert das Gerät. Passive:","o":["Das Gerät wird repariert.","Das Gerät ist repariert.","Das Gerät hat repariert."],"a":0,"why":"werden + participle forms the passive."},{"t":"gap","q":"Die Formulare ___ heute bearbeitet.","a":["werden"],"why":"Plural present passive: werden."},{"t":"gap","q":"Der Vertrag ___ letzte Woche unterschrieben.","a":["wurde"],"why":"Past passive singular: wurde."},{"t":"gap","q":"Die Wohnung ist schon renoviert ___ .","a":["worden"],"why":"Perfect passive uses worden, not geworden."},{"t":"gap","q":"Das Problem kann schnell ___ werden. (lösen)","a":["gelöst","geloest"],"why":"Modal + participle + werden."},{"t":"gap","q":"Hier ___ nur Deutsch gesprochen.","a":["wird"],"why":"Impersonal passive."},{"t":"gap","q":"Die Kinder ___ von den Eltern abgeholt.","a":["werden"],"why":"Plural present passive."},{"t":"gap","q":"Das Haus wurde ___ einem Sturm beschädigt.","a":["durch"],"why":"durch + accusative for a cause, von for a person."},{"t":"gap","q":"Die Rechnung muss bis Freitag bezahlt ___ .","a":["werden"],"why":"Modal passive ends with werden."},{"t":"mc","q":"Active: Man repariert das Auto. Passive:","o":["Das Auto wird repariert.","Das Auto ist repariert.","Man wird das Auto repariert."],"a":0,"why":"man as subject usually becomes a passive with no agent."},{"t":"mc","q":"In the Perfekt passive, geworden becomes:","o":["geworden","worden","werden"],"a":1,"why":"ist repariert worden."}],"tables":[{"title":"Passivformen","head":["Zeit","Bildung","Beispiel"],"rows":[["Präsens","wird + Partizip II","Das Auto wird repariert."],["Präteritum","wurde + Partizip II","Das Auto wurde repariert."],["Perfekt","ist + Partizip II + worden","Das Auto ist repariert worden."],["mit Modalverb","muss + Partizip II + werden","Das Auto muss repariert werden."]]},{"title":"werden konjugieren","head":["","Präsens","Präteritum"],"rows":[["ich","werde","wurde"],["du","wirst","wurdest"],["er/sie/es","wird","wurde"],["wir","werden","wurden"],["ihr","werdet","wurdet"],["sie/Sie","werden","wurden"]]},{"title":"Merke","rows":[["Täter nennen","von + Dativ: von meinem Vater"],["Mittel nennen","durch + Akkusativ: durch den Sturm"],["Perfekt","geworden wird zu worden"]]}],"en":"Passive voice — when the thing is acted on, not the doer","seq":57},{"id":"futur","level":"B1","title":"Futur I und werden","rule":"werden + infinitive expresses future or a guess: Er wird morgen kommen. Er wird wohl krank sein. On its own, werden means to become: Es wird kalt.","items":[{"t":"gap","q":"Ich ___ morgen früher anfangen.","a":["werde"],"why":"ich werde + infinitive."},{"t":"gap","q":"Sie ___ nächstes Jahr nach Bern ziehen.","a":["wird"],"why":"sie wird + infinitive."},{"t":"gap","q":"Wir ___ das schon schaffen.","a":["werden"],"why":"wir werden."},{"t":"gap","q":"Er ___ wohl im Stau stehen.","a":["wird"],"why":"Guess about the present: wird wohl."},{"t":"gap","q":"Es ___ langsam kalt.","a":["wird"],"why":"werden alone means to become."},{"t":"gap","q":"Mein Sohn ___ im Mai sechs.","a":["wird"],"why":"werden for turning an age."},{"t":"gap","q":"Sie ___ Ärztin.","a":["wird"],"why":"werden + profession, no article needed."},{"t":"mc","q":"In everyday German, the future is most often expressed with:","o":["werden + infinitive","present tense + time word","Konjunktiv II"],"a":1,"why":"Morgen fahre ich nach Bern is far more common than the Futur I."},{"t":"mc","q":"Er wird jetzt zu Hause sein. This expresses:","o":["a future plan","a guess about now","a command"],"a":1,"why":"werden + infinitive often means a supposition about the present."},{"t":"gap","q":"Du ___ das schon schaffen.","a":["wirst"],"why":"du wirst."},{"t":"gap","q":"Ihr ___ euch bestimmt freuen.","a":["werdet"],"why":"ihr werdet."},{"t":"gap","q":"Es ___ morgen wohl regnen.","a":["wird"],"why":"wird wohl for a guess."},{"t":"gap","q":"Meine Tochter ___ nächstes Jahr sieben.","a":["wird"],"why":"werden for turning an age."},{"t":"gap","q":"Die Tage ___ jetzt kürzer.","a":["werden"],"why":"werden alone = to become."},{"t":"gap","q":"Wir ___ Sie morgen informieren.","a":["werden"],"why":"wir werden + infinitive."},{"t":"gap","q":"Er ___ jetzt wohl im Büro sein.","a":["wird"],"why":"A supposition about right now."},{"t":"mc","q":"Sie wird wohl krank sein. This means:","o":["She will get ill.","She is probably ill now.","She was ill."],"a":1,"why":"werden + wohl expresses a guess about the present."},{"t":"mc","q":"Which is the most natural way to say 'I'm flying to India tomorrow'?","o":["Ich werde morgen nach Indien fliegen.","Ich fliege morgen nach Indien."],"a":1,"why":"Present tense with a time word is the everyday choice."},{"t":"gap","q":"Was ___ aus dem Projekt?","a":["wird"],"why":"Was wird aus ...? = what will become of ...?"}],"tables":[{"title":"werden","head":["","Präsens"],"rows":[["ich","werde"],["du","wirst"],["er/sie/es","wird"],["wir","werden"],["ihr","werdet"],["sie/Sie","werden"]]},{"title":"Drei Funktionen von werden","rows":[["Futur I","werden + Infinitiv: Ich werde morgen kommen."],["Vermutung","Er wird wohl im Stau stehen."],["allein: to become","Es wird kalt. Sie wird Ärztin."],["Passiv","Das Auto wird repariert."]]},{"title":"Merke","rows":[["Alltag","Meist reicht das Präsens: Morgen fahre ich nach Bern."]]}],"en":"Future tense, and the many uses of 'werden'","seq":59},{"id":"lassen","level":"B1","seq":61,"title":"Das Verb lassen","en":"lassen — to let, to leave behind, and to have something done","rule":"lassen has three jobs. 1. Allow: Lass mich helfen. 2. Leave behind: Ich habe den Schlüssel zu Hause gelassen. 3. Have something done by someone else: Ich lasse das Auto reparieren. In the perfect with a second verb it becomes lassen, not gelassen: Ich habe das Auto reparieren lassen.","tables":[{"title":"Konjugation","head":["","lassen"],"rows":[["ich","lasse"],["du","lässt"],["er/sie/es","lässt"],["wir","lassen"],["ihr","lasst"],["sie/Sie","lassen"]]},{"title":"Die drei Bedeutungen","head":["Bedeutung","Beispiel"],"rows":[["erlauben","Lass mich bitte helfen."],["zurücklassen","Ich habe den Schirm im Zug gelassen."],["etwas machen lassen","Ich lasse mir die Haare schneiden."],["Aufforderung","Lass uns gehen! — Let's go."]]},{"title":"Perfekt","rows":[["allein","Ich habe den Schlüssel gelassen."],["mit zweitem ."},{"t":"gap","q":"Das ist der Mann, ___ Auto kaputt ist.","a":["dessen"],"why":"Possessive relative, masculine: dessen."},{"t":"gap","q":"Die Stadt, in ___ ich wohne, ist klein.","a":["der"],"why":"in + dative, feminine: der."},{"t":"mc","q":"Where does the verb go in a relative clause?","o":["position 2","at the end","first"],"a":1,"why":"Like every subordinate clause, the verb goes to the end."},{"t":"mc","q":"Der Stuhl, ___ ich gekauft habe, war teuer.","o":["der","den","dem"],"a":1,"why":"It is the object of kaufen, so masculine accusative: den."},{"t":"gap","q":"Das Buch, ___ auf dem Tisch liegt, ist meins.","a":["das"],"why":"Neuter subject: das."},{"t":"gap","q":"Der Zug, ___ ich nehme, fährt um acht.","a":["den"],"why":"Object of nehmen: masculine accusative den."},{"t":"gap","q":"Die Frau, ___ ich das Buch gegeben habe, ist weg.","a":["der"],"why":"Indirect object: feminine dative der."},{"t":"gap","q":"Die Leute, ___ ich geholfen habe, waren dankbar.","a":["denen"],"why":"helfen + dative plural: denen."},{"t":"gap","q":"Das ist die Frau, ___ Mann Arzt ist.","a":["deren"],"why":"Possessive relative, feminine: deren."},{"t":"gap","q":"Der Kollege, mit ___ ich arbeite, ist krank.","a":["dem"],"why":"mit + masculine dative: dem."},{"t":"gap","q":"Das Haus, in ___ wir wohnen, ist alt.","a":["dem"],"why":"in + neuter dative: dem."},{"t":"gap","q":"Die Kinder, ___ hier wohnen, gehen in meine Schule.","a":["die"],"why":"Plural subject: die."},{"t":"mc","q":"What determines the CASE of the relative pronoun?","o":["the noun before it","its role inside the relative clause","the main verb"],"a":1,"why":"Gender and number come from the noun; case comes from the clause."},{"t":"mc","q":"Der Mann, ___ ich gestern getroffen habe, …","o":["der","den","dem"],"a":1,"why":"Object of treffen: masculine accusative den."}],"tables":[{"title":"Relativpronomen","head":["","maskulin","feminin","neutral","Plural"],"rows":[["Nominativ","der","die","das","die"],["Akkusativ","den","d /* ================= storage (safe) ================= */
const mem = {};
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
let marks = {};
try{ marks = JSON.parse(store.get("hoerbar.marks")||"{}"); }catch(e){ marks = {}; }
const saveMarks = () => store.set("hoerbar.marks", JSON.stringify(marks));

/* ================= state ================= */
let setIx = parseInt(store.get("hoerbar.set")||"0",10) || 0;
let i = 0, autoOn = false, slowOn = false, blindOn = false, speaking = false, runId = 0;
const cur = () => SETS[setIx].words[i];
const key = () => setIx + ":" + i;

const $ = id => document.getElementById(id);
const card = document.querySelector(".card");
const elWord=$("word"), elGloss=$("gloss"), elDe=$("de"), elEn=$("en"),
      elCount=$("counter"), elTicks=$("ticks"), elSets=$("sets"), elReveal=$("reveal");

/* ================= voice ================= */
let voice = null;
function deVoices(){
  let v=[]; try{ v=speechSynthesis.getVoices()||[]; }catch(e){}
  return v.filter(x=>/^de/i.test(x.lang));
}
function pickVoice(){
  const de=deVoices();
  if(!de.length) return;
  const saved=store.get("hoerbar.voice");
  voice = (saved && de.find(x=>x.name===saved))
       || de.find(x=>x.lang==="de-CH")
       || de.find(x=>x.lang==="de-DE")
       || de[0] || null;
  if(!voice) $("note").textContent = "No German voice found. On iPhone: Settings › Accessibility › Spoken Content › Voices › German.";
}
pickVoice();
if(typeof speechSynthesis!=="undefined") speechSynthesis.onvoiceschanged = pickVoice;

function hardStop(){
  try{ aStopPlay(); }catch(e){}
  try{
    speechSynthesis.cancel();
    if(speechSynthesis.paused) speechSynthesis.resume();
    speechSynthesis.cancel();
  }catch(e){}
  try{
    document.querySelectorAll(".pb.on").forEach(x=>{ x.className="pb"; });
  }catch(e){}
  try{ setSpeaking(false); }catch(e){}
}

function utter(text, rate){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = voice ? voice.lang : "de-DE";
  if(voice) u.voice = voice;
  u.rate = rate; u.pitch = 1.02; u.volume = 1;
  return u;
}

/* speaks the word, a beat, then the sentence; resolves when done */
function speakCard(){
  const myRun = ++runId;
  const [w,,de] = cur();
  const rate = slowOn ? 0.65 : 0.92;
  speechSynthesis.cancel();
  setSpeaking(true);

  return new Promise(resolve => {
    const uw = utter(w, rate);
    const finish = () => { if(myRun===runId) setSpeaking(false); resolve(); };
    uw.onend = () => {
      if(myRun!==runId) return;
      setTimeout(()=>{
        if(myRun!==runId) return;
        const us = utter(de, rate);
        us.onend = finish; us.onerror = finish;
        speechSynthesis.speak(us);
      }, 550);
    };
    uw.onerror = finish;
    speechSynthesis.speak(uw);
  });
}

function setSpeaking(on){
  speaking = on;
  document.body.classList.toggle("speaking", on);
  $("play").firstElementChild.innerHTML = on ? "<b>■</b>Stopp" : "<b>▶</b>Hören";
}

function stopAll(){
  runId++;
  try{ speechSynthesis.cancel(); if(speechSynthesis.paused) speechSynthesis.resume(); speechSynthesis.cancel(); }catch(e){}
  setSpeaking(false);
}

/* ================= auto loop ================= */
let looping=false;
async function autoLoop(){
  if(looping) return;
  looping=true;
  try{
  while(autoOn){
    await speakCard();
    if(!autoOn) break;
    await new Promise(r=>setTimeout(r, 900));
    if(!autoOn) break;
    if(i >= SETS[setIx].words.length - 1){ autoOn=false; $("auto").setAttribute("aria-pressed","false"); break; }
    move(1, true);
    await new Promise(r=>setTimeout(r, 250));
  }
  } finally { looping=false; }
}

/* ================= render ================= */
function render(){
  const [w,en,de,ende] = cur();
  elWord.textContent = w;
  elGloss.textContent = en;
  elDe.textContent = de;
  elEn.textContent = ende;
  elCount.textContent = (i+1) + " / " + SETS[setIx].words.length;

  const isPhrase = SETS[setIx].type === "phrase";
  elWord.classList.toggle("phrase", isPhrase);
  card.classList.toggle("phrase", isPhrase);

  const m = marks[key()];
  $("mKnown").setAttribute("aria-pressed", m==="known" ? "true":"false");
  $("mAgain").setAttribute("aria-pressed", m==="again" ? "true":"false");

  elGloss.classList.toggle("hidden", blindOn);
  elEn.classList.toggle("hidden", blindOn);
  elReveal.hidden = !blindOn;
  elReveal.textContent = "Show English";

  elTicks.innerHTML = "";
  SETS[setIx].words.forEach((_,n)=>{
    const t=document.createElement("div"); t.className="tick";
    const mk = marks[setIx+":"+n];
    if(mk==="known") t.classList.add("known");
    else if(mk) t.classList.add("seen");
    if(n===i) t.className = "tick here";
    elTicks.appendChild(t);
  });
}

function move(d, keepSpeech){
  const n = SETS[setIx].words.length;
  i = (i + d + n) % n;
  if(!keepSpeech) stopAll();
  render();
}

function buildSets(){
  elSets.innerHTML="";
  SETS.forEach((s,n)=>{
    const b=document.createElement("button");
    b.className = s.type==="phrase" ? "set ph" : "set"; b.textContent=s.name;
    b.setAttribute("aria-pressed", n===setIx ? "true":"false");
    b.onclick = ()=>{
      autoOn=false; $("auto").setAttribute("aria-pressed","false");
      stopAll(); setIx=n; i=0; store.set("hoerbar.set", String(n));
      buildSets(); render();
    };
    elSets.appendChild(b);
  });
}

/* ================= events ================= */
$("play").onclick = ()=>{
  if(speaking){ autoOn=false; $("auto").setAttribute("aria-pressed","false"); stopAll(); return; }
  if(autoOn) autoLoop(); else speakCard();
};
$("prev").onclick = ()=>move(-1);
$("next").onclick = ()=>move(1);

$("slow").onclick = e=>{
  slowOn=!slowOn; e.currentTarget.setAttribute("aria-pressed", slowOn?"true":"false");
  if(speaking){ stopAll(); autoOn ? autoLoop() : speakCard(); }
};
$("auto").onclick = e=>{
  autoOn=!autoOn; e.currentTarget.setAttribute("aria-pressed", autoOn?"true":"false");
  if(autoOn){ if(!speaking) autoLoop(); } else stopAll();
};
$("blind").onclick = e=>{
  blindOn=!blindOn; e.currentTarget.setAttribute("aria-pressed", blindOn?"true":"false");
  render();
};
elReveal.onclick = ()=>{
  elGloss.classList.remove("hidden"); elEn.classList.remove("hidden");
  elReveal.textContent = "Revealed";
};
$("mKnown").onclick = ()=>{
  marks[key()] = marks[key()]==="known" ? null : "known";
  if(!marks[key()]) delete marks[key()];
  saveMarks(); render();
};
$("mAgain").onclick = ()=>{
  marks[key()] = marks[key()]==="again" ? null : "again";
  if(!marks[key()]) delete marks[key()];
  saveMarks(); render();
};

document.addEventListener("keydown", e=>{
  const t=e.target, tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(t&&t.isContentEditable)) return;
  var bc=document.body.classList; if(bc.contains("g")||bc.contains("s")||bc.contains("k")||bc.contains("n")) return;
  if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key===" "){ e.preventDefault(); $("play").click(); }
});

/* swipe on the card */
let sx=0, sy=0;
card.addEventListener("touchstart", e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; }, {passive:true});
card.addEventListener("touchend", e=>{
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) move(dx<0?1:-1);
}, {passive:true});

document.addEventListener("visibilitychange", ()=>{
  if(document.hidden){ autoOn=false; $("auto").setAttribute("aria-pressed","false"); stopAll(); try{ hardStop(); }catch(e){} }
});

buildSets(); render();

/* ================= word search ================= */
const INDEX=[];
function keyPair(s){
  const b=(s||"").toLowerCase().replace(/[.!?,;:()]/g,"").replace(/\s+/g," ").trim();
  return { ae: b.replace(/ß/g,"ss").replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue"),
           pl: b.replace(/ß/g,"ss").replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u") };
}
SETS.forEach((s,si)=>s.words.forEach((w,wi)=>INDEX.push({
  si,wi,w:w[0],en:w[1],de:w[2],ende:w[3],set:s.name,
  kw:keyPair(w[0]), ken:keyPair(w[1]), kde:keyPair(w[2]), kende:keyPair(w[3])
})));

const kEq     = (p,q)=> p.ae===q.ae || p.pl===q.pl;
const kStarts = (p,q)=> p.ae.startsWith(q.ae) || p.pl.startsWith(q.pl);
const kHas    = (p,q)=> p.ae.includes(q.ae) || p.pl.includes(q.pl);

function scoreHit(e,q){
  if(kEq(e.kw,q)||kEq(e.ken,q)) return 0;
  if(kStarts(e.kw,q)) return 1;
  if(kStarts(e.ken,q)) return 2;
  if(kHas(e.kw,q)) return 3;
  if(kHas(e.ken,q)) return 4;
  if(kHas(e.kde,q)||kHas(e.kende,q)) return 5;
  return -1;
}

function hilite(txt,q){
  const t=String(txt);
  const low=t.toLowerCase().replace(/ä/g,"a").replace(/ö/g,"o").replace(/ü/g,"u");
  const i=low.indexOf(q.pl);
  if(i<0||!q.pl) return esc(t);
  return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.pl.length))+'</mark>'+esc(t.slice(i+q.pl.length));
}

function runSearch(){
  const raw=$("wq").value, q=keyPair(raw), out=$("wres");
  if(q.pl.length<2){ out.innerHTML='<p class="rescount">Mindestens zwei Buchstaben eingeben.</p>'; return; }
  const hits=[];
  for(const e of INDEX){ const sc=scoreHit(e,q); if(sc>=0) hits.push({e,sc}); }
  hits.sort((a,b)=>a.sc-b.sc || a.e.w.length-b.e.w.length);
  if(!hits.length){ out.innerHTML='<p class="rescount">Keine Treffer für "'+esc(raw)+'".</p>'; return; }
  const show=hits.slice(0,60);
  let html='<p class="rescount">'+hits.length+' Treffer'+(hits.length>60?', erste 60':'')+'</p>';
  show.forEach(({e})=>{
    html+='<button class="res" data-s="'+e.si+'" data-i="'+e.wi+'">'+
      '<span class="rw">'+hilite(e.w,q)+'</span>'+
      '<span class="rg">'+hilite(e.en,q)+'</span>'+
      '<span class="rs">'+esc(e.set)+' · '+esc(e.de)+'</span></button>';
  });
  out.innerHTML=html;
  out.querySelectorAll(".res").forEach(b=>b.onclick=()=>gotoWord(+b.dataset.s,+b.dataset.i));
}

function gotoWord(si,wi){
  autoOn=false; $("auto").setAttribute("aria-pressed","false");
  stopAll();
  setIx=si; i=wi; store.set("hoerbar.set", String(si));
  buildSets(); render();
  $("wsheet").classList.remove("open");
  if($("wq").blur) $("wq").blur();
  try{ speakCard(); }catch(e){}
}

};

te Bus?","When comes the next bus?"]],"o":185},{"w":"Butter","en":"butter","art":"die","pl":"(Sg.)","hint":"","vf":"","s":[["Möchtest du Butter aufs Brot oder nur Käse?","Do you want butter on bread or just cheese?"]],"o":186},{"w":"Café","en":"Coffee shop","art":"das","pl":"-s","hint":"french origin","vf":"","s":[["Kommst du mit ins Café? Ich möchte gern einen Kaffee trinken.","Are you coming to the cafe? I'd like to have a coffee."]],"o":187},{"w":"Cafeteria","en":"cafeteria","art":"die","pl":"-s","hint":"","vf":"","s":[["Ich gehe jetzt in die Cafeteria. Soll ich dir etwas mitbringen?","I'm going to the cafeteria now. Should I bring you something?"]],"o":188},{"w":"chatten","en":"to chat","art":"","pl":"","hint":"","vf":"chattet, hat gechattet","s":[["Luis chattet gern mit seinen Freunden im Internet.","Luis likes to chat with his friends on the Internet."]],"o":189},{"w":"Datum","en":"date","art":"das","pl":"-en","hint":"","vf":"","s":[["Bitte Datum und Unterschrift nicht vergessen!","Please do not forget the date and signature!"],["Welches Datum haben wir heute?","What date do we have today?"],["Haben Sie meine Kontaktdaten?","Do you have my contact details?"]],"o":190},{"w":"dauern","en":"to last","art":"","pl":"","hint":"","vf":"dauert, hat gedauert","s":[["Wie lange dauert die Pause? - Eine halbe Stunde.","How long is the break? - Half an hour."]],"o":191},{"w":"denken","en":"to think","art":"","pl":"","hint":"","vf":"denkt, hat gedacht","s":[["Ich denke, du hast recht.","I think you are right."],["Ich denke oft an meine Freundin.","I often think of my girlfriend."],["Was denktst du? Sollen wir heute Abend ins Kino gehen?","What do you think? Shall we go to the cinema tonight?"]],"o":192},{"w":"Chef","en":"male boss","art":"der","pl":"-s","hint":"","vf":"","s":[["Wir haben einen neuen Chef.","We have a new boss."]],"o":193},{"w":"Chefin","en":"female boss","art":"die","pl":"-nen","hint":"","vf":"","s":[["Wir haben eine neue Chefin.","We have a new boss."]],"o":194},{"w":"Club","en":"club","art":"der","pl":"-s","hint":"auch Klub geschrieben","vf":"","s":[["Gibt es hier einen Tennis-Club?","Is there a tennis club?"],["Ich möchte gern tanzen gehen. Wo gibt es hier einen Club mit guter Musik?","I would like to go dancing. Where is there a club with good music?"]],"o":195},{"w":"Comic","en":"comic","art":"das","pl":"-s","hint":"","vf":"","s":[["Mein Sohn liest immer nur Comics.","My son always reads comics."]],"o":196},{"w":"denn","en":"because","art":"","pl":"","hint":"","vf":"","s":[["Ich kann nicht kommen, denn ich bin krank.","I can not come, for I am sick."]],"o":197},{"w":"deshalb","en":"therefore / that's why","art":"","pl":"","hint":"","vf":"","s":[["Ich bin krank. Deshalb komme ich heute nicht ins Büro.","I'm sick. That's why I'm not coming to the office today."]],"o":198},{"w":"deutlich","en":"clear","art":"","pl":"","hint":"","vf":"","s":[["Sprechen Sie bitte deutlich!","Please speak clearly!"],["Können Sie das bitte deutlicher schreiben? Ich kann das nicht lesen.","Can you please write this more clearly? I can not read this."]],"o":199},{"w":"Computer","en":"computer","art":"der","pl":"-","hint":"","vf":"","s":[["Wann bekommst du deinen neuen Computer?","When will you get your new computer?"]],"o":200},{"w":"Creme","en":"cream","art":"die","pl":"-s/-n","hint":"","vf":"","s":[["Ich suche eine Creme für die Hände.","I'm looking for a cream for the hands."],["Der Kuchen schmeckt super! Was ist in der Creme? - Das ist eine Buttercreme mit viel Schokolade.","The cake tastes great! What is in the cream? - This is a butter cream with lots of chocolate."]],"o":201},{"w":"dick","en":"thick","art":"","pl":"","hint":"","vf":"","s":[["Ich bin zu dick. Ich muss weniger essen.","I am too fat. I have to eat less."]],"o":202},{"w":"Ding","en":"thing","art":"das","pl":"-e","hint":"","vf":"","s":[["Gib mir bitte mal das Ding da drüben!","Please give me the thing over there!"],["Was macht man mit diesem Ding? - Damit kann man Flaschen öffnen.","What do you do with this thing? - This allows bottles to be opened."]],"o":203},{"w":"direkt","en":"directly","art":"","pl":"","hint":"","vf":"","s":[["Wir wohnen direkt über dem Café.","We live right above the café."],["Ich möchte nicht direkt nach der Schule studieren, ich möchte erst reisen.","I do not want to study directly after school, I would like to travel first."],["Gibt es keinen direkten Zug nach Hamburg? - Nein, da müssen Sie immer umsteigen.","Is there no direct train to Hamburg? - No, you always have to change."],["Wir liefern Ihnen das Sofa direkt ins Haus.","We deliver the sofa directly into the house."]],"o":204},{"w":"da","en":"there","art":"","pl":"","hint":"","vf":"","s":[["Welche Bluse nehmen Sie? - Die da.","What blouse do you take? - That one."],["Wir sprechen gerade über Paul. Da kommt er ja.","We are talking about Paul. There he comes."],["Ist Herr Klein schon da?","Is Mr Klein already there?"],["Da drüben ist der Bahnhof.","Over there is the train station."]],"o":205},{"w":"Disco","en":"Disco","art":"die","pl":"-s","hint":"auch Disko geschrieben","vf":"","s":[["Wir gehen heute Abend in die Disco.","We go to the disco tonight."]],"o":206},{"w":"diskutieren","en":"to discuss","art":"","pl":"","hint":"","vf":"diskutiert, hat diskutiert","s":[["Ich möchte das mit meinen Kollegen diskutieren.","I would like to discuss this with my colleagues."]],"o":207},{"w":"dabei sein","en":"to be present / to be there","art":"","pl":"","hint":"","vf":"ist dabei, war dabei, ist dabei gewesen","s":[["Hast du einen Stift dabei?","Do you have a pen?"],["Schön, dass du da bist. Ist deine Familie auch dabei?","Nice that you're here. Is your family there too?"]],"o":208},{"w":"darüber","en":"about that","art":"","pl":"","hint":"","vf":"","s":[["Darüber spreche ich nicht gern.","I do not like to talk about that."]],"o":209},{"w":"doch","en":"still / however / but","art":"","pl":"","hint":"","vf":"","s":[["Hast du keinen Hunger? - Doch, ich bin sehr hungrig.","Are you not hungry? - Yes, I'm very hungry."],["Kannst du morgen nicht kommen? - Doch.","Can not you come tomorrow? - But."],["Geh doch mal wieder ins Kino!","Go back to the cinema!"],["Das macht doch nichts!","That does not matter!"]],"o":210},{"w":"darauf","en":"afterwards / after that / thereon","art":"","pl":"","hint":"","vf":"","s":[["Darauf fällt mir keine Antwort ein.","I can not think of that."]],"o":211},{"w":"dagegen sein","en":"be against","art":"","pl":"","hint":"","vf":"ist dagegen, war dagegen, ist dagegen gewesen","s":[["Ich bin dagegen.","I'm against it."]],"o":212},{"w":"dafür sein","en":"to be for it","art":"","pl":"","hint":"","vf":"ist dafür, war dafür, ist dafür gewesen","s":[["Ich bin dafür.","I am in favor."]],"o":213},{"w":"damals","en":"back then","art":"","pl":"","hint":"","vf":"","s":[["Als Student hatte ich viel Zeit und wollte reisen, aber damals hatte ich kein Geld.","As a student I had a lot of time and wanted to travel, but then I had no money."]],"o":214},{"w":"Doppelzimmer","en":"double room","art":"das","pl":"-","hint":"","vf":"","s":[["Möchten Sie ein Doppelzimmer oder ein Einzelzimmer?","Would you like a double or a single room?"]],"o":215},{"w":"Dame","en":"lady","art":"die","pl":"-n","hint":"","vf":"","s":[["Damen (an der Toilette)","Women (at the toilet)"],["Sehr geehrte Damen und Herren","Dear Ladies and Gentlemen"]],"o":216},{"w":"daneben","en":"aside / beside","art":"","pl":"","hint":"","vf":"","s":[["Du weißt doch, wo die Post ist. Daneben ist die Bank.","You know where the post office is. Next to it is the bank."]],"o":217},{"w":"Dank","en":"thanks","art":"der","pl":"(Sg.)","hint":"","vf":"","s":[["Vielen Dank!","Many Thanks!"],["Herzlichen Dank!","Thank you very much!"]],"o":218},{"w":"Dorf","en":"village","art":"das","pl":"\"-er","hint":"","vf":"","s":[["Unser Dorf liegt direkt an der Autobahn.","Our village is located directly on the highway."],["Meine Familie lebt in einem Dorf.","My family lives in a village."]],"o":219},{"w":"dort","en":"there","art":"","pl":"","hint":"","vf":"","s":[["Wir treffen uns vor dem Kino. - Gut, ich bin in fünf Minuten dort.","We meet in front of the cinema. - Well, I'll be there in five minutes."],["Dort ist unser Haus.","There is our house."],["Kommst du mit in die Stadt? - Nein, ich komme gerade von dort.","Are you coming to the city? - No, I've just come from there."]],"o":220},{"w":"dorther","en":"thence / from there","art":"","pl":"","hint":"","vf":"","s":[["Kommst du mit in die Stadt? - Nein, ich komme gerade dorther.","Are you coming to the city? - No, I've just come there."]],"o":221},{"w":"dorthin","en":"to there","art":"","pl":"","hint":"","vf":"","s":[["Deine Tasche kannst du dorthin stellen.","You can put your bag there."]],"o":222},{"w":"danke","en":"Thank you","art":"","pl":"","hint":"","vf":"","s":[["Soll ich Ihnen helfen? - Sehr freundlich, ja danke!","Can I help you? - Very friendly, yes thank you!"],["Guten Appetit! - Danke gleichfalls.","Good Appetite! - Thank you likewise."]],"o":223},{"w":"draußen","en":"outside","art":"","pl":"","hint":"","vf":"","s":[["Das Wetter ist so schön. Wollen wir draußen sitzen?","The weather is so nice. Do we want to sit outside?"],["Hunde müssen draußen bleiben.","Dogs have to stay outside."]],"o":224},{"w":"danken","en":"to thank","art":"","pl":"","hint":"","vf":"dankt, hat gedankt","s":[["Ich danke Ihnen für die Einladung.","Thank you for the invitation."]],"o":225},{"w":"dann","en":"then","art":"","pl":"","hint":"","vf":"","s":[["Ich muss noch schnell zur Post, dann komme ich.","I have to go to the post office quickly, then I come."],["Wenn es nicht regnet, dann kommen wir.","If it does not rain, then we come."]],"o":226},{"w":"dringend","en":"urgent","art":"","pl":"","hint":"","vf":"","s":[["Bitte kommen Sie schnell. Es ist dringend.","Please come fast. It's urgent."]],"o":227},{"w":"drinnen","en":"indoors","art":"","pl":"","hint":"","vf":"","s":[["Wollen Sie drinnen oder draußen sitzen?","Do you want to sit inside or outside?"],["Hier drinnen ist es sehr warm.","Inside it is very warm."]],"o":228},{"w":"dass","en":"that","art":"","pl":"","hint":"","vf":"","s":[["Rico hat gesagt, dass er auch zur Party kommt.","Rico said he was going to the party."],["Ich finde es super, dass du mich besuchst.","I think it's great that you visit me."]],"o":229},{"w":"Datei","en":"file","art":"die","pl":"-en","hint":"","vf":"","s":[["Wo hast du die Datei gespeichert?","Where did you save the file?"],["Kannst du die Datei bitte öffnen?","Can you open the file please?"]],"o":230},{"w":"drüben","en":"over there","art":"","pl":"","hint":"","vf":"","s":[["Da drüben ist die Haltestelle.","Over there is the stop."]],"o":231},{"w":"drücken","en":"to press","art":"","pl":"","hint":"","vf":"drückt, hat gedrückt","s":[["An dieser Tür musst du drücken, nicht ziehen, dann geht sie auf.","At this door you have to press, not pull, then she goes up."],["Drücken Sie „Bestätigen“!","Press \"Confirm\"!"],["Meine Schuhe drücken.","Push my shoes."]],"o":232},{"w":"drucken","en":"to print","art":"","pl":"","hint":"","vf":"druckt, hat gedruckt","s":[["Wähle einfach „Datei drucken“!","Just select \"Print file\"!"]],"o":233},{"w":"Einkaufszentrum","en":"shopping mall","art":"das","pl":"-en","hint":"","vf":"","s":[["Kommst du morgen mit ins Einkaufszentrum?","Are you coming to the shopping center tomorrow?"]],"o":234},{"w":"Drucker","en":"printer","art":"der","pl":"-","hint":"","vf":"","s":[["Mein Drucker ist kaputt.","My printer is broken."]],"o":235},{"w":"dumm","en":"stupid","art":"","pl":"","hint":"","vf":"","s":[["Ich finde den Film dumm.","I find the movie stupid."],["Entschuldigung, das war dumm von mir.","Excuse me, that was stupid of me."],["Das ist mir zu dumm.","This is too stupid for me."]],"o":236},{"w":"einladen","en":"to invite","art":"","pl":"","hint":"","vf":"lädt ein, hat eingeladen","s":[["Darf ich Sie zu einem Kaffee einladen?","May I invite you to a coffee?"]],"o":237},{" t","art":"das","pl":"-e","hint":"","vf":"","s":[["Im Sommer schlafen wir manchmal im Zelt.","In the summer we sometimes sleep in the tent."]],"o":1206},{"w":"Zentrum","en":"center","art":"das","pl":"-en","hint":"","vf":"","s":[["Der Bahnhof ist im Stadtzentrum.","The station is in the city center."],["Wohnst du im Zentrum? - Nein, ich wohne nicht direkt in der Stadt.","Do you live in the center? - No, I do not live directly in the city."]],"o":1207},{"w":"Zettel","en":"note","art":"der","pl":"-","hint":"","vf":"","s":[["Hast du einen Zettel für mich? Ich muss etwas notieren.","Do you have a note for me? I have to write down something."],["Schreiben Sie Ihre Telefonnummer bitte auf den Zettel.","Please write down your telephone number."]],"o":1208},{"w":"zusammen","en":"together","art":"","pl":"","hint":"","vf":"","s":[["Wollen wir zusammen essen gehen?","Do we want to eat together?"],["Zahlen, bitte. - Zusammen oder getrennt?","Pay please. - Together or separately?"],["Das macht zusammen 10 Euro 80.","That makes a total of 10 Euro 80."]],"o":1209},{"w":"zwischen","en":"in between","art":"","pl":"","hint":"","vf":"","s":[["Heidelberg liegt zwischen Frankfurt und Stuttgart.","Heidelberg is located between Frankfurt and Stuttgart."],["Zwischen acht und zehn Uhr bin ich zu Hause.","Between eight and ten o'clock I am at home."]],"o":1210},{"w":"Zeugnis","en":"certificate / school report","art":"das","pl":"-se","hint":"","vf":"","s":[["Morgen bekommen die Kinder ihr Zeugnis.","Tomorrow the children will get their testimony."]],"o":1211},{"w":"anziehen","en":"to dress / to put (sth.) on / to attract","art":"","pl":"","hint":"","vf":"zieht an, hat angezohen, ist angezogen","s":[["Ich ziehe eine Jacke an.","I put on a jacket."],["Ich ziehe mir eine Jacke an.","I wear a jacket."],["Er hat seinen Pullover ausgezogen und eine Jacke angezogen.","He pulled off his sweater and put on a jacket."]],"o":1212},{"w":"ausziehen","en":"move out","art":"","pl":"","hint":"","vf":"zieht aus, hat ausgezogen, ist ausgezohen","s":[["Er hat sein T-Shirt ausgezogen und ein Hemd angezogen.","He pulled out his T-shirt and put on a shirt."],["Die Nachbarn sind am Wochenende ausgezogen.","The neighbors moved out on the weekend."]],"o":1213},{"w":"Ziel","en":"aim / target","art":"das","pl":"-e","hint":"","vf":"","s":[["John läuft sehr schnell. Er war als erster am Ziel.","John is running very fast. He was the first."],["Was ist dein Ziel im Leben?","What is your goal in life?"]],"o":1214}];

const SPEAKS = [{"id":"sp_intro","level":"A1","title":"Erzählen Sie von sich","en":"Introduce yourself — the one you will definitely be asked","sec":90,"prompt":"Erzählen Sie von sich: Name, Alter, Herkunft, Familie, Wohnort und Beruf.","promptEn":"Tell us about yourself: name, age, where you're from, family, where you live, and your job.","points":[{"t":"Name und Alter","en":"name and age","k":["heisse","name ist","jahre alt","fünfunddreissig","fuenfunddreissig"]},{"t":"Herkunft","en":"where you're from","k":["komme aus","indien","hyderabad","heimatstadt"]},{"t":"Wohnort","en":"where you live now","k":["wohne","adliswil","zürich","zuerich","seit vier jahren"]},{"t":"Familie","en":"your family","k":["verheiratet","mann","kinder","sohn","tochter"]},{"t":"Beruf","en":"your job","k":["beruf","data engineer","gearbeitet","pause","zurückkehren","zurueckkehren"]},{"t":"Hobbys","en":"your hobbies","k":["freizeit","handarbeiten","häkle","haekle","häkeln","haekeln","makramee","male","malen","programmiere","basteln"]},{"t":"Grund für die Prüfung","en":"why you need the exam","k":["ausweis c","prüfung","pruefung","brauche"]}],"phrases":[["Mein Name ist … / Ich heisse …","My name is …"],["Ich komme aus …","I'm from …"],["Seit vier Jahren wohne ich in …","I've lived in … for four years."],["Ich bin verheiratet und wir haben zwei Kinder.","I'm married and we have two children."],["Von Beruf bin ich …","By profession I'm a …"],["Ich habe eine Pause gemacht.","I took a break."],["deshalb lerne ich Deutsch","that's why I'm learning German"],["In meiner Freizeit mache ich gern Handarbeiten.","In my free time I like doing handicrafts."],["Ich häkle und mache Makramee.","I crochet and do macramé."],["Ich male auch gern.","I also like painting."],["Das entspannt mich.","It relaxes me."],["… wenn die Kinder schlafen","… when the children are asleep"]],"text":[["Mein Name ist Sudheshna. Ich bin fünfunddreissig Jahre alt und komme aus Indien. Meine Heimatstadt ist Hyderabad. Das ist eine grosse Stadt im Süden Indiens, im Bundesstaat Telangana.","My name is Sudheshna. I am thirty-five years old and I come from India. My home city is Hyderabad. It's a big city in the south of India, in the state of Telangana."],["Seit vier Jahren wohne ich mit meiner Familie in Adliswil. Das ist eine kleine Stadt in der Nähe von Zürich. Es gefällt mir hier sehr gut, weil es ruhig und grün ist. Trotzdem ist man in zwanzig Minuten in der Stadt.","For four years I've lived with my family in Adliswil. It's a small town near Zurich. I like it here very much, because it's quiet and green. Even so, you're in the city in twenty minutes."],["Ich bin verheiratet. Mein Mann heisst Tharun und arbeitet als DevOps Engineer bei FIS. Wir haben zwei Kinder. Mein Sohn ist sieben Jahre alt und geht in die erste Klasse. Meine Tochter ist erst ein Jahr alt.","I'm married. My husband is called Tharun and works as a DevOps engineer at FIS. We have two children. My son is seven years old and is in the first class. My daughter is only one year old."],["Von Beruf bin ich Data Engineer. In Indien habe ich acht Jahre in diesem Bereich gearbeitet. Nach der Geburt meiner Kinder habe ich eine Pause gemacht. Jetzt möchte ich wieder in meinen Beruf zurückkehren, und deshalb lerne ich Deutsch.","By profession I'm a data engineer. In India I worked in this field for eight years. After my children were born I took a break. Now I'd like to return to my profession, and that's why I'm learning German."],["In meiner Freizeit mache ich gern Handarbeiten. Ich häkle, mache Makramee und male auch gern. Das entspannt mich sehr, besonders am Abend, wenn die Kinder schlafen. Ausserdem programmiere ich ein bisschen und entwickle kleine Apps für meine Familie.","In my free time I like doing handicrafts. I crochet, do macramé and also like painting. It relaxes me a lot, especially in the evening when the children are asleep. I also do a bit of programming and develop small apps for my family."],["Diese Prüfung brauche ich für den Ausweis C.","I need this exam for the C permit."]],"tip":"Speak this as one long monologue. Several reports say a detailed introduction makes the examiner skip the A2 question entirely.","fups":[["Wie ist Ihr Name?","What is your name?","Mein Name ist Sudheshna. Mit Vornamen Sudheshna, mein Familienname ist R.","My name is Sudheshna. My first name is Sudheshna, my surname is R."],["Können Sie Ihren Namen buchstabieren?","Can you spell your name?","Ja, gern: S – U – D – H – E – S – H – N – A.","Yes, gladly: S – U – D – H – E – S – H – N – A."],["Wann sind Sie geboren?","When were you born?","Ich bin am zwölften März neunzehnhundertneunzig geboren. Ich bin also fünfunddreissig Jahre alt.","I was born on the twelfth of March nineteen ninety. So I'm thirty-five years old."],["Woher kommen Sie genau?","Where exactly are you from?","Ich komme aus Hyderabad. Das ist die Hauptstadt vom Bundesstaat Telangana, im Süden von Indien.","I'm from Hyderabad. It's the capital of the state of Telangana, in the south of India."],["Wie gross ist Hyderabad?","How big is Hyderabad?","Hyderabad ist sehr gross, viel grösser als Zürich. Dort leben etwa zehn Millionen Menschen.","Hyderabad is very big, much bigger than Zurich. About ten million people live there."],["Wie ist das Wetter in Ihrer Heimat?","What's the weather like back home?","In Hyderabad ist es fast immer warm, oft über dreissig Grad. Schnee gibt es dort nie. Der Winter in der Schweiz war am Anfang schwierig für mich.","In Hyderabad it's almost always warm, often over thirty degrees. There's never any snow. The winter in Switzerland was difficult for me at first."],["Welche Sprachen sprechen Sie?","Which languages do you speak?","Meine Muttersprache ist Telugu. Ausserdem spreche ich Hindi und Englisch, und jetzt lerne ich Deutsch.","My mother tongue is Telugu. I also speak Hindi and English, and now I'm learning German."],["Was ist ein typisches Essen aus Hyderabad?","What's a typical dish from Hyderabad?","Biryani. Das ist ein Reisgericht mit Fleisch oder Gemüse und vielen Gewürzen. Es ist ziemlich scharf.","Biryani. It's a rice dish with meat or vegetables and lots of spices. It's quite spicy."],["Fahren Sie oft nach Indien?","Do you often travel to India?","Leider nicht so oft, etwa alle zwei Jahre. Der Flug ist lang und mit kleinen Kindern ist es anstrengend.","Unfortunately not that often, about every two years. The flight is long and with small children it's tiring."],["Vermissen Sie Indien?","Do you miss India?","Ja, manchmal schon. Vor allem meine Familie und das Essen. Aber wir telefonieren fast jeden Tag.","Yes, sometimes I do. Above all my family and the food. But we speak on the phone almost every day."],["Seit wann wohnen Sie in der Schweiz?","How long have you been living in Switzerland?","Seit vier Jahren. Wir sind zweitausendzweiundzwanzig hergezogen.","For four years. We moved here in twenty twenty-two."],["Warum sind Sie in die Schweiz gekommen?","Why did you come to Switzerland?","Mein Mann hat hier eine Stelle bekommen, und wir sind zusammen hergezogen.","My husband got a job here, and we moved here together."],["Wo genau wohnen Sie?","Where exactly do you live?","Wir wohnen in Adliswil. Das ist eine kleine Stadt südlich von Zürich, direkt an der Sihl.","We live in Adliswil. It's a small town south of Zurich, right on the river Sihl."],["Wie kommen Sie nach Zürich?","How do you get to Zurich?","Mit dem Zug. Das dauert nur etwa fünfzehn Minuten, und der Zug fährt sehr oft.","By train. It only takes about fifteen minutes, and the train goes very often."],["Was gefällt Ihnen an der Schweiz?","What do you like about Switzerland?","Mir gefällt die Natur sehr gut, die Berge und die Seen. Ausserdem ist alles sauber und sicher, und für Kinder ist es ideal.","I like the nature very much, the mountains and the lakes. Everything is also clean and safe, and it's ideal for children."],["Und was gefällt Ihnen nicht?","And what don't you like?","Alles ist ziemlich teuer. Und der Dialekt ist für mich immer noch schwierig zu verstehen.","Everything is quite expensive. And the dialect is still difficult for me to understand."],["Wie ist Ihre Wohnung?","What's your flat like?","Wir haben eine Vierzimmerwohnung mit einem Balkon. Sie ist hell und ruhig, aber für vier Personen langsam ein bisschen klein.","We have a four-room flat with a balcony. It's bright and quiet, but slowly getting a bit small for four people."],["Erzählen Sie von Ihrer Familie.","Tell me about your family.","Wir sind zu viert. Mein Mann heisst Tharun, mein Sohn ist sieben und meine Tochter ist ein Jahr alt.","There are four of us. My husband is called Tharun, my son is seven and my daughter is one."],["Was macht Ihr Mann beruflich?","What does your husband do for a living?","Er ist DevOps Engineer und arbeitet bei einer Firma, die FIS heisst. Er arbeitet mit Computersystemen und Software.","He's a DevOps engineer and works at a company called FIS. He works with computer systems and software."],["In welche Klasse geht Ihr Sohn?","Which class is your son in?","Er geht in die erste Klasse hier in Adliswil. Er spricht schon besser Deutsch als ich.","He's in the first class here in Adliswil. He already speaks German better than I do."],["Wer passt auf Ihre Tochter auf?","Who looks after your daughter?","Meistens bin ich zu Hause bei ihr. An zwei Tagen geht sie in die Kita.","Mostly I'm at home with her. On two days she goes to nursery."],["Was macht ein Data Engineer?","What does a data engineer do?","Ich arbeite mit Daten. Ich baue Systeme, die Daten aus verschiedenen Quellen sammeln und für die Analyse vorbereiten.","I work with data. I build systems that collect data from different sources and prepare it for analysis."],["Wie lange haben Sie in diesem Beruf gearbeitet?","How long did you work in that profession?","Acht Jahre, alle in Indien. Ich habe für verschiedene Kunden gearbeitet, unter anderem für eine Bank.","Eight years, all in India. I worked for various clients, among them a bank."],["Warum haben Sie eine Pause gemacht?","Why did you take a break?","Wir sind in die Schweiz gezogen, und danach sind meine Kinder gekommen. Deshalb war ich vier Jahre zu Hause.","We moved to Switzerland, and then my children came along. So I was at home for four years."],["Möchten Sie wieder arbeiten?","Do you want to work again?","Ja, sehr gern. Ich suche eine Stelle als Data Engineer, am liebsten Teilzeit, weil meine Kinder noch klein sind.","Yes, very much. I'm looking for a job as a data engineer, ideally part time, because my children are still small."],["Was häkeln Sie denn?","So what do you crochet?","Meistens kleine Sachen für die Kinder, zum Beispiel Mützen, Decken und Spielzeug.","Mostly small things for the children, for example hats, blankets and toys."],["Was ist Makramee?","What is macramé?","Man knüpft Schnüre zu Mustern. Daraus macht man zum Beispiel Wandbilder oder Blumenampeln.","You knot cords into patterns. From that you make wall hangings or plant hangers, for example."],["Wie haben Sie das gelernt?","How did you learn that?","Meine Mutter hat mir das Häkeln gezeigt, als ich klein war. Makramee habe ich später aus Videos gelernt.","My mother showed me crochet when I was small. I learned macramé later from videos."],["Was malen Sie am liebsten?","What do you most like painting?","Am liebsten male ich Blumen und Landschaften. Manchmal male ich auch mit meinem Sohn zusammen.","I most like painting flowers and landscapes. Sometimes I paint together with my son."],["Wie lange lernen Sie schon Deutsch?","How long have you been learning German?","Ich lerne seit etwa zwei Jahren, aber nicht regelmässig. In den letzten Monaten übe ich fast jeden Tag.","I've been learning for about two years, but not regularly. In recent months I've been practising almost every day."],["Wie lernen Sie Deutsch?","How do you learn German?","Ich lerne mit Apps und mit Büchern. Ausserdem habe ich selbst eine kleine App gebaut, mit der ich Wörter und Grammatik übe.","I learn with apps and books. I've also built a small app myself that I use to practise words and grammar."],["Ist Deutsch schwierig für Sie?","Is German difficult for you?","Am Anfang war es sehr schwierig, besonders die Artikel und die Fälle. Jetzt geht es langsam besser, aber ich mache noch viele Fehler.","At the beginning it was very difficult, especially the articles and the cases. Now it's slowly getting better, but I still make a lot of mistakes."],["Warum brauchen Sie den Ausweis C?","Why do you need the C permit?","Wir wohnen seit vier Jahren hier und möchten langfristig bleiben. Für den Ausweis C brauche ich mündlich das Niveau B1.","We've lived here for four years and want to stay long term. For the C permit I need level B1 orally."],["Was machen Sie in zwei Jahren?","What will you be doing in two years?","Ich hoffe, dass ich dann wieder arbeite und besser Deutsch spreche. Und dass wir immer noch hier in Adliswil wohnen.","I hope I'll be working again by then and speaking better German. And that we'll still be living here in Adliswil."]]},{"id":"sp_warum","level":"A1","title":"Warum brauchen Sie die Prüfung?","en":"Why you need this exam — a very common follow-up","sec":30,"prompt":"Warum machen Sie diese Prüfung?","promptEn":"Why are you taking this exam?","points":[{"t":"Ausweis C nennen","en":"name the C permit","k":["ausweis c","niederlassung","c-ausweis"]},{"t":"Wie lange Sie hier sind","en":"how long you've been here","k":["seit vier jahren","vier jahren","seit 2022","lange"]},{"t":"Zukunftsplan","en":"your plan to stay","k":["bleiben","langfristig","zukunft","leben"]}],"phrases":[["Ich brauche diese Bescheinigung für meinen Ausweis C.","I need this certificate for my C permit."],["Wir wohnen seit vier Jahren hier.","We've lived here for four years."],["Wir möchten langfristig in der Schweiz bleiben.","We want to stay in Switzerland long term."],["Für den Ausweis C brauche ich das Niveau B1.","For the C permit I need level B1."]],"text":[["Ich brauche diese Bescheinigung für meinen Ausweis C. Wir wohnen seit vier Jahren in der Schweiz und möchten langfristig hier bleiben. Für den Ausweis C brauche ich mündlich das Niveau B1, deshalb mache ich heute diese Prüfung.","I need this certificate for my C permit. We've been living in Switzerland for four years and want to stay here long term. For the C permit I need level B1 orally, so that's why I'm taking this exam today."]],"tip":"Short and clear is right here. Two or three sentences, then stop."},{"id":"sp_essen","level":"A1","title":"Essen aus Ihrer Heimat","en":"Typical food from your home region — a frequent cross-question","sec":40,"prompt":"Was ist ein typisches Essen aus Ihrer Heimat?","promptEn":"What is a typical dish from your home region?","points":[{"t":"Gericht nennen","en":"name the dish","k":["biryani","curry","reis","gericht"]},{"t":"Beschreiben","en":"describe it","k":["reis","gewürze","gewuerze","scharf","fleisch","gemüse","gemuese"]},{"t":"Wann man es isst","en":"when it's eaten","k":["fest","familie","sonntag","gäste","gaeste","besonderen"]},{"t":"Ihre Meinung","en":"your own view","k":["mag","liebe","gern","schmeckt","lieblings"]}],"phrases":[["Ein typisches Gericht aus Hyderabad ist …","A typical dish from Hyderabad is …"],["Es ist ein Reisgericht mit vielen Gewürzen.","It's a rice dish with lots of spices."],["Es ist ziemlich scharf.","It's quite spicy."],["Wir essen es oft, wenn Gäste kommen.","We often eat it when guests come."],["Das schmeckt mir am besten.","That's what I like best."]],"text":[["Ein typisches Gericht aus meiner Heimatstadt Hyderabad ist Biryani. Das ist ein Reisgericht mit Fleisch oder Gemüse und sehr vielen Gewürzen. Es ist ziemlich scharf.","A typical dish from my home city Hyderabad is biryani. It's a rice dish with meat or vegetables and a great many spices. It's quite spicy."],["Bei uns isst man Biryani meistens an Festen oder wenn Gäste kommen. Ich koche es auch hier in der Schweiz, aber die Gewürze sind hier leider teuer. Meiner Familie schmeckt es sehr gut.","Where I'm from you usually eat biryani at festivals or when guests come. I cook it here in Switzerland too, but unfortunately the spices are expensive here. My family likes it very much."]],"tip":"They ask this after you say where you're from. Having forty seconds ready turns a surprise question into an easy one."},{"id":"sp_arbeitstag","level":"A2","title":"Ihr Arbeitstag / Ihr Alltag","en":"Describe a typical working day","sec":60,"prompt":"Beschreiben Sie einen normalen Tag bei Ihnen. Was machen Sie von morgens bis abends?","promptEn":"Describe a normal day for you, from morning to evening.","points":[{"t":"Morgen","en":"the morning","k":["stehe auf","aufstehe","morgens","frühstück","fruehstueck","uhr"]},{"t":"Vormittag","en":"late morning","k":["schule","kindergarten","bringe","einkaufen","haushalt","lerne"]},{"t":"Mittag","en":"midday","k":["mittag","koche","esse","mittagessen"]},{"t":"Nachmittag","en":"afternoon","k":["nachmittag","hausaufgaben","spielplatz","hole","abholen"]},{"t":"Abend","en":"the evening","k":["abend","abendessen","ins bett","schlafen","fernsehen","lese"]},{"t":"Zeitangaben","en":"time expressions","k":["um ","danach","dann","zuerst","später","spaeter"]}],"phrases":[["Ich stehe um … Uhr auf.","I get up at …"],["Zuerst … , dann … , danach …","First … then … after that …"],["Ich bringe meinen Sohn zur Schule.","I take my son to school."],["Am Vormittag mache ich den Haushalt.","In the morning I do the housework."],["Nachmittags spielen wir draussen.","In the afternoons we play outside."],["Am Abend bringe ich die Kinder ins Bett.","In the evening I put the children to bed."],["Danach lerne ich noch eine Stunde Deutsch.","After that I study German for another hour."]],"text":[],"tip":"Noch nicht geschrieben. Tell me roughly how your weekday runs and we'll write this one together."},{"id":"sp_wochenende","level":"A2","title":"Ein Tag am Wochenende","en":"Describe a day at the weekend","sec":60,"prompt":"Beschreiben Sie einen Tag an Ihrem Wochenende.","promptEn":"Describe a day of your weekend.","points":[{"t":"Anders als werktags","en":"how it differs from a workday","k":["später","spaeter","ausschlafen","ruhiger","frei"]},{"t":"Vormittag","en":"the morning","k":["frühstück","fruehstueck","gemeinsam","spazieren","markt"]},{"t":"Mittag","en":"midday","k":["kochen","mittagessen","zusammen"]},{"t":"Nachmittag","en":"afternoon","k":["ausflug","spielplatz","besuch","freunde","see","wandern"]},{"t":"Abend","en":"evening","k":["abend","film","serie","früh ins bett","frueh ins bett"]}],"phrases":[["Am Samstag stehen wir später auf.","On Saturday we get up later."],["Wir frühstücken zusammen.","We have breakfast together."],["Danach gehen wir spazieren.","After that we go for a walk."],["Am Nachmittag machen wir oft einen Ausflug.","In the afternoon we often go on an outing."],["Sonntags besuchen uns manchmal Freunde.","On Sundays friends sometimes visit us."]],"text":[],"tip":"Noch nicht geschrieben. Tell me what a Saturday and Sunday look like for you."},{"id":"sp_zuerich","level":"A2","title":"Was gefällt Ihnen an Zürich?","en":"What you like about living in Zurich","sec":60,"prompt":"Was gefällt Ihnen am Leben in Zürich?","promptEn":"What do you like about life in Zurich?","points":[{"t":"Natur","en":"nature","k":["see","berge","grün","gruen","natur","wald"]},{"t":"Öffentlicher Verkehr","en":"public transport","k":["zug","bus","pünktlich","puenktlich","verkehr","tram"]},{"t":"Sicherheit / Familie","en":"safety and family life","k":["sicher","kinder","familie","ruhig","sauber"]},{"t":"Etwas Negatives","en":"one downside","k":["teuer","sprache","dialekt","wetter","winter"]}],"phrases":[["Mir gefällt besonders die Natur.","I particularly like the nature."],["Man kann im See schwimmen.","You can swim in the lake."],["Die öffentlichen Verkehrsmittel sind sehr pünktlich.","Public transport is very punctual."],["Ich fühle mich hier sicher.","I feel safe here."],["Für Kinder ist es ideal.","It's ideal for children."],["Nur die Sprache ist für mich noch schwierig.","Only the language is still difficult for me."]],"text":[],"tip":"Noch nicht geschrieben. Naming one downside at the end makes the answer sound honest rather than rehearsed."},{"id":"sp_wohnort","level":"A2","title":"Beschreiben Sie Ihren Wohnort","en":"Describe the place where you live","sec":60,"prompt":"Beschreiben Sie den Ort, wo Sie wohnen.","promptEn":"Describe the place where you live.","points":[{"t":"Wo es liegt","en":"where it is","k":["adliswil","nähe","naehe","zürich","zuerich","kanton"]},{"t":"Wie gross","en":"how big","k":["klein","stadt","einwohner","dorf"]},{"t":"Was es gibt","en":"what's there","k":["laden","geschäfte","geschaefte","schule","bahnhof","restaurant"]},{"t":"Ihre Wohnung","en":"your flat","k":["wohnung","zimmer","stock","balkon","garten"]},{"t":"Warum es Ihnen gefällt","en":"why you like it","k":["gefällt","gefaellt","ruhig","grün","gruen","familien"]}],"phrases":[["Adliswil liegt direkt neben Zürich.","Adliswil is right next to Zurich."],["Es ist eine kleine Stadt.","It's a small town."],["Es gibt Geschäfte, Schulen und einen Bahnhof.","There are shops, schools and a station."],["Wir wohnen in einer Wohnung mit … Zimmern.","We live in a flat with … rooms."],["Die Gegend ist sehr familienfreundlich.","The area is very family-friendly."]],"text":[],"tip":"Noch nicht geschrieben. Tell me about your flat and the area and I'll write it."},{"id":"sp_arbeit","level":"B1","title":"Ihre Arbeit: gut und weniger gut","en":"What you like and dislike about your work, with reasons","sec":90,"prompt":"Was gefällt Ihnen an Ihrer Arbeit und was gefällt Ihnen nicht? Warum?","promptEn":"What do you like about your work and what don't you like? Why?","points":[{"t":"Was Sie tun","en":"what you actually do","k":["data","daten","systeme","projekte","arbeite mit"]},{"t":"Was gefällt","en":"what you like","k":["gefällt","gefaellt","mag","interessant","lösen","loesen","team"]},{"t":"Begründung","en":"a reason","k":["weil","denn","deshalb"]},{"t":"Was weniger gefällt","en":"what you like less","k":["nicht so","weniger","stress","sitzungen","termindruck","anstrengend"]},{"t":"Ausblick","en":"your outlook","k":["möchte","moechte","zukunft","wieder","zurück","zurueck"]}],"phrases":[["Ich arbeite mit Daten und Datenbanken.","I work with data and databases."],["Am besten gefällt mir, dass ich Probleme lösen kann.","What I like best is that I can solve problems."],["Ich arbeite gern im Team.","I enjoy working in a team."],["Weniger gut gefällt mir, dass es manchmal Termindruck gibt.","I like it less that there's sometimes deadline pressure."],["Trotzdem möchte ich wieder in diesem Beruf arbeiten.","Even so, I'd like to work in this field again."]],"text":[],"tip":"Noch nicht geschrieben. Every 'what I like' needs a weil clause after it — that's the B1 marker here."},{"id":"sp_lotto","level":"B1","title":"Viel Geld im Lotto","en":"You win the lottery — three wishes with reasons","sec":90,"prompt":"Stellen Sie sich vor, Sie gewinnen viel Geld im Lotto. Nennen Sie drei Wünsche, die Sie sich damit erfüllen würden.","promptEn":"Imagine you win a lot of money in the lottery. Name three wishes you would fulfil with it.","points":[{"t":"Wunsch 1","en":"first wish","k":["zuerst","erstens","als erstes"]},{"t":"Wunsch 2","en":"second wish","k":["zweitens","dann","ausserdem"]},{"t":"Wunsch 3","en":"third wish","k":["drittens","zum schluss","abschliessend","zuletzt"]},{"t":"Konjunktiv II","en":"use würde / möchte","k":["würde","wuerde","möchte","moechte","hätte","haette"]},{"t":"Begründungen","en":"give reasons","k":["weil","denn","damit"]},{"t":"Zusammenfassung","en":"round it off","k":["zusammenfassend","das sind","meine drei"]}],"phrases":[["Wenn ich im Lotto viel Geld gewinnen würde, …","If I won a lot of money in the lottery, …"],["Zuerst würde ich … kaufen.","First I would buy …"],["Zweitens würde ich gerne … reisen.","Secondly I'd like to travel …"],["Zum Schluss möchte ich Geld für wohltätige Zwecke spenden.","Finally I'd like to donate money to charity."],["… weil Häuser in der Schweiz sehr teuer sind.","… because houses in Switzerland are very expensive."],["Zusammenfassend sind das meine drei Wünsche.","In summary, those are my three wishes."]],"text":[],"tip":"Noch nicht geschrieben. Two things the reports insist on: name exactly THREE, and give a reason for each. Examiners have refused to accept two."},{"id":"sp_zweijahre","level":"B1","title":"Wo sehen Sie sich in zwei Jahren?","en":"Where do you see yourself in two years — three points","sec":90,"prompt":"Wo sehen Sie sich in zwei Jahren? Nennen Sie drei Punkte und begründen Sie sie.","promptEn":"Where do you see yourself in two years? Name three things and give reasons.","points":[{"t":"Beruf","en":"work","k":["arbeiten","stelle","beruf","job","wieder"]},{"t":"Sprache","en":"language","k":["deutsch","b2","sprache","besser sprechen"]},{"t":"Familie / Wohnen","en":"family or home","k":["kinder","familie","wohnung","haus","bleiben"]},{"t":"Zukunftsformen","en":"future forms","k":["werde","möchte","moechte","hoffe","plane"]},{"t":"Begründungen","en":"reasons","k":["weil","denn","damit","deshalb"]}],"phrases":[["In zwei Jahren möchte ich wieder als … arbeiten.","In two years I'd like to be working as a … again."],["Ich hoffe, dass ich dann besser Deutsch spreche.","I hope I'll speak German better by then."],["Wir möchten weiterhin in der Schweiz leben.","We want to go on living in Switzerland."],["Ich werde bis dahin meine Zertifizierung erneuert haben.","By then I'll have renewed my certification."],["Das ist mir wichtig, weil …","That matters to me because …"]],"text":[],"tip":"Noch nicht geschrieben. Same three-point shape as the lottery question, so the two answers reinforce each other."},{"id":"sp_person","level":"B1","title":"Eine interessante Person","en":"Describe a person you find interesting","sec":90,"prompt":"Beschreiben Sie eine Person, die Sie interessant finden. Wer ist das und warum?","promptEn":"Describe a person you find interesting. Who is it and why?","points":[{"t":"Wer die Person ist","en":"who the person is","k":["das ist","meine","mein","heisst","kenne"]},{"t":"Wie Sie sie kennen","en":"how you know them","k":["kenne","seit","freundin","schwester","mutter","kollegin"]},{"t":"Aussehen oder Charakter","en":"appearance or character","k":["freundlich","stark","klug","geduldig","fleissig","ruhig"]},{"t":"Was sie macht","en":"what they do","k":["arbeitet","macht","kümmert","kuemmert","hilft"]},{"t":"Warum interessant","en":"why interesting","k":["weil","bewundere","beeindruckt","vorbild"]}],"phrases":[["Die Person, die ich sehr interessant finde, ist …","The person I find very interesting is …"],["Ich kenne sie seit …","I've known her for …"],["Sie ist sehr geduldig und fleissig.","She is very patient and hard-working."],["Ich bewundere sie, weil …","I admire her because …"],["Sie ist für mich ein Vorbild.","She is a role model for me."]],"text":[],"tip":"Noch nicht geschrieben. Pick someone real and close to you — the cross-questions are much easier to answer than about a celebrity."},{"id":"sp_reise","level":"B1","title":"Drei Reiseziele","en":"Three places you'd like to travel to","sec":90,"prompt":"Wohin möchten Sie gerne reisen? Nennen Sie drei Ziele und sagen Sie warum.","promptEn":"Where would you like to travel? Name three destinations and say why.","points":[{"t":"Ziel 1","en":"first destination","k":["zuerst","erstens","als erstes"]},{"t":"Ziel 2","en":"second destination","k":["zweitens","ausserdem","dann"]},{"t":"Ziel 3","en":"third destination","k":["drittens","zum schluss","zuletzt"]},{"t":"Begründungen","en":"reasons","k":["weil","denn","damit"]},{"t":"Konjunktiv / Wunsch","en":"wish forms","k":["würde","wuerde","möchte","moechte","gerne"]}],"phrases":[["Am liebsten würde ich nach … reisen.","Most of all I'd like to travel to …"],["Ich möchte dort die Landschaft sehen.","I'd like to see the landscape there."],["Das ist ein Traum von mir.","That's a dream of mine."],["Mit kleinen Kindern ist eine lange Reise schwierig.","With small children a long trip is difficult."]],"text":[],"tip":"Noch nicht geschrieben. Same three-point structure again — you'll find these B1 answers all share one skeleton."},{"id":"sp_ferientag","level":"B1","title":"Ein perfekter Ferientag","en":"Describe a perfect holiday day","sec":90,"prompt":"Beschreiben Sie einen perfekten Ferientag.","promptEn":"Describe a perfect holiday day.","points":[{"t":"Wo","en":"where","k":["meer","berge","see","strand","zu hause","indien"]},{"t":"Morgen","en":"morning","k":["morgen","frühstück","fruehstueck","aufstehen","sonne"]},{"t":"Tag","en":"during the day","k":["schwimmen","wandern","spazieren","essen","lesen"]},{"t":"Mit wem","en":"who with","k":["familie","kinder","mann","zusammen","freunde"]},{"t":"Konjunktiv","en":"wish forms","k":["würde","wuerde","wäre","waere","möchte","moechte"]}],"phrases":[["Ein perfekter Ferientag wäre für mich …","A perfect holiday day for me would be …"],["Wir würden spät aufstehen.","We'd get up late."],["Am Nachmittag würden wir schwimmen gehen.","In the afternoon we'd go swimming."],["Am wichtigsten ist, dass wir Zeit zusammen haben.","The most important thing is that we have time together."]],"text":[],"tip":"Noch nicht geschrieben. This one lets you show Konjunktiv II throughout — wäre and würde in nearly every sentence."}];
